      - {name: name, type: "Optional[str]", ctx: "Router name"}
      - {name: description, type: "Optional[str]", ctx: "Router description"}
      - {name: requires_user_input, type: bool, ctx: "HITL: user selects the route"}
      - {name: user_input_message, type: "Optional[str]", ctx: "Selection prompt for user"}
      - {name: allow_multiple_selections, type: bool, ctx: "Allow user to select multiple routes"}
      - {name: user_input_schema, type: "Optional[List[Dict]]", ctx: "Custom schema for user input"}
      - {name: requires_confirmation, type: bool, ctx: "Pause for confirmation before execution"}
      - {name: confirmation_message, type: "Optional[str]", ctx: "Confirmation prompt"}
      - {name: on_reject, type: "Union[OnReject, str]", ctx: "Action on rejection (default: skip)"}

data:
  - name: CEL_VARIABLES
    type: "conceptual"
    ctx: |
      Available in CEL selector expressions:
        input — current step input content
        previous_step_content — output of previous step
        previous_step_outputs — list of all previous step outputs
        additional_data — extra data from step input
        session_state — workflow session state
        step_choices — list of choice names
