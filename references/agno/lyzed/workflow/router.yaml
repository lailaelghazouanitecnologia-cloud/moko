purpose: "Router — dynamic step selection at runtime via callable function, CEL expression, or HITL user selection"
tags: [routing, dynamic, cel, hitl]
ctx: "@dataclass. Selects which step(s) to execute from choices list. Three selection modes: programmatic (Callable), expression (CEL string), interactive (HITL user selection)."

