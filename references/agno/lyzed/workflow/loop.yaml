      - {name: max_iterations, type: int, ctx: "Max iterations (default: 3)"}
      - {name: end_condition, type: "Optional[Union[Callable, str]]", ctx: "Termination condition — callable(List[StepOutput]) -> bool, or CEL expression"}
      - {name: forward_iteration_output, type: bool, ctx: "Pass iteration output as next iteration input"}
