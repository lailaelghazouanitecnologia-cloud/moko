      - {name: confirmation_message, type: "Optional[str]", ctx: "Confirmation prompt"}
      - {name: on_reject, type: "Union[OnReject, str]", ctx: "Action on rejection (default: skip)"}

data:
  - name: CEL_VARIABLES
    type: "conceptual"
    ctx: |
      Available in CEL end_condition expressions:
        current_iteration — zero-based iteration counter
        max_iterations — configured max
        all_success — True if all steps in last iteration succeeded
        last_step_content — string content of last step output
        step_outputs — list of all StepOutput objects
