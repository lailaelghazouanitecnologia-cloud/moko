## Roska Module Descriptor — os/
name: os
purpose: "AgentOS — FastAPI runtime for agents, teams, workflows with YAML config, auth, API routing"
tags: [agentos, fastapi, runtime, config, api]

files:
  - file: app.py
    purpose: "FastAPI application setup and lifecycle"
    tags: [fastapi, app]

  - file: config.py
    purpose: "AgentOSConfig — YAML-driven configuration schema"
    tags: [config, schema]

  - file: utils.py
    purpose: "Utilities including load_yaml_config()"
    tags: [utils, yaml]

  - file: schema.py
    purpose: "API response/request schemas (HealthResponse, ConfigResponse, SessionSchema...)"
    tags: [schema, api]

  - file: auth.py
    purpose: "Authentication middleware"
    tags: [auth]

  - file: managers.py
    purpose: "Component management (agent/team/workflow lifecycle)"
    tags: [managers]

  - file: router.py
    purpose: "API routing"
    tags: [router]

  - file: settings.py
    purpose: "OS settings"
    tags: [settings]

submodules:
  - name: interfaces
    purpose: "Integration interfaces (Slack, Discord, etc.)"

  - name: middleware
    purpose: "FastAPI middleware"

  - name: routers
    purpose: "15+ API endpoint routers"

types:
  - name: AgentOSConfig
    kind: struct
    vis: pub
    ctx: "YAML-driven configuration for AgentOS runtime"
    fields:
      - {name: available_models, type: "Optional[List[str]]", ctx: "Available model IDs"}
      - {name: chat, type: "Optional[ChatConfig]", ctx: "Chat UI config (quick_prompts, max 3 per agent)"}
      - {name: evals, type: "Optional[EvalsConfig]", ctx: "Evaluation configuration"}
      - {name: knowledge, type: "Optional[KnowledgeConfig]", ctx: "RAG database config"}
      - {name: memory, type: "Optional[MemoryConfig]", ctx: "Agent memory storage config"}
      - {name: session, type: "Optional[SessionConfig]", ctx: "Conversation storage config"}
      - {name: metrics, type: "Optional[MetricsConfig]", ctx: "Performance tracking config"}
      - {name: traces, type: "Optional[TracesConfig]", ctx: "Execution tracing config"}

functions:
  - name: load_yaml_config
    sig: "(config_file_path: str) -> AgentOSConfig"
    vis: pub
    ctx: "Read YAML/YML file, validate, return AgentOSConfig"

data:
  - name: api_schemas
    type: "conceptual"
    ctx: |
      API response schemas:
        HealthResponse — service health status
        ConfigResponse — full OS configuration (os_id, name, agents, teams, workflows, interfaces)
        AgentSummaryResponse — agent configuration summary
        TeamSummaryResponse — team configuration summary
        WorkflowSummaryResponse — workflow configuration summary
        SessionSchema — session state descriptor
        WorkflowRunRequest — workflow run input parameters
