## Roska File Descriptor — models/openai/chat.py
file: models/openai/chat.py
lines: ~1200
purpose: "OpenAI Chat model — GPT-4o, o-series, audio support, structured outputs, service tiers"
tags: [openai, gpt4, structured-outputs, audio, reasoning]
ctx: "Inherits Model. Default id='gpt-4o'. supports_native_structured_outputs=True. Role mapping system (system→developer for newer models)."

types:
