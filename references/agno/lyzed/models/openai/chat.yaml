      - {name: logprobs, type: "Optional[bool]", ctx: "Return log probabilities"}
      - {name: top_logprobs, type: "Optional[int]", ctx: "Number of top logprobs"}
      - {name: max_tokens, type: "Optional[int]", ctx: "Max output tokens"}
      - {name: max_completion_tokens, type: "Optional[int]", ctx: "Max completion tokens (newer param)"}
