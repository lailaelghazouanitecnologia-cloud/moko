## Roska Module Descriptor — eval/
name: eval
purpose: "Agent evaluation framework — accuracy, reliability, performance, agent-as-judge"
tags: [eval, accuracy, reliability, performance, judge]

files:
  - file: base.py
    purpose: "BaseEval ABC — pre_check/post_check abstract methods"
    tags: [abc, eval]

  - file: accuracy.py
    purpose: "AccuracyEval — response accuracy evaluation"
    tags: [accuracy]

  - file: agent_as_judge.py
    purpose: "AgentAsJudgeEval — LLM-based evaluation (agent judges agent)"
    tags: [judge, llm-eval]

  - file: performance.py
    purpose: "PerformanceEval — latency, token usage, cost metrics"
    tags: [performance, metrics]

  - file: reliability.py
    purpose: "ReliabilityEval — consistency and error rate checks"
    tags: [reliability]

  - file: utils.py
    purpose: "Evaluation utility functions"

types:
  - name: BaseEval
    kind: trait
    vis: pub
    ctx: "Abstract evaluation — pre_check before run, post_check after run"
    methods:
      - "pre_check(run_input: Union[RunInput, TeamRunInput]) -> None [abstract]"
      - "async_pre_check(run_input: Union[RunInput, TeamRunInput]) -> None [abstract]"
      - "post_check(run_output: Union[RunOutput, TeamRunOutput]) -> None [abstract]"
      - "async_post_check(run_output: Union[RunOutput, TeamRunOutput]) -> None [abstract]"

data:
  - name: integration
    type: "conceptual"
    ctx: "Evals are added via Agent.pre_hooks/post_hooks: Optional[List[Union[Callable, BaseGuardrail, BaseEval]]]"

exports:
  - {name: BaseEval, kind: type}
  - {name: AccuracyEval, kind: type}
  - {name: AgentAsJudgeEval, kind: type}
  - {name: PerformanceEval, kind: type}
  - {name: ReliabilityEval, kind: type}
