## Roska File Descriptor — run/agent.py
file: run/agent.py
purpose: "Agent run models — RunInput, RunOutput, RunEvent (30+ types), all event dataclasses"
tags: [agent, run, events, output, input, streaming]
ctx: "Defines the complete event system for agent execution. RunOutput is the primary response container. 30+ event types for fine-grained streaming."

types:
  - name: RunInput
    kind: struct
    vis: pub
    ctx: "Agent run input with multimodal support"
    fields:
      - {name: input_content, type: "Union[str, List, Dict, Message, BaseModel, List[Message]]"}
      - {name: images, type: "Optional[Sequence[Image]]"}
      - {name: videos, type: "Optional[Sequence[Video]]"}
      - {name: audios, type: "Optional[Sequence[Audio]]"}
      - {name: files, type: "Optional[Sequence[File]]"}

  - name: RunEvent
    kind: enum
    vis: pub
    ctx: "30+ event types for streaming agent execution"
    variants:
      - {name: run_started}
      - {name: run_content}
      - {name: run_content_completed}
      - {name: run_intermediate_content}
      - {name: run_completed}
      - {name: run_error}
      - {name: run_cancelled}
      - {name: run_paused, ctx: "HITL: contains requirements"}
      - {name: run_continued}
      - {name: pre_hook_started}
      - {name: pre_hook_completed}
      - {name: post_hook_started}
      - {name: post_hook_completed}
      - {name: tool_call_started}
      - {name: tool_call_completed}
      - {name: tool_call_error}
      - {name: reasoning_started}
      - {name: reasoning_step}
      - {name: reasoning_content_delta}
      - {name: reasoning_completed}
      - {name: memory_update_started}
      - {name: memory_update_completed}
      - {name: session_summary_started}
      - {name: session_summary_completed}
      - {name: parser_model_response_started}
      - {name: parser_model_response_completed}
      - {name: output_model_response_started}
      - {name: output_model_response_completed}
      - {name: model_request_started}
      - {name: model_request_completed}
      - {name: compression_started}
      - {name: compression_completed}
      - {name: followups_started}
      - {name: followups_completed}
      - {name: custom_event}

  - name: RunOutput
    kind: struct
    vis: pub
    ctx: "Complete agent response — content, reasoning, tools, media, events, HITL requirements"
    fields:
      - {name: run_id, type: str}
      - {name: agent_id, type: str}
      - {name: agent_name, type: str}
      - {name: session_id, type: "Optional[str]"}
      - {name: parent_run_id, type: "Optional[str]"}
      - {name: workflow_id, type: "Optional[str]"}
      - {name: user_id, type: "Optional[str]"}
      - {name: input, type: "Optional[RunInput]"}
      - {name: content, type: "Optional[Any]"}
      - {name: content_type, type: str}
      - {name: reasoning_content, type: "Optional[str]"}
      - {name: reasoning_steps, type: "Optional[List[ReasoningStep]]"}
      - {name: reasoning_messages, type: "Optional[List[Message]]"}
      - {name: model, type: "Optional[str]"}
      - {name: model_provider, type: "Optional[str]"}
      - {name: model_provider_data, type: "Optional[Dict]"}
      - {name: messages, type: "Optional[List[Message]]"}
      - {name: metrics, type: "Optional[RunMetrics]"}
      - {name: tools, type: "Optional[List[ToolExecution]]"}
      - {name: images, type: "Optional[List[Image]]"}
      - {name: videos, type: "Optional[List[Video]]"}
      - {name: audio, type: "Optional[List[Audio]]"}
      - {name: files, type: "Optional[List[File]]"}
      - {name: response_audio, type: "Optional[Audio]"}
      - {name: citations, type: "Optional[Any]"}
      - {name: references, type: "Optional[Any]"}
      - {name: followups, type: "Optional[Any]"}
      - {name: metadata, type: "Optional[Dict]"}
      - {name: session_state, type: "Optional[Dict]"}
      - {name: events, type: "Optional[List[RunOutputEvent]]"}
      - {name: status, type: RunStatus}
      - {name: requirements, type: "Optional[List[RunRequirement]]", ctx: "Active HITL requirements"}
      - {name: created_at, type: int}

data:
  - name: hitl_properties
    type: "conceptual"
    ctx: |
      RunOutput HITL properties:
        active_requirements — unresolved requirements
        is_paused — True if status == paused
        is_cancelled — True if status == cancelled
        tools_requiring_confirmation — tools awaiting manual approval
        tools_requiring_user_input — tools awaiting structured input
        tools_awaiting_external_execution — tools awaiting external system
