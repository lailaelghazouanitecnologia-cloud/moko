## Roska Module Descriptor — guardrails/
name: guardrails
purpose: "Input/output security — moderation, PII detection, prompt injection prevention"
tags: [guardrails, security, moderation, pii, injection]

files:
  - file: base.py
    purpose: "BaseGuardrail ABC — check/async_check abstract methods"
    tags: [abc, guardrail]

  - file: openai.py
    purpose: "OpenAIModerationGuardrail — content moderation via OpenAI omni-moderation API"
    tags: [openai, moderation]

  - file: pii.py
    purpose: "PII detection guardrail"
    tags: [pii, privacy]

  - file: prompt_injection.py
    purpose: "Prompt injection detection guardrail"
    tags: [injection, security]

types:
  - name: BaseGuardrail
    kind: trait
    vis: pub
    ctx: "Abstract guardrail — implements check() for input validation before agent processing"
    methods:
      - "check(run_input: Union[RunInput, TeamRunInput]) -> None [abstract]"
      - "async_check(run_input: Union[RunInput, TeamRunInput]) -> None [abstract]"

  - name: OpenAIModerationGuardrail
    kind: struct
    vis: pub
    ctx: "OpenAI content moderation — checks 13 categories"
    fields:
      - {name: moderation_model, type: str, ctx: "default: 'omni-moderation-latest'"}
      - {name: raise_for_categories, type: "Optional[List[str]]", ctx: "Categories: sexual, harassment, hate, illicit, self-harm, violence (+ subcategories)"}
      - {name: api_key, type: "Optional[str]", ctx: "OpenAI API key"}

data:
  - name: integration
    type: "conceptual"
    ctx: "Guardrails are added via Agent.pre_hooks: Optional[List[Union[Callable, BaseGuardrail, BaseEval]]]"
