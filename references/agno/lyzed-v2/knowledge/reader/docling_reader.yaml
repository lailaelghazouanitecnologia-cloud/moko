- name: DoclingReader
  kind: struct
  ctx: 'Reader for various document formats using IBM''s Docling library. Docling supports a wide range of input formats like: - Documents: PDF, DOCX, XLSX, PPTX, Markdown, HTML, AsciiDoc, LaTeX, CSV - Images: PNG, JPEG, TIFF, BMP, WEBP - Audio: WAV, MP3, M4A, AAC, OGG, FLAC - Video: MP4, AVI, MOV - Other: WebVTT, JSON, XML Converts all formats into a unified DoclingDocument representation, then exports to markdown, text, json, html, doctags, etc.'
