types:
- name: SemanticChunking
  kind: struct
  ctx: 'Chunking strategy that splits text into semantic chunks using chonkie. Args: embedder: The embedder to use for generating embeddings. Can be: - A string model identifier (e.g., "minishlab/potion-base-32M") for chonkie''s built-in models - A chonkie BaseEmbeddings instance (used directly) - An Agno Embedder (wrapped for chonkie compatibility) chunk_size: Maximum tokens allowed per chunk. similarity_threshold: Threshold for semantic similarity (0-1). similarity_window: Number of sentences to consider for similarity calculation. min_sentences_per_chunk: Minimum number of sentences per chunk. min_characters_per_sentence: Minimum number of characters per sentence. delimiters: Delimiters to use for sentence splitting. include_delimiters: Whether to include delimiter in prev/next sentence or None. skip_window: Number of groups to skip when merging (0=disabled). filter_window: Window length for the Savitzky-Golay filter. filter_polyorder: Polynomial order for the Savitzky-Golay filter. filter_tolerance: Tolerance for the Savitzky-Golay filter. chunker_params: Additional parameters to pass to chonkie''s SemanticChunker.'
