- name: UpstashVectorDb
  kind: struct
  ctx: 'This class provides an interface to Upstash Vector database with support for both custom embeddings and Upstash''s hosted embedding models. Args: url (str): The Upstash Vector database URL. token (str): The Upstash Vector API token. retries (Optional[int], optional): Number of retry attempts for operations. Defaults to 3. retry_interval (Optional[float], optional): Time interval between retries in seconds. Defaults to 1.0. dimension (Optional[int], optional): The dimension of the embeddings. Defaults to None. embedder (Optional[Embedder], optional): The embedder to use. If None, uses Upstash hosted embedding models. namespace (Optional[str], optional): The namespace to use. Defaults to DEFAULT_NAMESPACE. reranker (Optional[Reranker], optional): The reranker to use. Defaults to None. name (Optional[str], optional): The name of the vector database. Defaults to None. description (Optional[str], optional): The description of the vector database. Defaults to None. **kwargs: Additional keyword arguments.'
