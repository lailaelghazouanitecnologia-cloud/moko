types:
- name: RedisRunCancellationManager
  kind: struct
  ctx: 'Redis-based cancellation manager for distributed run cancellation. This manager stores run cancellation state in Redis, enabling cancellation across multiple processes or services. To use: call the set_cancellation_manager function to set the cancellation manager. Args: redis_client: Sync Redis client for sync methods. Can be Redis or RedisCluster. async_redis_client: Async Redis client for async methods. Can be AsyncRedis or AsyncRedisCluster. key_prefix: Prefix for Redis keys. Defaults to "agno:run:cancellation:". ttl_seconds: TTL for keys in seconds. Defaults to 86400 (1 day). Keys auto-expire to prevent orphaned keys if runs aren''t cleaned up. Set to None to disable expiration.'
