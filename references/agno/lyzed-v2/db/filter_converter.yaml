purpose: 'Generic FilterExpr -> database query converter for named table columns. Converts serialized FilterExpr dictionaries (from agno.filters) to database-native predicates that can be applied to any table with named columns. This is distinct from PgVector''s _dsl_to_sqlalchemy which operates on JSONB metadata columns. This converter operates on direct table columns (table.c.column_name). Supported backends: - SQLAlchemy (SQLite, PostgreSQL, MySQL, SingleStore) Usage: >>> from agno.db.filter_converter import filter_expr_to_sqlalchemy, TRACE_COLUMNS >>> >>> # Convert a filter dict to a SQLAlchemy WHERE clause >>> filter_dict = {"op": "AND", "conditions": [ ...     {"op": "EQ", "key": "status", "value": "OK"}, ...     {"op": "CONTAINS", "key": "user_id", "value": "admin"} ... ]} >>> where_clause = filter_expr_to_sqlalchemy(filter_dict, table, TRACE_COLUMNS) >>> stmt = select(table).where(where_clause)'
