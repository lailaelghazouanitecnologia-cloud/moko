types:
- name: ScheduleExecutor
  kind: struct
  ctx: Execute a schedule by calling its endpoint on the AgentOS server. For run endpoints (``/agents/*/runs``, ``/teams/*/runs``, etc.) the executor submits a background run (``background=true``), then polls the run status endpoint until it reaches a terminal state (COMPLETED, ERROR, CANCELLED, PAUSED). For all other endpoints a simple request/response cycle is used.
