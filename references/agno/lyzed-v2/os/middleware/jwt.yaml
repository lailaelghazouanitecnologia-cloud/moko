- name: JWTValidator
  kind: struct
  ctx: 'JWT token validator that can be used standalone or within JWTMiddleware. This class handles: - Loading verification keys (static keys or JWKS files) - Validating JWT signatures - Extracting claims from tokens It can be stored on app.state for use by WebSocket handlers or other components that need JWT validation outside of the HTTP middleware chain. Example: # Create validator validator = JWTValidator( verification_keys=["your-public-key"], algorithm="RS256", ) # Validate a token try: payload = validator.validate(token) user_id = payload.get("sub") scopes = payload.get("scopes", []) except jwt.InvalidTokenError as e: print(f"Invalid token: {e}") # Store on app.state for WebSocket access app.state.jwt_validator = validator'
