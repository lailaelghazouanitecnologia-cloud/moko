- name: JWTMiddleware
  kind: struct
  ctx: 'JWT Authentication Middleware with optional RBAC (Role-Based Access Control). This middleware: 1. Extracts JWT token from Authorization header or cookies 2. Decodes and validates the token 3. Validates the `aud` (audience) claim matches the AgentOS ID (if configured) 4. Stores JWT claims (user_id, session_id, scopes) in request.state 5. Optionally checks if the request path requires specific scopes (if scope_mappings provided) 6. Validates that the authenticated user has the required scopes 7. Returns 401 for invalid tokens, 403 for insufficient scopes RBAC is opt-in: Only enabled when authorization=True or scope_mappings are provided. Without authorization enabled, the middleware only extracts and validates JWT tokens. Audience Verification: - The `aud` claim in JWT tokens should contain the AgentOS ID - This is verified against the AgentOS instance ID from app.state.agent_os_id - Tokens with mismatched audience will be rejected with 401 Scope Format (simplified): - Global resource scopes: `resource:action` (e.g., "agents:read") - Per-resource scopes: `resource:<resource-id>:action` (e.g., "agents:web-agent:run") - Wildcards: `resource:*:action` (e.g., "agents:*:run") - Admin scope: `admin` (grants all permissions) Token Sources: - "header": Extract from Authorization header (default) - "cookie": Extract from HTTP cookie - "both": Try header first, then cookie as fallback Example: from agno.os.middleware import JWTMiddleware from agno.os.scopes import AgentOSScope # Single verification key app.add_middleware( JWTMiddleware, verification_keys=["your-public-key"], authorization=True, verify_audience=True,  # Verify aud claim matches AgentOS ID scope_mappings={ # Override default scope for this endpoint "GET /agents": ["agents:read"], # Add new endpoint mapping "POST /custom/endpoint": ["agents:run"], # Allow access without scopes "GET /public/stats": [], } ) # Multiple verification keys (accept tokens from multiple issuers) app.add_middleware( JWTMiddleware, verification_keys=[ "public-key-from-issuer-1", "public-key-from-issuer-2", ], authorization=True, ) # Using a static JWKS file app.add_middleware( JWTMiddleware, jwks_file="/path/to/jwks.json", authorization=True, ) # No validation (extract claims only, useful for development) app.add_middleware( JWTMiddleware, validate=False,  # No verification key needed )'
