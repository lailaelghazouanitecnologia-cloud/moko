- name: AgentOSScope
  kind: enum
  ctx: 'Enum of all available AgentOS permission scopes. Special Scopes: - ADMIN: Grants full access to all endpoints (agent_os:admin) Scope format: Global Resource Scopes: - system:read - System configuration and model information - agents:read - List all agents - teams:read - List all teams - workflows:read - List all workflows - sessions:read - View session data - sessions:write - Create and update sessions - sessions:delete - Delete sessions - memories:read - View memories - memories:write - Create and update memories - memories:delete - Delete memories - knowledge:read - View and search knowledge - knowledge:write - Add and update knowledge - knowledge:delete - Delete knowledge - metrics:read - View metrics - metrics:write - Refresh metrics - evals:read - View evaluation runs - evals:write - Create and update evaluation runs - evals:delete - Delete evaluation runs - traces:read - View traces and trace statistics Per-Resource Scopes (with resource ID): - agents:<agent-id>:read - Read specific agent - agents:<agent-id>:run - Run specific agent - teams:<team-id>:read - Read specific team - teams:<team-id>:run - Run specific team - workflows:<workflow-id>:read - Read specific workflow - workflows:<workflow-id>:run - Run specific workflow Wildcards: - agents:*:run - Run any agent - teams:*:run - Run any team'
