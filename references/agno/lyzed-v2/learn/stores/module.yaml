  purpose: 'Decision Log Store ================== Storage backend for Decision Log learning type. Records decisions made by agents with reasoning, context, and outcomes. Useful for auditing, debugging, and learning from past decisions. Key Features: - Log decisions with reasoning and context - Record outcomes for feedback loops - Search past decisions by type, time range, or content - Agent tools for explicit decision logging Scope: - Decisions are stored per agent/session - Can be queried by agent_id, session_id, or time range Supported Modes: - ALWAYS: Automatic extraction of decisions from tool calls - AGENTIC: Agent explicitly logs decisions via tools'
  types: 0
  functions: 1
  imports: 21
  exports: 1
