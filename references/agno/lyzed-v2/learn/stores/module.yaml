  purpose: 'User Profile Store ================== Storage backend for User Profile learning type. Stores long-term structured profile fields about users that persist across sessions. Key Features: - Structured profile fields (name, preferred_name, and custom fields) - Background extraction from conversations - Agent tools for in-conversation updates - Multi-user isolation (each user has their own profile) Profile Fields (structured): - name, preferred_name, and custom fields from extended schemas - Updated via `update_profile` tool - For concrete facts that fit defined schema fields Note: For unstructured memories, use UserMemoryStore instead. Scope: - Profiles are retrieved by user_id only - agent_id/team_id stored in DB columns for audit trail Supported Modes: - ALWAYS: Automatic extraction after conversations - AGENTIC: Agent calls update_user_profile tool directly'
  types: 0
