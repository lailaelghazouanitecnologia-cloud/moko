- file: stores/learned_knowledge.py
  lines: 1577
  purpose: 'Learned Knowledge Store ======================= Storage backend for Learned Knowledge learning type. Stores reusable insights that apply across users and agents. Think of it as: - UserProfile = what you know about a person - SessionContext = what happened in this meeting - LearnedKnowledge = reusable insights that apply anywhere Key Features: - TWO agent tools: save_learning and search_learnings - Semantic search for relevant learnings - Shared across all agents using the same knowledge base - Supports namespace-based scoping for privacy/sharing control: - namespace="user": Private per user (scoped by user_id) - namespace="global": Shared with everyone (default) - namespace="<custom>": Custom grouping (literal string, e.g., "engineering") Supported Modes: - AGENTIC: Agent calls save_learning directly when it discovers insights - PROPOSE: Agent proposes learnings, user approves before saving - ALWAYS: Automatic extraction with duplicate detection'
  types: 0
  functions: 1
  imports: 20
  exports: 1
- file: stores/user_profile.py
