- file: stores/session_context.py
  lines: 1248
  purpose: 'Session Context Store ===================== Storage backend for Session Context learning type. Stores the current state of a session: what''s happened, what''s the goal, what''s the plan. Key Features: - Summary extraction from conversations - Optional planning mode (goal, plan, progress tracking) - Session-scoped storage (each session_id has one context) - Builds on previous context (doesn''t start from scratch each time) - No agent tool (system-managed only) Scope: - Context is retrieved by session_id only - agent_id/team_id stored in DB columns for audit trail Key Behavior: - Extraction receives the previous context and updates it - This ensures continuity even when message history is truncated - Previous context + new messages → Updated context Supported Modes: - ALWAYS only. SessionContextStore does not support AGENTIC, PROPOSE, or HITL modes.'
  types: 0
  functions: 1
  imports: 22
  exports: 1
- file: stores/entity_memory.py
  lines: 3292
  purpose: 'Entity Memory Store =================== Storage backend for Entity Memory learning type. Stores knowledge about external entities - people, companies, projects, products, concepts, systems, and any other things the agent interacts with that aren''t the user themselves. Think of it as: - UserProfile = what you know about THE USER - EntityMemory = what you know about EVERYTHING ELSE Key Features: - Entity-scoped storage (entity_id + entity_type) - Three types of memory per entity: - Facts (semantic): Timeless truths ("Acme uses PostgreSQL") - Events (episodic): Time-bound occurrences ("Acme launched v2 on Jan 15") - Relationships (graph): Connections to other entities ("Bob is CEO of Acme") - Namespace-based sharing control - Agent tools for CRUD operations - Background extraction from conversations Scoping: - entity_id: Unique identifier (e.g., "acme_corp", "bob_smith") - entity_type: Category (e.g., "company", "person", "project", "product") - namespace: Sharing scope: - "user": Private to current user - "global": Shared with everyone (default) - "<custom>": Custom grouping (e.g., "sales_team") Supported Modes: - ALWAYS: Automatic extraction of entity info from conversations - AGENTIC: Agent calls tools directly to manage entity info'
  types: 0
  functions: 1
  imports: 21
  exports: 1
- file: stores/decision_log.py
