- name: ParallelTools
  kind: struct
  ctx: 'ParallelTools provides access to Parallel''s web search and extraction APIs. Parallel offers powerful APIs optimized for AI agents: - Search API: AI-optimized web search that returns relevant excerpts tailored for LLMs - Extract API: Extract content from specific URLs in clean markdown format, handling JavaScript-heavy pages and PDFs Args: api_key (Optional[str]): Parallel API key. If not provided, will use PARALLEL_API_KEY environment variable. enable_search (bool): Enable Search API functionality. Default is True. enable_extract (bool): Enable Extract API functionality. Default is True. all (bool): Enable all tools. Overrides individual flags when True. Default is False. max_results (int): Default maximum number of results for search operations. Default is 10. max_chars_per_result (int): Default maximum characters per result for search operations. Default is 10000. beta_version (str): Beta API version header. Default is "search-extract-2025-10-10". mode (Optional[str]): Default search mode. Options: "one-shot" or "agentic". Default is None. include_domains (Optional[List[str]]): Default domains to restrict results to. Default is None. exclude_domains (Optional[List[str]]): Default domains to exclude from results. Default is None. max_age_seconds (Optional[int]): Default cache age threshold (minimum 600). Default is None. disable_cache_fallback (Optional[bool]): Default cache fallback behavior. Default is None.'
