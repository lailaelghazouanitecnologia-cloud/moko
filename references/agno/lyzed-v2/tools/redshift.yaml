types:
- name: RedshiftTools
  kind: struct
  ctx: 'A toolkit for interacting with Amazon Redshift databases. Supports these authentication methods: - Standard username and password authentication - IAM authentication with AWS profile - IAM authentication with AWS credentials Args: host (Optional[str]): Redshift cluster endpoint hostname. Falls back to REDSHIFT_HOST env var. port (int): Redshift cluster port number. Default is 5439. database (Optional[str]): Database name to connect to. Falls back to REDSHIFT_DATABASE env var. user (Optional[str]): Username for standard authentication. password (Optional[str]): Password for standard authentication. iam (bool): Enable IAM authentication. Default is False. cluster_identifier (Optional[str]): Redshift cluster identifier for IAM auth with provisioned clusters. Falls back to REDSHIFT_CLUSTER_IDENTIFIER env var. region (Optional[str]): AWS region for IAM credential retrieval. Falls back to AWS_REGION or AWS_DEFAULT_REGION env vars. db_user (Optional[str]): Database user for IAM auth with provisioned clusters. Falls back to REDSHIFT_DB_USER env var. access_key_id (Optional[str]): AWS access key ID for IAM auth. Falls back to AWS_ACCESS_KEY_ID env var. secret_access_key (Optional[str]): AWS secret access key for IAM auth. Falls back to AWS_SECRET_ACCESS_KEY env var. session_token (Optional[str]): AWS session token for temporary credentials. Falls back to AWS_SESSION_TOKEN env var. profile (Optional[str]): AWS profile name for IAM auth. Falls back to AWS_PROFILE env var. ssl (bool): Enable SSL connection. Default is True. table_schema (str): Default schema for table operations. Default is "public".'
