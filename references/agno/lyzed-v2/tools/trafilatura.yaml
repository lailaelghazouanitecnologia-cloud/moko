- name: TrafilaturaTools
  kind: struct
  ctx: 'TrafilaturaTools is a toolkit for web scraping and text extraction. Args: output_format (str): Default output format for extractions. Options: ''txt'', ''json'', ''xml'', ''markdown'', ''csv'', ''html'', ''xmltei''. include_comments (bool): Whether to extract comments along with main text by default. include_tables (bool): Whether to include table content by default. include_images (bool): Whether to include image information by default (experimental). include_formatting (bool): Whether to preserve formatting by default. include_links (bool): Whether to preserve links by default (experimental). with_metadata (bool): Whether to include metadata in extractions by default. favor_precision (bool): Whether to prefer precision over recall by default. favor_recall (bool): Whether to prefer recall over precision by default. target_language (Optional[str]): Default target language filter (ISO 639-1 format). deduplicate (bool): Whether to remove duplicate segments by default. max_tree_size (Optional[int]): Maximum tree size for processing. max_crawl_urls (int): Maximum number of URLs to crawl per website. max_known_urls (int): Maximum number of known URLs during crawling.'
