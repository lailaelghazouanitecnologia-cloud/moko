types:
- name: SettingsMixin
  kind: interface
  status: translated
  target_file: src/config/settings-mixin.ts
  description: Centralized configuration mixin for all subsystems
  fields:
  - name: backend
    type: BackendOpts
  - name: shell
    type: ShellOpts
  - name: web
    type: WebOpts
  - name: mcp
    type: MCPOpts
  - name: gui
    type: GUIOpts
  - name: skillSearch
    type: SkillSearchOpts
  - name: skillQuality
    type: SkillQualityOpts
  - name: skill
    type: SkillOpts
  - name: grounding
    type: GroundingOpts
  methods:
  - name: merge
    sig: '(other: SettingsMixin): SettingsMixin'
    hint: deep merge configs
  - name: validate
    sig: '(): void'
    hint: check constraints
  - name: toEnv
    sig: '(): Record<string, string>'
    hint: export env vars
- name: BackendOpts
  kind: interface
  status: translated
  target_file: src/config/backend-opts.ts
  description: Backend configuration contract
  fields:
  - name: backendType
    type: BackendType
  - name: endpoint
    type: string
  - name: apiKey
    type: string
  - name: timeout
    type: number
  - name: maxRetries
    type: number
  methods:
  - name: validate
    sig: '(): boolean'
    hint: check config valid
  - name: toJSON
    sig: '(): Record<string, any>'
    hint: serialize config
  - name: merge
    sig: '(other: Partial<BackendOpts>): BackendOpts'
    hint: combine configs
- name: ShellOpts
  kind: interface
  status: translated
