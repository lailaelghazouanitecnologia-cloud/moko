    type: boolean
  methods:
  - name: validate
    sig: '(): void'
    hint: ensure sane values
  - name: toDict
    sig: '(): Record<string, any>'
    hint: plain object export
  - name: merge
    sig: '(other: Partial<ShellOpts>): ShellOpts'
    hint: overlay options
- name: WebOpts
