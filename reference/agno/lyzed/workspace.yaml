## Roska Workspace Descriptor — agno-agi/agno
## Hierarchy: Workspace → Module → File → Class/Function → Detail
## Depth 0: purpose + tags (~10 tokens/file)
## Depth 1: + imports, type names, function signatures (~60 tokens)
## Depth 2: + fields, params, locals, calls (~150 tokens)
## Depth 3: + body opcodes, full execution flow (~300 tokens)

name: agno
path: libs/agno/agno/
purpose: "Full-stack runtime for agentic AI software"
tags: [ai-agents, multi-agent, orchestration, rag, llm, production, python]
shared_deps:
  - pydantic>=2.0
  - httpx
  - rich
  - docstring-parser

