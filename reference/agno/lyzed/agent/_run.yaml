  # ── Core Execution (THE 13-STEP PIPELINE) ──
  - name: _run
    sig: "(agent, input_message, *, session=None, run_context=None, ...) -> RunOutput"
    ctx: |
      Main non-streaming sync execution. 13-step pipeline:
        1. Read/Create Session
        2. Update Metadata & Session State
        3. Resolve Dependencies
        4. Execute Pre-Hooks (guardrails, evals)
        5. Determine Tools for Model
        6. Prepare Run Messages (system + user + history + context)
        7. Start Background Tasks (memory, learning, culture)
        8. Handle Reasoning (if enabled — native or CoT)
        9. Generate Model Response (tool execution happens here)
       10. Output/Parser Model Processing
       11. Convert to Structured Format
       12. Execute Post-Hooks
       13. Wait for Background Tasks, cleanup_and_store()
      Wrapped in retry loop with exponential backoff.
    lines: [323, 711]
    calls:
      - _storage.read_or_create_session
      - resolve_run_dependencies
      - _hooks.execute_pre_hooks
      - agent.get_tools
      - _tools.determine_tools_for_model
      - _messages.get_run_messages
      - _managers.start_memory_future
      - _managers.start_learning_future
      - _response.handle_reasoning
      - agent.model.response
      - _response.generate_response_with_output_model
      - _response.parse_response_with_parser_model
      - _response.convert_response_to_structured_format
      - _hooks.execute_post_hooks
      - cleanup_and_store

