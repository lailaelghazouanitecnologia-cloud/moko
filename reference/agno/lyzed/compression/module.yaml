## Roska Module Descriptor — compression/
name: compression
purpose: "Message context compression — LLM-driven tool result compression to reduce token usage"
tags: [compression, context, tokens, optimization]

files:
  - file: manager.py
    purpose: "CompressionManager — decides when to compress and executes compression via LLM"
    tags: [manager, compression, llm]

types:
  - name: CompressionManager
    kind: struct
    vis: pub
    ctx: "@dataclass. Compresses verbose tool results to preserve key facts while reducing tokens."
    fields:
      - {name: model, type: "Optional[Model]", ctx: "LLM model for compression"}
      - {name: compress_tool_results, type: bool, ctx: "Enable tool result compression (default: True)"}
      - {name: compress_tool_results_limit, type: "Optional[int]", ctx: "Compress after N uncompressed results"}
      - {name: compress_token_limit, type: "Optional[int]", ctx: "Compress when token count exceeds limit"}
      - {name: compress_tool_call_instructions, type: "Optional[str]", ctx: "Custom compression prompt"}
      - {name: stats, type: "Dict[str, Any]", ctx: "Compression statistics"}

functions:
  - name: should_compress
    sig: "(self, messages, tools, model, response_format) -> bool"
    vis: pub
    ctx: "Decide if compression is needed based on limits"

  - name: ashould_compress
    sig: "async (self, messages, tools, model, response_format) -> bool"
    vis: pub
    is_async: true

  - name: compress
    sig: "(self, messages, run_metrics) -> None"
    vis: pub
    ctx: "Execute compression — preserves facts/numbers/dates, removes filler"

  - name: acompress
    sig: "async (self, messages, run_metrics) -> None"
    vis: pub
    is_async: true

data:
  - name: compression_strategy
    type: "conceptual"
    ctx: |
      Preserves: specific facts, numbers, statistics, dates, entities, identifiers, quotes
      Removes: introductions, hedging, meta-commentary, formatting, promotional text
      Integration: Agent.compress_tool_results=True, Agent.compression_manager=CompressionManager(...)
      Events: CompressionStartedEvent, CompressionCompletedEvent
      Message field: compressed_content: Optional[str]
