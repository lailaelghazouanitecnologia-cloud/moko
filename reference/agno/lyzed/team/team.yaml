  - name: TeamMode
    kind: enum
    vis: pub
    ctx: "Execution mode for the team"
    variants:
      - {name: coordinate, ctx: "Default. Leader picks members, crafts tasks, synthesizes responses."}
      - {name: route, ctx: "Leader routes to a specialist, returns member response directly."}
      - {name: broadcast, ctx: "Delegate same task to ALL members simultaneously."}
      - {name: tasks, ctx: "Autonomous task loop. Leader decomposes goals, assigns tasks, iterates until complete."}

