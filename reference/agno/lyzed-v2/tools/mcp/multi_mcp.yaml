- name: MultiMCPTools
  kind: struct
  ctx: 'A toolkit for integrating multiple Model Context Protocol (MCP) servers with Agno agents. This allows agents to access tools, resources, and prompts exposed by MCP servers. Can be used in three ways: 1. Direct initialization with a ClientSession 2. As an async context manager with StdioServerParameters 3. As an async context manager with SSE or Streamable HTTP endpoints'
