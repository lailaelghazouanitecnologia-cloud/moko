- name: BrightDataTools
  kind: struct
  ctx: 'BrightData is a toolkit for web scraping, screenshots, search engines, and web data feeds. Args: api_key (Optional[str]): Bright Data API key. Retrieved from BRIGHT_DATA_API_KEY env variable if not provided. enable_scrape_markdown (bool): Enable webpage scraping as Markdown. Default is True. enable_screenshot (bool): Enable website screenshot capture. Default is True. enable_search_engine (bool): Enable search engine functionality. Default is True. enable_web_data_feed (bool): Enable web data feed retrieval. Default is True. all (bool): Enable all tools. Overrides individual flags when True. Default is False. serp_zone (str): SERP zone for search operations. Default is "serp_api". web_unlocker_zone (str): Web unlocker zone for scraping operations. Default is "web_unlocker1". verbose (bool): Enable verbose logging. Default is False. timeout (int): Timeout in seconds for operations. Default is 600.'
