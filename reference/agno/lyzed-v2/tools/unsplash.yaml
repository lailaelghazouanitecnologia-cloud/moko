  ctx: 'A toolkit for searching and retrieving images from Unsplash. Unsplash provides access to over 4.3 million high-quality, royalty-free images that can be used for various purposes. This toolkit enables AI agents to: - Search for photos by keywords - Get detailed information about specific photos - Retrieve random photos with optional filters - Track downloads (required by Unsplash API guidelines) Example: ```python from agno.agent import Agent from agno.models.openai import OpenAIChat from agno.tools.unsplash import UnsplashTools agent = Agent( model=OpenAIChat(id="gpt-4o"), tools=[UnsplashTools()], ) agent.print_response("Find me 3 photos of mountains at sunset") ```'
