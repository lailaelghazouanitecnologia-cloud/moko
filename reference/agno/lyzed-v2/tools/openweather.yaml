- name: OpenWeatherTools
  kind: struct
  ctx: 'OpenWeather is a toolkit for accessing weather data from OpenWeatherMap API. Args: api_key (Optional[str]): OpenWeatherMap API key. If not provided, will try to get from OPENWEATHER_API_KEY env var. units (str): Units of measurement. Options are ''standard'', ''metric'', and ''imperial''. Default is ''metric''. enable_current_weather (bool): Enable current weather function. Default is True. enable_forecast (bool): Enable forecast function. Default is True. enable_air_pollution (bool): Enable air pollution function. Default is True. enable_geocoding (bool): Enable geocoding function. Default is True. all (bool): Enable all functions. Default is False.'
