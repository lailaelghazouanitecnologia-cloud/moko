types:
- name: AwsBedrockReranker
  kind: struct
  ctx: 'AWS Bedrock reranker supporting Amazon Rerank 1.0 and Cohere Rerank 3.5 models. This reranker uses the unified Bedrock Rerank API (bedrock-agent-runtime) which provides a consistent interface for both model providers. To use this reranker, you need to either: 1. Set the following environment variables: - AWS_ACCESS_KEY_ID - AWS_SECRET_ACCESS_KEY - AWS_REGION 2. Or provide a boto3 Session object Args: model (str): The model ID to use. Options: - ''amazon.rerank-v1:0'' (Amazon Rerank 1.0) - ''cohere.rerank-v3-5:0'' (Cohere Rerank 3.5) Default is ''cohere.rerank-v3-5:0''. top_n (Optional[int]): Number of top results to return after reranking. If None, returns all documents reranked. aws_region (Optional[str]): The AWS region to use. aws_access_key_id (Optional[str]): The AWS access key ID to use. aws_secret_access_key (Optional[str]): The AWS secret access key to use. session (Optional[Session]): A boto3 Session object for authentication. additional_model_request_fields (Optional[Dict]): Additional model-specific parameters to pass in the request (e.g., Cohere-specific options). Example: ```python from agno.knowledge.reranker.aws_bedrock import AwsBedrockReranker # Using Cohere Rerank 3.5 (default) reranker = AwsBedrockReranker( model="cohere.rerank-v3-5:0", top_n=5, aws_region="us-west-2", ) # Using Amazon Rerank 1.0 reranker = AwsBedrockReranker( model="amazon.rerank-v1:0", top_n=10, aws_region="us-west-2", ) # Rerank documents reranked_docs = reranker.rerank(query="What is machine learning?", documents=docs) ``` Note: - Amazon Rerank 1.0 is NOT available in us-east-1 (N. Virginia). Use Cohere Rerank 3.5 in that region. - Maximum 1000 documents per request.'
