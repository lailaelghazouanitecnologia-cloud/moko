purpose: 'LearningMachine Configuration ============================= Enums and configuration classes for the unified learning system. Uses dataclasses instead of Pydantic BaseModels to avoid runtime overhead and validation errors that could break agents mid-run. Configurations: - LearningMode: How learning is extracted (ALWAYS, AGENTIC, PROPOSE, HITL) - UserProfileConfig: Config for user profile learning - MemoriesConfig: Config for memories learning - SessionContextConfig: Config for session context learning - LearnedKnowledgeConfig: Config for learned knowledge - EntityMemoryConfig: Config for entity memory'
