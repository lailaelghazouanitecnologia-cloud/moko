[project]
name = "ai-repo-analyzer"
version = "1.0.0"
description = "AI-powered GitHub repository analyzer built with the Agno framework"
requires-python = ">=3.10"
dependencies = [
    "agno>=1.0.0",
    "anthropic>=0.40.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
repo-analyzer = "repo_analyzer.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
