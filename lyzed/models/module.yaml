        lines: 1111
        purpose: "Claude implementation — extended thinking, prompt caching, MCP, structured outputs"
        descriptor: anthropic/claude.yaml

  - name: openai
    purpose: "GPT-4o, o-series, audio via OpenAI API"
    files:
      - file: chat.py
