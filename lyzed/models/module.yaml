## Roska Module Descriptor — models/
name: models
purpose: "47 LLM provider adapters under unified Model ABC interface"
tags: [llm, providers, streaming, function-calling, structured-outputs]

files:
  - file: base.py
    lines: ~500
    purpose: "Model ABC — abstract base with retry logic, caching, token counting"
    tags: [abc, base, retry, cache]
    descriptor: base/base.yaml

