## Roska Module Descriptor — hooks/
name: hooks
purpose: "Pre/post processing hooks with @hook decorator — background execution support"
tags: [hooks, decorator, pre-hook, post-hook, background]

files:
  - file: decorator.py
    purpose: "@hook decorator — marks functions as hooks with optional background execution"
    tags: [decorator, hook]

types:
  - name: "@hook"
    kind: "decorator"
    vis: pub
    ctx: "Decorator for pre/post hooks. Supports sync/async, background execution (AgentOS only)."

data:
  - name: usage_patterns
    type: "conceptual"
    ctx: |
      @hook                                    # Bare decorator — sync
      @hook()                                  # With parens — sync
      @hook(run_in_background=True)            # Background (AgentOS only)
      @hook(run_in_background=True)
      async def my_hook(run_output, agent):    # Async background hook

      Hook signatures:
        Pre-hook:  (run_input: RunInput, agent: Agent) -> None
        Post-hook: (run_output: RunOutput, agent: Agent) -> None

      Integration in Agent:
        pre_hooks: Optional[List[Union[Callable, BaseGuardrail, BaseEval]]]
        post_hooks: Optional[List[Union[Callable, BaseGuardrail, BaseEval]]]
        tool_hooks: Optional[List[Callable]]

functions:
  - name: hook
    sig: "(fn=None, *, run_in_background=False) -> Callable"
    vis: pub
    ctx: "Decorator factory — sets _agno_run_in_background attribute on function"

  - name: should_run_in_background
    sig: "(hook_func: Callable) -> bool"
    vis: pub
    ctx: "Check if hook has background execution flag"
