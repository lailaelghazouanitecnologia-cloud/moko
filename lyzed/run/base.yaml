## Roska File Descriptor — run/base.py
file: run/base.py
purpose: "RunContext, RunStatus, BaseRunOutputEvent — core run execution primitives"
tags: [context, status, base]

types:
  - name: RunStatus
    kind: enum
    vis: pub
    ctx: "Run lifecycle status"
    variants:
      - {name: pending, ctx: "Not yet started"}
      - {name: running, ctx: "Currently executing"}
      - {name: completed, ctx: "Finished successfully"}
      - {name: paused, ctx: "Paused for HITL (confirmation/input/external)"}
      - {name: cancelled, ctx: "Cancelled by user or system"}
      - {name: error, ctx: "Failed with error"}

  - name: RunContext
    kind: struct
    vis: pub
    ctx: "Context passed through the run pipeline — contains run metadata, session state, tools, knowledge"
    fields:
      - {name: run_id, type: str}
      - {name: session_id, type: "Optional[str]"}
      - {name: user_id, type: "Optional[str]"}
      - {name: workflow_id, type: "Optional[str]"}
      - {name: workflow_run_id, type: "Optional[str]"}
      - {name: dependencies, type: "Optional[Dict[str, Any]]"}
      - {name: knowledge_filters, type: "Optional[Dict]"}
      - {name: metadata, type: "Optional[Dict[str, Any]]"}
      - {name: session_state, type: "Optional[Dict[str, Any]]"}
      - {name: output_schema, type: "Optional[Any]"}
      - {name: messages, type: "Optional[List[Message]]"}
      - {name: tools, type: "Optional[List]"}
      - {name: knowledge, type: "Optional[Any]"}
      - {name: members, type: "Optional[List]"}

  - name: BaseRunOutputEvent
    kind: struct
    vis: pub
    ctx: "Base class for all run output events"
    methods:
      - "to_dict() -> Dict[str, Any]"
      - "to_json() -> str"
      - "from_dict(data: Dict) -> BaseRunOutputEvent"
