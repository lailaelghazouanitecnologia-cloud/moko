## Roska Module Descriptor — approval/
name: approval
purpose: "HITL approval system — @approval decorator, ApprovalType enum, RunRequirement lifecycle"
tags: [hitl, approval, confirmation, user-input, external-execution]

files:
  - file: types.py
    purpose: "ApprovalType enum — required | audit"
    tags: [enum, approval-type]

  - file: decorator.py
    purpose: "@approval decorator — marks tools requiring human approval"
    tags: [decorator, approval]

types:
  - name: ApprovalType
    kind: enum
    vis: pub
    ctx: "Approval behavior type"
    variants:
      - {name: required, val: "required", ctx: "Blocking — run pauses until resolved"}
      - {name: audit, val: "audit", ctx: "Non-blocking — audit record after interaction"}

  - name: "@approval"
    kind: "decorator"
    vis: pub
    ctx: "Decorator for tools requiring human approval"

data:
  - name: usage_patterns
    type: "conceptual"
    ctx: |
      @approval                    # Bare — default "required"
      @approval()                  # With parens — default "required"
      @approval(type="required")   # Blocking approval
      @approval(type="audit")      # Non-blocking audit trail

      HITL Flow:
        1. Agent calls tool with requires_confirmation=True
        2. RunPausedEvent emitted with RunRequirement
        3. Client confirms/rejects via requirement.confirm()/reject(note)
        4. Agent resumes or takes alternative action

      RunRequirement fields:
        tool_execution: Optional[ToolExecution]
        confirmation: Optional[bool]
        confirmation_note: Optional[str]
        user_input_schema: Optional[List[UserInputField]]
        user_feedback_schema: Optional[List[UserFeedbackQuestion]]
        external_execution_result: Optional[str]

      ToolExecution HITL fields:
        requires_confirmation: bool
        requires_user_input: bool
        external_execution_required: bool
        approval_type: str  # "required" | "audit"
        user_input_schema: Optional[List[UserInputField]]
        confirmed: Optional[bool]
        approval_id: Optional[str]
