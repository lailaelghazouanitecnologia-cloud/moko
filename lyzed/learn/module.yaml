## Roska Module Descriptor — learn/
name: learn
purpose: "LearningMachine — persistent learning across sessions via 6 store types"
tags: [learning, persistence, user-profile, entity-memory, knowledge]

files:
  - file: machine.py
    purpose: "LearningMachine orchestrator — manages 6 learning store types"
    tags: [learning, orchestrator]

  - file: config.py
    purpose: "Configuration models for each learning store type"
    tags: [config]

  - file: schemas.py
    purpose: "Data structures for learning records"
    tags: [schemas]

submodules:
  - name: stores
    purpose: "Storage backends for learning records"

types:
  - name: LearningMachine
    kind: struct
    vis: pub
    ctx: "@dataclass. Manages persistent learning across sessions via 6 store types."
    fields:
      - {name: db, type: "Optional[Union[BaseDb, AsyncBaseDb]]", ctx: "Storage backend"}
      - {name: model, type: "Optional[Model]", ctx: "LLM for learning extraction"}
      - {name: knowledge, type: "Optional[Any]", ctx: "Knowledge base reference"}
      - {name: user_profile, type: "Union[bool, UserProfileConfig, UserProfileStore]", ctx: "User profile learning (default: False)"}
      - {name: user_memory, type: "Union[bool, UserMemoryConfig, UserMemoryStore]", ctx: "User memory learning (default: False)"}
      - {name: session_context, type: "Union[bool, SessionContextConfig, SessionContextStore]", ctx: "Session context learning (default: False)"}
      - {name: entity_memory, type: "Union[bool, EntityMemoryConfig, EntityMemoryStore]", ctx: "Entity memory learning (default: False)"}
      - {name: learned_knowledge, type: "Union[bool, LearnedKnowledgeConfig, LearnedKnowledgeStore]", ctx: "Learned knowledge (default: False)"}
      - {name: decision_log, type: "Union[bool, DecisionLogConfig, DecisionLogStore]", ctx: "Decision logging — Phase 2 (default: False)"}
      - {name: namespace, type: str, ctx: "Namespace for isolation (default: 'global')"}
      - {name: custom_stores, type: "Optional[Dict[str, LearningStore]]", ctx: "Custom store implementations"}
      - {name: debug_mode, type: bool, ctx: "Debug logging (default: False)"}

data:
  - name: learning_types
    type: "conceptual"
    ctx: |
      6 learning store types:
        1. UserProfile — who the user is (preferences, demographics)
        2. UserMemory — history with user (past interactions)
        3. SessionContext — current session state
        4. EntityMemory — external entity knowledge
        5. LearnedKnowledge — reusable insights extracted from interactions
        6. DecisionLog — decision audit trail (Phase 2)

      Integration: Agent.learning = LearningMachine(...) or Agent.learning = True
      Context: Agent.add_learnings_to_context = True
