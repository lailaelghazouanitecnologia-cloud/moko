types:
- name: ActionCapture
  kind: class
  status: translated
  target_file: src/recording/action-capture.ts
  description: Captures and stores a single user action event
  fields:
  - name: timestamp
    type: number
  - name: type
    type: string
  - name: payload
    type: any
  - name: metadata
    type: any
  methods:
  - name: capture
    sig: '(type: string, payload: any): void'
    hint: record new action
  - name: toJSON
    sig: '(): string'
    hint: serialize action
  - name: replay
    sig: '(): Promise<void>'
    hint: replay action
  - name: validate
    sig: '(): boolean'
    hint: check payload
  - name: clone
    sig: '(): Action'
    hint: create copy
  - name: diff
    sig: '(other: Action): any'
    hint: compare payloads
  - name: seed
    sig: '(json: string): Action'
    hint: seed from json
  - name: isValidType
    sig: '(type: string): boolean'
    hint: check type
  - name: hash
    sig: '(): string'
    hint: calculate hash
- name: CaptureManager
  kind: class
  status: translated
  target_file: src/recording/capture-manager.ts
  description: orchestrates capture lifecycle
  fields:
  - name: is_recording
    type: boolean
  - name: storage_path
    type: string
  - name: trace_id
    type: string
  methods:
  - name: start
    sig: '(trace_id: string): Promise<void>'
    hint: start new capture
  - name: pause
    sig: '(): void'
    hint: pause current capture
  - name: resume
    sig: '(): void'
    hint: resume paused capture
  - name: stop
    sig: '(): Promise<string>'
  - name: abort
    sig: '(): void'
    hint: discard capture
  - name: list
    sig: '(): Promise<string[]>"'
    hint: list trace ids
  - name: load
    sig: '(trace_id: string): CaptureViewer'
    hint: load for replay
  - name: delete
    sig: '(trace_id: string): Promise<void>'
    hint: delete capture
  - name: archive
    sig: '(trace_id: string): archive'
    hint: archive to cloud
- name: ClipRecorder
  kind: class
  status: translated
  target_file: src/recording/clip-recorder.ts
  description: Records user interaction clips
  fields:
  - name: isRecording
    type: boolean
  - name: fileName
    type: string
  - name: startTime
    type: number
  - name: clipBuffer
    type: any[]
  - name: recordingManager
    type: RecordingManager
  methods:
  - name: start
    sig: '(fileName: string): Promise<void>'
    hint: start new clip
  - name: stop
    sig: '(): Promise<void>'
    hint: end recording
  - name: pause
    sig: '(): void'
    hint: resume paused
  - name: addFrame
    sig: '(frame: any): void'
  - name: save
    sig: '(): Promise<string>'
  - name: abort
    sig: '(): void'
- name: CaptureViewer
  kind: class
  status: translated
  target_file: src/recording/capture-viewer.ts
  description: Plays back recorded captures
  fields:
  - name: capture
    type: ActionCapture
  - name: currentFrame
  - name: playbackSpeed
    type: number
  - name: loop
    type: boolean
  methods:
  - name: load
    sig: '(capture: ActionCapture): void'
    hint: load capture data
  - name: start
    sig: '(): Promise<void>'
    hint: start playback
  - name: pause
    sig: '(): void'
    hint: pause playback
  - name: resume
    sig: '(): void'
  - name: stop
    sig: '(): void'
  - name: seek
    sig: '(frame: number): void'
  - name: ''
  - name: previous
  - name: setSpeed
- name: TraceRecorder
  kind: class
  status: translated
  target_file: src/recording/trace-recorder.ts
  description: Records full execution traces for replay
  fields:
  - name: traceId
    type: string
  - name: startTime
    type: Date
  - name: isRecording
    type: boolean
  - name: events
    type: Array<TraceEvent>
  methods:
  - name: start
    sig: '(): void'
    hint: Begin trace capture
  - name: stop
    sig: '(): TraceSummary'
    hint: End and summarize
  - name: recordEvent
    sig: '(event: TraceEvent): void'
    hint: Log single event
  - name: save
    sig: '(path: string): Promise<void>'
    hint: Persist to disk
  - name: load
    sig: '(path: string): Promise<TraceRecorder>'
    hint: Restore from disk
  - name: replay
    sig: '(): AsyncIterable<TraceEvent>'
    hint: Stream events back
