types:
- name: AgentCore
  kind: class
  status: translated
  target_file: src/agents/agent-core.ts
  description: Central orchestrator for agent lifecycle and grounding integration
  fields:
  - name: id
    type: string
  - name: state
    type: AgentState
  - name: pool
    type: AgentPool
  - name: grounding
    type: GroundedAgent
  - name: recording
    type: RecordingManager
  methods:
  - name: start
    sig: '(): Promise<void>'
    hint: initialize agent runtime
  - name: stop
    sig: '(): Promise<void>'
    hint: graceful shutdown
  - name: execute
    sig: '(query: string): Promise<ToolResult>'
    hint: run user query
  - name: pause
    sig: '(): void'
    hint: pause execution
  - name: resume
    sig: '(): void'
    hint: resume execution
  - name: reset
    sig: '(): Promise<void>'
    hint: clear state
  - name: attachGrounding
    sig: '(client: GroundingClient): void'
    hint: bind grounding client
  - name: detachGrounding
    sig: '(): void'
    hint: unbind grounding
  - name: recordAction
    sig: '(action: Action): Promise<void>'
    hint: log action
- name: AgentState
  kind: class
  status: translated
  target_file: src/agents/agent-state.ts
  description: Encapsulates runtime state of an agent
  fields:
  - name: status
    type: string
  - name: context
    type: Map<string, any>
  - name: lastAction
    type: string
  - name: recordingId
    type: string
  methods:
  - name: updateStatus
    sig: '(status: string): void'
    hint: set agent status
  - name: getContext
    sig: '(key: string): any'
    hint: retrieve context value
  - name: setContext
    sig: '(key: string, value: any): void'
    hint: store context value
  - name: recordAction
    sig: '(action: string): void'
    hint: log last action
  - name: isRecording
    sig: '(): boolean'
    hint: check recording active
  - name: attachRecording
    sig: '(recordingId: string): void'
    hint: link recording id
  - name: serialize
    sig: '(): string'
    hint: export to json
  - name: deserialize
    sig: '(data: string): void'
    hint: load from json
- name: AgentPool
  kind: class
  status: translated
  target_file: src/agents/agent-pool.ts
  description: Manages lifecycle and pooling of AgentCore instances
  fields:
  - name: agents
    type: Map<string, AgentCore>
  - name: state
    type: AgentState
  - name: maxPoolSize
    type: number
  - name: idleTimeoutMs
    type: number
  methods:
  - name: acquire
    sig: '(id: string): Promise<AgentCore>'
    hint: checkout agent instance
  - name: release
    sig: '(agent: AgentCore): Promise<void>'
    hint: return to pool
  - name: spawn
    sig: '(config: any): Promise<AgentCore>'
    hint: create new agent
  - name: retire
    sig: '(id: string): Promise<void>'
    hint: remove agent
  - name: list
    sig: '(): AgentCore[]'
    hint: get all agents
  - name: prune
    sig: '(): Promise<number>'
    hint: clean idle agents
  - name: reset
    sig: '(id: string): Promise<void>'
    hint: restart agent
- name: GroundedAgent
  kind: class
  status: translated
  target_file: src/agents/grounded-agent.ts
  description: Agent with grounding integration for tool use
  fields:
  - name: agentCore
    type: AgentCore
  - name: groundingClient
    type: GroundingClient
  - name: toolCache
    type: Map<string, BaseTool>
  - name: recordingManager
    type: RecordingManager
  methods:
  - name: initialize
    sig: '(): Promise<void>'
    hint: setup grounding and cache
  - name: execute
    sig: '(query: string): Promise<ToolResult>'
    hint: run grounded task
  - name: searchTools
    sig: '(query: string): Promise<BaseTool[]>'
    hint: hybrid search pipeline
  - name: applyPatch
    sig: '(patch: string, targetDir: string): Promise<boolean>'
    hint: fuzzy patch application
  - name: startRecording
    sig: '(sessionId: string): Promise<void>'
    hint: begin trajectory capture
  - name: stopRecording
    sig: '(sessionId: string): Promise<RecordingViewer>'
    hint: end and return viewer
  - name: resolveHostConfig
    sig: '(): Promise<OpenSpaceConfig>'
    hint: auto detect host config
  - name: listGroundedSkills
    sig: '(): Promise<string[]>'
    hint: show available skills
  - name: refreshSkills
    sig: '(): Promise<void>'
    hint: reload from disk
