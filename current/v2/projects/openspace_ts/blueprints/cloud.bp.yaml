types:
- name: CloudFault
  kind: class
  status: translated
  target_file: src/cloud/cloud-fault.ts
  description: Standardized cloud error wrapper
  fields:
  - name: code
    type: string
  - name: message
    type: string
  - name: details
    type: Record<string, any>
  methods:
  - name: fromError
    sig: '(err: Error): CloudFault'
    hint: wrap native error
  - name: toJSON
    sig: '(): string'
    hint: serialize for wire
  - name: isRetryable
    sig: '(): boolean'
    hint: check retry policy
  - name: log
    sig: '(logger: Logger): void'
    hint: emit structured log
  - name: enrich
    sig: '(ctx: Record<string, any>): CloudFault'
    hint: add context fields
- name: ForgeClient
  kind: class
  status: translated
  target_file: src/cloud/forge-client.ts
  description: Remote skill repository client
  fields:
  - name: baseUrl
    type: string
  - name: apiKey
    type: string
  - name: timeout
    type: number
  methods:
  - name: searchSkills
    sig: '(query: string, limit?: number): Promise<SkillIndex[]>'
    hint: hybrid search pipeline
  - name: downloadSkill
    sig: '(id: string, targetDir: string): Promise<void>'
    hint: fetch and save skill
  - name: uploadSkill
    sig: '(skillPath: string, metadata: object): Promise<string>'
    hint: publish skill package
  - name: deleteSkill
    sig: '(id: string): Promise<void>'
    hint: remove from cloud
  - name: listSkills
    sig: '(tags?: string[]): Promise<SkillIndex[]>'
    hint: enumerate with filters
  - name: applyPatch
    sig: '(skillId: string, patch: string): Promise<void>'
    hint: fuzzy patch apply
  - name: getConfig
    sig: '(): Promise<object>'
    hint: host auto detection
  - name: recordExecution
    sig: '(sessionId: string, data: object): Promise<void>'
    hint: upload trajectory
- name: SkillIndex
  kind: class
  status: translated
  target_file: src/cloud/skill-index.ts
  description: Remote skill repository search and sharing infrastructure
  fields:
  - name: client
    type: ForgeClient
  - name: cache
    type: Map<string, any>
  - name: indexVersion
    type: string
  methods:
  - name: search
    sig: '(query: string, limit?: number): Promise<SkillMatch[]>'
    hint: hybrid BM25 vector search
  - name: publish
    sig: '(skill: SkillMeta): Promise<void>'
    hint: upload skill to cloud
  - name: delete
    sig: '(skillId: string): Promise<void>'
    hint: remove skill by id
  - name: download
    sig: '(skillId: string): Promise<SkillBundle>'
    hint: fetch skill artifact
  - name: rate
    sig: '(skillId: string, rating: number): Promise<void>'
    hint: submit user rating
  - name: listTrending
    sig: '(days?: number): Promise<SkillMeta[]>'
    hint: popular recent skills
  - name: refreshCache
    sig: '(): Promise<void>'
    hint: invalidate local cache
  - name: resolveDependencies
    sig: '(skillId: string): Promise<string[]>'
    hint: get skill dependencies
