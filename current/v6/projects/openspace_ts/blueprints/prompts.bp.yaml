types:
- name: SkillForgePrompts
  kind: class
  status: translated
  target_file: src/prompts/skill-forge-prompts.ts
  description: Prompt templates for skill evolution
  fields:
  - name: skillEvolutionPrompt
    type: string
  - name: patchGenerationPrompt
    type: string
  - name: validationPrompt
    type: string
  - name: rollbackPrompt
    type: string
  methods:
  - name: getSkillEvolutionPrompt
    sig: '(skill: string, context: string): string'
    hint: generate evolution prompt
  - name: getPatchPrompt
    sig: '(skill: string, diff: string): string'
    hint: create patch prompt
  - name: getValidationPrompt
    sig: '(skill: string, test: string): string'
    hint: validate skill prompt
  - name: getRollbackPrompt
    sig: '(skill: string, version: string): string'
    hint: rollback skill prompt
  - name: renderTemplate
    sig: '(template: string, vars: Map<string, string>): string'
    hint: render template vars
- name: GroundedAgentPrompts
  kind: class
  status: translated
  target_file: src/prompts/grounded-agent-prompts.ts
  references:
  - openspace/__root__/__init__.yaml
  - openspace/__root__/__main__.yaml
  - openspace/__root__/module.yaml
  - openspace/__root__/dashboard_server.yaml
  - openspace/__root__/mcp_server.yaml
