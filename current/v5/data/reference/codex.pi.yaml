decisions:
- area: architecture
  choice: Event-driven state management over direct state mutation
  why: Enables loose coupling between execution engine and UI components, supports multiple consumers of execution events
- area: error_handling
  choice: Separate TurnFailedEvent instead of exceptions for execution failures
  why: Maintains stream continuity and provides structured error information without breaking the async generator flow
- area: coupling
  choice: 17-field configuration object (CodexExecArgs) instead of parameter lists
  why: Provides extensibility for execution options while maintaining backward compatibility as new features are added
- area: identity
  choice: TypeScript typealiases over classes for data structures
  why: Reduces boilerplate while maintaining type safety, aligns with functional programming patterns in the codebase
- area: persistence
  choice: Patch-based file updates instead of full file rewrites
  why: Enables atomic changes, supports rollback mechanisms, and reduces I/O overhead for large files
