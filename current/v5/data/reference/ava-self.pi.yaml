patterns:
- name: actor-registry-dispatch
  what: Maps block types to specialized actors for modular execution
  how: Registry pattern with BaseActor protocol - each actor implements execute() and handles specific BlockType (analyze,
    implement, test, etc.)
  components:
  - ActorRegistry
  - BaseActor
  - BlockType
  where: actors/base.py
  loc: 150
  reusable_when: When you need pluggable workers for different task types
- name: state-matrix-compression
  what: Virtual machine that tracks analysis state to minimize LLM tokens
  how: Maintains compressed representation of what LLM already knows instead of dumping raw YAML, with analysis states and
    budget-aware loading
  components:
  - StateMatrix
  - AnalysisState
  - what_to_load()
  where: pipeline/matrix.py
  loc: 400
  reusable_when: When context window management is critical for LLM interactions
- name: blockchain-style-planning
  what: Immutable plan chain with branching for evaluations
  how: Project → Branches → Plan → Blocks hierarchy where each Branch maintains a blockchain of Blocks with status tracking
    and parallel execution
  components:
  - Branch
  - Project
  - Block
  - BlockStatus
  where: core/models.py
  loc: 500
  reusable_when: When you need reproducible, auditable execution chains
- name: intelligent-context-compression
  what: 5-stage compression pipeline for Roska descriptors
  how: Signature truncation, type filtering, method pruning, field sampling, and YAML minification to fit token limits
  components:
  - Compressor
  - compression_strategies
  where: pipeline/compressor.py
  loc: 300
  reusable_when: When dealing with large codebases that exceed LLM context limits
- name: guardrails-budget-enforcement
  what: Centralized safety limits with cumulative usage tracking
  how: RunGuard instance shared across all components tracks tokens, blocks, plan size and throttles/halts when limits exceeded
  components:
  - RunGuard
  - GuardrailTripped
  - RunLimits
  where: core/guardrails.py
  loc: 400
  reusable_when: When preventing runaway AI agent costs is critical
features:
- name: multi-agent-architecture-analysis
  description: Specialized agents analyze different aspects of codebase architecture
  algorithm: ActionPipeline with compression and state matrix - architect agent uses intelligent context building with module-focused
    pipeline
  key_insight: Each agent (architect, security, dependency) uses tailored pipeline strategies for optimal context building
  modules:
  - agents/architect.py
  - agents/security.py
  - agents/dependency.py
  loc: 800
  complexity: high
- name: structured-discussion-system
  description: Multi-stance debates within execution blocks
  algorithm: DiscussantActor cycles through stances (advocate, critic, pragmatist, architect) for comprehensive analysis
  key_insight: Forces examination of problems from multiple perspectives before implementation
  modules:
  - actors/discussant.py
  loc: 200
  complexity: medium
- name: evaluation-branching-system
  description: A/B testing different implementations of same type
  algorithm: Evaluation branches re-implement single types with different algorithms, then benchmark against main branch
  key_insight: Blockchain-style branching enables safe experimentation without affecting main development
  modules:
  - duel/evaluation.py
  - core/branch.py
  loc: 600
  complexity: high
- name: semantic-vector-search
  description: Hybrid search combining vector similarity with structured filters
  algorithm: LanceDB with Nomic embeddings + voyage API, supports semantic search with project/type filters
  key_insight: Splits large descriptors per-type for better embedding quality
  modules:
  - vectorstore/search.py
  - vectorstore/indexer.py
  loc: 400
  complexity: medium
- name: auto-fix-compilation-errors
  description: Intelligent compilation error fixing with multiple strategies
  algorithm: Error clustering + strategy pattern - SyntaxStrategy, ImportStrategy, ConstructorTypoStrategy applied based on
    error type
  key_insight: Cascading fixes where one fix may reveal new errors for iterative improvement
  modules:
  - fix/strategies.py
  loc: 500
  complexity: high
- name: quality-classification-tree
  description: Decision tree classifier for code quality issues
  algorithm: Custom tree building with entropy-based splits, max depth 6, min leaf 3 for quality prediction
  key_insight: Embeddings + tree classifier outperform pure similarity matching for quality hints
  modules:
  - quality/quality_classifier.py
  loc: 300
  complexity: medium
- name: resumable-session-state
  description: Persistent state enabling resume of interrupted generation runs
  algorithm: Saves after each module completion with goal, spec, completed modules, tokens used - supports ava dev --resume
  key_insight: Granular checkpointing prevents complete restart on failures
  modules:
  - session/run_state.py
  loc: 200
  complexity: low
- name: emission-index-matching
  description: Finds relevant reference implementations for blueprint types
  algorithm: EmissionIndex matches TypeBlueprint methods against Roska descriptors across all reference projects for intelligent
    reference selection
  key_insight: Method-level matching provides more precise references than type-level matching
  modules:
  - tools/emission.py
  loc: 300
  complexity: medium
decisions:
- area: architecture
  choice: Actor-based system with registry pattern instead of monolithic supervisor
  why: Extracted 1705-LOC god object into specialized actors for maintainability and testability
- area: context_management
  choice: State matrix + compression pipeline instead of raw YAML dumping
  why: Reduces LLM tokens by 60-80% while maintaining relevant context for large codebases
- area: evaluation
  choice: Blockchain-style branching with evaluation branches for A/B testing
  why: Enables safe experimentation and benchmarking without corrupting main development chain
- area: error_handling
  choice: Structured exception hierarchy with recoverable errors
  why: Replaces generic Exception catching with specific error types for better error recovery
- area: identity
  choice: Roska descriptors as universal code representation format
  why: Enables consistent analysis across languages and projects with structured metadata
- area: persistence
  choice: LanceDB for vector store with per-type descriptor splitting
  why: Better embedding quality for large files while maintaining fast semantic search
