decisions:
- area: architecture
  choice: Trait-based handler pattern instead of inheritance for LLM providers
  why: Enables composition over inheritance, easier testing, and provider-specific optimization without base class bloat
- area: coupling
  choice: Shared module for both extension and webview code
  why: Prevents code duplication while maintaining type safety across process boundaries
- area: error_handling
  choice: Provider-specific error mapping to common error types
  why: Abstracts provider quirks while preserving error context for debugging
- area: identity
  choice: MCP tool names combine server+identifier+tool for uniqueness
  why: Prevents naming collisions when multiple MCP servers expose similar tools
- area: persistence
  choice: Environment-based configuration with self-hosted support
  why: Supports enterprise deployments while maintaining cloud service compatibility
