types:
- name: RelativeIndenter
  kind: struct
  ctx: 'Rewrites text files to have relative indentation, which involves reformatting the leading white space on lines.  This format makes it easier to search and apply edits to pairs of code blocks which may differ significantly in their overall level of indentation. It removes leading white space which is shared with the preceding line. Original: ``` Foo # indented 8 Bar # indented 4 more than the previous line Baz # same indent as the previous line Fob # same indent as the previous line ``` Becomes: ``` Foo # indented 8 Bar # indented 4 more than the previous line Baz # same indent as the previous line Fob # same indent as the previous line ``` If the current line is *less* indented then the previous line, uses a unicode character to indicate outdenting. Original ``` Foo Bar Baz Fob # indented 4 less than the previous line ``` Becomes: ``` Foo Bar Baz ←←←←Fob # indented 4 less than the previous line ``` This is a similar original to the last one, but every line has been uniformly outdented: ``` Foo Bar Baz Fob # indented 4 less than the previous line ``` It becomes this result, which is very similar to the previous result.  Only the white space on the first line differs.  From the word Foo onwards, it is identical to the previous result. ``` Foo Bar Baz ←←←←Fob # indented 4 less than the previous line ```'
  fields:
  - name: marker
    type: Any
    default: ARROW
