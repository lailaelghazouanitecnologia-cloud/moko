- name: GalleryGridDirective
  kind: struct
  ctx: 'A directive to show a gallery of images and links in a Bootstrap grid. The grid can be generated from a YAML file that contains a list of items, or from the content of the directive (also formatted in YAML). Use the parameter "class-card" to add an additional CSS class to all cards. When specifying the grid items, you can use all parameters from "grid-item-card" directive to customize individual cards + ["image", "header", "content", "title"]. Danger: This directive can only be used in the context of a Myst documentation page as the templates use Markdown flavored formatting.'
