types:
- name: BaseGroupChatManager
  kind: trait
  ctx: 'Base class for a group chat manager that manages a group chat with multiple participants. It is the responsibility of the caller to ensure: - All participants must subscribe to the group chat topic and each of their own topics. - The group chat manager must subscribe to the group chat topic. - The agent types of the participants must be unique. - For each participant, the agent type must be the same as the topic type. Without the above conditions, the group chat will not function correctly.'
  bases:
  - SequentialRoutedAgent
  - ABC
  fields:
  - name: _name
    type: Any
    default: name
  - name: _group_topic_type
    type: Any
    default: group_topic_type
  - name: _output_topic_type
    type: Any
    default: output_topic_type
  - name: _participant_names
    type: Any
    default: participant_names
  - name: _participant_name_to_topic_type
    type: dict
    default: |-
      {
                  name: topic_type for name, topic_type in zip(participant_names, participant_topic_types, strict=True)
              }
