types:
- name: BaseGroupChat
  kind: trait
  ctx: The base class for group chat teams. In a group chat team, participants share context by publishing their messages to all other participants. If an :class:`~autogen_agentchat.base.ChatAgent` is a participant, the :class:`~autogen_agentchat.messages.BaseChatMessage` from the agent response's :attr:`~autogen_agentchat.base.Response.chat_message` will be published to other participants in the group chat. If a :class:`~autogen_agentchat.base.Team` is a participant, the :class:`~autogen_agentchat.messages.BaseChatMessage` from the team result' :attr:`~autogen_agentchat.base.TaskResult.messages` will be published to other participants in the group chat. To implement a group chat team, first create a subclass of :class:`BaseGroupChatManager` and then create a subclass of :class:`BaseGroupChat` that uses the group chat manager. This base class provides the mapping between the agents of the AgentChat API and the agent runtime of the Core API, and handles high-level features like running, pausing, resuming, and resetting the team.
