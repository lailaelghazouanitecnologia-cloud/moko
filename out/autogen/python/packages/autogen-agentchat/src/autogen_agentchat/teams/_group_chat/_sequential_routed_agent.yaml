- name: SequentialRoutedAgent
  kind: struct
  ctx: 'A subclass of :class:`autogen_core.RoutedAgent` that ensures that messages of certain types are processed sequentially using a FIFO lock. This is useful for agents that need to maintain a strict order of processing messages, such as in a group chat scenario. Args: description (str): The description of the agent. sequential_message_types (Sequence[Type[Any]]): A sequence of message types that should be processed sequentially. If a message of one of these types is received, the agent will acquire a FIFO lock to ensure that it is processed before any later messages that are also one of these types.'
