- name: StructuredMessageFactory
  kind: struct
  ctx: ':meta private: A component that creates structured chat messages from Pydantic models or JSON schemas. This component helps you generate strongly-typed chat messages with content defined using a Pydantic model. It can be used in declarative workflows where message structure must be validated, formatted, and serialized. You can initialize the component directly using a `BaseModel` subclass, or dynamically from a configuration object (e.g., loaded from disk or a database). ### Example 1: Create from a Pydantic Model .. code-block:: python from pydantic import BaseModel from autogen_agentchat.messages import StructuredMessageFactory class TestContent(BaseModel): field1: str field2: int format_string = "This is a string {field1} and this is an int {field2}" sm_component = StructuredMessageFactory(input_model=TestContent, format_string=format_string) message = sm_component.StructuredMessage( source="test_agent", content=TestContent(field1="Hello", field2=42), format_string=format_string ) print(message.to_model_text())  # Output: This is a string Hello and this is an int 42 config = sm_component.dump_component() s_m_dyn = StructuredMessageFactory.load_component(config) message = s_m_dyn.StructuredMessage( source="test_agent", content=s_m_dyn.ContentModel(field1="dyn agent", field2=43), format_string=s_m_dyn.format_string, ) print(type(message))  # StructuredMessage[GeneratedModel] print(message.to_model_text())  # Output: This is a string dyn agent and this is an int 43 Attributes: component_config_schema (StructureMessageConfig): Defines the configuration structure for this component. component_provider_override (str): Path used to reference this component in external tooling. component_type (str): Identifier used for categorization (e.g., "structured_message"). Raises: ValueError: If neither `json_schema` nor `input_model` is provided. Args: json_schema (Optional[str]): JSON schema to dynamically create a Pydantic model. input_model (Optional[Type[BaseModel]]): A subclass of `BaseModel` that defines the expected message structure. format_string (Optional[str]): Optional string to render content into a human-readable format. content_model_name (Optional[str]): Optional name for the generated Pydantic model.'
  fields:
  - name: component_config_schema
    type: Any
    default: StructureMessageConfig
  - name: component_provider_override
    type: str
    default: '"autogen_agentchat.messages.StructuredMessageFactory"'
