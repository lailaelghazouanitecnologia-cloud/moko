- name: MessageFilterAgent
  kind: struct
  ctx: 'A wrapper agent that filters incoming messages before passing them to the inner agent. .. warning:: This is an experimental feature, and the API will change in the future releases. This is useful in scenarios like multi-agent workflows where an agent should only process a subset of the full message history—for example, only the last message from each upstream agent, or only the first message from a specific source. Filtering is configured using :class:`MessageFilterConfig`, which supports: - Filtering by message source (e.g., only messages from "user" or another agent) - Selecting the first N or last N messages from each source - If position is `None`, all messages from that source are included This agent is compatible with both direct message passing and team-based execution such as :class:`~autogen_agentchat.teams.GraphFlow`. Example: >>> agent_a = MessageFilterAgent( ...     name="A", ...     wrapped_agent=some_other_agent, ...     filter=MessageFilterConfig( ...         per_source=[ ...             PerSourceFilter(source="user", position="first", count=1), ...             PerSourceFilter(source="B", position="last", count=2), ...         ] ...     ), ... ) Example use case with Graph: Suppose you have a looping multi-agent graph: A → B → A → B → C. You want: - A to only see the user message and the last message from B - B to see the user message, last message from A, and its own prior responses (for reflection) - C to see the user message and the last message from B Wrap the agents like so: >>> agent_a = MessageFilterAgent( ...     name="A", ...     wrapped_agent=agent_a_inner, ...     filter=MessageFilterConfig( ...         per_source=[ ...             PerSourceFilter(source="user", position="first", count=1), ...             PerSourceFilter(source="B", position="last", count=1), ...         ] ...     ), ... ) >>> agent_b = MessageFilterAgent( ...     name="B", ...     wrapped_agent=agent_b_inner, ...     filter=MessageFilterConfig( ...         per_source=[ ...             PerSourceFilter(source="user", position="first", count=1), ...             PerSourceFilter(source="A", position="last", count=1), ...             PerSourceFilter(source="B", position="last", count=10), ...         ] ...     ), ... ) >>> agent_c = MessageFilterAgent( ...     name="C", ...     wrapped_agent=agent_c_inner, ...     filter=MessageFilterConfig( ...         per_source=[ ...             PerSourceFilter(source="user", position="first", count=1), ...             PerSourceFilter(source="B", position="last", count=1), ...         ] ...     ), ... ) Then define the graph: >>> graph = DiGraph( ...     nodes={ ...         "A": DiGraphNode(name="A", edges=[DiGraphEdge(target="B")]), ...         "B": DiGraphNode( ...             name="B", ...             edges=[ ...                 DiGraphEdge(target="C", condition="exit"), ...                 DiGraphEdge(target="A", condition="loop"), ...             ], ...         ), ...         "C": DiGraphNode(name="C", edges=[]), ...     }, ...     default_start_node="A", ... ) This will ensure each agent sees only what is needed for its decision or action logic.'
