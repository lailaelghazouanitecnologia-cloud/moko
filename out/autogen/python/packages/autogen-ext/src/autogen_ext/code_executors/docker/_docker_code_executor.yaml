- name: DockerCommandLineCodeExecutor
  kind: struct
  ctx: 'Executes code through a command line environment in a Docker container. .. note:: This class requires the :code:`docker` extra for the :code:`autogen-ext` package: .. code-block:: bash pip install "autogen-ext[docker]" The executor first saves each code block in a file in the working directory, and then executes the code file in the container. The executor executes the code blocks in the order they are received. Currently, the executor only supports Python and shell scripts. For Python code, use the language "python" for the code block. For shell scripts, use the language "bash", "shell", "sh", "pwsh", "powershell", or "ps1" for the code block. Args: image (_type_, optional): Docker image to use for code execution. Defaults to "python:3-slim". container_name (Optional[str], optional): Name of the Docker container which is created. If None, will autogenerate a name. Defaults to None. timeout (int, optional): The timeout for code execution. Defaults to 60. work_dir (Union[Path, str], optional): The working directory for the code execution. Defaults to temporary directory. bind_dir (Union[Path, str], optional): The directory that will be bound to the code executor container. Useful for cases where you want to spawn the container from within a container. Defaults to work_dir. auto_remove (bool, optional): If true, will automatically remove the Docker container when it is stopped. Defaults to True. stop_container (bool, optional): If true, will automatically stop the container when stop is called, when the context manager exits or when the Python process exits with atext. Defaults to True. device_requests (Optional[List[DeviceRequest]], optional): A list of device request instances to add to the container for exposing GPUs (e.g., [docker.types.DeviceRequest(count=-1, capabilities=[[''gpu'']])]). Defaults to None. functions (List[Union[FunctionWithRequirements[Any, A], Callable[..., Any]]]): A list of functions that are available to the code executor. Default is an empty list. functions_module (str, optional): The name of the module that will be created to store the functions. Defaults to "functions". extra_volumes (Optional[Dict[str, Dict[str, str]]], optional): A dictionary of extra volumes (beyond the work_dir) to mount to the container; key is host source path and value ''bind'' is the container path. See  Defaults to None. Example: extra_volumes = {''/home/user1/'': {''bind'': ''/mnt/vol2'', ''mode'': ''rw''}, ''/var/www'': {''bind'': ''/mnt/vol1'', ''mode'': ''ro''}} extra_hosts (Optional[Dict[str, str]], optional): A dictionary of host mappings to add to the container. (See Docker docs on extra_hosts) Defaults to None. Example: extra_hosts = {"kubernetes.docker.internal": "host-gateway"} init_command (Optional[str], optional): A shell command to run before each shell operation execution. Defaults to None. Example: init_command="kubectl config use-context docker-hub" delete_tmp_files (bool, optional): If true, will delete temporary files after execution. Defaults to False. .. note:: Using the current directory (".") as working directory is deprecated. Using it will raise a deprecation warning.'
