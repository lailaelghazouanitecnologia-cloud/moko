- name: RedisMemory
  kind: struct
  ctx: 'Store and retrieve memory using vector similarity search powered by RedisVL. `RedisMemory` provides a vector-based memory implementation that uses RedisVL for storing and retrieving content based on semantic similarity or sequential order. It enhances agents with the ability to recall relevant information during conversations by leveraging vector embeddings to find similar content. This implementation requires the RedisVL extra to be installed. Install with: .. code-block:: bash pip install "autogen-ext[redisvl]" Additionally, you will need access to a Redis instance. To run a local instance of redis in docker: .. code-block:: bash docker run -d --name redis -p 6379:6379 redis:8 To download and run Redis locally: .. code-block:: bash curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list sudo apt-get update  > /dev/null 2>&1 sudo apt-get install redis-server  > /dev/null 2>&1 redis-server --daemonize yes Args: config (RedisMemoryConfig | None): Configuration for the Redis memory. If None, defaults to a RedisMemoryConfig with recommended settings. Example: .. code-block:: python from logging import WARNING, getLogger import asyncio from autogen_agentchat.agents import AssistantAgent from autogen_agentchat.ui import Console from autogen_core.memory import MemoryContent, MemoryMimeType from autogen_ext.memory.redis import RedisMemory, RedisMemoryConfig from autogen_ext.models.openai import OpenAIChatCompletionClient logger = getLogger() logger.setLevel(WARNING) # Define tool to use async def get_weather(city: str, units: str = "imperial") -> str: if units == "imperial": return f"The weather in {city} is 73 °F and Sunny." elif units == "metric": return f"The weather in {city} is 23 °C and Sunny." else: return f"Sorry, I don''t know the weather in {city}." async def main(): # Initailize Redis memory redis_memory = RedisMemory( config=RedisMemoryConfig( redis_url="redis://localhost:6379", index_name="chat_history", prefix="memory", ) ) # Add user preferences to memory await redis_memory.add( MemoryContent( content="The weather should be in metric units", mime_type=MemoryMimeType.TEXT, metadata={"category": "preferences", "type": "units"}, ) ) await redis_memory.add( MemoryContent( content="Meal recipe must be vegan", mime_type=MemoryMimeType.TEXT, metadata={"category": "preferences", "type": "dietary"}, ) ) model_client = OpenAIChatCompletionClient( model="gpt-4o", ) # Create assistant agent with ChromaDB memory assistant_agent = AssistantAgent( name="assistant_agent", model_client=model_client, tools=[get_weather], memory=[redis_memory], ) stream = assistant_agent.run_stream(task="What is the weather in New York?") await Console(stream) await model_client.close() await redis_memory.close() asyncio.run(main()) Output: .. code-block:: text ---------- TextMessage (user) ---------- What is the weather in New York? ---------- MemoryQueryEvent (assistant_agent) ---------- [MemoryContent(content=''The weather should be in metric units'', mime_type=<MemoryMimeType.TEXT: ''text/plain''>, metadata={''category'': ''preferences'', ''type'': ''units''})] ---------- ToolCallRequestEvent (assistant_agent) ---------- [FunctionCall(id=''call_tyCPvPPAV4SHWhtfpM6UMemr'', arguments=''{"city":"New York","units":"metric"}'', name=''get_weather'')] ---------- ToolCallExecutionEvent (assistant_agent) ---------- [FunctionExecutionResult(content=''The weather in New York is 23 °C and Sunny.'', name=''get_weather'', call_id=''call_tyCPvPPAV4SHWhtfpM6UMemr'', is_error=False)] ---------- ToolCallSummaryMessage (assistant_agent) ---------- The weather in New York is 23 °C and Sunny.'
