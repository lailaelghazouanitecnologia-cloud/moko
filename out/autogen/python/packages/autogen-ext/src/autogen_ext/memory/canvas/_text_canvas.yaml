- name: TextCanvas
  kind: struct
  ctx: 'An in‑memory canvas that stores *text* files with full revision history. .. warning:: This is an experimental API and may change in the future. Besides the original CRUD‑like operations, this enhanced implementation adds: * **apply_patch** – applies patches using the ``unidiff`` library for accurate hunk application and context line validation. * **get_revision_content** – random access to any historical revision. * **get_revision_diffs** – obtain the list of diffs applied between every consecutive pair of revisions so that a caller can replay or audit the full change history.'
