- name: MemoryBank
  kind: struct
  ctx: 'Stores task-completion insights as memories in a vector DB for later retrieval. Args: reset: True to clear the DB before starting. config: An optional dict that can be used to override the following values: - path: The path to the directory where the memory bank files are stored. - relevance_conversion_threshold: The threshold used to normalize relevance. - n_results: The maximum number of most relevant results to return for any given topic. - distance_threshold: The maximum string-pair distance for a memo to be retrieved. logger: An optional logger. If None, no logging will be performed.'
