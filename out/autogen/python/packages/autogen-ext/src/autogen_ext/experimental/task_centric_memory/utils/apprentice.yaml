- name: Apprentice
  kind: struct
  ctx: 'A minimal wrapper combining task-centric memory with an agent or team. Applications may use the Apprentice class, or they may directly instantiate and call the Memory Controller using this class as an example. Args: client: The client to call the model. config: An optional dict that can be used to override the following values: - name_of_agent_or_team: The name of the target agent or team for assigning tasks to. - disable_prefix_caching: True to disable prefix caching by prepending random ints to the first message. - MemoryController: A config dict passed to MemoryController. logger: An optional logger. If None, a default logger will be created.'
