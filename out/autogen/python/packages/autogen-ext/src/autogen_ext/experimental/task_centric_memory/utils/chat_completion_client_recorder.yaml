- name: ChatCompletionClientRecorder
  kind: struct
  ctx: 'A chat completion client that supports fast, large-scale tests of code calling LLM clients. Two modes are supported: 1. "record": delegates to the underlying client while also recording the input messages and responses, which are saved to disk when finalize() is called. 2. "replay": loads previously recorded message and responses from disk, then on each call checks that its message matches the recorded message, and returns the recorded response. The recorded data is stored as a JSON list of records. Each record is a dictionary with a "mode" field (either "create" or "create_stream"), a serialized list of messages, and either a "response" (for create calls) or a "stream" (a list of streamed outputs for create_stream calls). ReplayChatCompletionClient and ChatCompletionCache do similar things, but with significant differences: - ReplayChatCompletionClient replays pre-defined responses in a specified order without recording anything or checking the messages sent to the client. - ChatCompletionCache caches responses and replays them for messages that have been seen before, regardless of order, and calls the base client for any uncached messages.'
