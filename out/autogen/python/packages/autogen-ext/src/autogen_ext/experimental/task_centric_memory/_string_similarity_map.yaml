- name: StringSimilarityMap
  kind: struct
  ctx: 'Provides storage and similarity-based retrieval of string pairs using a vector database. Each DB entry is a pair of strings: an input string and an output string. The input string is embedded and used as the retrieval key. The output string can be anything, but it''s typically used as a dict key. Vector embeddings are currently supplied by Chroma''s default Sentence Transformers. Args: - reset: True to clear the DB immediately after creation. - path_to_db_dir: Path to the directory where the DB is stored. - logger: An optional logger. If None, no logging will be performed.'
