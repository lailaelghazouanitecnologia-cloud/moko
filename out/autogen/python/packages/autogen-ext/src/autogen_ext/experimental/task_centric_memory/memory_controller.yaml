- name: MemoryController
  kind: struct
  ctx: '(EXPERIMENTAL, RESEARCH IN PROGRESS) Implements fast, memory-based learning, and manages the flow of information to and from a memory bank. Args: reset: True to empty the memory bank before starting. client: The model client to use internally. task_assignment_callback: An optional callback used to assign a task to any agent managed by the caller. config: An optional dict that can be used to override the following values: - generalize_task: Whether to rewrite tasks in more general terms. - revise_generalized_task: Whether to critique then rewrite the generalized task. - generate_topics: Whether to base retrieval directly on tasks, or on topics extracted from tasks. - validate_memos: Whether to apply a final validation stage to retrieved memos. - max_memos_to_retrieve: The maximum number of memos to return from retrieve_relevant_memos(). - max_train_trials: The maximum number of learning iterations to attempt when training on a task. - max_test_trials: The total number of attempts made when testing for failure on a task. - MemoryBank: A config dict passed to MemoryBank. logger: An optional logger. If None, a default logger will be created. Example: The `task-centric-memory` extra first needs to be installed: .. code-block:: bash pip install "autogen-ext[task-centric-memory]" The following code snippet shows how to use this class for the most basic storage and retrieval of memories.: .. code-block:: python import asyncio from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_ext.experimental.task_centric_memory import MemoryController from autogen_ext.experimental.task_centric_memory.utils import PageLogger async def main() -> None: client = OpenAIChatCompletionClient(model="gpt-4o") logger = PageLogger(config={"level": "DEBUG", "path": "./pagelogs/quickstart"})  # Optional, but very useful. memory_controller = MemoryController(reset=True, client=client, logger=logger) # Add a few task-insight pairs as memories, where an insight can be any string that may help solve the task. await memory_controller.add_memo(task="What color do I like?", insight="Deep blue is my favorite color") await memory_controller.add_memo(task="What''s another color I like?", insight="I really like cyan") await memory_controller.add_memo(task="What''s my favorite food?", insight="Halibut is my favorite") # Retrieve memories for a new task that''s related to only two of the stored memories. memos = await memory_controller.retrieve_relevant_memos(task="What colors do I like most?") print("{} memories retrieved".format(len(memos))) for memo in memos: print("- " + memo.insight) asyncio.run(main())'
