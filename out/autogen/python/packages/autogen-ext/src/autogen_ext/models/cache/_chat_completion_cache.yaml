- name: ChatCompletionCache
  kind: struct
  ctx: 'A wrapper around a :class:`~autogen_ext.models.cache.ChatCompletionClient` that caches creation results from an underlying client. Cache hits do not contribute to token usage of the original client. Typical Usage: Lets use caching on disk with `openai` client as an example. First install `autogen-ext` with the required packages: .. code-block:: bash pip install -U "autogen-ext[openai, diskcache]" And use it as: .. code-block:: python import asyncio import tempfile from autogen_core.models import UserMessage from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_ext.models.cache import ChatCompletionCache, CHAT_CACHE_VALUE_TYPE from autogen_ext.cache_store.diskcache import DiskCacheStore from diskcache import Cache async def main(): with tempfile.TemporaryDirectory() as tmpdirname: # Initialize the original client openai_model_client = OpenAIChatCompletionClient(model="gpt-4o") # Then initialize the CacheStore, in this case with diskcache.Cache. # You can also use redis like: # from autogen_ext.cache_store.redis import RedisStore # import redis # redis_instance = redis.Redis() # cache_store = RedisCacheStore[CHAT_CACHE_VALUE_TYPE](redis_instance) cache_store = DiskCacheStore[CHAT_CACHE_VALUE_TYPE](Cache(tmpdirname)) cache_client = ChatCompletionCache(openai_model_client, cache_store) response = await cache_client.create([UserMessage(content="Hello, how are you?", source="user")]) print(response)  # Should print response from OpenAI response = await cache_client.create([UserMessage(content="Hello, how are you?", source="user")]) print(response)  # Should print cached response asyncio.run(main()) For Redis caching: .. code-block:: python import asyncio from autogen_core.models import UserMessage from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_ext.models.cache import ChatCompletionCache, CHAT_CACHE_VALUE_TYPE from autogen_ext.cache_store.redis import RedisStore import redis async def main(): # Initialize the original client openai_model_client = OpenAIChatCompletionClient(model="gpt-4o") # Initialize Redis cache store redis_instance = redis.Redis() cache_store = RedisStore[CHAT_CACHE_VALUE_TYPE](redis_instance) cache_client = ChatCompletionCache(openai_model_client, cache_store) response = await cache_client.create([UserMessage(content="Hello, how are you?", source="user")]) print(response)  # Should print response from OpenAI response = await cache_client.create([UserMessage(content="Hello, how are you?", source="user")]) print(response)  # Should print cached response asyncio.run(main()) For streaming with Redis caching: .. code-block:: python import asyncio from autogen_core.models import UserMessage, CreateResult from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_ext.models.cache import ChatCompletionCache, CHAT_CACHE_VALUE_TYPE from autogen_ext.cache_store.redis import RedisStore import redis async def main(): # Initialize the original client openai_model_client = OpenAIChatCompletionClient(model="gpt-4o") # Initialize Redis cache store redis_instance = redis.Redis() cache_store = RedisStore[CHAT_CACHE_VALUE_TYPE](redis_instance) cache_client = ChatCompletionCache(openai_model_client, cache_store) # First streaming call async for chunk in cache_client.create_stream( [UserMessage(content="List all countries in Africa", source="user")] ): if isinstance(chunk, CreateResult): print("\\n") print("Cached: ", chunk.cached)  # Should print False else: print(chunk, end="") # Second streaming call (cached) async for chunk in cache_client.create_stream( [UserMessage(content="List all countries in Africa", source="user")] ): if isinstance(chunk, CreateResult): print("\\n") print("Cached: ", chunk.cached)  # Should print True else: print(chunk, end="") asyncio.run(main()) You can now use the `cached_client` as you would the original client, but with caching enabled. Args: client (ChatCompletionClient): The original ChatCompletionClient to wrap. store (CacheStore): A store object that implements get and set methods. The user is responsible for managing the store''s lifecycle & clearing it (if needed). Defaults to using in-memory cache.'
