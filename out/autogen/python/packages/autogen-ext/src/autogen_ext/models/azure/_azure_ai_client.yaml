types:
- name: AzureAIChatCompletionClient
  kind: struct
  ctx: 'Chat completion client for models hosted on Azure AI Foundry or GitHub Models. See `here <https://learn.microsoft.com/en-us/azure/ai-studio/reference/reference-model-inference-chat-completions>`_ for more info. Args: endpoint (str): The endpoint to use. **Required.** credential (union, AzureKeyCredential, AsyncTokenCredential): The credentials to use. **Required** model_info (ModelInfo): The model family and capabilities of the model. **Required.** model (str): The name of the model. **Required if model is hosted on GitHub Models.** frequency_penalty: (optional,float) presence_penalty: (optional,float) temperature: (optional,float) top_p: (optional,float) max_tokens: (optional,int) response_format: (optional, literal["text", "json_object"]) stop: (optional,List[str]) tools: (optional,List[ChatCompletionsToolDefinition]) tool_choice: (optional,Union[str, ChatCompletionsToolChoicePreset, ChatCompletionsNamedToolChoice]]) seed: (optional,int) model_extras: (optional,Dict[str, Any]) To use this client, you must install the `azure` extra: .. code-block:: bash pip install "autogen-ext[azure]" The following code snippet shows how to use the client with GitHub Models: .. code-block:: python import asyncio import os from azure.core.credentials import AzureKeyCredential from autogen_ext.models.azure import AzureAIChatCompletionClient from autogen_core.models import UserMessage async def main(): client = AzureAIChatCompletionClient( model="Phi-4", endpoint="https://models.github.ai/inference", # To authenticate with the model you will need to generate a personal access token (PAT) in your GitHub settings. # Create your PAT token by following instructions here: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens credential=AzureKeyCredential(os.environ["GITHUB_TOKEN"]), model_info={ "json_output": False, "function_calling": False, "vision": False, "family": "unknown", "structured_output": False, }, ) result = await client.create([UserMessage(content="What is the capital of France?", source="user")]) print(result) # Close the client. await client.close() if __name__ == "__main__": asyncio.run(main()) To use streaming, you can use the `create_stream` method: .. code-block:: python import asyncio import os from autogen_core.models import UserMessage from autogen_ext.models.azure import AzureAIChatCompletionClient from azure.core.credentials import AzureKeyCredential async def main(): client = AzureAIChatCompletionClient( model="Phi-4", endpoint="https://models.github.ai/inference", # To authenticate with the model you will need to generate a personal access token (PAT) in your GitHub settings. # Create your PAT token by following instructions here: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens credential=AzureKeyCredential(os.environ["GITHUB_TOKEN"]), model_info={ "json_output": False, "function_calling": False, "vision": False, "family": "unknown", "structured_output": False, }, ) # Create a stream. stream = client.create_stream([UserMessage(content="Write a poem about the ocean", source="user")]) async for chunk in stream: print(chunk, end="", flush=True) print() # Close the client. await client.close() if __name__ == "__main__": asyncio.run(main())'
