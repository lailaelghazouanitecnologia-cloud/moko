types:
- name: AzureAIAgent
  kind: struct
  ctx: 'Azure AI Assistant agent for AutoGen. Installation: .. code-block:: bash pip install "autogen-ext[azure]"  # For Azure AI Foundry Agent Service This agent leverages the Azure AI Assistant API to create AI assistants with capabilities like: * Code interpretation and execution * Grounding with Bing search * File handling and search * Custom function calling * Multi-turn conversations The agent integrates with AutoGen''s messaging system, providing a seamless way to use Azure AI capabilities within the AutoGen framework. It supports tools like code interpreter, file search, and various grounding mechanisms. Agent name must be a valid Python identifier: 1. It must start with a letter (A-Z, a-z) or an underscore (_). 2. It can only contain letters, digits (0-9), or underscores. 3. It cannot be a Python keyword. 4. It cannot contain spaces or special characters. 5. It cannot start with a digit. Check here on how to create a new secured agent with user-managed identity: https://learn.microsoft.com/en-us/azure/ai-services/agents/how-to/virtual-networks Examples: Use the AzureAIAgent to create an agent grounded with Bing: .. code-block:: python import asyncio import os from autogen_agentchat.messages import TextMessage from autogen_core import CancellationToken from autogen_ext.agents.azure._azure_ai_agent import AzureAIAgent from azure.ai.projects.aio import AIProjectClient from azure.identity.aio import DefaultAzureCredential from azure.ai.agents.models import BingGroundingTool import dotenv async def bing_example(): async with DefaultAzureCredential() as credential: async with AIProjectClient(  # type: ignore credential=credential, endpoint=os.getenv("AZURE_PROJECT_ENDPOINT", "") ) as project_client: conn = await project_client.connections.get(name=os.getenv("BING_CONNECTION_NAME", "")) bing_tool = BingGroundingTool(conn.id) agent_with_bing_grounding = AzureAIAgent( name="bing_agent", description="An AI assistant with Bing grounding", project_client=project_client, deployment_name="gpt-4o", instructions="You are a helpful assistant.", tools=bing_tool.definitions, metadata={"source": "AzureAIAgent"}, ) # For the bing grounding tool to return the citations, the message must contain an instruction for the model to do return them. # For example: "Please provide citations for the answers" result = await agent_with_bing_grounding.on_messages( messages=[ TextMessage( content="What is Microsoft\\''s annual leave policy? Provide citations for your answers.", source="user", ) ], cancellation_token=CancellationToken(), message_limit=5, ) print(result) if __name__ == "__main__": dotenv.load_dotenv() asyncio.run(bing_example()) Use the AzureAIAgent to create an agent with file search capability: .. code-block:: python import asyncio import os import tempfile import urllib.request import dotenv from autogen_agentchat.messages import TextMessage from autogen_core import CancellationToken from autogen_ext.agents.azure._azure_ai_agent import AzureAIAgent from azure.ai.projects.aio import AIProjectClient from azure.identity.aio import DefaultAzureCredential async def file_search_example(): # Download README.md from GitHub readme_url = "https://raw.githubusercontent.com/microsoft/autogen/refs/heads/main/README.md" temp_file = None try: # Create a temporary file to store the downloaded README temp_file = tempfile.NamedTemporaryFile(delete=False, suffix=".md") urllib.request.urlretrieve(readme_url, temp_file.name) print(f"Downloaded README.md to {temp_file.name}") async with DefaultAzureCredential() as credential: async with AIProjectClient(  # type: ignore credential=credential, endpoint=os.getenv("AZURE_PROJECT_ENDPOINT", "") ) as project_client: agent_with_file_search = AzureAIAgent( name="file_search_agent", description="An AI assistant with file search capabilities", project_client=project_client, deployment_name="gpt-4.1-mini", instructions="You are a helpful assistant.", tools=["file_search"], metadata={"source": "AzureAIAgent"}, ) ct: CancellationToken = CancellationToken() # Use the downloaded README file for file search await agent_with_file_search.on_upload_for_file_search( file_paths=[temp_file.name], vector_store_name="file_upload_index", vector_store_metadata={"source": "AzureAIAgent"}, cancellation_token=ct, vector_store_polling_interval=60, ) result = await agent_with_file_search.on_messages( messages=[ TextMessage( content="Hello, what is AutoGen and what capabilities does it have?", source="user" ) ], cancellation_token=ct, message_limit=5, ) print(result) finally: # Clean up the temporary file if temp_file and os.path.exists(temp_file.name): os.unlink(temp_file.name) print(f"Removed temporary file {temp_file.name}") if __name__ == "__main__": dotenv.load_dotenv() asyncio.run(file_search_example()) Use the AzureAIAgent to create an agent with code interpreter capability: .. code-block:: python import asyncio import os import dotenv from autogen_agentchat.messages import TextMessage from autogen_core import CancellationToken from autogen_ext.agents.azure._azure_ai_agent import AzureAIAgent from azure.ai.projects.aio import AIProjectClient from azure.identity.aio import DefaultAzureCredential async def code_interpreter_example(): async with DefaultAzureCredential() as credential: async with AIProjectClient(  # type: ignore credential=credential, endpoint=os.getenv("AZURE_PROJECT_ENDPOINT", "") ) as project_client: agent_with_code_interpreter = AzureAIAgent( name="code_interpreter_agent", description="An AI assistant with code interpreter capabilities", project_client=project_client, deployment_name="gpt-4.1-mini", instructions="You are a helpful assistant.", tools=["code_interpreter"], metadata={"source": "AzureAIAgent"}, ) await agent_with_code_interpreter.on_upload_for_code_interpreter( file_paths="/workspaces/autogen/python/packages/autogen-core/docs/src/user-guide/core-user-guide/cookbook/data/nifty_500_quarterly_results.csv", cancellation_token=CancellationToken(), polling_interval=5, ) result = await agent_with_code_interpreter.on_messages( messages=[ TextMessage( content="Aggregate the number of stocks per industry and give me a markdown table as a result?", source="user", ) ], cancellation_token=CancellationToken(), ) print(result) if __name__ == "__main__": dotenv.load_dotenv() asyncio.run(code_interpreter_example())'
