- name: MultimodalWebSurfer
  kind: struct
  ctx: 'MultimodalWebSurfer is a multimodal agent that acts as a web surfer that can search the web and visit web pages. Installation: .. code-block:: bash pip install "autogen-ext[web-surfer]" It launches a chromium browser and allows the playwright to interact with the web browser and can perform a variety of actions. The browser is launched on the first call to the agent and is reused for subsequent calls. It must be used with a multimodal model client that supports function/tool calling, ideally GPT-4o currently. When :meth:`on_messages` or :meth:`on_messages_stream` is called, the following occurs: 1) If this is the first call, the browser is initialized and the page is loaded. This is done in :meth:`_lazy_init`. The browser is only closed when :meth:`close` is called. 2) The method :meth:`_generate_reply` is called, which then creates the final response as below. 3) The agent takes a screenshot of the page, extracts the interactive elements, and prepares a set-of-mark screenshot with bounding boxes around the interactive elements. 4) The agent makes a call to the :attr:`model_client` with the SOM screenshot, history of messages, and the list of available tools. - If the model returns a string, the agent returns the string as the final response. - If the model returns a list of tool calls, the agent executes the tool calls with :meth:`_execute_tool` using :attr:`_playwright_controller`. - The agent returns a final response which includes a screenshot of the page, page metadata, description of the action taken and the inner text of the webpage. 5) If at any point the agent encounters an error, it returns the error message as the final response. .. note:: Please note that using the MultimodalWebSurfer involves interacting with a digital world designed for humans, which carries inherent risks. Be aware that agents may occasionally attempt risky actions, such as recruiting humans for help or accepting cookie agreements without human involvement. Always ensure agents are monitored and operate within a controlled environment to prevent unintended consequences. Moreover, be cautious that MultimodalWebSurfer may be susceptible to prompt injection attacks from webpages. .. note:: On Windows, the event loop policy must be set to `WindowsProactorEventLoopPolicy` to avoid issues with subprocesses. .. code-block:: python import sys import asyncio if sys.platform == "win32": asyncio.set_event_loop_policy(asyncio.WindowsProactorEventLoopPolicy()) Args: name (str): The name of the agent. model_client (ChatCompletionClient): The model client used by the agent. Must be multimodal and support function calling. downloads_folder (str, optional): The folder where downloads are saved. Defaults to None, no downloads are saved. description (str, optional): The description of the agent. Defaults to MultimodalWebSurfer.DEFAULT_DESCRIPTION. debug_dir (str, optional): The directory where debug information is saved. Defaults to None. headless (bool, optional): Whether the browser should be headless. Defaults to True. start_page (str, optional): The start page for the browser. Defaults to MultimodalWebSurfer.DEFAULT_START_PAGE. animate_actions (bool, optional): Whether to animate actions. Defaults to False. to_save_screenshots (bool, optional): Whether to save screenshots. Defaults to False. use_ocr (bool, optional): Whether to use OCR. Defaults to False. browser_channel (str, optional): The browser channel. Defaults to None. browser_data_dir (str, optional): The browser data directory. Defaults to None. to_resize_viewport (bool, optional): Whether to resize the viewport. Defaults to True. playwright (Playwright, optional): The playwright instance. Defaults to None. context (BrowserContext, optional): The browser context. Defaults to None. Example usage: The following example demonstrates how to create a web surfing agent with a model client and run it for multiple turns. .. code-block:: python import asyncio from autogen_agentchat.ui import Console from autogen_agentchat.teams import RoundRobinGroupChat from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_ext.agents.web_surfer import MultimodalWebSurfer async def main() -> None: # Define an agent web_surfer_agent = MultimodalWebSurfer( name="MultimodalWebSurfer", model_client=OpenAIChatCompletionClient(model="gpt-4o-2024-08-06"), ) # Define a team agent_team = RoundRobinGroupChat([web_surfer_agent], max_turns=3) # Run the team and stream messages to the console stream = agent_team.run_stream(task="Navigate to the AutoGen readme on GitHub.") await Console(stream) # Close the browser controlled by the agent await web_surfer_agent.close() asyncio.run(main())'
