- name: OpenAIAgent
  kind: struct
  ctx: 'An agent implementation that uses the OpenAI Responses API to generate responses. Installation: .. code-block:: bash pip install "autogen-ext[openai]" # pip install "autogen-ext[openai,azure]"  # For Azure OpenAI Assistant This agent leverages the Responses API to generate responses with capabilities like: * Multi-turn conversations * Built-in tool support (file_search, code_interpreter, web_search_preview, etc.) Currently, custom tools are not supported. .. versionchanged:: v0.7.0 Added support for built-in tool types like file_search, web_search_preview, code_interpreter, computer_use_preview, image_generation, and mcp. Added support for tool configurations with required and optional parameters. Built-in tools are split into two categories: **Tools that can use string format** (no required parameters): - web_search_preview: Can be used as "web_search_preview" or with optional config (user_location, search_context_size) - image_generation: Can be used as "image_generation" or with optional config (background, input_image_mask) - local_shell: Can be used as "local_shell" (WARNING: Only works with codex-mini-latest model) **Tools that REQUIRE dict configuration** (have required parameters): - file_search: MUST use dict with vector_store_ids (List[str]) - computer_use_preview: MUST use dict with display_height (int), display_width (int), environment (str) - code_interpreter: MUST use dict with container (str) - mcp: MUST use dict with server_label (str), server_url (str) Using required-parameter tools in string format will raise a ValueError with helpful error messages. The tools parameter type annotation only accepts string values for tools that don''t require parameters. Note: Custom tools (autogen FunctionTool or other user-defined tools) are not supported by this agent. Only OpenAI built-in tools provided via the Responses API are supported. Args: name (str): Name of the agent description (str): Description of the agent''s purpose client (Union[AsyncOpenAI, AsyncAzureOpenAI]): OpenAI client instance model (str): Model to use (e.g. "gpt-4.1") instructions (str): System instructions for the agent tools (Optional[Iterable[Union[str, BuiltinToolConfig]]]): Tools the agent can use. Supported string values (no required parameters): "web_search_preview", "image_generation", "local_shell". Dict values can provide configuration for built-in tools with parameters. Required parameters for built-in tools: - file_search: vector_store_ids (List[str]) - computer_use_preview: display_height (int), display_width (int), environment (str) - code_interpreter: container (str) - mcp: server_label (str), server_url (str) Optional parameters for built-in tools: - file_search: max_num_results (int), ranking_options (dict), filters (dict) - web_search_preview: user_location (str or dict), search_context_size (int) - image_generation: background (str), input_image_mask (str) - mcp: allowed_tools (List[str]), headers (dict), require_approval (bool) Special tools with model restrictions: - local_shell: Only works with "codex-mini-latest" model (WARNING: Very limited support) Custom tools are not supported. temperature (Optional[float]): Temperature for response generation (default: 1) max_output_tokens (Optional[int]): Maximum output tokens json_mode (bool): Whether to use JSON mode (default: False) store (bool): Whether to store conversations (default: True) truncation (str): Truncation strategy (default: "disabled") Example: Basic usage with built-in tools: .. code-block:: python import asyncio from autogen_agentchat.ui import Console from autogen_ext.agents.openai import OpenAIAgent from openai import AsyncOpenAI async def example(): client = AsyncOpenAI() agent = OpenAIAgent( name="SimpleAgent", description="A simple OpenAI agent using the Responses API", client=client, model="gpt-4.1", instructions="You are a helpful assistant.", tools=["web_search_preview"],  # Only tools without required params ) await Console(agent.run_stream(task="Search for recent AI developments")) asyncio.run(example()) Usage with configured built-in tools: .. code-block:: python import asyncio from autogen_agentchat.ui import Console from autogen_ext.agents.openai import OpenAIAgent from openai import AsyncOpenAI async def example_with_configs(): client = AsyncOpenAI() # Configure tools with required and optional parameters tools = [ # { #     "type": "file_search", #     "vector_store_ids": ["vs_abc123"],  # required #     "max_num_results": 10,  # optional # }, # { #     "type": "computer_use_preview", #     "display_height": 1024,  # required #     "display_width": 1280,  # required #     "environment": "linux",  # required # }, { "type": "code_interpreter", "container": {"type": "auto"},  # required }, # { #     "type": "mcp", #     "server_label": "my-mcp-server",  # required #     "server_url": "http://localhost:3000",  # required # }, { "type": "web_search_preview", "user_location": {  # optional - structured location "type": "approximate",  # required: "approximate" or "exact" "country": "US",  # optional "region": "CA",  # optional "city": "San Francisco",  # optional }, "search_context_size": "low",  # optional }, # "image_generation",  # Simple tools can still use string format ] agent = OpenAIAgent( name="ConfiguredAgent", description="An agent with configured tools", client=client, model="gpt-4.1", instructions="You are a helpful assistant with specialized tools.", tools=tools,  # type: ignore ) await Console(agent.run_stream(task="Search for recent AI developments")) asyncio.run(example_with_configs()) Note: Custom tools are not supported by OpenAIAgent. Use only built-in tools from the Responses API.'
