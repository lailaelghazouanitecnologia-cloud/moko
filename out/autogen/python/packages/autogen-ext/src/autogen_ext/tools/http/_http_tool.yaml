- name: HttpTool
  kind: struct
  ctx: 'A wrapper for using an HTTP server as a tool. Args: name (str): The name of the tool. description (str, optional): A description of the tool. scheme (str): The scheme to use for the request. Must be either "http" or "https". host (str): The host to send the request to. port (int): The port to send the request to. path (str, optional): The path to send the request to. Defaults to "/". Can include path parameters like "/{param1}/{param2}" which will be templated from input args. method (str, optional): The HTTP method to use, will default to POST if not provided. Must be one of "GET", "POST", "PUT", "DELETE", "PATCH". headers (dict[str, Any], optional): A dictionary of headers to send with the request. json_schema (dict[str, Any]): A JSON Schema object defining the expected parameters for the tool. Path parameters must also be included in the schema and must be strings. return_type (Literal["text", "json"], optional): The type of response to return from the tool. Defaults to "text". timeout (float, optional): The timeout for HTTP requests in seconds. Defaults to 5.0. .. note:: This tool requires the :code:`http-tool` extra for the :code:`autogen-ext` package. To install: .. code-block:: bash pip install -U "autogen-agentchat" "autogen-ext[http-tool]" Example: Simple use case:: import asyncio from autogen_agentchat.agents import AssistantAgent from autogen_agentchat.messages import TextMessage from autogen_core import CancellationToken from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_ext.tools.http import HttpTool # Define a JSON schema for a base64 decode tool base64_schema = { "type": "object", "properties": { "value": {"type": "string", "description": "The base64 value to decode"}, }, "required": ["value"], } # Create an HTTP tool for the httpbin API base64_tool = HttpTool( name="base64_decode", description="base64 decode a value", scheme="https", host="httpbin.org", port=443, path="/base64/{value}", method="GET", json_schema=base64_schema, ) async def main(): # Create an assistant with the base64 tool model = OpenAIChatCompletionClient(model="gpt-4") assistant = AssistantAgent("base64_assistant", model_client=model, tools=[base64_tool]) # The assistant can now use the base64 tool to decode the string response = await assistant.on_messages( [TextMessage(content="Can you base64 decode the value ''YWJjZGU='', please?", source="user")], CancellationToken(), ) print(response.chat_message) asyncio.run(main())'
