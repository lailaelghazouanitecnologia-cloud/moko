- name: StdioMcpToolAdapter
  kind: struct
  ctx: 'Allows you to wrap an MCP tool running over STDIO and make it available to AutoGen. This adapter enables using MCP-compatible tools that communicate over standard input/output with AutoGen agents. Common use cases include wrapping command-line tools and local services that implement the Model Context Protocol (MCP). .. note:: To use this class, you need to install `mcp` extra for the `autogen-ext` package. .. code-block:: bash pip install -U "autogen-ext[mcp]" Args: server_params (StdioServerParams): Parameters for the MCP server connection, including command to run and its arguments tool (Tool): The MCP tool to wrap session (ClientSession, optional): The MCP client session to use. If not provided, a new session will be created. This is useful for testing or when you want to manage the session lifecycle yourself. See :func:`~autogen_ext.tools.mcp.mcp_server_tools` for examples.'
