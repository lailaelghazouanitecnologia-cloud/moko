- name: McpSessionHost
  kind: struct
  ctx: 'Host component that provides MCP server capabilities. This host acts as the client-side Host for MCP sessions, handling requests from MCP servers for text generation (sampling), user prompting (elicitation), and file system root listing. It coordinates with model clients and elicitors to provide these capabilities. The host supports three main MCP server capabilities: - Sampling: Text generation using a language model via chat completion client - Elicitation: Structured prompting and response collection via elicitors - Roots: Listing available file system roots for server access Args: model_client: Optional chat completion client for handling sampling requests roots: Optional sequence of roots or callable returning roots for file system access elicitor: Optional elicitor for handling elicitation requests Example: Complete setup with MCP capabilities including sampling and elicitation:: from autogen_agentchat.agents import AssistantAgent from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_ext.tools.mcp import ( ChatCompletionClientSampler, McpSessionHost, McpWorkbench, StaticRootsProvider, StdioElicitor, StdioServerParams, ) from pydantic import FileUrl from mcp.types import Root # Setup model client for sampling model_client = OpenAIChatCompletionClient(model="gpt-4o") sampler = ChatCompletionClientSampler(model_client) # Create elicitor that prompts for user input over stdio elicitor = StdioElicitor() # Provide static roots in the host system roots = StaticRootsProvider( [Root(uri=FileUrl("file:///home"), name="Home"), Root(uri=FileUrl("file:///tmp"), name="Tmp")] ) # Create MCP session host with sampling, elicitation, and list_roots capabilities # If you want to support roots, import or define Root and FileUrl, then uncomment the roots line below host = McpSessionHost( sampler=sampler,  # Support sampling via model client elicitor=elicitor,  # Support elicitation via user_proxy roots=roots, ) # Setup MCP workbench with your server mcp_workbench = McpWorkbench( server_params=StdioServerParams(command="python", args=["your_mcp_server.py"]), host=host,  # Add the host here ) # Create MCP-enabled assistant mcp_assistant = AssistantAgent( "mcp_assistant", model_client=model_client, workbench=mcp_workbench, ) # Now the AssistantAgent can support MCP servers that request sampling, elicitation, and roots!'
