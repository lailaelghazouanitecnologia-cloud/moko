- name: McpWorkbench
  kind: struct
  ctx: 'A workbench that wraps an MCP server and provides an interface to list and call tools provided by the server. .. warning:: Only connect to trusted MCP servers, especially when using `StdioServerParams` as it executes commands in the local environment. This workbench should be used as a context manager to ensure proper initialization and cleanup of the underlying MCP session. .. list-table:: MCP Support :header-rows: 1 :widths: 30 70 * - MCP Capability - Supported Features * - Tools - list_tools, call_tool * - Resources - list_resources, read_resource * - ResourceTemplates - list_resource_templates, read_resource_template * - Prompts - list_prompts, get_prompt * - Sampling - Optional support via McpSessionHost * - Roots - Optional support via McpSessionHost * - Ellicitation - Optional support via McpSessionHost Args: server_params (McpServerParams): The parameters to connect to the MCP server. This can be either a :class:`StdioServerParams` or :class:`SseServerParams`. tool_overrides (Optional[Dict[str, ToolOverride]]): Optional mapping of original tool names to override configurations for name and/or description. This allows customizing how server tools appear to consumers while maintaining the underlying tool functionality. model_client: Optional chat completion client to handle sampling requests from MCP servers that support the sampling capability. This allows MCP servers to request text generation from a language model during tool execution. If not provided, sampling requests will return an error. Raises: ValueError: If there are conflicts in tool override names. Examples: Here is a simple example of how to use the workbench with a `mcp-server-fetch` server: .. code-block:: python import asyncio from autogen_ext.tools.mcp import McpWorkbench, StdioServerParams async def main() -> None: params = StdioServerParams( command="uvx", args=["mcp-server-fetch"], read_timeout_seconds=60, ) # You can also use `start()` and `stop()` to manage the session. async with McpWorkbench(server_params=params) as workbench: tools = await workbench.list_tools() print(tools) result = await workbench.call_tool(tools[0]["name"], {"url": "https://github.com/"}) print(result) asyncio.run(main()) Example of using tool overrides: .. code-block:: python import asyncio from autogen_ext.tools.mcp import McpWorkbench, StdioServerParams from autogen_core.tools import ToolOverride async def main() -> None: params = StdioServerParams( command="uvx", args=["mcp-server-fetch"], read_timeout_seconds=60, ) # Override the fetch tool''s name and description overrides = { "fetch": ToolOverride(name="web_fetch", description="Enhanced web fetching tool with better error handling") } async with McpWorkbench(server_params=params, tool_overrides=overrides) as workbench: tools = await workbench.list_tools() # The tool will now appear as "web_fetch" with the new description print(tools) # Call the overridden tool result = await workbench.call_tool("web_fetch", {"url": "https://github.com/"}) print(result) asyncio.run(main()) Example of using the workbench with the `GitHub MCP Server <https://github.com/github/github-mcp-server>`_: .. code-block:: python import asyncio from autogen_agentchat.agents import AssistantAgent from autogen_agentchat.ui import Console from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_ext.tools.mcp import McpWorkbench, StdioServerParams async def main() -> None: model_client = OpenAIChatCompletionClient(model="gpt-4.1-nano") server_params = StdioServerParams( command="docker", args=[ "run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server", ], env={ "GITHUB_PERSONAL_ACCESS_TOKEN": "ghp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXX", }, ) async with McpWorkbench(server_params) as mcp: agent = AssistantAgent( "github_assistant", model_client=model_client, workbench=mcp, reflect_on_tool_use=True, model_client_stream=True, ) await Console(agent.run_stream(task="Is there a repository named Autogen")) asyncio.run(main()) Example of using the workbench with the `Playwright MCP Server <https://github.com/microsoft/playwright-mcp>`_: .. code-block:: python # First run `npm install -g @playwright/mcp@latest` to install the MCP server. import asyncio from autogen_agentchat.agents import AssistantAgent from autogen_agentchat.teams import RoundRobinGroupChat from autogen_agentchat.conditions import TextMessageTermination from autogen_agentchat.ui import Console from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_ext.tools.mcp import McpWorkbench, StdioServerParams async def main() -> None: model_client = OpenAIChatCompletionClient(model="gpt-4.1-nano") server_params = StdioServerParams( command="npx", args=[ "@playwright/mcp@latest", "--headless", ], ) async with McpWorkbench(server_params) as mcp: agent = AssistantAgent( "web_browsing_assistant", model_client=model_client, workbench=mcp, model_client_stream=True, ) team = RoundRobinGroupChat( [agent], termination_condition=TextMessageTermination(source="web_browsing_assistant"), ) await Console(team.run_stream(task="Find out how many contributors for the microsoft/autogen repository")) asyncio.run(main()) (+1 dunder methods)'
