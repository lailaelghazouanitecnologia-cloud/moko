- name: AzureAISearchTool
  kind: struct
  ctx: 'Azure AI Search tool for querying Azure search indexes. This tool provides a simplified interface for querying Azure AI Search indexes using various search methods. It''s recommended to use the factory methods to create instances tailored for specific search types: 1.  **Full-Text Search**: For traditional keyword-based searches, Lucene queries, or semantically re-ranked results. - Use `AzureAISearchTool.create_full_text_search()` - Supports `query_type`: "simple" (keyword), "full" (Lucene), "semantic". 2.  **Vector Search**: For pure similarity searches based on vector embeddings. - Use `AzureAISearchTool.create_vector_search()` 3.  **Hybrid Search**: For combining vector search with full-text or semantic search to get the benefits of both. - Use `AzureAISearchTool.create_hybrid_search()` - The text component can be "simple", "full", or "semantic" via the `query_type` parameter. Each factory method configures the tool with appropriate defaults and validations for the chosen search strategy. .. warning:: If you set `query_type="semantic"`, you must also provide a valid `semantic_config_name`. This configuration must be set up in your Azure AI Search index beforehand.'
  bases:
  - EmbeddingProviderMixin
  - BaseAzureAISearchTool
