- name: GlobalSearchTool
  kind: struct
  ctx: 'Enables running GraphRAG global search queries as an AutoGen tool. This tool allows you to perform semantic search over a corpus of documents using the GraphRAG framework. The search combines graph-based document relationships with semantic embeddings to find relevant information. .. note:: This tool requires the :code:`graphrag` extra for the :code:`autogen-ext` package. To install: .. code-block:: bash pip install -U "autogen-agentchat" "autogen-ext[graphrag]" Before using this tool, you must complete the GraphRAG setup and indexing process: 1. Follow the GraphRAG documentation to initialize your project and settings 2. Configure and tune your prompts for the specific use case 3. Run the indexing process to generate the required data files 4. Ensure you have the settings.yaml file from the setup process Please refer to the [GraphRAG documentation](https://microsoft.github.io/graphrag/) for detailed instructions on completing these prerequisite steps. Example usage with AssistantAgent: .. code-block:: python import asyncio from pathlib import Path from autogen_ext.models.openai import OpenAIChatCompletionClient from autogen_agentchat.ui import Console from autogen_ext.tools.graphrag import GlobalSearchTool from autogen_agentchat.agents import AssistantAgent async def main(): # Initialize the OpenAI client openai_client = OpenAIChatCompletionClient( model="gpt-4o-mini", api_key="<api-key>", ) # Set up global search tool global_tool = GlobalSearchTool.from_settings(root_dir=Path("./"), config_filepath=Path("./settings.yaml")) # Create assistant agent with the global search tool assistant_agent = AssistantAgent( name="search_assistant", tools=[global_tool], model_client=openai_client, system_message=( "You are a tool selector AI assistant using the GraphRAG framework. " "Your primary task is to determine the appropriate search tool to call based on the user''s query. " "For broader, abstract questions requiring a comprehensive understanding of the dataset, call the ''global_search'' function." ), ) # Run a sample query query = "What is the overall sentiment of the community reports?" await Console(assistant_agent.run_stream(task=query)) if __name__ == "__main__": asyncio.run(main())'
