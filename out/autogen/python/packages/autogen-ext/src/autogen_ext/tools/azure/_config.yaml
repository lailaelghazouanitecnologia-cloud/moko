types:
- name: AzureAISearchConfig
  kind: model
  ctx: 'Configuration for Azure AI Search with validation. This class defines the configuration parameters for Azure AI Search tools, including authentication, search behavior, caching, and embedding settings. .. note:: This class requires the ``azure`` extra for the ``autogen-ext`` package. .. code-block:: bash pip install -U "autogen-ext[azure]" .. note:: **Prerequisites:** 1. An Azure AI Search service must be created in your Azure subscription. 2. The search index must be properly configured for your use case: - For vector search: Index must have vector fields - For semantic search: Index must have semantic configuration - For hybrid search: Both vector fields and text fields must be configured 3. Required packages: - Base functionality: ``azure-search-documents>=11.4.0`` - For Azure OpenAI embeddings: ``openai azure-identity`` - For OpenAI embeddings: ``openai`` Example Usage: .. code-block:: python from azure.core.credentials import AzureKeyCredential from autogen_ext.tools.azure import AzureAISearchConfig # Basic configuration for full-text search config = AzureAISearchConfig( name="doc-search", endpoint="https://your-search.search.windows.net",  # Your Azure AI Search endpoint index_name="<your-index>",  # Name of your search index credential=AzureKeyCredential("<your-key>"),  # Your Azure AI Search admin key query_type="simple", search_fields=["content", "title"],  # Update with your searchable fields top=5, ) # Configuration for vector search with Azure OpenAI embeddings vector_config = AzureAISearchConfig( name="vector-search", endpoint="https://your-search.search.windows.net", index_name="<your-index>", credential=AzureKeyCredential("<your-key>"), query_type="vector", vector_fields=["embedding"],  # Update with your vector field name embedding_provider="azure_openai", embedding_model="text-embedding-ada-002", openai_endpoint="https://your-openai.openai.azure.com",  # Your Azure OpenAI endpoint openai_api_key="<your-openai-key>",  # Your Azure OpenAI key top=5, ) # Configuration for hybrid search with semantic ranking hybrid_config = AzureAISearchConfig( name="hybrid-search", endpoint="https://your-search.search.windows.net", index_name="<your-index>", credential=AzureKeyCredential("<your-key>"), query_type="semantic", semantic_config_name="<your-semantic-config>",  # Name of your semantic configuration search_fields=["content", "title"],  # Update with your search fields vector_fields=["embedding"],  # Update with your vector field name embedding_provider="openai", embedding_model="text-embedding-ada-002", openai_api_key="<your-openai-key>",  # Your OpenAI API key top=5, )'
