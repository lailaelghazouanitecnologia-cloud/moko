- name: Memory
  kind: trait
  ctx: Protocol defining the interface for memory implementations. A memory is the storage for data that can be used to enrich or modify the model context. A memory implementation can use any storage mechanism, such as a list, a database, or a file system. It can also use any retrieval mechanism, such as vector search or text search. It is up to the implementation to decide how to store and retrieve data. It is also a memory implementation's responsibility to update the model context with relevant memory content based on the current model context and querying the memory store. See :class:`~autogen_core.memory.ListMemory` for an example implementation.
