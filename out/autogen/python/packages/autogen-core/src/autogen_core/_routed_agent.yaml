types:
- name: RoutedAgent
  kind: struct
  ctx: 'A base class for agents that route messages to handlers based on the type of the message and optional matching functions. To create a routed agent, subclass this class and add message handlers as methods decorated with either :func:`event` or :func:`rpc` decorator. Example: .. code-block:: python from dataclasses import dataclass from autogen_core import MessageContext from autogen_core import RoutedAgent, event, rpc @dataclass class Message: pass @dataclass class MessageWithContent: content: str @dataclass class Response: pass class MyAgent(RoutedAgent): def __init__(self): super().__init__("MyAgent") @event async def handle_event_message(self, message: Message, ctx: MessageContext) -> None: assert ctx.topic_id is not None await self.publish_message(MessageWithContent("event handled"), ctx.topic_id) @rpc(match=lambda message, ctx: message.content == "special")  # type: ignore async def handle_special_rpc_message(self, message: MessageWithContent, ctx: MessageContext) -> Response: return Response()'
  bases:
  - BaseAgent
  fields:
