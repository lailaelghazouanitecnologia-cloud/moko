- name: TokenLimitedChatCompletionContext
  kind: struct
  ctx: '(Experimental) A token based chat completion context maintains a view of the context up to a token limit. .. note:: Added in v0.4.10. This is an experimental component and may change in the future. Args: model_client (ChatCompletionClient): The model client to use for token counting. The model client must implement the :meth:`~autogen_core.models.ChatCompletionClient.count_tokens` and :meth:`~autogen_core.models.ChatCompletionClient.remaining_tokens` methods. token_limit (int | None): The maximum number of tokens to keep in the context using the :meth:`~autogen_core.models.ChatCompletionClient.count_tokens` method. If None, the context will be limited by the model client using the :meth:`~autogen_core.models.ChatCompletionClient.remaining_tokens` method. tools (List[ToolSchema] | None): A list of tool schema to use in the context. initial_messages (List[LLMMessage] | None): A list of initial messages to include in the context.'
