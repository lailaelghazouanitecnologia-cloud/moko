- name: AgentInstantiationContext
  kind: struct
  ctx: 'A static class that provides context for agent instantiation. This static class can be used to access the current runtime and agent ID during agent instantiation -- inside the factory function or the agent''s class constructor. Example: Get the current runtime and agent ID inside the factory function and the agent''s constructor: .. code-block:: python import asyncio from dataclasses import dataclass from autogen_core import ( AgentId, AgentInstantiationContext, MessageContext, RoutedAgent, SingleThreadedAgentRuntime, message_handler, ) @dataclass class TestMessage: content: str class TestAgent(RoutedAgent): def __init__(self, description: str): super().__init__(description) # Get the current runtime -- we don''t use it here, but it''s available. _ = AgentInstantiationContext.current_runtime() # Get the current agent ID. agent_id = AgentInstantiationContext.current_agent_id() print(f"Current AgentID from constructor: {agent_id}") @message_handler async def handle_test_message(self, message: TestMessage, ctx: MessageContext) -> None: print(f"Received message: {message.content}") def test_agent_factory() -> TestAgent: # Get the current runtime -- we don''t use it here, but it''s available. _ = AgentInstantiationContext.current_runtime() # Get the current agent ID. agent_id = AgentInstantiationContext.current_agent_id() print(f"Current AgentID from factory: {agent_id}") return TestAgent(description="Test agent") async def main() -> None: # Create a SingleThreadedAgentRuntime instance. runtime = SingleThreadedAgentRuntime() # Start the runtime. runtime.start() # Register the agent type with a factory function. await runtime.register_factory("test_agent", test_agent_factory) # Send a message to the agent. The runtime will instantiate the agent and call the message handler. await runtime.send_message(TestMessage(content="Hello, world!"), AgentId("test_agent", "default")) # Stop the runtime. await runtime.stop() asyncio.run(main())'
