  purpose: This example showcases using a Semantic Router to dynamically route user messages to the most appropraite agent for a conversation. The Semantic Router Agent is responsible for receiving messages from the user, identifying the intent of the message, and then routing the message to the agent, by referencing an "Agent Registry". Using the pub-sub model, messages are broadcast to the most appropriate agent. In this example, the Agent Registry is a simple dictionary which maps string-matched intents to agent names. In a more complex example, the intent classifier may be more robust, and the agent registry could use a technology such as Azure AI Search to host definitions for many agents. For this example, there are 2 agents available, an "hr" agent and a "finance" agent. Any requests that can not be classified as "hr" or "finance" will result in the conversation ending with a Termination message.
