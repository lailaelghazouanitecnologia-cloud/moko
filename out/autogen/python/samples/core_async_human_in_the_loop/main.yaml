file: core_async_human_in_the_loop/main.py
lines: 356
purpose: 'This example demonstrates an approach one can use to implement a async human in the loop system. The system consists of two agents: 1. An assistant agent that uses a tool call to schedule a meeting (this is a mock) 2. A user proxy that is used as a proxy for a slow human user. When this user receives a message from the assistant, it sends out a termination request with the query for the real human. The query to the human is sent out (as an input to the terminal here, but it could be an email or anything else) and the state of the runtime is saved in a persistent layer. When the user responds, the runtime is rehydrated with the state and the user input is sent back to the runtime. This is a simple example that can be extended to more complex scenarios as well. Whenever implementing a human in the loop system, it is important to consider that human looped systems can be slow - Humans take time to respond, but also depending on your medium of communication, the time taken can vary significantly. When waiting for the human to respond, it is possible that the system may be torn down. In such cases, it is important to save the state of the system with any relevant information that is needed to rehydrate the system. When designing such systems, it can be helpful recognize the trade-offs at which point to save the system state. In the given (simple) example, the system state is saved when the user input is needed. However, in a more complex system, it may be necessary to save the state at multiple points to ensure that the system can be rehydrated to the correct state. Additionally, we use "human"-in-loop in this example, but the same principles can be applied to any slow external system that the agent needs to interact with.'
