## Roska File Descriptor — __tests__/parallel-interactive-prompts.test.ts
file: __tests__/parallel-interactive-prompts.test.ts
lines: 300
purpose: 'Test for GitHub issue #13642: Parallel interactive tool calls (ask_user, request_access) should all be answerable, not just the most recent. Root cause: state.activeInlineQuestion is a single property that gets overwritten when multiple ask_question events arrive concurrently. The Harness dispatches events fire-and-forget (no await), so multiple interactive handlers run concurrently, and the last one wins — earlier prompts become unreachable.'
