## Roska File Descriptor — components/ask-question-inline.ts
file: components/ask-question-inline.ts
lines: 442
purpose: 'Inline ask question component. Shows a question with either selectable options or free-text input directly in the conversation flow instead of as an overlay dialog. Supports three lifecycle phases: 1. **Streaming** — Created early by handleToolInputStart with no args. As partial JSON arrives via handleToolInputDelta, `updateArgs()` feeds the question text and option labels into the bordered box progressively. 2. **Active** — When handleAskQuestion fires, `activate()` wires up the interactive SelectList / Input and the submit/cancel callbacks. 3. **Answered** — After the user responds, the box freezes with ✓/✗ icons.'
