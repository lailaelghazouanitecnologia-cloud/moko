file: components/om-output.ts
lines: 249
purpose: TUI component for rendering OM observation/reflection output in a bordered box. Uses observer (amber) color for observations and reflector (red) color for reflections. Collapsed to COLLAPSED_LINES by default, expandable with ctrl+e. Includes marker info (emoji, compression stats) in the footer.
