## Roska File Descriptor — onboarding/onboarding-inline.ts
file: onboarding/onboarding-inline.ts
lines: 700
purpose: 'Inline onboarding component. Walks the user through a multi-step wizard: 1. Welcome 2. Auth / Login prompt 3. Mode pack selection (build / plan / fast model preset) 4. OM pack selection (observational memory model) 5. YOLO mode toggle The component renders each step inline in the conversation stream. On completion it fires `onComplete` with the collected choices.'
