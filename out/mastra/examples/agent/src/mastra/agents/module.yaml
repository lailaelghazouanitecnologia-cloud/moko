  purpose: 'Dynamic Tools Agent Example This agent demonstrates the dynamic tool search pattern where tools are discovered and loaded on demand rather than being available upfront. Benefits: - Reduces context token usage by ~94% when working with many tools - Agent discovers tools as needed rather than having all definitions loaded - Tools are loaded per-conversation and persist across turns Usage: 1. Agent starts with only search_tools and load_tool 2. When agent needs a capability, it searches for relevant tools 3. Agent loads the tool by name 4. On subsequent turns, loaded tools are available via toolsets'
