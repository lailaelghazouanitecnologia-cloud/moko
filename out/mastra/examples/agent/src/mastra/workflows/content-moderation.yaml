file: workflows/content-moderation.ts
lines: 342
purpose: 'Content Moderation with Processor Workflows This module demonstrates how to use processor workflows with agents: 1. Individual processors attached directly to an agent 2. Processor workflows using all workflow features: - Sequential chaining (.then) - Parallel execution (.parallel) - Conditional branching (.branch) - Mapping/transformation (.map) 3. Using agent.generate() and agent.stream() directly with processors 4. Handling tripwires in direct agent usage'
