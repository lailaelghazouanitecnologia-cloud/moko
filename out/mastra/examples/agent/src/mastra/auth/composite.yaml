purpose: 'Composite auth provider - combines multiple auth providers. This demonstrates using CompositeAuth to layer: 1. SimpleAuth for service tokens (API access) 2. MastraCloudAuthProvider for user OAuth (SSO login) Request flow: - Token auth: SimpleAuth checks first, then Cloud verifies - SSO login: Cloud provides login URL and handles callback - Sessions: Cloud manages session cookies Requires environment variables: - MASTRA_PROJECT_ID: Cloud project ID - MASTRA_CLOUD_URL: Cloud API base URL - MASTRA_CALLBACK_URL: OAuth callback URL - SERVICE_TOKEN: Optional service token for API access'
