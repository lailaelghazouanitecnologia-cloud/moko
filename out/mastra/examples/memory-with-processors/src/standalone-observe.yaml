file: src/standalone-observe.ts
lines: 210
purpose: 'Example: Standalone observe() API This demonstrates using ObservationalMemory directly (without the Memory wrapper) to manually observe messages, retrieve observations, and inject them into a system prompt. The standalone API is useful when: - You''re building a plugin (like @mastra/opencode) that intercepts messages - You have a custom chat loop and want control over when observation happens - You''re working outside the Mastra agent pipeline Run with: pnpm observe'
