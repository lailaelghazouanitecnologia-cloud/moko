## Roska File Descriptor — __tests__/add-tool-result-message-id.test.ts
file: __tests__/add-tool-result-message-id.test.ts
lines: 221
purpose: 'Integration tests for issue #12683 / #11552: addToolResult with client-side tools. Simulates the full two-request flow through handleChatStream: Request 1: User sends "What''s in my clipboard?" → LLM responds with tool call for get_clipboard → Server streams response with start event containing messageId "A" Request 2: Client calls addToolResult, sends back messages with tool result → Last message is assistant (id="A", with tool result) — this is a continuation → Server streams continuation response → start event messageId MUST be "A" (not a new server-generated ID) → Otherwise the client creates a duplicate assistant message This test proves the bug: without the fix, the second start event has a different messageId, causing useChat to create a new assistant message instead of appending to the existing one.'
