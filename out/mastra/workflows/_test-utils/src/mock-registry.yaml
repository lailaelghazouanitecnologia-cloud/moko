## Roska File Descriptor — src/mock-registry.ts
file: src/mock-registry.ts
lines: 115
purpose: 'MockRegistry - Decouples test mocks from workflow definitions Problem: Factory tests create workflows once at test collection time with vi.fn() mocks embedded in step execute functions. These mocks persist across tests, causing call count accumulation and flaky tests. Solution: This registry stores mock factories that create fresh mocks on reset. Steps call into the registry at runtime instead of using embedded mocks directly.'
