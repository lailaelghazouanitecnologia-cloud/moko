- file: src/braintrust-nesting.test.ts
  lines: 381
  purpose: 'Unit tests using real Braintrust SDK to verify span nesting behavior. NOTE: We intentionally use the real SDK (not mocked) because we need to verify the SDK''s internal span relationship tracking (_spanId, _rootSpanId, _spanParents). We use a fake API key (''test-key'') so the SDK initializes and creates real span objects with proper internal state, but no data is actually sent to Braintrust servers. This runs at unit test speed with no external dependencies. These tests verify that our BraintrustExporter correctly uses the SDK''s startSpan() chain to establish proper parent-child relationships. Key behaviors tested: 1. Root spans get _rootSpanId = own _spanId (no parentSpanIds passed) 2. Child spans get correct _rootSpanId and _spanParents via startSpan() chain 3. External context spans properly nest under external parent'
  types: 1
  functions: 2
  imports: 13
  exports: 3
