  purpose: 'OpenTelemetry Bridge for Mastra Observability This bridge enables bidirectional integration with OpenTelemetry infrastructure: 1. Reads OTEL trace context from active spans (via AsyncLocalStorage) 2. Creates real OTEL spans when Mastra spans are created 3. Maintains span context for proper parent-child relationships 4. Allows OTEL-instrumented code (DB, HTTP clients) in tools/workflows to have correct parents This creates complete distributed traces where Mastra spans are properly nested within OTEL spans from auto-instrumentation, and any OTEL-instrumented operations within Mastra spans maintain the correct hierarchy.'
