- name: LangfuseExporter
  kind: struct
  ctx: 'Look up the Langfuse prompt from the closest span that has one. This enables prompt inheritance for MODEL_GENERATION spans when the prompt is set on a parent span (e.g., AGENT_RUN) rather than directly on the generation. This enables prompt linking when: - A workflow calls multiple agents, each with different prompts - Nested agents have different prompts - The prompt is set on AGENT_RUN but MODEL_GENERATION inherits it'
