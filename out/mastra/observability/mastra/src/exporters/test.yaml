## Roska File Descriptor — exporters/test.ts
file: exporters/test.ts
lines: 1680
purpose: 'Test Exporter for Observability A full-featured exporter primarily designed for testing purposes that provides: - In-memory event collection for ALL signals (Traces, Metrics, Logs, Scores, Feedback) - File output support - Span lifecycle tracking and validation - Query methods for filtering spans by type, trace ID, span ID, etc. - Query methods for filtering logs, metrics, scores, and feedback - Statistics and analytics on all collected signals - Internal metrics collection with summary on flush()'
