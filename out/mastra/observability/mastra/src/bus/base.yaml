## Roska File Descriptor — bus/base.ts
file: bus/base.ts
lines: 90
purpose: 'BaseObservabilityEventBus - Generic event bus for observability events. Provides a synchronous pub/sub mechanism: - Events are dispatched to subscribers immediately on emit() - Graceful error handling (handler errors don''t break other handlers) - flush() awaits any in-flight async subscriber promises - Clean shutdown flushes then clears subscribers Buffering/batching is intentionally NOT done here — individual exporters own their own batching strategy (e.g. CloudExporter batches uploads).'
