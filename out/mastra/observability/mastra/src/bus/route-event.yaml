## Roska File Descriptor — bus/route-event.ts
file: bus/route-event.ts
lines: 100
purpose: Shared event routing logic for observability handlers (exporters and bridges). Both ObservabilityExporter and ObservabilityBridge implement the same optional signal handlers (onTracingEvent, onLogEvent, onMetricEvent, onScoreEvent, onFeedbackEvent). This module provides a single routing function used by both the ObservabilityBus (for exporters) and BaseObservabilityInstance (for bridges).
