  purpose: ObservabilityBus - Unified event bus for all observability signals. Routes events to registered exporters and an optional bridge based on event type. Each handler declares which signals it supports by implementing the corresponding method (onTracingEvent, onLogEvent, onMetricEvent, onScoreEvent, onFeedbackEvent). Handler presence = signal support. If a handler does not implement a method, events of that type are silently skipped for that handler.
