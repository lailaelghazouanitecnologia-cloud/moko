  purpose: 'Trace-Level Sampling Tests These tests verify that sampling decisions are made at the trace level, not the span level. When using ratio or custom sampling: - The sampling decision should be made ONCE at the root span - All child spans should inherit the parent''s sampling decision - If root span is sampled, all children should be sampled - If root span is not sampled (NoOpSpan), all children should also be NoOpSpan Related issue: https://github.com/mastra-ai/mastra/issues/11504'
