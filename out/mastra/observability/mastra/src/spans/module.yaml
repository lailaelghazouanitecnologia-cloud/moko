  purpose: 'Bounded serialization utilities for AI tracing. These utilities prevent memory issues by enforcing strict limits on string lengths, array sizes, object depths, and total output size. They are designed to be used across all tracing/telemetry systems. ## Custom Span Serialization Classes can implement a `serializeForSpan()` method to provide a custom representation when serialized for tracing spans. This is useful for: - Excluding internal state and implementation details - Removing functions and circular references - Providing a clean, readable representation for observability ```typescript class MyClass { private internalState = new Map(); public data: string[]; serializeForSpan() { return { data: this.data }; } } ```'
