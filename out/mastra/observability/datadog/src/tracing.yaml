file: src/tracing.ts
lines: 683
purpose: 'Datadog LLM Observability Exporter for Mastra Exports Mastra observability data to Datadog''s LLM Observability product. Uses a completion-only pattern where spans are emitted on span_ended events. Key features: - Maps Mastra span types to Datadog span kinds - Normalizes AI SDK v4/v5 token usage formats - Formats LLM inputs/outputs as message arrays - Flattens metadata into searchable tags - Supports both agent and agentless modes'
