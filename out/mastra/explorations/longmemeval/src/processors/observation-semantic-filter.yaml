## Roska File Descriptor — processors/observation-semantic-filter.ts
file: processors/observation-semantic-filter.ts
lines: 1142
purpose: 'ObservationSemanticFilter - RAG-based filtering for OM observations This processor works alongside ObservationalMemory to filter observations based on semantic similarity to the user''s query. It''s designed to help models like GPT-4o that struggle with dense context by providing only the most relevant observations. Flow: 1. OM''s processInputStep loads observations and stores them in state 2. This processor''s processInputStep: - Embeds the user''s query - Retrieves relevant observation chunks from vector store - Injects filtered observations into context (replacing OM''s full injection) 3. OM''s processOutputResult creates new observations 4. This processor''s processOutputResult: - Chunks new observations by line - Embeds and stores chunks in vector store'
