- file: src/llm-mock.ts
  lines: 285
  purpose: 'LLM Mocking Record/replay LLM API calls in tests. Two factories: - `createLLMMock(model)` — wrap a real AI SDK model instance - `createGatewayMock()` — mock all LLM traffic (for gateway/string models) Both return self-contained instances with no global state. ```typescript // With a real model instance import { createLLMMock } from ''@internal/test-utils''; import { openai } from ''@ai-sdk/openai''; const mock = createLLMMock(openai(''gpt-4o'')); beforeAll(() => mock.start()); afterAll(() => mock.saveAndStop()); ``` ```typescript // With gateway string models like ''openai/gpt-4o'' import { createGatewayMock } from ''@internal/test-utils''; const mock = createGatewayMock(); beforeAll(() => mock.start()); afterAll(() => mock.saveAndStop()); ```'
  types: 5
