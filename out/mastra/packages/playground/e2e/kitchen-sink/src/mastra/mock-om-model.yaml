## Roska File Descriptor — mastra/mock-om-model.ts
file: mastra/mock-om-model.ts
lines: 157
purpose: 'Custom Mock Model for Observational Memory E2E Tests This mock model triggers multi-step execution by returning tool calls on the first call, which causes the agent loop to continue to step 2. The OM processor only triggers observations when stepNumber > 0, so we need this multi-step behavior. Uses a counter-based approach: first call = tool call, all subsequent = text. This is more reliable than checking messages for tool results because OM can clear messages from context after observation. Flow: 1. Step 0: Model returns tool-call with finishReason: ''tool-calls'' 2. Tool executes, results added to messages 3. Step 1: Model returns text with finishReason: ''stop'' 4. OM processor sees stepNumber=1, checks threshold, triggers observation'
