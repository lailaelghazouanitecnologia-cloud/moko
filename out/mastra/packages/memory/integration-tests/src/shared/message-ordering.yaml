purpose: 'Message Ordering Integration Tests - Issue #9909 These tests verify that message part ordering is preserved through the full streaming -> persistence -> retrieval cycle with REAL storage backends. Issue: https://github.com/mastra-ai/mastra/issues/9909 Each test compares THREE sources: 1. STREAM - The ground truth of what was streamed from the LLM 2. RAW STORAGE - Direct query to the database (listMessages) 3. RECALL - The processed recall output from Memory Tests run with OpenAI models.'
