purpose: 'Observational Memory (OM) A memory system that keeps agents performant across long conversations by: 1. Automatically compressing turn-based message history into structured observations 2. Reflecting on observations when they grow too large Three-agent architecture: - Actor: The main agent, sees observations + recent unobserved messages - Observer: Extracts observations when history exceeds threshold - Reflector: Condenses observations when they exceed threshold'
