file: __tests__/standalone-observe.test.ts
lines: 347
purpose: 'Standalone observe() Method Tests Tests for the public `observe()` API added for external consumers like the @mastra/opencode plugin. This API allows triggering observation without going through the full processInputStep pipeline. Key behaviors tested: 1. observe() triggers observation when messages are provided and threshold is met 2. observe() skips observation when threshold is not met 3. observe() calls lifecycle hooks (onObservationStart/End, onReflectionStart/End) 4. observe() works in both thread and resource scope 5. observe() filters unobserved messages when provided directly'
