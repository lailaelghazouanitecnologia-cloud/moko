## Roska File Descriptor — hooks/use-permissions.ts
file: hooks/use-permissions.ts
lines: 205
purpose: Hook for checking user permissions in the UI. Provides access to the current user's permissions and helper functions to check if the user has specific permissions. ```tsx import { usePermissions } from '@mastra/playground-ui'; function AgentActions({ agentId }) { const { hasPermission, hasAnyPermission } = usePermissions(); return ( <> {hasPermission('agents:execute') && <RunButton agentId={agentId} />} {hasPermission('agents:write') && <EditButton agentId={agentId} />} {hasPermission('agents:delete') && <DeleteButton agentId={agentId} />} </> ); } ```
