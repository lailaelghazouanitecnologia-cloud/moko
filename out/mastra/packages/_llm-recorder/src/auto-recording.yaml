purpose: 'Auto-Recording Module Provides a simple function to enable LLM recording/replay for a test file with automatic name derivation from the test file path. This is a lighter alternative to the Vite plugin — just import and call `enableAutoRecording()` at the top of your test file. ```typescript import { enableAutoRecording } from ''@internal/llm-recorder''; // Auto-derives recording name from file path enableAutoRecording(); describe(''My Tests'', () => { it(''works'', async () => { const result = await agent.generate(''Hello''); expect(result.text).toBeDefined(); }); }); ``` ```typescript // With custom name enableAutoRecording({ nameOverride: ''my-custom-name'' }); ```'
