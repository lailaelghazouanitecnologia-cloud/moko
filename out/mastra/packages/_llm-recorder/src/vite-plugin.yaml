purpose: 'Vitest LLM Recorder Plugin A Vite plugin that automatically injects LLM recording/replay setup into test files. This eliminates the need to manually call `useLLMRecording()` in every test file. The plugin transforms test files at build time, injecting the recording setup code before any test definitions. Recording names are auto-derived from file paths. ```typescript // vitest.config.ts import { llmRecorderPlugin } from ''@internal/llm-recorder/vite-plugin''; export default defineConfig({ plugins: [llmRecorderPlugin()], test: { ... } }); ```'
