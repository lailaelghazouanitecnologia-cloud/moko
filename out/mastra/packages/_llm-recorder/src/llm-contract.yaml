## Roska File Descriptor — src/llm-contract.ts
file: src/llm-contract.ts
lines: 387
purpose: LLM Contract Validation Validates LLM API response structures against known schemas. Useful for detecting API drift before it breaks production code. The validator compares response _structure_ (types, field presence) rather than exact values, making it resilient to normal response variation. ```typescript import { validateLLMContract, extractSchema, formatContractResult } from '@internal/llm-recorder'; // Compare actual response against expected structure const result = validateLLMContract(actualResponse, expectedResponse); console.log(formatContractResult(result)); ```
