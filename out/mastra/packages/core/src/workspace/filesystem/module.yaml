- file: filesystem/composite-filesystem.ts
  lines: 533
  purpose: 'CompositeFilesystem - Routes operations to mounted filesystems based on path. Creates a unified filesystem view by combining multiple filesystems at different mount points. Useful for composing local storage, S3, and other backends. ```typescript const cfs = new CompositeFilesystem({ mounts: { ''/local'': new LocalFilesystem({ basePath: ''./data'' }), ''/s3'': new S3Filesystem({ bucket: ''my-bucket'', ... }), } }); // readdir(''/'') returns [''local'', ''s3''] // readFile(''/local/file.txt'') reads from LocalFilesystem // readFile(''/s3/data.json'') reads from S3Filesystem ```'
  types: 5
