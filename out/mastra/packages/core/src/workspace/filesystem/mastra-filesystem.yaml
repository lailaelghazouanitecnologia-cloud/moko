## Roska File Descriptor — filesystem/mastra-filesystem.ts
file: filesystem/mastra-filesystem.ts
lines: 324
purpose: 'MastraFilesystem Base Class Abstract base class for filesystem providers that want automatic logger integration and lifecycle management. Extends MastraBase to receive the Mastra logger when registered with a Mastra instance. ## Lifecycle Management The base class provides race-condition-safe lifecycle wrappers: - `_init()` - Handles concurrent calls, status management - `_destroy()` - Handles concurrent calls and status management Subclasses override the plain `init()` and `destroy()` methods to provide their implementation. Callers use the `_`-prefixed wrappers (or `callLifecycle()`) which add status tracking and race-condition safety. External providers can extend this class to get logger support, or implement the WorkspaceFilesystem interface directly if they don''t need logging.'
