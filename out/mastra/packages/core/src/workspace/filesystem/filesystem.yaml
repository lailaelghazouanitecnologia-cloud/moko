## Roska File Descriptor — filesystem/filesystem.ts
file: filesystem/filesystem.ts
lines: 363
purpose: 'Workspace Filesystem Interface Defines the contract for filesystem providers that can be used with Workspace. Users pass filesystem provider instances to the Workspace constructor. Built-in providers: - LocalFilesystem: A folder on the user''s machine - AgentFS: Turso-backed filesystem with audit trail ```typescript import { Workspace } from ''@mastra/core''; import { LocalFilesystem } from ''@mastra/workspace-fs-local''; const workspace = new Workspace({ filesystem: new LocalFilesystem({ basePath: ''./my-workspace'' }), }); ```'
