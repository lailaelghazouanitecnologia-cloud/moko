  purpose: 'Workspace Class A Workspace combines a Filesystem and a Sandbox to provide agents with a complete environment for storing files and executing code. Users pass provider instances directly to the Workspace constructor. ```typescript import { Workspace } from ''@mastra/core''; import { LocalFilesystem } from ''@mastra/workspace-fs-local''; import { AgentFS } from ''@mastra/workspace-fs-agentfs''; import { ComputeSDKSandbox } from ''@mastra/workspace-sandbox-computesdk''; // Simple workspace with local filesystem const workspace = new Workspace({ filesystem: new LocalFilesystem({ basePath: ''./workspace'' }), }); // Full workspace with AgentFS and cloud sandbox const fullWorkspace = new Workspace({ filesystem: new AgentFS({ path: ''./agent.db'' }), sandbox: new ComputeSDKSandbox({ provider: ''e2b'' }), }); await fullWorkspace.init(); await fullWorkspace.filesystem?.writeFile(''/code/app.py'', ''print("Hello!")''); const result = await fullWorkspace.sandbox?.executeCommand?.(''python3'', [''app.py''], { cwd: ''/code'' }); ```'
