  purpose: 'LocalSkillSource - Read-only skill source backed by local filesystem. Uses Node.js fs/promises to read skills directly from disk. This allows skills to be loaded without requiring a full WorkspaceFilesystem. ```typescript const source = new LocalSkillSource({ basePath: process.cwd(), }); // skills paths are relative to basePath const skillsImpl = new WorkspaceSkillsImpl({ source, skills: [''./skills'', ''./node_modules/@company/skills''], }); ```'
