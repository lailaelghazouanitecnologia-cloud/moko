purpose: 'Skill Tools — Factory Creates the built-in skill tools for agents. These tools let the model discover and read skill instructions on demand. Design: stateless. The `skill` tool returns the full skill instructions in its tool result — no activation state tracking needed. Instructions persist naturally in conversation history. If context gets compacted, the model just calls the tool again.'
