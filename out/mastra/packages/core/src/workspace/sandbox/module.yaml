  purpose: 'Local Sandbox Provider A sandbox implementation that executes commands on the local machine. This is the default sandbox for development and local agents. Supports optional native OS sandboxing: - macOS: Uses seatbelt (sandbox-exec) for filesystem and network isolation - Linux: Uses bubblewrap (bwrap) for namespace isolation'
