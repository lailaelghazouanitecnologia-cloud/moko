purpose: 'Workspace Sandbox Interface Defines the contract for sandbox providers that can be used with Workspace. Users pass sandbox provider instances to the Workspace constructor. Sandboxes provide isolated environments for code and command execution. They may have their own filesystem that''s separate from the workspace FS. Built-in providers (via ComputeSDK): - E2B: Cloud sandboxes - Modal: GPU-enabled sandboxes - Docker: Container-based execution - Local: Development-only local execution ```typescript import { Workspace } from ''@mastra/core''; import { ComputeSDKSandbox } from ''@mastra/workspace-sandbox-computesdk''; const workspace = new Workspace({ sandbox: new ComputeSDKSandbox({ provider: ''e2b'' }), }); ```'
