purpose: 'Seatbelt (macOS sandbox-exec) macOS built-in sandboxing using sandbox-exec with SBPL profiles. Important: Uses `-p` (inline profile) instead of `-f` (file) because `-f` doesn''t work reliably with path filters on modern macOS. Note on macOS sandbox limitations: - `(allow file-read* (subpath ...))` only works WITH a preceding `(allow file-read*)` - So for reads: allow all, then deny specific paths - For writes: allow specific paths with subpath filters Based on the approach used by Claude Code''s sandbox-runtime: https://github.com/anthropic-experimental/sandbox-runtime'
