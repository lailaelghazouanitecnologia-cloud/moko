purpose: LSP Client JSON-RPC client wrapper for communicating with language servers. Uses dynamic imports for vscode-jsonrpc and vscode-languageserver-protocol to keep them as optional dependencies. Spawns LSP servers via a SandboxProcessManager, so it works with any sandbox backend (local, E2B, etc.) that has a process manager.
