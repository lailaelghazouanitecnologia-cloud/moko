  purpose: LSP Manager Per-workspace manager that owns LSP server clients. NOT a singleton — each Workspace instance creates its own LSPManager. Resolves the project root per-file by walking up from the file's directory using language-specific markers defined on each server (e.g. tsconfig.json for TypeScript, go.mod for Go). Falls back to the default root when walkup finds nothing.
