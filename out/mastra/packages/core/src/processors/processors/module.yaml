  purpose: 'WorkspaceInstructionsProcessor Injects workspace environment instructions (filesystem paths, sandbox info, mount states) into the system message so agents understand which paths are accessible in shell commands vs. file tools. Auto-wired by Agent when a workspace is configured. ```typescript // Auto-created by Agent when workspace exists const agent = new Agent({ workspace: new Workspace({ filesystem: new LocalFilesystem({ basePath: ''./data'' }), sandbox: new LocalSandbox(), }), }); // Or explicit processor control: const agent = new Agent({ workspace, inputProcessors: [new WorkspaceInstructionsProcessor({ workspace })], }); ```'
