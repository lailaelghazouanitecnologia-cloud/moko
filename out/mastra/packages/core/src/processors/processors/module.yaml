  purpose: 'SkillsProcessor - Processor for Agent Skills specification. Injects available skills metadata into the system message so the model knows which skills exist and can call the `skill` tool to load instructions. ```typescript // Auto-created by Agent when workspace has skills const agent = new Agent({ workspace: new Workspace({ filesystem: new LocalFilesystem({ basePath: ''./data'' }), skills: [''/skills''], }), }); // Or explicit processor control: const agent = new Agent({ workspace, inputProcessors: [new SkillsProcessor({ workspace })], }); ```'
