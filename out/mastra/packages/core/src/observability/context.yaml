purpose: Tracing Context Integration This module provides automatic tracing context propagation throughout Mastra's execution contexts. It uses JavaScript Proxies to transparently wrap Mastra, Agent, and Workflow instances so that tracing context is automatically injected without requiring manual passing by users.
