## Roska File Descriptor — network/validation.ts
file: network/validation.ts
lines: 814
purpose: 'Network Completion Scorers Completion checks are just MastraScorers that return 0 (failed) or 1 (passed). This unifies completion checking with the evaluation system. ```typescript import { createScorer } from ''@mastra/core/evals''; // Simple completion scorer const testsScorer = createScorer({ id: ''tests'', description: ''Run unit tests'', }).generateScore(async ({ run }) => { const result = await exec(''npm test''); return result.exitCode === 0 ? 1 : 0; }); // Use in network await agent.network(messages, { completion: { scorers: [testsScorer], }, }); ```'
