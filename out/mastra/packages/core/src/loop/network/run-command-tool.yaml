purpose: Node.js-specific tool for running shell commands. This file is separated from validation.ts to avoid bundling Node.js dependencies into browser builds. - NEVER use with untrusted input or in multi-tenant environments - Always configure allowedCommands to restrict executable commands - Always set allowedBasePaths to restrict working directories - Consider running in a sandboxed environment (container, VM) - Review all commands that agents may construct before deployment
