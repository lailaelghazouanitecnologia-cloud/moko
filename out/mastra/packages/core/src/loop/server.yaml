purpose: 'Server-only exports for the loop module. These exports contain Node.js dependencies and should not be imported in browser builds. ```typescript // Server-side only import { createRunCommandTool } from ''@mastra/core/loop/server''; ``` security risks if misused. NEVER use with untrusted input. Always configure: - `allowedCommands`: Restrict which commands can be executed - `allowedBasePaths`: Restrict working directories - Consider additional sandboxing (containers, VMs) for production See {@link RunCommandToolOptions} for configuration details.'
