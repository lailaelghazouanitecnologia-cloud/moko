purpose: 'RBAC provider interface for EE authentication. Enables role-based access control in Studio. RBAC is designed to be separate from authentication. This allows users to mix auth providers with RBAC providers: - Use Better Auth for authentication + StaticRBACProvider for RBAC - Use Clerk for both auth and RBAC via MastraRBACClerk - Use Auth0 for auth + custom RBAC provider'
