purpose: 'Test for Zod v4 JSON Schema compatibility issue This test reproduces the bug where: 1. OpenAISchemaCompatLayer.processZodType() adds .transform() to handle .optional(), .nullable(), .default() 2. When the processed schema is converted to JSON Schema via asJsonSchema() 3. It throws "Transforms cannot be represented in JSON Schema" Bug Report Pattern: ```typescript const schema = z.object({ rate: z.string().nullish().default(""), }); const result = await agent.generate(prompt, { structuredOutput: { schema } }); // Error: Transforms cannot be represented in JSON Schema ```'
