  purpose: Type compatibility layer for Zod v3 and v4 Zod v3 and v4 have different internal type structures, but they share the same public API. This type uses structural typing to accept schemas from both versions by checking for the presence of `parse` and `safeParse` rather than relying on nominal type matching. Using nominal union types (e.g. `z.ZodType<T> | zv4.ZodType<T>`) causes TypeScript to perform deep comparison of both zod type trees when inferring generics, leading to combinatorial explosion and OOM in `tsc`.
