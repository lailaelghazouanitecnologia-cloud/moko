## Roska File Descriptor — __tests__/tool-approval-standalone-repro.test.ts
file: __tests__/tool-approval-standalone-repro.test.ts
lines: 204
purpose: 'Reproduction: Agent without Mastra instance fails to resume stream after tool approval suspension. Root cause: The Agent''s resumeStream/resumeGenerate methods rely on `this.#mastra?.getStorage()?.getStore(''workflows'')` to load workflow snapshots. When an Agent is used standalone (without being registered via a Mastra instance), `#mastra` is undefined, so snapshots are never persisted during suspension and can never be loaded during resumption. This means: 1. The initial stream suspends and emits a `tool-call-approval` chunk — this works. 2. `approveToolCall()` / `declineToolCall()` call `resumeStream()` internally. 3. `resumeStream()` tries to load the snapshot: `workflowsStore?.loadWorkflowSnapshot(...)`. 4. `workflowsStore` is `undefined` because `this.#mastra` is `undefined`. 5. `existingSnapshot` is `undefined`, so `#execute()` receives no resume context. 6. The resumed execution starts fresh with empty messages and no snapshot — it does NOT continue from where it left off.'
