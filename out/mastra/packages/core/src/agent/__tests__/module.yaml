  purpose: 'Reasoning with Interleaved Chunks Tests Tests for GitHub issue #11480: When reasoning-end is received after text-start, reasoning content is lost. Some model providers (like ZAI/glm-4.6) return chunks in this order: step-start → reasoning-start → reasoning-delta → text-start → reasoning-end → text-end The bug: When text-start arrives while isReasoning is true, the code clears reasoningDeltas before reasoning-end has a chance to save them to the message.'
  types: 0
  functions: 1
