- file: __tests__/reasoning-memory.test.ts
  lines: 1059
  purpose: 'Reasoning + Memory Integration Tests Tests for GitHub issue #11103: OpenAI reasoning models fail with "reasoning item without required following item" When sending a message in a thread that contains a reasoning part followed by a text part, the second request fails because OpenAI requires that when a reasoning item has an `id` field, the following assistant message must also have a matching `id` field to link them together. The bug was that reasoning providerMetadata (containing openai.itemId) was leaking into subsequent text parts because runState.providerOptions wasn''t being reset after reasoning-end.'
  types: 0
  functions: 3
  imports: 8
