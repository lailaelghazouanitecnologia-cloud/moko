  purpose: 'InstructionBuilder: Resolves an array of AgentInstructionBlock items into a final instruction string. For each block: - `{ type: ''text'', content }` → render template with context - `{ type: ''prompt_block_ref'', id }` → fetch from storage, evaluate rules, render template - `{ type: ''prompt_block'', content, rules? }` → inline block, evaluate rules, render template Blocks that fail rule evaluation are excluded. Resolved text segments are joined with double newlines.'
