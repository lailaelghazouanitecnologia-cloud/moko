- name: MastraServer
  kind: struct
  ctx: Register a global error-handling middleware at the top of the middleware chain. This acts as a safety net for errors that propagate past route handlers (e.g., from auth middleware, context middleware, or when route handlers re-throw). When `server.onError` is configured, calls it and uses the response. Otherwise provides a default JSON error response. Errors are emitted on the app for logging (Koa convention) but NOT re-thrown, so this middleware is the final error boundary. Users who need custom error handling should use `server.onError` or register their own middleware between this and the routes.
