  purpose: 'Type-checking E2E tests for @mastra/core These tests verify that @mastra/core compiles correctly in a real userland environment. We publish packages to a local Verdaccio registry and install them in a fresh project outside the monorepo to catch type errors that wouldn''t surface during development: - Missing or incorrect type exports - Broken type references to internal packages - Dependencies on dev-only types not available to end users Running type checks inside the monorepo would incorrectly resolve dev dependencies and miss these issues. Usage: npx tsx test.ts'
