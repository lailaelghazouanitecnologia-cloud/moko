purpose: Custom handler for code blocks to preserve language hints Docusaurus places language classes on <pre> elements (e.g., <pre class="language-typescript">), not on <code> elements. The default rehype-remark handler only checks <code> elements, so we need a custom handler to extract the language from the <pre> element.
