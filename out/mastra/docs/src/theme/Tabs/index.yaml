## Roska File Descriptor — Tabs/index.tsx
file: Tabs/index.tsx
lines: 140
purpose: Swizzled Tabs component that removes the `key={String(isBrowser)}` workaround from upstream Docusaurus. The upstream hack forces a full re-mount after hydration (see https://github.com/facebook/docusaurus/issues/5653), which causes content churn that search engines penalize. Since our tabs use static default values (npm2yarn with groupId sync), the workaround is unnecessary.
