types:
- name: SidebarDoc
  kind: trait
  ctx: 'Validates (and optionally fixes) the sorting order of items in the reference sidebar. Rules (applied recursively at every level): 1. "Overview" labeled items always come first. 2. "Configuration" labeled items come right after Overview. 3. Standalone doc pages (non-dot labels) come before subcategories. 4. Subcategories are sorted alphabetically by label (case-insensitive). 5. Within doc pages, non-dot items come before dot-prefixed items. 6. Non-dot items are sorted alphabetically (case-insensitive). 7. Dot-prefixed items are sorted alphabetically (case-insensitive). Usage: pnpm validate:reference-sidebar        # validate only pnpm validate:reference-sidebar:fix     # fix in place'
