purpose: 'Blaxel Process Manager Implements SandboxProcessManager for Blaxel cloud sandboxes. Wraps the Blaxel SDK''s process API (exec, list, get, kill, streamLogs) for background process management. Key limitation: Blaxel sandboxes do not support stdin. ProcessHandle.sendStdin() throws and the writer stream will error.'
