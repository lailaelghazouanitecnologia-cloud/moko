purpose: 'Blaxel Sandbox Integration Tests These tests require real Blaxel API access and run against actual Blaxel sandboxes. They are separated from unit tests to avoid mock conflicts. Required environment variables: - BL_API_KEY (or BL_CLIENT_CREDENTIALS): Blaxel authentication - BL_WORKSPACE: Blaxel workspace name - S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY: For S3 mount tests - S3_ENDPOINT, S3_REGION: For S3-compatible services (R2, MinIO) - GCS_SERVICE_ACCOUNT_KEY, TEST_GCS_BUCKET: For GCS mount tests'
