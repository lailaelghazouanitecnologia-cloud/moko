purpose: 'LSP per-file root resolution integration tests. Verifies that walkUpAsync resolves different LSP project roots for files in separate project directories. Creates two projects with distinct tsconfig.json files and validates that each file gets diagnostics from its own project''s TS server instance. Local vs remote FS behavior: - Local FS: walkUpAsync finds markers → TS server reads tsconfig.json from disk at the resolved root → different tsconfig settings produce different diagnostics - Remote FS (S3/GCS): walkUpAsync finds markers via filesystem API → but the TS server can''t read tsconfig.json from the remote path → uses default compiler settings → we can only verify that both projects resolve and return diagnostics Uses `sandboxPathsAligned` as the proxy for whether the TS server sees files written via the workspace filesystem API.'
