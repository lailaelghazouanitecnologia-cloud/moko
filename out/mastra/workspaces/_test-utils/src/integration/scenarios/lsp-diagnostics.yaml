purpose: 'LSP diagnostics integration tests. Verifies that the LSP subsystem produces real diagnostics when a workspace has `lsp: true` and a sandbox with a process manager. Requires: - typescript and typescript-language-server installed (resolved via node_modules) - vscode-jsonrpc available (optional dep of @mastra/core) - A sandbox that can spawn processes (LocalSandbox or compatible) Tests are skipped gracefully when LSP is not available. Uses the workspace filesystem API to write test files so that walkUpAsync can find project markers (tsconfig.json) on any provider (local, S3, GCS). The TS language server receives file content via LSP protocol and doesn''t need files on disk.'
