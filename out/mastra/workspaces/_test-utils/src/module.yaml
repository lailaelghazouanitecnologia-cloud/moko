  purpose: 'Shared workspace integration tests with local providers. Runs the shared integration test suite against LocalFilesystem + LocalSandbox to validate the factories themselves and ensure the local providers pass all integration scenarios. Tests three configurations: 1. LocalFilesystem (contained: true) + LocalSandbox 2. LocalFilesystem (contained: false) + LocalSandbox 3. Mounts with LocalFilesystem (contained: true) + LocalSandbox Note: Mounts with contained: false is not tested because CompositeFilesystem passes `/`-prefixed paths (after stripping the mount prefix) to each mount''s filesystem, and contained: false treats those as absolute host paths (COR-554).'
