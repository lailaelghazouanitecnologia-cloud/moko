## Roska File Descriptor — sandbox/process-manager.ts
file: sandbox/process-manager.ts
lines: 276
purpose: 'Daytona Process Manager Implements SandboxProcessManager for Daytona cloud sandboxes. Wraps the Daytona SDK''s session API (createSession, executeSessionCommand, getSessionCommandLogs, deleteSession) for background process management. Each spawn() creates a dedicated session with a single command. The user command is wrapped in a subshell `(command)` so that: - `exit N` exits the subshell, not the session shell - Heredocs are contained within the subshell - The session command finishes cleanly'
