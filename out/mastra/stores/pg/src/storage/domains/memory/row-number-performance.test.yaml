purpose: 'Performance test to demonstrate the ROW_NUMBER() query performance issue described in GitHub Issue #11150. The issue: When using semantic recall, the _getIncludedMessages method generates a ROW_NUMBER() OVER (ORDER BY "createdAt" ASC) query for each included message. This becomes extremely slow on large tables because: 1. The ROW_NUMBER() window function must scan all messages in the thread to assign row numbers 2. Each included message generates a separate CTE + subquery 3. With semantic recall returning multiple messages (default topK=4), multiple expensive CTEs are UNION ALL''d together Expected: < 500ms for listMessages with include parameter Actual (on 1M+ row tables): 5-10+ minutes, blocking queries'
