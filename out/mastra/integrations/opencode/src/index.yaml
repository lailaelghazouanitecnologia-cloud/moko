## Roska File Descriptor — src/index.ts
file: src/index.ts
lines: 417
purpose: 'OpenCode plugin that brings Mastra Observational Memory into opencode sessions. Mastra OM compresses long conversation history into structured observations using an Observer (extract) and Reflector (condense) architecture. Configuration is read from .opencode/mastra.json in the project root. ```json { "model": "google/gemini-2.5-flash", "observation": { "messageTokens": 20000 }, "reflection": { "observationTokens": 90000 }, "storagePath": ".opencode/memory/observations.db" } ```'
