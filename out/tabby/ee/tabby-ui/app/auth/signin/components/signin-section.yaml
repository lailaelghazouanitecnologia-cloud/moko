  type: any
  val: findIndex(authProviders, x => x.kind === AuthProviderKind.OauthGitlab) > -1
- name: enableGoogleOauth
  type: any
  val: findIndex(authProviders, x => x.kind === AuthProviderKind.OauthGoogle) > -1
- name: enableOidcOauth
  type: any
  val: findIndex(authProviders, x => x.kind === AuthProviderKind.OauthOidc) > -1
- name: enable3POauth
  type: any
  val: |-
    enableGithubOauth ||
        enableGitlabOauth ||
        enableGoogleOauth ||
        enableOidcOauth
- name: enableLdapAuth
  type: any
  val: findIndex(authProviders, x => x.kind === AuthProviderKind.Ldap) > -1
- name: passwordSigninVisible
  type: any
  val: passwordForceRender || !isDisablePasswordLogin
- name: tabsDefaultValue
  type: any
  val: 'passwordSigninVisible ? ''standard'' : ''ldap'''
- name: formVisible
  type: any
  val: passwordSigninVisible || enableLdapAuth
- name: tabListVisible
  type: any
  val: passwordSigninVisible && enableLdapAuth
- name: '{ status }'
  type: any
  val: useSession()
- name: displayLoading
  type: any
  val: |-
    isFetchingServerInfo ||
