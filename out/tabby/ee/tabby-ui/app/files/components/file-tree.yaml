data:
- name: FileTreeContext
  type: any
  val: |-
    React.createContext<FileTreeContextValue>(
      {} as FileTreeContextValue
    )
- name: items
  type: any
  val: |-
    React.useMemo(() => {
        return new Array(level).fill(1)
      }, [level])
- name: '{ activeRepo, activeEntryInfo }'
  type: any
  val: |-
    React.useContext(
        SourceCodeBrowserContext
      )
- name: |-
    {
        fileMap,
        updateFileMap,
        expandedKeys,
        toggleExpandedKey,
        onSelectTreeNode
      }
  type: any
  val: React.useContext(FileTreeContext)
- name: initialized
  type: any
  val: React.useRef(false)
- name: basename
  type: any
  val: 'root ? '''' : node.file.basename'
- name: expanded
  type: any
  val: expandedKeys.has(basename)
- name: shouldFetchChildren
  type: any
  val: |-
    node.file.kind === 'dir' &&
        !fileMap?.[node.fullPath]?.treeExpanded &&
        expanded
- name: '{ data, isLoading }'
  type: SWRResponse<ResolveEntriesResponse>
  val: |-
    useSWRImmutable(
          shouldFetchChildren
            ? toEntryRequestUrl(activeRepo, activeEntryInfo.rev, basename)
          ...
- name: '[loading]'
  type: any
  val: useDebounceValue(isLoading, 100)
- name: existingChildren
  type: any
  val: '!!node?.children?.length'
- name: key
  type: any
  val: child.file.basename
- name: '{ repoMap, activeEntryInfo }'
  type: any
  val: |-
    React.useContext(
        SourceCodeBrowserContext
      )
- name: '{ initialized, fileTreeData, fetchingTreeEntries }'
  type: any
  val: React.useContext(FileTreeContext)
- name: '{ repositorySpecifier }'
  type: any
  val: activeEntryInfo
- name: hasSelectedRepo
  type: any
  val: '!!repositorySpecifier'
- name: hasNoRepoEntries
  type: any
  val: hasSelectedRepo && !fileTreeData?.length
- name: isFile
  type: any
  val: node?.file?.kind === 'file'
