## Roska File Descriptor — codeRenderer/CodeRenderer.ts
file: codeRenderer/CodeRenderer.ts
lines: 445
layer: logic
purpose: CodeRenderer is a class that, when given a code string, highlights the code string using shiki and returns a svg representation of it. We could technically just call shiki's methods to do a one-liner syntax highlighting code, but a separate class for this is useful because we rarely ever need syntax highlighting outside of creating a render of it.
