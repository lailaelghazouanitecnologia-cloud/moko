types:
- name: VertexAI
  kind: struct
  ctx: 'Vertex Supports 3 different URL formats 1. Standard VertexAI: e.g. https://{location}-aiplatform.googleapis.com/v1/projects/{project}/locations/{location}/publishers/google/models/{model}:streamGenerateContent 2. Tuned model:       e.g. https://{location}-aiplatform.googleapis.com/v1/projects/{project}/locations/{location}/endpoints/{endpoint}:streamGenerateContent 3. Express mode:      e.g. https://aiplatform.googleapis.com/v1/publishers/google/models/{model}:streamGenerateContent?key={API_KEY} // see https://cloud.google.com/vertex-ai/generative-ai/docs/start/express-mode/overview Authentication can be done using the following 2. Access token obtained using Google Auth client, passed to endpoint that includes full model path with project id and region 1. API Key (express mode), region and projectId will be ignored In all cases we have defined apiBase to be up to everything including the location. Standard api base: https://{location}-aiplatform.googleapis.com/v1/projects/{project}/locations/{location}/ Express api base: https://aiplatform.googleapis.com/v1/ TODO endpoints is not currently supported (api base is same as standard but we don''t have a way to add endpoint name yet Note that VertexAI uses the term "service endpoint" and "model", like: {service-endpoint}/v1/{model}:streamGenerateContent So "model" includes the project, location, publisher, etc Express mode has limited support and CRITICALLY is only available to NEW users who had NOT used cloud services before. However it is pretty common as gemini becomes more popular. Only Gemini models are supported for now https://cloud.google.com/vertex-ai/generative-ai/docs/start/express-mode/overview#models'
