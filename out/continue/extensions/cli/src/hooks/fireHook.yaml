## Roska File Descriptor — hooks/fireHook.ts
file: hooks/fireHook.ts
lines: 231
layer: logic
purpose: Convenience functions for firing hook events from integration points. These functions build the hook input with common fields and delegate to the HookService. They are safe to call even if the HookService is not yet initialized (they return no-op results).
