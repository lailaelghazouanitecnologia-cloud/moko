- name: BrowserSessionManager
  kind: struct
  ctx: Manages browser sessions for different threads. This class maintains separate browser sessions for different threads, enabling concurrent usage of browsers in multi-threaded environments. Browsers are created lazily only when needed by tools. Uses per-key events to serialize creation for the same thread_id without blocking unrelated callers or wasting resources on duplicate sessions.
