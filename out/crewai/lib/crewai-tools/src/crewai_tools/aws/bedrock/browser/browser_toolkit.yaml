- name: BrowserToolkit
  kind: struct
  ctx: 'Toolkit for navigating web with AWS Bedrock browser. This toolkit provides a set of tools for working with a remote browser and supports multiple threads by maintaining separate browser sessions for each thread ID. Browsers are created lazily only when needed. Example: ```python from crewai import Agent, Task, Crew from crewai_tools.aws.bedrock.browser import create_browser_toolkit # Create the browser toolkit toolkit, browser_tools = create_browser_toolkit(region="us-west-2") # Create a CrewAI agent that uses the browser tools research_agent = Agent( role="Web Researcher", goal="Research and summarize web content", backstory="You''re an expert at finding information online.", tools=browser_tools, ) # Create a task for the agent research_task = Task( description="Navigate to https://example.com and extract all text content. Summarize the main points.", agent=research_agent, ) # Create and run the crew crew = Crew(agents=[research_agent], tasks=[research_task]) result = crew.kickoff() # Clean up browser resources when done import asyncio asyncio.run(toolkit.cleanup()) ```'
