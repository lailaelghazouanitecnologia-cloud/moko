- name: CodeInterpreterToolkit
  kind: struct
  ctx: 'Toolkit for working with AWS Bedrock code interpreter environment. This toolkit provides a set of tools for working with a remote code interpreter environment: * execute_code - Run code in various languages (primarily Python) * execute_command - Run shell commands * read_files - Read content of files in the environment * list_files - List files in directories * delete_files - Remove files from the environment * write_files - Create or update files * start_command_execution - Start long-running commands asynchronously * get_task - Check status of async tasks * stop_task - Stop running tasks The toolkit lazily initializes the code interpreter session on first use. It supports multiple threads by maintaining separate code interpreter sessions for each thread ID. Example: ```python from crewai import Agent, Task, Crew from crewai_tools.aws.bedrock.code_interpreter import ( create_code_interpreter_toolkit, ) # Create the code interpreter toolkit toolkit, code_tools = create_code_interpreter_toolkit(region="us-west-2") # Create a CrewAI agent that uses the code interpreter tools developer_agent = Agent( role="Python Developer", goal="Create and execute Python code to solve problems", backstory="You''re a skilled Python developer with expertise in data analysis.", tools=code_tools, ) # Create a task for the agent coding_task = Task( description="Write a Python function that calculates the factorial of a number and test it.", agent=developer_agent, ) # Create and run the crew crew = Crew(agents=[developer_agent], tasks=[coding_task]) result = crew.kickoff() # Clean up resources when done import asyncio asyncio.run(toolkit.cleanup()) ```'
  fields:
