- name: StagehandTool
  kind: struct
  ctx: 'A tool that uses Stagehand to automate web browser interactions using natural language with atomic action handling. Stagehand allows AI agents to interact with websites through a browser, performing actions like clicking buttons, filling forms, and extracting data. The tool supports four main command types: 1. act - Perform actions like clicking, typing, scrolling, or navigating 2. navigate - Specifically navigate to a URL (shorthand for act with navigation) 3. extract - Extract structured data from web pages 4. observe - Identify and analyze elements on a page Usage examples: - Navigate to a website: instruction="Go to the homepage", url="https://example.com" - Click a button: instruction="Click the login button" - Fill a form: instruction="Fill the login form with username ''user'' and password ''pass''" - Extract data: instruction="Extract all product prices and names", command_type="extract" - Observe elements: instruction="Find all navigation menu items", command_type="observe" - Complex tasks: instruction="Step 1: Navigate to https://example.com; Step 2: Scroll down to the ''Features'' section; Step 3: Click ''Learn More''", command_type="act" Example of breaking down "Search for OpenAI" into multiple steps: 1. First navigation: instruction="Go to Google", url="https://google.com", command_type="navigate" 2. Enter search term: instruction="Type ''OpenAI'' in the search box", command_type="act" 3. Submit search: instruction="Press the Enter key or click the search button", command_type="act" 4. Click on result: instruction="Click on the OpenAI website link in the search results", command_type="act" (+3 dunder methods)'
