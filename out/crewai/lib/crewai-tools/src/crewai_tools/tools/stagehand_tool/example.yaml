purpose: 'StagehandTool Example This example demonstrates how to use the StagehandTool in a CrewAI workflow. It shows how to use the three main primitives: act, extract, and observe. Prerequisites: 1. A Browserbase account with API key and project ID 2. An LLM API key (OpenAI or Anthropic) 3. Installed dependencies: crewai, crewai-tools, stagehand-py Usage: - Set your API keys in environment variables (recommended) - Or modify the script to include your API keys directly - Run the script: python stagehand_example.py'
