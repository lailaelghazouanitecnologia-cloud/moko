- name: BrightDataWebUnlockerTool
  kind: struct
  ctx: 'A tool for performing web scraping using the Bright Data Web Unlocker API. This tool allows automated and programmatic access to web pages by routing requests through Bright Data''s unlocking and proxy infrastructure, which can bypass bot protection mechanisms like CAPTCHA, geo-restrictions, and anti-bot detection. Attributes: name (str): Name of the tool. description (str): Description of what the tool does. args_schema (Type[BaseModel]): Pydantic model schema for expected input arguments. base_url (str): Base URL of the Bright Data Web Unlocker API. api_key (str): Bright Data API key (must be set in the BRIGHT_DATA_API_KEY environment variable). zone (str): Bright Data zone identifier (must be set in the BRIGHT_DATA_ZONE environment variable). Methods: _run(**kwargs: Any) -> Any: Sends a scraping request to Bright Data''s Web Unlocker API and returns the result.'
