- name: DatabricksQueryTool
  kind: struct
  ctx: 'A tool for querying Databricks workspace tables using SQL. This tool executes SQL queries against Databricks tables and returns the results. It requires Databricks authentication credentials to be set as environment variables. Authentication can be provided via: - Databricks CLI profile: Set DATABRICKS_CONFIG_PROFILE environment variable - Direct credentials: Set DATABRICKS_HOST and DATABRICKS_TOKEN environment variables Example: >>> tool = DatabricksQueryTool() >>> results = tool.run(query="SELECT * FROM my_table LIMIT 10")'
