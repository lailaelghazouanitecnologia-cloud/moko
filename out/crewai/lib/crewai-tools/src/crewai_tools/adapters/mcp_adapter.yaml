- name: MCPServerAdapter
  kind: struct
  ctx: 'Manages the lifecycle of an MCP server and make its tools available to CrewAI. Note: tools can only be accessed after the server has been started with the `start()` method. Usage: # context manager + stdio with MCPServerAdapter(...) as tools: # tools is now available # context manager + sse with MCPServerAdapter({"url": "http://localhost:8000/sse"}) as tools: # tools is now available # context manager with filtered tools with MCPServerAdapter(..., "tool1", "tool2") as filtered_tools: # only tool1 and tool2 are available # context manager with custom connect timeout (60 seconds) with MCPServerAdapter(..., connect_timeout=60) as tools: # tools is now available with longer timeout # manually stop mcp server try: mcp_server = MCPServerAdapter(...) tools = mcp_server.tools  # all tools # or with filtered tools and custom timeout mcp_server = MCPServerAdapter(..., "tool1", "tool2", connect_timeout=45) filtered_tools = mcp_server.tools  # only tool1 and tool2 ... finally: mcp_server.stop() # Best practice is ensure cleanup is done after use. mcp_server.stop() # run after crew().kickoff() (+2 dunder methods)'
