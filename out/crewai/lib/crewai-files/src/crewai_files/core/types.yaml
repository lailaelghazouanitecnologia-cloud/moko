- name: BaseFile
  kind: trait
  ctx: 'Abstract base class for typed file wrappers. Provides common functionality for all file types including: - File source management - Content reading - Dict unpacking support (`**` syntax) - Per-file mode mode Can be unpacked with ** syntax: `{**ImageFile(source="./chart.png")}` which unpacks to: `{"chart": <ImageFile instance>}` using filename stem as key. Attributes: source: The underlying file source (path, bytes, or stream). mode: How to handle this file if it exceeds provider limits.'
