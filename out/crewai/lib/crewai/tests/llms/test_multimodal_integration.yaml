- name: TestAnthropicFileUploadIntegration
  kind: struct
  ctx: Integration tests for Anthropic multimodal with file_id uploads. We test file_id uploads with Anthropic because OpenAI Chat Completions API only supports file_id references for PDFs (type="file"), not images. OpenAI's Responses API supports image file_id (type="input_image"), but crewAI currently uses Chat Completions. Anthropic supports file_id for all content types including images.
  methods:
  - name: test_describe_image_with_file_id
