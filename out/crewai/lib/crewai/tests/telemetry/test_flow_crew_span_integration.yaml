## Roska File Descriptor — telemetry/test_flow_crew_span_integration.py
file: telemetry/test_flow_crew_span_integration.py
lines: 302
purpose: 'Test that crew execution spans work correctly when crews run inside flows. Note: These tests use mocked LLM responses instead of VCR cassettes because VCR''s httpx async stubs have a known incompatibility with the OpenAI client when running inside asyncio.run() (which Flow.kickoff() uses). The VCR assertion `assert not hasattr(resp, "_decoder")` fails silently when the OpenAI client reads responses before VCR can serialize them.'
