## Roska File Descriptor — embeddings/test_google_vertex_memory_integration.py
file: embeddings/test_google_vertex_memory_integration.py
lines: 171
purpose: Integration tests for Google Vertex embeddings with Crew memory. These tests make real API calls and use VCR to record/replay responses. The memory save path (extract_memories + remember) requires LLM and embedding API calls that are difficult to capture in VCR cassettes (GCP metadata auth, embedding endpoints). We mock those paths and verify the crew pipeline works end-to-end while testing memory storage separately with a fake embedder.
