- name: AgentExecutor
  kind: struct
  ctx: 'Agent Executor for both standalone agents and crew-bound agents. Inherits from: - Flow[AgentExecutorState]: Provides flow orchestration capabilities - CrewAgentExecutorMixin: Provides memory methods (short/long/external term) This executor can operate in two modes: - Standalone mode: When crew and task are None (used by Agent.kickoff()) - Crew mode: When crew and task are provided (used by Agent.execute_task()) Note: Multiple instances may be created during agent initialization (cache setup, RPM controller setup, etc.) but only the final instance should execute tasks via invoke().'
