types:
- name: LiteAgent
  kind: model
  ctx: 'A lightweight agent that can process messages and use tools. .. deprecated:: LiteAgent is deprecated and will be removed in a future version. Use ``Agent().kickoff(messages)`` instead, which provides the same functionality with additional features like memory and knowledge support. This agent is simpler than the full Agent class, focusing on direct execution rather than task delegation. It''s designed to be used for simple interactions where a full crew is not needed. Attributes: role: The role of the agent. goal: The objective of the agent. backstory: The backstory of the agent. llm: The language model that will run the agent. tools: Tools at the agent''s disposal. verbose: Whether the agent execution should be in verbose mode. max_iterations: Maximum number of iterations for tool usage. max_execution_time: Maximum execution time in seconds. response_format: Optional Pydantic model for structured output.'
