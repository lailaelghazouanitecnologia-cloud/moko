## Roska File Descriptor — memory/encoding_flow.py
file: memory/encoding_flow.py
lines: 505
purpose: 'Batch-native encoding flow: full save pipeline for one or more memories. Orchestrates the encoding side of memory in a single Flow with 5 steps: 1. Batch embed (ONE embedder call for all items) 2. Intra-batch dedup (cosine matrix, drop near-exact duplicates) 3. Parallel find similar (concurrent storage searches) 4. Parallel analyze (N concurrent LLM calls -- field resolution + consolidation) 5. Execute plans (batch re-embed updates + bulk insert)'
