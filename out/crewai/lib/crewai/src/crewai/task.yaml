types:
- name: Task
  kind: model
  ctx: 'Class that represents a task to be executed. Each task must have a description, an expected output and an agent responsible for execution. Attributes: agent: Agent responsible for task execution. Represents entity performing task. async_execution: Boolean flag indicating asynchronous task execution. callback: Function/object executed post task completion for additional actions. config: Dictionary containing task-specific configuration parameters. context: List of Task instances providing task context or input data. description: Descriptive text detailing task''s purpose and execution. expected_output: Clear definition of expected task outcome. output_file: File path for storing task output. create_directory: Whether to create the directory for output_file if it doesn''t exist. output_json: Pydantic model for structuring JSON output. output_pydantic: Pydantic model for task output. security_config: Security configuration including fingerprinting. tools: List of tools/resources limited for task execution. allow_crewai_trigger_context: Optional flag to control crewai_trigger_payload injection. None (default): Auto-inject for first task only. True: Always inject trigger payload for this task. False: Never inject trigger payload, even for first task. (+1 dunder methods)'
