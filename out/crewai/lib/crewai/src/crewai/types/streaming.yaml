  ctx: 'Streaming output wrapper for crew execution. Provides both sync and async iteration over stream chunks, with access to the final CrewOutput via the .result property. For kickoff_for_each_async with streaming, use .results to get list of outputs. Example: ```python # Single crew streaming = crew.kickoff(inputs={"topic": "AI"}) for chunk in streaming: print(chunk.content, end="", flush=True) result = streaming.result # Multiple crews (kickoff_for_each_async) streaming = await crew.kickoff_for_each_async( [{"topic": "AI"}, {"topic": "ML"}] ) async for chunk in streaming: print(chunk.content, end="", flush=True) results = streaming.results  # List of CrewOutput ``` (+1 dunder methods)'
