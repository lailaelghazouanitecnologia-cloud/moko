purpose: Native MCP tool wrapper for CrewAI agents. This module provides a tool wrapper that creates a fresh MCP client for every invocation, ensuring safe parallel execution even when the same tool is called concurrently by the executor.
imports:
- sym: asyncio
- sym: contextvars
