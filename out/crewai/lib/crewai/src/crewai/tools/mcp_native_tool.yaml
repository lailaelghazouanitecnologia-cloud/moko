types:
- name: MCPNativeTool
  kind: struct
  ctx: Native MCP tool that creates a fresh client per invocation. A ``client_factory`` callable produces an independent ``MCPClient`` + transport for every ``_run_async`` call.  This guarantees that parallel invocations -- whether of the *same* tool or *different* tools from the same server -- never share mutable connection state (which would cause anyio cancel-scope errors).
