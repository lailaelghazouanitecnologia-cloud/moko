- name: ServerExtension
  kind: trait
  ctx: 'Base class for A2A protocol server extensions. Subclass this to create custom extensions that modify agent behavior when clients activate them. Extensions are identified by URI and can be marked as required. Example: class SamplingExtension(ServerExtension): uri = "urn:crewai:ext:sampling/v1" required = True def __init__(self, max_tokens: int = 4096): self.max_tokens = max_tokens @property def params(self) -> dict[str, Any]: return {"max_tokens": self.max_tokens} async def on_request(self, context: ExtensionContext) -> None: limit = context.get_extension_metadata(self.uri, "limit") if limit: context.state["token_limit"] = int(limit) async def on_response(self, context: ExtensionContext, result: Any) -> Any: return result'
