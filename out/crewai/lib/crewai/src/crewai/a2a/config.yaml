- name: ClientTransportConfig
  kind: model
  ctx: 'Transport configuration for A2A client. Groups all client transport-related settings including preferred transport, supported transports for negotiation, and protocol-specific configurations. Transport negotiation logic: 1. If `preferred` is set and server supports it → use client''s preferred 2. Otherwise, if server''s preferred is in client''s `supported` → use server''s preferred 3. Otherwise, find first match from client''s `supported` in server''s interfaces Attributes: preferred: Client''s preferred transport. If set, client preference takes priority. supported: Transports the client can use, in order of preference. jsonrpc: JSON-RPC client transport configuration. grpc: gRPC client transport configuration.'
  bases:
  - BaseModel
  fields:
  - name: model_config
    type: Any
    default: ClassVar[ConfigDict]
  - name: preferred
    type: Any
    default: TransportType | None
  - name: supported
