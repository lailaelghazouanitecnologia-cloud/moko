purpose: 'AgentCard JWS signing utilities. This module provides functions for signing and verifying AgentCards using JSON Web Signatures (JWS) as per RFC 7515. Signed agent cards allow clients to verify the authenticity and integrity of agent card information. Example: >>> from crewai.a2a.utils.agent_card_signing import sign_agent_card >>> signature = sign_agent_card(agent_card, private_key_pem, key_id="key-1") >>> card_with_sig = card.model_copy(update={"signatures": [signature]})'
