purpose: 'A2A error codes and error response utilities. This module provides a centralized mapping of all A2A protocol error codes as defined in the A2A specification, plus custom CrewAI extensions. Error codes follow JSON-RPC 2.0 conventions: - -32700 to -32600: Standard JSON-RPC errors - -32099 to -32000: Server errors (A2A-specific) - -32768 to -32100: Reserved for implementation-defined errors'
