- name: OAuth2ServerAuth
  kind: struct
  ctx: 'OAuth2 authentication for A2A server. Declares OAuth2 security scheme in AgentCard and validates tokens using either JWKS for JWT tokens or token introspection for opaque tokens. This is distinct from OIDCAuth in that it declares an explicit OAuth2SecurityScheme with flows, rather than an OpenIdConnectSecurityScheme with discovery URL. Attributes: token_url: OAuth2 token endpoint URL for client_credentials flow. authorization_url: OAuth2 authorization endpoint for authorization_code flow. refresh_url: Optional refresh token endpoint URL. scopes: Available OAuth2 scopes with descriptions. jwks_url: JWKS URL for JWT validation. Required if not using introspection. introspection_url: Token introspection endpoint (RFC 7662). Alternative to JWKS. introspection_client_id: Client ID for introspection endpoint authentication. introspection_client_secret: Client secret for introspection endpoint. audience: Expected audience claim for JWT validation. issuer: Expected issuer claim for JWT validation. algorithms: Allowed JWT signing algorithms. required_claims: Claims that must be present in the token. jwks_cache_ttl: TTL for JWKS cache in seconds. clock_skew_seconds: Allowed clock skew for token validation.'
