- name: StepObservation
  kind: model
  ctx: 'Planner''s observation after a step execution completes. Returned by the PlannerObserver after EVERY step — not just failures. The Planner uses this to decide whether to continue, refine, or replan. Based on PLAN-AND-ACT (Section 3.3): the Planner observes what the Executor did and incorporates new information into the remaining plan. Attributes: step_completed_successfully: Whether the step achieved its objective. key_information_learned: New information revealed by this step (e.g., "Found 3 products: A, B, C"). Used to refine upcoming steps. remaining_plan_still_valid: Whether pending todos still make sense given the new information. True does NOT mean no refinement needed. suggested_refinements: Structured in-place updates to pending step descriptions. Each entry targets a specific step by number. These are applied directly without a second LLM call. Example: [{"step_number": 3, "new_description": "Select product B (highest rated)"}] needs_full_replan: The remaining plan is fundamentally wrong and must be regenerated from scratch. Mutually exclusive with remaining_plan_still_valid (if this is True, that should be False). replan_reason: Explanation of why a full replan is needed (None if not). goal_already_achieved: The overall task goal has been satisfied early. No more steps needed — skip remaining todos and finalize.'
  bases:
  - BaseModel
  fields:
  - name: step_completed_successfully
    type: Any
    default: bool
  - name: key_information_learned
    type: Any
    default: str
  - name: remaining_plan_still_valid
    type: Any
    default: bool
  - name: suggested_refinements
    type: Any
    default: list[StepRefinement] | None
  - name: needs_full_replan
    type: Any
    default: bool
  - name: replan_reason
    type: Any
