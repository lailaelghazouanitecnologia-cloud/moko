  purpose: Dynamic Pydantic model creation from JSON schemas. This module provides utilities for converting JSON schemas to Pydantic models at runtime. The main function is `create_model_from_schema`, which takes a JSON schema and returns a dynamically created Pydantic model class. This is used by the A2A server to honor response schemas sent by clients, allowing structured output from agent tasks. Based on dydantic (https://github.com/zenbase-ai/dydantic). This module provides functions for converting Pydantic models to JSON schemas suitable for use with LLMs and tool definitions.
