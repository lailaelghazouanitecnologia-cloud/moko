purpose: Context and result types for isolated step execution in Plan-and-Execute architecture. These types mediate between the AgentExecutor (orchestrator) and StepExecutor (per-step worker). StepExecutionContext carries only final results from dependencies — never LLM message histories. StepResult carries only the outcome of a step — never internal execution traces.
