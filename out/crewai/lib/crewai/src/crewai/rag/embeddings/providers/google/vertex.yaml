  ctx: 'Google Vertex AI embeddings provider with dual SDK support. Supports both legacy models (textembedding-gecko*) using the deprecated vertexai.language_models SDK and new models (gemini-embedding-*, text-embedding-*) using the google-genai SDK. The SDK is automatically selected based on the model name. Legacy models will emit a deprecation warning. Authentication modes: 1. Vertex AI backend: Set project_id and location/region (uses Application Default Credentials) 2. API key: Set api_key for direct API access (new SDK models only) Example: # Legacy model (backwards compatible, will emit deprecation warning) provider = VertexAIProvider( project_id="my-project", region="us-central1",  # or location="us-central1" model_name="textembedding-gecko" ) # New model with Vertex AI backend provider = VertexAIProvider( project_id="my-project", location="us-central1", model_name="gemini-embedding-001" ) # New model with API key provider = VertexAIProvider( api_key="your-api-key", model_name="gemini-embedding-001" )'
