- name: GoogleGenAIVertexEmbeddingFunction
  kind: struct
  ctx: 'Embedding function for Google Vertex AI with dual SDK support. This class supports both: - Legacy models (textembedding-gecko*) using the deprecated vertexai.language_models SDK - New models (gemini-embedding-*, text-embedding-*) using the google-genai SDK The SDK is automatically selected based on the model name. Legacy models will emit a deprecation warning. Supports two authentication modes: 1. Vertex AI backend: Set project_id and location/region (uses Application Default Credentials) 2. API key: Set api_key for direct API access Example: # Using legacy model (will emit deprecation warning) embedder = GoogleGenAIVertexEmbeddingFunction( project_id="my-project", region="us-central1", model_name="textembedding-gecko" ) # Using new model with google-genai SDK embedder = GoogleGenAIVertexEmbeddingFunction( project_id="my-project", location="us-central1", model_name="gemini-embedding-001" ) # Using API key (new SDK only) embedder = GoogleGenAIVertexEmbeddingFunction( api_key="your-api-key", model_name="gemini-embedding-001" )'
