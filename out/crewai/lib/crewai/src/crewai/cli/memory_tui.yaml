  - name: CSS
    type: str
    default: |-
      f"""
          Header {{
              background: {_PRIMARY};
              color: {_TERTIARY};
          }}
          Footer {{
              background: {_SECONDARY};
              color: {_TERTIARY};
          }}
          Footer > .footer-key--key {{
              background: {_PRIMARY};
              color: {_TERTIARY};
          }}
          Horizontal {{
              height: 1fr;
          }}
          #scope-tree {{
              width: 30%;
              padding: 1 2;
              background: {_SECONDARY} 8%;
              border-right: solid {_SECONDARY};
          }}
          #scope-tree:focus > .tree--cursor {{
              background: {_SECONDARY};
              color: {_TERTIARY};
          }}
          #scope-tree > .tree--guides {{
              color: {_SECONDARY} 50%;
          }}
          #scope-tree > .tree--guides-hover {{
              color: {_PRIMARY};
          }}
          #scope-tree > .tree--guides-selected {{
              color: {_SECONDARY};
          }}
          #right-panel {{
              width: 70%;
              padding: 0 1;
          }}
          #info-panel {{
              height: 2fr;
              padding: 1 2;
              overflow-y: auto;
              border: round {_SECONDARY};
          }}
          #info-panel:focus {{
              border: round {_PRIMARY};
          }}
          #info-panel LoadingIndicator {{
              color: {_PRIMARY};
          }}
          #entry-list {{
              height: 1fr;
              border: round {_SECONDARY};
              padding: 0 1;
              scrollbar-color: {_PRIMARY};
          }}
          #entry-list:focus {{
              border: round {_PRIMARY};
          }}
          #entry-list > .option-list--option-highlighted {{
              background: {_SECONDARY};
              color: {_TERTIARY};
          }}
          #recall-input {{
              margin: 0 1 1 1;
              border: tall {_SECONDARY};
          }}
          #recall-input:focus {{
              border: tall {_PRIMARY};
          }}
          """
