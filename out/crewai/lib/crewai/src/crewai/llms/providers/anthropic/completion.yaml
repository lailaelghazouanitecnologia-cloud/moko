- name: AnthropicToolSearchConfig
  kind: model
  ctx: 'Configuration for Anthropic''s server-side tool search. When enabled, tools marked with defer_loading=True are not loaded into context immediately. Instead, Claude uses the tool search tool to dynamically discover and load relevant tools on-demand. Attributes: type: The tool search variant to use. - "regex": Claude constructs regex patterns to search tool names/descriptions. - "bm25": Claude uses natural language queries to search tools.'
  bases:
  - BaseModel
