- name: BedrockCompletion
  kind: struct
  ctx: 'AWS Bedrock native completion implementation using the Converse API. This class provides direct integration with AWS Bedrock using the modern Converse API, which provides a unified interface across all Bedrock models. Features: - Full tool calling support with proper conversation continuation - Streaming and non-streaming responses with comprehensive event handling - Guardrail configuration for content filtering - Model-specific parameters via additionalModelRequestFields - Custom response field extraction - Proper error handling for all AWS exception types - Token usage tracking and stop reason logging - Support for both text and tool use content blocks The implementation follows AWS Bedrock Converse API best practices including: - Proper tool use ID tracking for multi-turn tool conversations - Complete streaming event handling (messageStart, contentBlockStart, etc.) - Response metadata and trace information capture - Model-specific conversation format handling (e.g., Cohere requirements)'
  bases:
  - BaseLLM
