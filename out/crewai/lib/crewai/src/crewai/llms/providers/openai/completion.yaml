- name: OpenAICompletion
  kind: struct
  ctx: 'OpenAI native completion implementation. This class provides direct integration with the OpenAI Python SDK, supporting both Chat Completions API and Responses API. The Responses API is OpenAI''s newer API primitive with built-in tools (web search, file search, code interpreter), stateful conversations, and improved reasoning model support. Args: api: Which OpenAI API to use - "completions" (default) or "responses". instructions: System-level instructions (Responses API only). store: Whether to store responses for multi-turn (Responses API only). previous_response_id: ID of previous response for multi-turn (Responses API only). include: Additional data to include in response (Responses API only). builtin_tools: List of OpenAI built-in tools to enable (Responses API only). Supported: "web_search", "file_search", "code_interpreter", "computer_use". parse_tool_outputs: Whether to return structured ResponsesAPIResult with parsed built-in tool outputs instead of just text (Responses API only). auto_chain: Automatically track and use response IDs for multi-turn conversations (Responses API only). When True, each response ID is saved and used as previous_response_id in subsequent calls. auto_chain_reasoning: Automatically track and pass encrypted reasoning items for ZDR (Zero Data Retention) compliance (Responses API only). When True, adds "reasoning.encrypted_content" to include, captures reasoning items from responses, and passes them back in subsequent calls to preserve chain-of-thought without storing data on OpenAI servers.'
