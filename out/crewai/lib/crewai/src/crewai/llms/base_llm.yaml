types:
- name: BaseLLM
  kind: trait
  ctx: 'Abstract base class for LLM implementations. This class defines the interface that all LLM implementations must follow. Users can extend this class to create custom LLM implementations that don''t rely on litellm''s authentication mechanism. Custom LLM implementations should handle error cases gracefully, including timeouts, authentication failures, and malformed responses. They should also implement proper validation for input parameters and provide clear error messages when things go wrong. Attributes: model: The model identifier/name. temperature: Optional temperature setting for response generation. stop: A list of stop sequences that the LLM should use to stop generation. additional_params: Additional provider-specific parameters.'
