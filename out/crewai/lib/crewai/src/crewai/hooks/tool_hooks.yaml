types:
- name: ToolCallHookContext
  kind: struct
  ctx: 'Context object passed to tool call hooks. Provides hooks with access to the tool being called, its input, the agent/task/crew context, and the result (for after hooks). Attributes: tool_name: Name of the tool being called tool_input: Tool input parameters (mutable dict). Can be modified in-place by before_tool_call hooks. IMPORTANT: Modify in-place (e.g., context.tool_input[''key''] = value). Do NOT replace the dict (e.g., context.tool_input = {}), as this will not affect the actual tool execution. tool: Reference to the CrewStructuredTool instance agent: Agent executing the tool (may be None) task: Current task being executed (may be None) crew: Crew instance (may be None) tool_result: Tool execution result (only set for after_tool_call hooks). Can be modified by returning a new string from after_tool_call hook.'
