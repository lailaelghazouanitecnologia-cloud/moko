types:
- name: LLMCallHookContext
  kind: struct
  ctx: 'Context object passed to LLM call hooks. Provides hooks with complete access to the execution state, allowing modification of messages, responses, and executor attributes. Supports both executor-based calls (agents in crews/flows) and direct LLM calls. Attributes: executor: Reference to the executor (CrewAgentExecutor/LiteAgent) or None for direct calls messages: Direct reference to messages (mutable list). Can be modified in both before_llm_call and after_llm_call hooks. Modifications in after_llm_call hooks persist to the next iteration, allowing hooks to modify conversation history for subsequent LLM calls. IMPORTANT: Modify messages in-place (e.g., append, extend, remove items). Do NOT replace the list (e.g., context.messages = []), as this will break the executor. Use context.messages.append() or context.messages.extend() instead of assignment. agent: Reference to the agent executing the task (None for direct LLM calls) task: Reference to the task being executed (None for direct LLM calls or LiteAgent) crew: Reference to the crew instance (None for direct LLM calls or LiteAgent) llm: Reference to the LLM instance iterations: Current iteration count (0 for direct LLM calls) response: LLM response string (only set for after_llm_call hooks). Can be modified by returning a new string from after_llm_call hook.'
  fields:
  - name: executor
    type: Any
    default: CrewAgentExecutor | AgentExecutor | LiteAgent | None
  - name: messages
    type: Any
    default: list[LLMMessage]
  - name: agent
    type: Any
    default: Any
  - name: task
    type: Any
    default: Any
  - name: crew
    type: Any
    default: Any
  - name: llm
    type: Any
    default: BaseLLM | None | str | Any
  - name: iterations
    type: Any
    default: int
  - name: response
    type: Any
    default: str | None
