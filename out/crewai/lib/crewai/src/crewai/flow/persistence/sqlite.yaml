types:
- name: SQLiteFlowPersistence
  kind: struct
  ctx: 'SQLite-based implementation of flow state persistence. This class provides a simple, file-based persistence implementation using SQLite. It''s suitable for development and testing, or for production use cases with moderate performance requirements. This implementation supports async human feedback by storing pending feedback context in a separate table. When a flow is paused waiting for feedback, use save_pending_feedback() to persist the context. Later, use load_pending_feedback() to retrieve it when resuming. Example: ```python persistence = SQLiteFlowPersistence("flows.db") # Start a flow with async feedback try: flow = MyFlow(persistence=persistence) result = flow.kickoff() except HumanFeedbackPending as e: # Flow is paused, state is already persisted print(f"Waiting for feedback: {e.context.flow_id}") # Later, resume with feedback flow = MyFlow.from_pending("abc-123", persistence) result = flow.resume("looks good!") ```'
