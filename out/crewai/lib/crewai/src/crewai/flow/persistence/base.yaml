- name: FlowPersistence
  kind: trait
  ctx: 'Abstract base class for flow state persistence. This class defines the interface that all persistence implementations must follow. It supports both structured (Pydantic BaseModel) and unstructured (dict) states. For async human feedback support, implementations can optionally override: - save_pending_feedback(): Saves state with pending feedback context - load_pending_feedback(): Loads state and pending feedback context - clear_pending_feedback(): Clears pending feedback after resume'
