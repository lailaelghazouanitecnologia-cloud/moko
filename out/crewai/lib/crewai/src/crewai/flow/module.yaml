  purpose: 'Input provider protocol for Flow.ask(). This module provides the InputProvider protocol and InputResponse dataclass used by Flow.ask() to request input from users during flow execution. The default implementation is ``ConsoleProvider`` (from ``crewai.flow.async_feedback.providers``), which serves both feedback and input collection via console. Example (default console input): ```python from crewai.flow import Flow, start class MyFlow(Flow): @start() def gather_info(self): topic = self.ask("What topic should we research?") return topic ``` Example (custom provider with metadata): ```python from crewai.flow import Flow, start from crewai.flow.input_provider import InputProvider, InputResponse class SlackProvider: def request_input(self, message, flow, metadata=None): channel = metadata.get("channel", "#general") if metadata else "#general" thread = self.post_question(channel, message) reply = self.wait_for_reply(thread) return InputResponse( text=reply.text, metadata={"responded_by": reply.user_id, "thread_id": thread.id}, ) class MyFlow(Flow): input_provider = SlackProvider() @start() def gather_info(self): topic = self.ask("What topic?", metadata={"channel": "#research"}) return topic ```'
