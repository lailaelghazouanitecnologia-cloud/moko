purpose: Default provider implementations for human feedback and user input. This module provides the ConsoleProvider, which is the default synchronous provider that collects both feedback (for ``@human_feedback``) and user input (for ``Flow.ask()``) via console.
imports:
- sym: crewai.flow.async_feedback.types.PendingFeedbackContext
types:
- name: ConsoleProvider
  kind: struct
  ctx: 'Default synchronous console-based provider for feedback and input. This provider blocks execution and waits for console input from the user. It serves two purposes: - **Feedback** (``request_feedback``): Used by ``@human_feedback`` to display method output and collect review feedback. - **Input** (``request_input``): Used by ``Flow.ask()`` to prompt the user with a question and collect a response. This is the default provider used when no custom provider is specified in the ``@human_feedback`` decorator or on the Flow''s ``input_provider``. Example (feedback): ```python from crewai.flow.async_feedback import ConsoleProvider @human_feedback( message="Review this:", provider=ConsoleProvider(), ) def my_method(self): return "Content to review" ``` Example (input): ```python from crewai.flow import Flow, start class MyFlow(Flow): @start() def gather_info(self): topic = self.ask("What topic should we research?") return topic ```'
