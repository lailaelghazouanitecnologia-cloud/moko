purpose: Core types for async human feedback in Flows. This module defines the protocol, exception, and context types used for non-blocking human-in-the-loop workflows.
types:
- name: HumanFeedbackPending
  kind: struct
  ctx: 'Signal that flow execution should pause for async human feedback. When raised by a provider, the flow framework will: 1. Stop execution at the current method 2. Automatically persist state and context (if persistence is configured) 3. Return this object to the caller (not re-raise it) The caller receives this as a return value from `flow.kickoff()`, enabling graceful handling of the paused state without try/except blocks: ```python result = flow.kickoff() if isinstance(result, HumanFeedbackPending): # Flow is paused, handle async feedback print(f"Waiting for feedback: {result.context.flow_id}") else: # Normal completion print(f"Flow completed: {result}") ``` Note: The flow framework automatically saves pending feedback when this exception is raised. Providers do NOT need to call `save_pending_feedback` manually - just raise this exception and the framework handles persistence. Attributes: context: The PendingFeedbackContext with all details needed to resume callback_info: Optional dict with information for external systems (e.g., webhook URL, ticket ID, Slack thread ID) Example: ```python class SlackProvider(HumanFeedbackProvider): def request_feedback(self, context, flow): # Send notification to external system ticket_id = self.create_slack_thread(context) # Raise to pause - framework handles persistence automatically raise HumanFeedbackPending( context=context, callback_info={ "slack_channel": "#reviews", "thread_id": ticket_id, }, ) ```'
