## Roska File Descriptor — flow/utils.py
file: flow/utils.py
lines: 969
purpose: Utility functions for flow visualization and dependency analysis. This module provides core functionality for analyzing and manipulating flow structures, including node level calculation, ancestor tracking, and return value analysis. Functions in this module are primarily used by the visualization system to create accurate and informative flow diagrams. Example ------- >>> flow = Flow() >>> node_levels = calculate_node_levels(flow) >>> ancestors = build_ancestor_dict(flow)
