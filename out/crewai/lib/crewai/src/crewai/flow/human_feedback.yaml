## Roska File Descriptor — flow/human_feedback.py
file: flow/human_feedback.py
lines: 577
purpose: 'Human feedback decorator for Flow methods. This module provides the @human_feedback decorator that enables human-in-the-loop workflows within CrewAI Flows. It allows collecting human feedback on method outputs and optionally routing to different listeners based on the feedback. Supports both synchronous (blocking) and asynchronous (non-blocking) feedback collection through the provider parameter. Example (synchronous, default): ```python from crewai.flow import Flow, start, listen, human_feedback class ReviewFlow(Flow): @start() @human_feedback( message="Please review this content:", emit=["approved", "rejected"], llm="gpt-4o-mini", ) def generate_content(self): return {"title": "Article", "body": "Content..."} @listen("approved") def publish(self): result = self.human_feedback print(f"Publishing: {result.output}") ``` Example (asynchronous with custom provider): ```python from crewai.flow import Flow, start, human_feedback from crewai.flow.async_feedback import HumanFeedbackProvider, HumanFeedbackPending class SlackProvider(HumanFeedbackProvider): def request_feedback(self, context, flow): self.send_notification(context) raise HumanFeedbackPending(context=context) class ReviewFlow(Flow): @start() @human_feedback( message="Review this:", emit=["approved", "rejected"], llm="gpt-4o-mini", provider=SlackProvider(), ) def generate_content(self): return "Content..." ```'
