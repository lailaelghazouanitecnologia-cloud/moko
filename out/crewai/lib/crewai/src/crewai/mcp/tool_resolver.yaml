file: mcp/tool_resolver.py
lines: 622
purpose: 'MCP tool resolution for CrewAI agents. This module extracts all MCP-related tool resolution logic from the Agent class into a standalone MCPToolResolver. It handles three flavours of MCP reference: 1. Native configs:   MCPServerStdio / MCPServerHTTP / MCPServerSSE objects. 2. HTTPS URLs:       e.g. "https://mcp.example.com/api" 3. AMP references:   e.g. "notion" or "notion#search" (legacy "crewai-amp:" prefix also works)'
