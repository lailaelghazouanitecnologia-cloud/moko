types:
- name: MCPToolResolver
  kind: struct
  ctx: 'Resolves MCP server references / configs into CrewAI ``BaseTool`` instances. Typical lifecycle:: resolver = MCPToolResolver(agent=my_agent, logger=my_agent._logger) tools = resolver.resolve(my_agent.mcps) # … agent executes tasks using *tools* … resolver.cleanup() The resolver owns the MCP client connections it creates and is responsible for tearing them down via :meth:`cleanup`.'
