types:
- name: CrewAIEventsBus
  kind: struct
  ctx: 'Singleton event bus for handling events in CrewAI. This class manages event registration and emission for both synchronous and asynchronous event handlers, automatically scheduling async handlers in a dedicated background event loop. Synchronous handlers execute in a thread pool executor to ensure completion before program exit. Asynchronous handlers execute in a dedicated event loop running in a daemon thread, with graceful shutdown waiting for completion. Attributes: _instance: Singleton instance of the event bus _instance_lock: Reentrant lock for singleton initialization (class-level) _rwlock: Read-write lock for handler registration and access (instance-level) _sync_handlers: Mapping of event types to registered synchronous handlers _async_handlers: Mapping of event types to registered asynchronous handlers _sync_executor: Thread pool executor for running synchronous handlers _loop: Dedicated asyncio event loop for async handler execution _loop_thread: Background daemon thread running the event loop _console: Console formatter for error output'
