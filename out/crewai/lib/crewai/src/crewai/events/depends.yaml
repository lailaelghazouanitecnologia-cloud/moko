- name: Depends
  kind: struct
  ctx: 'Declares a dependency on another event handler. Similar to FastAPI''s Depends, this allows handlers to specify that they depend on other handlers completing first. Handlers with dependencies will execute after their dependencies, while independent handlers can run in parallel. Args: handler: The handler function that this handler depends on Example: >>> from crewai.events import Depends, crewai_event_bus >>> from crewai.events import LLMCallStartedEvent >>> @crewai_event_bus.on(LLMCallStartedEvent) >>> def setup_context(source, event): ...     return {"initialized": True} >>> >>> @crewai_event_bus.on(LLMCallStartedEvent, depends_on=Depends(setup_context)) >>> def process(source, event): ...     # Runs after setup_context completes ...     pass (+3 dunder methods)'
