types:
- name: StepExecutor
  kind: struct
  ctx: 'Executes a SINGLE todo item using direct-action execution. The StepExecutor owns its own message list per invocation. It never reads or writes the AgentExecutor''s state. Results flow back via StepResult. Execution pattern (per Plan-and-Act, arxiv 2503.09572): 1. Build messages from todo + context 2. Call LLM once (with or without native tools) 3. If tool call → execute it → return tool result 4. If text answer → return it directly No inner loop — recovery is PlannerObserver''s responsibility. Args: llm: The language model to use for execution. tools: Structured tools available to the executor. agent: The agent instance (for role/goal/verbose/config). original_tools: Original BaseTool instances (needed for native tool schema). tools_handler: Optional tools handler for caching and delegation tracking. task: Optional task context. crew: Optional crew context. function_calling_llm: Optional separate LLM for function calling. request_within_rpm_limit: Optional RPM limit function. callbacks: Optional list of callbacks. i18n: Optional i18n instance.'
