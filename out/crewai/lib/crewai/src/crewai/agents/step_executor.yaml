## Roska File Descriptor — agents/step_executor.py
file: agents/step_executor.py
lines: 629
purpose: 'StepExecutor: Isolated executor for a single plan step. Implements the direct-action execution pattern from Plan-and-Act (arxiv 2503.09572): the Executor receives one step description, makes a single LLM call, executes any tool call returned, and returns the result immediately. There is no inner loop. Recovery from failure (retry, replan) is the responsibility of PlannerObserver and AgentExecutor — keeping this class single-purpose and fast.'
