- name: BaseAgent
  kind: trait
  ctx: 'Abstract Base Class for all third party agents compatible with CrewAI. Attributes: id (UUID4): Unique identifier for the agent. role (str): Role of the agent. goal (str): Objective of the agent. backstory (str): Backstory of the agent. cache (bool): Whether the agent should use a cache for tool usage. config (dict[str, Any] | None): Configuration for the agent. verbose (bool): Verbose mode for the Agent Execution. max_rpm (int | None): Maximum number of requests per minute for the agent execution. allow_delegation (bool): Allow delegation of tasks to agents. tools (list[Any] | None): Tools at the agent''s disposal. max_iter (int): Maximum iterations for an agent to execute a task. agent_executor: An instance of the CrewAgentExecutor class. llm (Any): Language model that will run the agent. crew (Any): Crew to which the agent belongs. i18n (I18N): Internationalization settings. cache_handler ([CacheHandler]): An instance of the CacheHandler class. tools_handler ([ToolsHandler]): An instance of the ToolsHandler class. max_tokens: Maximum number of tokens for the agent to generate in a response. knowledge_sources: Knowledge sources for the agent. knowledge_storage: Custom knowledge storage for the agent. security_config: Security configuration for the agent, including fingerprinting. apps: List of enterprise applications that the agent can access through CrewAI AMP Tools. Methods: execute_task(task: Any, context: str | None = None, tools: list[BaseTool] | None = None) -> str: Abstract method to execute a task. create_agent_executor(tools=None) -> None: Abstract method to create an agent executor. get_delegation_tools(agents: list["BaseAgent"]): Abstract method to set the agents task tools for handling delegation and question asking to other agents in crew. get_platform_tools(apps: list[PlatformAppOrAction]): Abstract method to get platform tools for the specified list of applications and/or application/action combinations. get_output_converter(llm, model, instructions): Abstract method to get the converter class for the agent to create json/pydantic outputs. interpolate_inputs(inputs: dict[str, Any]) -> None: Interpolate inputs into the agent description and backstory. set_cache_handler(cache_handler: CacheHandler) -> None: Set the cache handler for the agent. copy() -> "BaseAgent": Create a copy of the agent. set_rpm_controller(rpm_controller: RPMController) -> None: Set the rpm controller for the agent. set_private_attrs() -> "BaseAgent": Set private attributes.'
