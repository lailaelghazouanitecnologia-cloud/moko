  ctx: 'Observes step execution results and decides on plan continuation. After EVERY step execution, this class: 1. Analyzes what the step accomplished 2. Identifies new information learned 3. Decides if the remaining plan is still valid 4. Suggests lightweight refinements or triggers full replanning LLM resolution (magical fallback): - If ``agent.planning_config.llm`` is explicitly set → use that - Otherwise → fall back to ``agent.llm`` (same LLM for everything) Args: agent: The agent instance (for LLM resolution and config). task: Optional task context (for description and expected output).'
