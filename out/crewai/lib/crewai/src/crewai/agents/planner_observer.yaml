purpose: 'PlannerObserver: Observation phase after each step execution. Implements the "Observe" phase. After every step execution, the Planner analyzes what happened, what new information was learned, and whether the remaining plan is still valid. This is NOT an error detector — it runs on every step, including successes, to incorporate runtime observations into the remaining plan. Refinements are structured (StepRefinement objects) and applied directly from the observation result — no second LLM call required.'
