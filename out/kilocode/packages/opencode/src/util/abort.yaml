purpose: Creates an AbortController that automatically aborts after a timeout. Uses bind() instead of arrow functions to avoid capturing the surrounding scope in closures. Arrow functions like `() => controller.abort()` capture request bodies and other large objects, preventing GC for the timer lifetime.
