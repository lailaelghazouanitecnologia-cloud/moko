## Roska File Descriptor — addons/serialize.ts
file: addons/serialize.ts
lines: 634
purpose: 'SerializeAddon - Serialize terminal buffer contents Port of xterm.js addon-serialize for ghostty-web. Enables serialization of terminal contents to a string that can be written back to restore terminal state. Usage: ```typescript const serializeAddon = new SerializeAddon(); term.loadAddon(serializeAddon); const content = serializeAddon.serialize(); ```'
