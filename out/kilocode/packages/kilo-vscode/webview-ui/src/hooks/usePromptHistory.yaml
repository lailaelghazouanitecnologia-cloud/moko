purpose: Prompt history navigation hook. Arrow Up/Down at cursor boundaries cycles through previously sent prompts, matching the behavior of the CLI TUI and the desktop app. Entries persist via localStorage (same pattern as the desktop app's Persist.global), surviving webview hide/show cycles.
