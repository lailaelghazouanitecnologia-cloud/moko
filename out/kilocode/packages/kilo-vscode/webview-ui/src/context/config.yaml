purpose: Config context Manages backend configuration state (permissions, agents, providers, etc.) and exposes an updateConfig method to apply partial updates. Changes are accumulated in a local draft and only sent to the extension when saveConfig() is called. This allows batching multiple settings changes into a single write (which triggers disposeAll on the CLI).
