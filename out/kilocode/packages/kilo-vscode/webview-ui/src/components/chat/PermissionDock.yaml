file: chat/PermissionDock.tsx
lines: 265
layer: logic
purpose: PermissionDock component Displays permission requests from the AI assistant in the dock above the prompt input. Uses kilo-ui's DockPrompt component for proper surface styling. Per-rule toggles allow users to approve/deny individual permission rules for future requests. For bash, the hierarchical rules from metadata.rules are shown. For other tools, the always array is shown so users can configure per-tool permissions. The command buttons (Deny / Run) control the current command.
