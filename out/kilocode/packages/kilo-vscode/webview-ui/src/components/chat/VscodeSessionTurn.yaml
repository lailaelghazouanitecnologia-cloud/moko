layer: logic
purpose: 'VscodeSessionTurn component Custom replacement for the upstream SessionTurn, designed for the VS Code sidebar. Key differences from upstream SessionTurn: - No "Gathered context" grouping — each tool call is rendered individually - Sub-agents are fully expanded inline via TaskToolExpanded - No per-turn auto-scroll (MessageList handles it) - Simpler flat structure without overflow containers'
