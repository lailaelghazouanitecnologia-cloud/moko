layer: logic
purpose: MessageList component Scrollable turn-based message list. Each user message is rendered as a VscodeSessionTurn — a custom component that renders all assistant parts as a flat, verbose list with no context grouping, and fully expands sub-agent (task tool) parts inline. Shows recent sessions in the empty state for quick resumption.
