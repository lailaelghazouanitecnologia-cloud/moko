purpose: AssistantMessage component Renders all parts of an assistant message as a flat list — no context grouping. Unlike the upstream AssistantParts, this renders each read/glob/grep/list tool individually for maximum verbosity in the VS Code sidebar context. Active questions and permissions are rendered in the bottom dock.
