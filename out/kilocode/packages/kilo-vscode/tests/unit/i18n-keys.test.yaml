## Roska File Descriptor — unit/i18n-keys.test.ts
file: unit/i18n-keys.test.ts
lines: 407
layer: test
purpose: 'Translation key validation 1. Ensures every string-literal translation key passed to a t() function actually exists in the corresponding English dictionary. 2. Ensures every English key has a translation in all other locale files. Three independent key pools are checked: - Webview (sidebar + agent manager): merged from app, ui, kilo-i18n, agent-manager dicts - CLI backend (extension-side server-manager): cli-backend/i18n dict - Autocomplete (extension-side): autocomplete/i18n dict Dynamic keys (template literals, variables) are intentionally skipped — only string literals are validated.'
