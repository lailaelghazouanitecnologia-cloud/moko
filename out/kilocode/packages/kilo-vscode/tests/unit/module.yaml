- file: unit/agent-manager-i18n.test.ts
  lines: 346
  purpose: 'Localization lint: Agent Manager Ensures all user-visible strings in the Agent Manager webview go through the i18n `t()` function rather than being hardcoded in English. Detects: - JSX text content (raw text between tags) - String-literal JSX attribute values for user-facing props (title, label, placeholder, aria-label) - Hardcoded string arguments to known UI functions (showToast, etc.) Allows: - CSS class names, data-* attributes, `type` attributes, icon names - Event handler names, message types, signal/state keys - Numbers, single characters, punctuation-only strings - Template expressions `{...}` (assumed to use t()) - Strings that are clearly programmatic (IDs, prefixes, selectors)'
  types: 2
  functions: 3
  imports: 7
  exports: 8
