- file: unit/kilo-ui-contract.test.ts
  lines: 140
  purpose: 'Runtime contract tests for kilo-vscode''s dependencies on @kilocode/kilo-ui. These tests import the upstream UI modules directly and verify at runtime that the exports kilo-vscode depends on still exist with the expected shape. Because the upstream modules use SolidJS JSX (jsxImportSource: "solid-js"), they must be loaded from within packages/kilo-ui/ where bun picks up the correct tsconfig. We use Bun.spawnSync to run a small check script in that context. TypeScript types (OpenFileFn, ToolProps, ToolInfo) are erased at runtime, so those are verified via source analysis on the upstream file.'
