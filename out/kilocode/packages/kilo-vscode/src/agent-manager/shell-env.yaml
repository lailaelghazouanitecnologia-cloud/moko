## Roska File Descriptor — agent-manager/shell-env.ts
file: agent-manager/shell-env.ts
lines: 173
purpose: macOS shell environment PATH resolution. When VS Code is launched from Finder, Spotlight, or the Dock, the extension host inherits a minimal PATH (/usr/bin:/bin:/usr/sbin:/sbin) that excludes directories added by package managers (homebrew, nvm, pipx, etc.) and shell profiles (.zshrc, .bash_profile). This module lazily resolves the user's real PATH by spawning a login shell and caches the result. The fix is applied on first ENOENT and persisted to process.env.PATH so all subsequent child_process calls benefit.
