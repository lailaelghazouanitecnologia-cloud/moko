layer: logic
purpose: 'WorktreeStateManager - Centralized persistent state for agent manager worktrees and sessions. Persists to `.kilo/agent-manager.json`. Decouples worktrees from sessions (many sessions per worktree) and provides CRUD operations for both. Data model: - Worktree: a git worktree with branch, path, parentBranch (bare), remote - ManagedSession: a server session ID associated with a worktree (or null for local)'
