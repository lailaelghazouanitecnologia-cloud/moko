layer: logic
purpose: Typed message contracts for the Agent Manager extension ↔ webview boundary. These types must stay in sync with webview-ui/src/types/messages.ts. The webview side re-uses the types directly; this file provides the extension-side equivalents so onMessage() and postToWebview() are type-checked rather than relying on Record<string, unknown> casts.
