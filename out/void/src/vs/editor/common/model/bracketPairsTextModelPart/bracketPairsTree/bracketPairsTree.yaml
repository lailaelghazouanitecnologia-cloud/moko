types:
- name: BracketPairsTree
  kind: struct
  ctx: 'There are two trees: The initial tree that has no token information and is used for performant initial bracket colorization. The tree that used token information to detect bracket pairs. To prevent flickering, we only switch from the initial tree to tree with token information when tokenization completes. Since the text can be edited while background tokenization is in progress, we need to update both trees.'
