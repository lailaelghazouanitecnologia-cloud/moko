- name: LinkDetector
  kind: struct
  ctx: Matches and handles web urls, absolute and relative file links in the string provided. Returns <span/> element that wraps the processed string, where matched links are replaced by <a/>. 'onclick' event is attached to all anchored links that opens them in the editor. When splitLines is true, each line of the text, even if it contains no links, is wrapped in a <span> and added as a child of the returned <span>. If a `hoverBehavior` is passed, hovers may be added using the workbench hover service. This should be preferred for new code where hovers are desirable.
