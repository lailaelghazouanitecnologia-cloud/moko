- name: ThreadStatusScheduler
  kind: struct
  ctx: An array of set of thread IDs. When a 'stopped' event is encountered, the editor refreshes its thread IDs. In the meantime, the thread may change state it again. So the editor puts a Set into this array when it starts the refresh, and checks it after the refresh is finished, to see if any of the threads it looked up should now be invalidated.
