types:
- name: AbstractDebugAdapter
  kind: trait
  ctx: 'Returns whether we should insert a timeout between processing messageA and messageB. Artificially queueing protocol messages guarantees that any microtasks for previous message finish before next message is processed. This is essential ordering when using promises anywhere along the call path. For example, take the following, where `chooseAndSendGreeting` returns a person name and then emits a greeting event: ``` let person: string; adapter.onGreeting(() => console.log(''hello'', person)); person = await adapter.chooseAndSendGreeting(); ``` Because the event is dispatched synchronously, it may fire before person is assigned if they''re processed in the same task. Inserting a task boundary avoids this issue.'
