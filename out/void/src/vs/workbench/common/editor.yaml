- name: EditorResourceAccessorImpl
  kind: struct
  ctx: 'The original URI of an editor is the URI that was used originally to open the editor and should be used whenever the URI is presented to the user, e.g. as a label together with utility methods such as `ResourceLabel` or `ILabelService` that can turn this original URI into the best form for presenting. In contrast, the canonical URI (#getCanonicalUri) may be different and should be used whenever the URI is used to e.g. compare with other editors or when caching certain data based on the URI. For example: on Windows and macOS, the same file URI with different casing may point to the same file. The editor may chose to "normalize" the URI into a canonical form so that only one editor opens for same file URIs with different casing. As such, the original URI and the canonical URI can be different.'
