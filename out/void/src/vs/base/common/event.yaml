- name: Emitter
  kind: struct
  ctx: 'A listener, or list of listeners. A single listener is the most common for event emitters (#185789), so we optimize that special case to avoid wrapping it in an array (just like Node.js itself.) A list of listeners never ''downgrades'' back to a plain function if listeners are removed, for two reasons: 1. That''s complicated (especially with the deliveryQueue) 2. A listener with >1 listener is likely to have >1 listener again at some point, and swapping between arrays and functions may[citation needed] introduce unnecessary work and garbage. The array listeners can be ''sparse'', to avoid reallocating the array whenever any listener is added or removed. If more than `1 / compactionThreshold` of the array is empty, only then is it resized.'
