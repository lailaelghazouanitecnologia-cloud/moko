- name: TaskPresentationScheduler
  kind: struct
  ctx: Flush immediately and await completion. Guarantees that at least one flush runs at "immediate" priority after this call returns, even if a concurrent flush cycle consumed the pending priority before this call could start its own cycle. If the scheduler has already been disposed this is a no-op and resolves without error. Callers that need a guarantee that the final presentation was delivered should ensure `dispose()` has not been called before invoking `flushNow()` (the task streaming finalization path does this correctly because `dispose()` is only called during `abortTask()`).
