- name: Task
  kind: struct
  ctx: 'The mode associated with this task. Persisted across sessions to maintain user context when reopening tasks from history. ## Lifecycle ### For new tasks: 1. Initially `undefined` during construction 2. Asynchronously initialized from provider state via `initializeTaskMode()` 3. Falls back to `defaultModeSlug` if provider state is unavailable ### For history items: 1. Immediately set from `historyItem.mode` during construction 2. Falls back to `defaultModeSlug` if mode is not stored in history ## Important This property should NOT be accessed directly until `taskModeReady` promise resolves. Use `getTaskMode()` for async access or `taskMode` getter for sync access after initialization.'
