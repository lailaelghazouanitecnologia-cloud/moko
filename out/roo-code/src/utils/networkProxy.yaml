layer: logic
purpose: Network Proxy Configuration Module Provides proxy configuration for all outbound HTTP/HTTPS requests from the Roo Code extension. When running in debug mode (F5), a proxy can be enabled for outbound traffic. Optionally, TLS certificate verification can be disabled (debug only) to allow MITM proxy inspection. Uses global-agent to globally route all HTTP/HTTPS traffic through the proxy, which works with axios, fetch, and most SDKs that use native Node.js http/https.
