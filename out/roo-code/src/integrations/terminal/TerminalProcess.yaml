  ctx: Remove only VSCode shell integration sequences (OSC 633/133) while preserving standard ANSI SGR escape codes for color/formatting. VSCode shell integration uses OSC 633 and OSC 133 sequences to mark prompt boundaries, command starts/ends, etc. These are not useful for inline display and should be stripped. Standard ANSI SGR sequences (e.g., \x1B[32m for green) are preserved so the frontend can render them as styled HTML.
