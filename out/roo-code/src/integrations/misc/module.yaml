- file: misc/indentation-reader.ts
  lines: 469
  layer: logic
  purpose: 'Indentation-based semantic code block extraction. Inspired by Codex''s indentation mode, this module extracts meaningful code blocks based on indentation hierarchy rather than arbitrary line ranges. The algorithm uses bidirectional expansion from an anchor line: 1. Parse the file to determine indentation level of each line 2. Compute effective indents (blank lines inherit previous non-blank line''s indent) 3. Expand up and down from anchor simultaneously 4. Apply sibling exclusion counters to limit scope 5. Trim empty lines from edges 6. Apply line limit'
