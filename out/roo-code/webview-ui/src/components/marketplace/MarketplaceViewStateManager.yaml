file: marketplace/MarketplaceViewStateManager.ts
lines: 486
layer: logic
purpose: 'MarketplaceViewStateManager This class manages the state for the marketplace view in the Roo Code extensions interface. IMPORTANT: Fixed issue where the marketplace feature was causing the Roo Code extensions interface to switch to the browse tab and redraw it every 30 seconds. The fix prevents unnecessary tab switching and redraws by: 1. Only updating the UI when necessary 2. Preserving the current tab when handling timeouts 3. Using minimal state updates to avoid resetting scroll position'
