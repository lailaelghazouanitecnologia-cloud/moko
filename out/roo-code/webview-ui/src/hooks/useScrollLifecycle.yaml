## Roska File Descriptor — hooks/useScrollLifecycle.ts
file: hooks/useScrollLifecycle.ts
lines: 489
layer: logic
purpose: useScrollLifecycle Simplified chat scroll lifecycle with a short, time-boxed hydration window. - Task switch enters `HYDRATING_PINNED_TO_BOTTOM` - We issue one immediate `scrollToIndex("LAST")` and one post-render retry - During hydration, transient Virtuoso `atBottomStateChange(false)` signals are ignored so follow mode does not flicker off - User escape intent (wheel / keyboard / pointer-upward drag / row expansion) moves to `USER_BROWSING_HISTORY` and prevents forced re-pinning
