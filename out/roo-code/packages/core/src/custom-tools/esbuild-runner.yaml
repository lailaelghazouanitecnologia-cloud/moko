layer: logic
purpose: esbuild-runner - Runs esbuild-wasm CLI to transpile TypeScript files. This module provides a way to run esbuild as a CLI process instead of using the JavaScript API. This uses esbuild-wasm which is cross-platform and works on all operating systems without needing native binaries. In production, the esbuild-wasm CLI script is bundled in dist/bin/. In development, it falls back to using esbuild-wasm from node_modules.
