purpose: 'File-based debug logging utility This writes logs to ~/.roo/cli-debug.log, avoiding stdout/stderr which would break TUI applications. The log format is timestamped JSON. Usage: import { debugLog, DebugLogger } from "@roo-code/core/cli" // Simple logging debugLog("handleModeSwitch", { mode: newMode, configId }) // Or create a named logger for a component const log = new DebugLogger("ClineProvider") log.info("handleModeSwitch", { mode: newMode })'
