purpose: 'State Store This module manages the client''s internal state, including: - The clineMessages array (source of truth for agent state) - The computed agent state info - Any extension state we want to cache The store is designed to be: - Immutable: State updates create new objects, not mutations - Observable: Changes trigger notifications - Queryable: Current state is always accessible'
