layer: logic
purpose: 'OutputManager - Handles all CLI output and streaming This manager is responsible for: - Writing messages to stdout/stderr - Tracking what''s been displayed (to avoid duplicates) - Managing streaming content with delta computation - Formatting different message types appropriately Design notes: - Uses the Observable pattern from client/events.ts for internal state - Single responsibility: CLI output only (no prompting, no state detection) - Can be disabled for TUI mode where Ink controls the terminal'
