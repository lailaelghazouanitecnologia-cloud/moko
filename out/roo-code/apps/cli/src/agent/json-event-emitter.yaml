layer: logic
purpose: 'JsonEventEmitter - Handles structured JSON output for the CLI This class transforms internal CLI events (ClineMessage, state changes, etc.) into structured JSON events and outputs them to stdout. Supports two output modes: - "stream-json": NDJSON format (one JSON object per line) for real-time streaming - "json": Single JSON object at the end with accumulated events Schema is optimized for efficiency with high message volume: - Minimal fields per event - No redundant wrappers - `done` flag instead of partial:false'
