## Roska File Descriptor — agent/message-processor.ts
file: agent/message-processor.ts
lines: 482
layer: logic
purpose: 'Message Processor This module handles incoming messages from the extension host and dispatches appropriate state updates and events. It acts as the bridge between raw extension messages and the client''s internal state management. Message Flow: ``` Extension Host ──▶ MessageProcessor ──▶ StateStore ──▶ Events ``` The processor handles different message types: - "state": Full state update from extension - "messageUpdated": Single message update - "action": UI action triggers - "invoke": Command invocations'
