## Roska File Descriptor — agent/extension-client.ts
file: agent/extension-client.ts
lines: 580
layer: logic
purpose: 'Roo Code Client This is the main entry point for the client library. It provides a high-level API for: - Processing messages from the extension host - Querying the current agent state - Subscribing to state change events - Sending responses back to the extension The client is designed to be transport-agnostic. You provide a way to send messages to the extension, and you feed incoming messages to the client. Architecture: ``` ┌───────────────────────────────────────────────┐ │               ExtensionClient                 │ │                                               │ Extension ──────▶ │  MessageProcessor ──▶ StateStore              │ Messages          │         │                  │                  │ │         ▼                  ▼                  │ │    TypedEventEmitter ◀── State/Events         │ │         │                                     │ │         ▼                                     │ │    Your Event Handlers                        │ └───────────────────────────────────────────────┘ ```'
