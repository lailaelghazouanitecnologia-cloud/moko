file: agent/ask-dispatcher.ts
lines: 664
layer: logic
purpose: 'AskDispatcher - Routes ask messages to appropriate handlers This dispatcher is responsible for: - Categorizing ask types using type guards from client module - Routing to the appropriate handler based on ask category - Coordinating between OutputManager and PromptManager - Tracking which asks have been handled (to avoid duplicates) Design notes: - Uses isIdleAsk, isInteractiveAsk, isResumableAsk, isNonBlockingAsk type guards - Single responsibility: Ask routing and handling only - Delegates output to OutputManager, input to PromptManager - Sends responses back through a provided callback'
