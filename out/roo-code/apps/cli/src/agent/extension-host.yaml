purpose: 'ExtensionHost - Loads and runs the Roo Code extension in CLI mode This class is a thin coordination layer responsible for: 1. Creating the vscode-shim mock 2. Loading the extension bundle via require() 3. Activating the extension 4. Wiring up managers for output, prompting, and ask handling'
