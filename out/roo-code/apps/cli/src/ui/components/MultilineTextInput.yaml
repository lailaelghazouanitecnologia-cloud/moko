purpose: 'MultilineTextInput Component A multi-line text input for Ink CLI applications. Based on ink-multiline-input but simplified for our needs. Key behaviors: - Option+Enter (macOS) / Alt+Enter: Add new line (works reliably) - Shift+Enter: Add new line (requires terminal support for kitty keyboard protocol) - Enter: Submit - Backspace at start of line: Merge with previous line - Escape: Clear all lines - Arrow keys: Navigate within and between lines'
