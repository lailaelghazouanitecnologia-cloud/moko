name: autocomplete
purpose: Autocomplete system for CLI input. This module provides a generic, extensible autocomplete system that supports multiple trigger patterns (like @ for files, / for commands) through a plugin-like trigger architecture. ```tsx import { AutocompleteInput, PickerSelect, useAutocompletePicker, createFileTrigger, createSlashCommandTrigger, } from './autocomplete' const triggers = [ createFileTrigger({ onSearch, getResults }), createSlashCommandTrigger({ getCommands }), ] <AutocompleteInput triggers={triggers} onSubmit={handleSubmit} /> ```
