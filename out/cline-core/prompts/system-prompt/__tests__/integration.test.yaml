## Roska File Descriptor — __tests__/integration.test.ts
file: __tests__/integration.test.ts
lines: 351
layer: test
purpose: 'System Prompt Integration Tests with Snapshot Testing This test suite validates that system prompts remain consistent across different model families and context configurations using snapshot testing. Usage: - Run tests normally: `npm run test:unit` Tests will fail if generated prompts don''t match existing snapshots - Update snapshots: `npm run test:unit -- --update-snapshots` This will regenerate all snapshot files with current prompt output When tests fail: 1. Review the differences shown in the error message 2. Determine if changes are intentional (e.g., prompt improvements) 3. If changes are correct, run with --update-snapshots to update baselines 4. If changes are unintentional, investigate why prompt generation changed'
