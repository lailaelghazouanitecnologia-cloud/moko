purpose: 'Rule frontmatter conditional evaluation. This module implements a small conditional "DSL" for Cline Rules YAML frontmatter. It is used to decide whether a rule should be activated for a given request context. Notes: - Unknown conditional keys are ignored for forward compatibility. - The `paths` conditional matches if any candidate path matches any glob pattern. - Candidate paths are expected to be workspace-root-relative POSIX paths.'
