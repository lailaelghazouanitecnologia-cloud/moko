- name: _On
  kind: struct
  vis: protected
  ctx: 'Entry point for authorization handlers that control access to specific resources. The _On class provides a flexible way to define authorization rules for different resources and actions in your application. It supports three main usage patterns: 1. Global handlers that run for all resources and actions 2. Resource-specific handlers that run for all actions on a resource 3. Resource and action specific handlers for fine-grained control Each handler must be an async function that accepts two parameters: - ctx (AuthContext): Contains request context and authenticated user info - value: The data being authorized (type varies by endpoint) The handler should return one of: - None or True: Accept the request - False: Reject with 403 error - FilterType: Apply filtering rules to the response ???+ example "Examples" Start by denying all requests by default with a global handler, then add specific handlers to allow access: ```python # Default deny: reject all requests without a specific handler @auth.on async def deny_all(ctx: AuthContext, value: Any) -> False: return False ``` Resource-specific handler to allow access (takes precedence over the global deny handler): ```python @auth.on.threads async def allow_thread_access(ctx: AuthContext, value: Any) -> Auth.types.FilterType: # Allow access only to threads owned by the user return {"owner": ctx.user.identity} ``` Resource and action specific handler: ```python @auth.on.threads.create async def allow_thread_create(ctx: AuthContext, value: Any) -> None: # Allow thread creation, stamping the owner value.setdefault("metadata", {})["owner"] = ctx.user.identity ``` Multiple resources or actions: ```python @auth.on(resources=["threads", "assistants"], actions=["read", "search"]) async def allow_reads(ctx: AuthContext, value: Any) -> Auth.types.FilterType: # Allow read/search, scoped to user''s resources return {"owner": ctx.user.identity} ```'
