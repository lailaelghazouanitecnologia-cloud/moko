## Roska File Descriptor — langgraph_sdk/client.py
file: langgraph_sdk/client.py
lines: 55
purpose: The LangGraph client implementations connect to the LangGraph API. This module provides both asynchronous (`get_client(url="http://localhost:2024")` or `LangGraphClient`) and synchronous (`get_sync_client(url="http://localhost:2024")` or `SyncLanggraphClient`) clients to interacting with the LangGraph API's core resources such as Assistants, Threads, Runs, and Cron jobs, as well as its persistent document Store.
