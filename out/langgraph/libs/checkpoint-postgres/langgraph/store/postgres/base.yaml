- name: PostgresStore
  kind: struct
  ctx: 'Postgres-backed store with optional vector search using pgvector. !!! example "Examples" Basic setup and usage: ```python from langgraph.store.postgres import PostgresStore from psycopg import Connection conn_string = "postgresql://user:pass@localhost:5432/dbname" # Using direct connection with Connection.connect(conn_string) as conn: store = PostgresStore(conn) store.setup() # Run migrations. Done once # Store and retrieve data store.put(("users", "123"), "prefs", {"theme": "dark"}) item = store.get(("users", "123"), "prefs") ``` Or using the convenient `from_conn_string` helper: ```python from langgraph.store.postgres import PostgresStore conn_string = "postgresql://user:pass@localhost:5432/dbname" with PostgresStore.from_conn_string(conn_string) as store: store.setup() # Store and retrieve data store.put(("users", "123"), "prefs", {"theme": "dark"}) item = store.get(("users", "123"), "prefs") ``` Vector search using LangChain embeddings: ```python from langchain.embeddings import init_embeddings from langgraph.store.postgres import PostgresStore conn_string = "postgresql://user:pass@localhost:5432/dbname" with PostgresStore.from_conn_string( conn_string, index={ "dims": 1536, "embed": init_embeddings("openai:text-embedding-3-small"), "fields": ["text"]  # specify which fields to embed. Default is the whole serialized value } ) as store: store.setup() # Do this once to run migrations # Store documents store.put(("docs",), "doc1", {"text": "Python tutorial"}) store.put(("docs",), "doc2", {"text": "TypeScript guide"}) store.put(("docs",), "doc2", {"text": "Other guide"}, index=False) # don''t index # Search by similarity results = store.search(("docs",), query="programming guides", limit=2) ``` Note: Semantic search is disabled by default. You can enable it by providing an `index` configuration when creating the store. Without this configuration, all `index` arguments passed to `put` or `aput`will have no effect. Warning: Make sure to call `setup()` before first use to create necessary tables and indexes. The pgvector extension must be available to use vector search. Note: If you provide a TTL configuration, you must explicitly call `start_ttl_sweeper()` to begin the background thread that removes expired items. Call `stop_ttl_sweeper()` to properly clean up resources when you''re done with the store. (+1 dunder methods)'
