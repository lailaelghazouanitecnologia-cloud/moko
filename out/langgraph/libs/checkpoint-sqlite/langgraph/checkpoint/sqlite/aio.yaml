types:
- name: AsyncSqliteSaver
  kind: struct
  ctx: 'An asynchronous checkpoint saver that stores checkpoints in a SQLite database. This class provides an asynchronous interface for saving and retrieving checkpoints using a SQLite database. It''s designed for use in asynchronous environments and offers better performance for I/O-bound operations compared to synchronous alternatives. Attributes: conn (aiosqlite.Connection): The asynchronous SQLite database connection. serde (SerializerProtocol): The serializer used for encoding/decoding checkpoints. Tip: Requires the [aiosqlite](https://pypi.org/project/aiosqlite/) package. Install it with `pip install aiosqlite`. Warning: While this class supports asynchronous checkpointing, it is not recommended for production workloads due to limitations in SQLite''s write performance. For production use, consider a more robust database like PostgreSQL. Tip: Remember to **close the database connection** after executing your code, otherwise, you may see the graph "hang" after execution (since the program will not exit until the connection is closed). The easiest way is to use the `async with` statement as shown in the examples. ```python async with AsyncSqliteSaver.from_conn_string("checkpoints.sqlite") as saver: # Your code here graph = builder.compile(checkpointer=saver) config = {"configurable": {"thread_id": "thread-1"}} async for event in graph.astream_events(..., config, version="v1"): print(event) ``` Examples: Usage within StateGraph: ```pycon >>> import asyncio >>> >>> from langgraph.checkpoint.sqlite.aio import AsyncSqliteSaver >>> from langgraph.graph import StateGraph >>> >>> async def main(): >>>     builder = StateGraph(int) >>>     builder.add_node("add_one", lambda x: x + 1) >>>     builder.set_entry_point("add_one") >>>     builder.set_finish_point("add_one") >>>     async with AsyncSqliteSaver.from_conn_string("checkpoints.db") as memory: >>>         graph = builder.compile(checkpointer=memory) >>>         coro = graph.ainvoke(1, {"configurable": {"thread_id": "thread-1"}}) >>>         print(await asyncio.gather(coro)) >>> >>> asyncio.run(main()) Output: [2] ``` Raw usage: ```pycon >>> import asyncio >>> import aiosqlite >>> from langgraph.checkpoint.sqlite.aio import AsyncSqliteSaver >>> >>> async def main(): >>>     async with aiosqlite.connect("checkpoints.db") as conn: ...         saver = AsyncSqliteSaver(conn) ...         config = {"configurable": {"thread_id": "1", "checkpoint_ns": ""}} ...         checkpoint = {"ts": "2023-05-03T10:00:00Z", "data": {"key": "value"}, "id": "0c62ca34-ac19-445d-bbb0-5b4984975b2a"} ...         saved_config = await saver.aput(config, checkpoint, {}, {}) ...         print(saved_config) >>> asyncio.run(main()) {''configurable'': {''thread_id'': ''1'', ''checkpoint_ns'': '''', ''checkpoint_id'': ''0c62ca34-ac19-445d-bbb0-5b4984975b2a''}} ```'
