types:
- name: SqliteSaver
  kind: struct
  ctx: 'A checkpoint saver that stores checkpoints in a SQLite database. Note: This class is meant for lightweight, synchronous use cases (demos and small projects) and does not scale to multiple threads. For a similar sqlite saver with `async` support, consider using [AsyncSqliteSaver][langgraph.checkpoint.sqlite.aio.AsyncSqliteSaver]. Args: conn (sqlite3.Connection): The SQLite database connection. serde (Optional[SerializerProtocol]): The serializer to use for serializing and deserializing checkpoints. Defaults to JsonPlusSerializerCompat. Examples: >>> import sqlite3 >>> from langgraph.checkpoint.sqlite import SqliteSaver >>> from langgraph.graph import StateGraph >>> >>> builder = StateGraph(int) >>> builder.add_node("add_one", lambda x: x + 1) >>> builder.set_entry_point("add_one") >>> builder.set_finish_point("add_one") >>> # Create a new SqliteSaver instance >>> # Note: check_same_thread=False is OK as the implementation uses a lock >>> # to ensure thread safety. >>> conn = sqlite3.connect("checkpoints.sqlite", check_same_thread=False) >>> memory = SqliteSaver(conn) >>> graph = builder.compile(checkpointer=memory) >>> config = {"configurable": {"thread_id": "1"}} >>> graph.get_state(config) >>> result = graph.invoke(3, config) >>> graph.get_state(config) StateSnapshot(values=4, next=(), config={''configurable'': {''thread_id'': ''1'', ''checkpoint_ns'': '''', ''checkpoint_id'': ''0c62ca34-ac19-445d-bbb0-5b4984975b2a''}}, parent_config=None)'
