types:
- name: AsyncSqliteStore
  kind: struct
  ctx: 'Asynchronous SQLite-backed store with optional vector search. This class provides an asynchronous interface for storing and retrieving data using a SQLite database with support for vector search capabilities. Examples: Basic setup and usage: ```python from langgraph.store.sqlite import AsyncSqliteStore async with AsyncSqliteStore.from_conn_string(":memory:") as store: await store.setup()  # Run migrations # Store and retrieve data await store.aput(("users", "123"), "prefs", {"theme": "dark"}) item = await store.aget(("users", "123"), "prefs") ``` Vector search using LangChain embeddings: ```python from langchain_openai import OpenAIEmbeddings from langgraph.store.sqlite import AsyncSqliteStore async with AsyncSqliteStore.from_conn_string( ":memory:", index={ "dims": 1536, "embed": OpenAIEmbeddings(), "fields": ["text"]  # specify which fields to embed } ) as store: await store.setup()  # Run migrations once # Store documents await store.aput(("docs",), "doc1", {"text": "Python tutorial"}) await store.aput(("docs",), "doc2", {"text": "TypeScript guide"}) await store.aput(("docs",), "doc3", {"text": "Other guide"}, index=False)  # don''t index # Search by similarity results = await store.asearch(("docs",), query="programming guides", limit=2) ``` Warning: Make sure to call `setup()` before first use to create necessary tables and indexes. Note: This class requires the aiosqlite package. Install with `pip install aiosqlite`.'
