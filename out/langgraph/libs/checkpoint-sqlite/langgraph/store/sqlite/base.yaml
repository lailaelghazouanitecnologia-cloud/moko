- name: SqliteStore
  kind: struct
  ctx: 'SQLite-backed store with optional vector search capabilities. Examples: Basic setup and usage: ```python from langgraph.store.sqlite import SqliteStore import sqlite3 conn = sqlite3.connect(":memory:") store = SqliteStore(conn) store.setup()  # Run migrations. Done once # Store and retrieve data store.put(("users", "123"), "prefs", {"theme": "dark"}) item = store.get(("users", "123"), "prefs") ``` Or using the convenient `from_conn_string` helper: ```python from langgraph.store.sqlite import SqliteStore with SqliteStore.from_conn_string(":memory:") as store: store.setup() # Store and retrieve data store.put(("users", "123"), "prefs", {"theme": "dark"}) item = store.get(("users", "123"), "prefs") ``` Vector search using LangChain embeddings: ```python from langchain.embeddings import OpenAIEmbeddings from langgraph.store.sqlite import SqliteStore with SqliteStore.from_conn_string( ":memory:", index={ "dims": 1536, "embed": OpenAIEmbeddings(), "fields": ["text"]  # specify which fields to embed } ) as store: store.setup()  # Run migrations # Store documents store.put(("docs",), "doc1", {"text": "Python tutorial"}) store.put(("docs",), "doc2", {"text": "TypeScript guide"}) store.put(("docs",), "doc3", {"text": "Other guide"}, index=False)  # don''t index # Search by similarity results = store.search(("docs",), query="programming guides", limit=2) ``` Note: Semantic search is disabled by default. You can enable it by providing an `index` configuration when creating the store. Without this configuration, all `index` arguments passed to `put` or `aput` will have no effect. Warning: Make sure to call `setup()` before first use to create necessary tables and indexes. (+1 dunder methods)'
