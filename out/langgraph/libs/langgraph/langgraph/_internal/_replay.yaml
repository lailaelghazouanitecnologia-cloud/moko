  ctx: Tracks which subgraphs have already loaded their pre-replay checkpoint. During a parent replay, each subgraph's first invocation should restore the checkpoint from before the replay point. Subsequent invocations of the same subgraph (e.g. in a loop) should use normal checkpoint loading so they pick up freshly created checkpoints. The single `ReplayState` instance is shared by reference across all derived configs within one parent execution.
