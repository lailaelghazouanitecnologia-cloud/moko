  purpose: 'Async tests for time travel (replay and fork) behavior. Covers the intersection of replay vs fork across graph structures: - Replay & fork basics (no interrupt, no subgraph) - Replay & fork with interrupts (no subgraph) - Multiple / sequential interrupts - Subgraph without interrupt - Subgraph with interrupt - __copy__ / update_state(None) - Observability (get_state, config access) Key concepts: - Replay (invoke with checkpoint_id): Re-executes nodes after the checkpoint. Interrupts re-fire on replay. - Fork (update_state then invoke): Creates a new checkpoint without cached pending writes. Nodes re-execute and interrupts DO re-fire.'
