## Roska File Descriptor — tests/test_subgraph_persistence.py
file: tests/test_subgraph_persistence.py
lines: 641
purpose: 'Tests for subgraph persistence behavior (sync). Covers three checkpointer settings for subgraph state: - checkpointer=False: no persistence, even when parent has a checkpointer - checkpointer=None (default): "stateless" — inherits parent checkpointer for interrupt support, but state resets each invocation. This is the common case when an agent is invoked from inside a tool used by another agent. - checkpointer=True: "stateful" — state accumulates across invocations on the same thread id'
