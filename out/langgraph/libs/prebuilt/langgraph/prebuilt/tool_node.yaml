## Roska File Descriptor — prebuilt/tool_node.py
file: prebuilt/tool_node.py
lines: 1869
purpose: 'Tool execution node for LangGraph workflows. This module provides prebuilt functionality for executing tools in LangGraph. Tools are functions that models can call to interact with external systems, APIs, databases, or perform computations. The module implements design patterns for: - Parallel execution of multiple tool calls for efficiency - Robust error handling with customizable error messages - State injection for tools that need access to graph state - Store injection for tools that need persistent storage - Command-based state updates for advanced control flow Key Components: - [`ToolNode`][langgraph.prebuilt.ToolNode]: Main class for executing tools in LangGraph workflows - [`InjectedState`][langgraph.prebuilt.InjectedState]: Annotation for injecting graph state into tools - [`InjectedStore`][langgraph.prebuilt.InjectedStore]: Annotation for injecting persistent store into tools - [`ToolRuntime`][langgraph.prebuilt.ToolRuntime]: Runtime information for tools, bundling together `state`, `context`, `config`, `stream_writer`, `tool_call_id`, and `store` - [`tools_condition`][langgraph.prebuilt.tools_condition]: Utility function for conditional routing based on tool calls Typical Usage: ```python from langchain_core.tools import tool from langchain.tools import ToolNode @tool def my_tool(x: int) -> str: return f"Result: {x}" tool_node = ToolNode([my_tool]) ```'
