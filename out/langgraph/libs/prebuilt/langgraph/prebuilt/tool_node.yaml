- name: ToolNode
  kind: struct
  ctx: 'A node for executing tools in LangGraph workflows. Handles tool execution patterns including function calls, state injection, persistent storage, and control flow. Manages parallel execution, error handling. Use `ToolNode` when building custom workflows that require fine-grained control over tool execution—for example, custom routing logic, specialized error handling, or non-standard agent architectures. For standard ReAct-style agents, use [`create_agent`][langchain.agents.create_agent] instead. It uses `ToolNode` internally with sensible defaults for the agent loop, conditional routing, and error handling. Input Formats: 1. **Graph state** with `messages` key that has a list of messages: - Common representation for agentic workflows - Supports custom messages key via `messages_key` parameter 2. **Message List**: `[AIMessage(..., tool_calls=[...])]` - List of messages with tool calls in the last AIMessage 3. **Direct Tool Calls**: `[{"name": "tool", "args": {...}, "id": "1", "type": "tool_call"}]` - Bypasses message parsing for direct tool execution - For programmatic tool invocation and testing Output Formats: Output format depends on input type and tool behavior: **For Regular tools**: - Dict input → `{"messages": [ToolMessage(...)]}` - List input → `[ToolMessage(...)]` **For Command tools**: - Returns `[Command(...)]` or mixed list with regular tool outputs - `Command` can update state, trigger navigation, or send messages Args: tools: A sequence of tools that can be invoked by this node. Supports: - **BaseTool instances**: Tools with schemas and metadata - **Plain functions**: Automatically converted to tools with inferred schemas name: The name identifier for this node in the graph. Used for debugging and visualization. tags: Optional metadata tags to associate with the node for filtering and organization. handle_tool_errors: Configuration for error handling during tool execution. Supports multiple strategies: - `True`: Catch all errors and return a `ToolMessage` with the default error template containing the exception details. - `str`: Catch all errors and return a `ToolMessage` with this custom error message string. - `type[Exception]`: Only catch exceptions with the specified type and return the default error message for it. - `tuple[type[Exception], ...]`: Only catch exceptions with the specified types and return default error messages for them. - `Callable[..., str]`: Catch exceptions matching the callable''s signature and return the string result of calling it with the exception. - `False`: Disable error handling entirely, allowing exceptions to propagate. Defaults to a callable that: - Catches tool invocation errors (due to invalid arguments provided by the model) and returns a descriptive error message - Ignores tool execution errors (they will be re-raised) messages_key: The key in the state dictionary that contains the message list. This same key will be used for the output `ToolMessage` objects. Allows custom state schemas with different message field names. Examples: Basic usage: ```python from langchain.tools import ToolNode from langchain_core.tools import tool @tool def calculator(a: int, b: int) -> int: \"\"\"Add two numbers.\"\"\" return a + b tool_node = ToolNode([calculator]) ``` State injection: ```python from typing_extensions import Annotated from langchain.tools import InjectedState @tool def context_tool(query: str, state: Annotated[dict, InjectedState]) -> str: \"\"\"Some tool that uses state.\"\"\" return f"Query: {query}, Messages: {len(state[''messages''])}" tool_node = ToolNode([context_tool]) ``` Error handling: ```python def handle_errors(e: ValueError) -> str: return "Invalid input provided" tool_node = ToolNode([my_tool], handle_tool_errors=handle_errors) ```'
