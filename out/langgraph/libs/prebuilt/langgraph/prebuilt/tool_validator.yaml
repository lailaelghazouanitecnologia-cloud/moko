## Roska File Descriptor — prebuilt/tool_validator.py
file: prebuilt/tool_validator.py
lines: 221
purpose: This module provides a ValidationNode class that can be used to validate tool calls in a langchain graph. It applies a pydantic schema to tool_calls in the models' outputs, and returns a ToolMessage with the validated content. If the schema is not valid, it returns a ToolMessage with the error message. The ValidationNode can be used in a StateGraph with a "messages" key. If multiple tool calls are requested, they will be run in parallel.
