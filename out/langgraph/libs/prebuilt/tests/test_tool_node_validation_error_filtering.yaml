## Roska File Descriptor — tests/test_tool_node_validation_error_filtering.py
file: tests/test_tool_node_validation_error_filtering.py
lines: 470
purpose: Unit tests for ValidationError filtering in ToolNode. This module tests that validation errors are filtered to only include arguments that the LLM controls. Injected arguments (InjectedState, InjectedStore, ToolRuntime) are automatically provided by the system and should not appear in validation error messages. This ensures the LLM receives focused, actionable feedback about the parameters it can actually control, improving error correction and reducing confusion from irrelevant system implementation details.
