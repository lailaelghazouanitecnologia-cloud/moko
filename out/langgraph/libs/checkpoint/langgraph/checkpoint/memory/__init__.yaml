types:
- name: InMemorySaver
  kind: struct
  ctx: 'An in-memory checkpoint saver. This checkpoint saver stores checkpoints in memory using a `defaultdict`. Note: Only use `InMemorySaver` for debugging or testing purposes. For production use cases we recommend installing [langgraph-checkpoint-postgres](https://pypi.org/project/langgraph-checkpoint-postgres/) and using `PostgresSaver` / `AsyncPostgresSaver`. If you are using LangSmith Deployment, no checkpointer needs to be specified. The correct managed checkpointer will be used automatically. Args: serde: The serializer to use for serializing and deserializing checkpoints. Example: ```python import asyncio from langgraph.checkpoint.memory import InMemorySaver from langgraph.graph import StateGraph builder = StateGraph(int) builder.add_node("add_one", lambda x: x + 1) builder.set_entry_point("add_one") builder.set_finish_point("add_one") memory = InMemorySaver() graph = builder.compile(checkpointer=memory) coro = graph.ainvoke(1, {"configurable": {"thread_id": "thread-1"}}) asyncio.run(coro)  # Output: 2 ``` (+2 dunder methods)'
