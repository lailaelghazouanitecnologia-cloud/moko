- name: PersistentDict
  kind: struct
  ctx: Persistent dictionary with an API compatible with shelve and anydbm. The dict is kept in memory, so the dictionary operations run as fast as a regular dictionary. Write to disk is delayed until close or sync (similar to gdbm's fast mode). Input file format is automatically discovered. Output file format is selectable between pickle, json, and csv. All three serialization formats are backed by fast C implementations. Adapted from https://code.activestate.com/recipes/576642-persistent-dict-with-multiple-standard-file-format/ (+2 dunder methods)
  bases:
  - defaultdict
  fields:
  - name: flag
    type: str
    default: '"c"'
  - name: mode
