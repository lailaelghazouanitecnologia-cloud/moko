- name: BaseStore
  kind: trait
  ctx: 'Abstract base class for persistent key-value stores. Stores enable persistence and memory that can be shared across threads, scoped to user IDs, assistant IDs, or other arbitrary namespaces. Some implementations may support semantic search capabilities through an optional `index` configuration. Note: Semantic search capabilities vary by implementation and are typically disabled by default. Stores that support this feature can be configured by providing an `index` configuration at creation time. Without this configuration, semantic search is disabled and any `index` arguments to storage operations will have no effect. Similarly, TTL (time-to-live) support is disabled by default. Subclasses must explicitly set `supports_ttl = True` to enable this feature.'
  bases:
  - ABC
  fields:
  - name: supports_ttl
    type: Any
    default: bool
  - name: ttl_config
    type: Any
    default: TTLConfig | None
