purpose: 'Base classes and types for persistent key-value stores. Stores provide long-term memory that persists across threads and conversations. Supports hierarchical namespaces, key-value storage, and optional vector search. Core types: - `BaseStore`: Store interface with sync/async operations - `Item`: Stored key-value pairs with metadata - `Op`: Get/Put/Search/List operations'
