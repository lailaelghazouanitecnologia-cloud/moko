## ThiefEngine — Math (vectors, matrices)
name: math
path: src/geom
module: geom
layer: geom
lines: 800
types:
  - name: Vector4
    kind: class
    fields: [x, y, z, w]
    methods: [set, cpy, toArray, fromArray, len, max, min, add, sub, mulScl, mul, dot, cross, nor, equals]
  - name: Vector3
    kind: class
    extends: Vector4
    description: "3D vector — w=0, inherits all Vector4 methods"
  - name: Vector2
    kind: class
    fields: [x, y]
    methods: [add, sub, mul, dot, nor, len, equals]
  - name: Matrix4
    kind: class
    fields: ["data: number[16]"]
    methods: [get, set, getData, setData, cpy]
    static_methods: [identity, zeros, translation, rotation, scale, mulMM, mulMV, transpose, inverse]
    storage: "Column-major for WebGL upload"
description: "Minimal math library — Vector4 base, Vector3 extends, Matrix4 column-major. Static factory methods for transforms."
