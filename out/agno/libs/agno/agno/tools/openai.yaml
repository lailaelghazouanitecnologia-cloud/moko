- name: OpenAITools
  kind: struct
  ctx: 'Tools for interacting with OpenAI API. Args: api_key (str, optional): OpenAI API key. Retrieved from OPENAI_API_KEY env variable if not provided. enable_transcription (bool): Enable audio transcription functionality. Default is True. enable_image_generation (bool): Enable image generation functionality. Default is True. enable_speech_generation (bool): Enable speech generation functionality. Default is True. all (bool): Enable all tools. Overrides individual flags when True. Default is False. transcription_model (str): Model to use for transcription. Default is "whisper-1". text_to_speech_voice (OpenAIVoice): Voice to use for TTS. Default is "alloy". text_to_speech_model (OpenAITTSModel): Model to use for TTS. Default is "tts-1". text_to_speech_format (OpenAITTSFormat): Audio format for TTS. Default is "mp3". image_model (str, optional): Model to use for image generation. Default is "dall-e-3". image_quality (str, optional): Quality setting for image generation. image_size (str, optional): Size setting for image generation. image_style (str, optional): Style setting for image generation.'
