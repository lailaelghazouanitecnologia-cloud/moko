purpose: 'Google Sheets Toolset for interacting with Sheets API Required Environment Variables: ----------------------------- - GOOGLE_CLIENT_ID: Google OAuth client ID - GOOGLE_CLIENT_SECRET: Google OAuth client secret - GOOGLE_PROJECT_ID: Google Cloud project ID - GOOGLE_REDIRECT_URI: Google OAuth redirect URI (default: http://localhost) How to Get These Credentials: --------------------------- 1. Go to Google Cloud Console (https://console.cloud.google.com) 2. Create a new project or select an existing one 3. Enable the Google Sheets API: - Go to "APIs & Services" > "Enable APIs and Services" - Search for "Google Sheets API" - Click "Enable" 4. Create OAuth 2.0 credentials: - Go to "APIs & Services" > "Credentials" - Click "Create Credentials" > "OAuth client ID" - Go through the OAuth consent screen setup - Give it a name and click "Create" - You''ll receive: * Client ID (GOOGLE_CLIENT_ID) * Client Secret (GOOGLE_CLIENT_SECRET) - The Project ID (GOOGLE_PROJECT_ID) is visible in the project dropdown at the top of the page 5. Set up environment variables: Create a .envrc file in your project root with: ``` export GOOGLE_CLIENT_ID=your_client_id_here export GOOGLE_CLIENT_SECRET=your_client_secret_here export GOOGLE_PROJECT_ID=your_project_id_here export GOOGLE_REDIRECT_URI=http://localhost  # Default value ``` Alternatively, follow the instructions in the Google Sheets API Quickstart guide: 1: Steps: https://developers.google.com/sheets/api/quickstart/python 2: Save the credentials.json file to the root of the project or update the path in the GoogleSheetsTools class Note: The first time you run the application, it will open a browser window for OAuth authentication. A token.json file will be created to store the authentication credentials for future use.'
