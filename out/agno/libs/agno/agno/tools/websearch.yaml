- name: WebSearchTools
  kind: struct
  ctx: 'Toolkit for searching the web. Uses the meta-search library DDGS. Multiple search backends (e.g. google, bing, duckduckgo) are available. Args: enable_search (bool): Enable web search function. enable_news (bool): Enable news search function. backend (str): The backend to use for searching. Defaults to "auto" which automatically selects available backends. Other options include: "duckduckgo", "google", "bing", "brave", "yandex", "yahoo", etc. modifier (Optional[str]): A modifier to be prepended to search queries. fixed_max_results (Optional[int]): A fixed number of maximum results. proxy (Optional[str]): Proxy to be used for requests. timeout (Optional[int]): The maximum number of seconds to wait for a response. verify_ssl (bool): Whether to verify SSL certificates. timelimit (Optional[str]): Time limit for search results. Valid values: "d" (day), "w" (week), "m" (month), "y" (year). region (Optional[str]): Region for search results (e.g., "us-en", "uk-en", "ru-ru").'
