- name: SchedulePoller
  kind: struct
  ctx: Periodically poll the DB for due schedules and execute them. Each poll tick repeatedly calls ``db.claim_due_schedule()`` until no more schedules are due, spawning an ``asyncio.create_task`` for each claimed schedule so they run concurrently.
