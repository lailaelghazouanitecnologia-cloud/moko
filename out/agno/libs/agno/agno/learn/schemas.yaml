purpose: 'LearningMachine Schemas ======================= Dataclasses for each learning type. Uses pure dataclasses to avoid runtime overhead. All parsing is done via from_dict() which never raises. Classes are designed to be extended - from_dict() and to_dict() automatically handle subclass fields via dataclasses.fields(). Field Descriptions When extending schemas, use field metadata to provide descriptions that will be shown to the LLM: @dataclass class MyUserProfile(UserProfile): company: Optional[str] = field( default=None, metadata={"description": "Where they work"} ) The LLM will see this description when deciding how to update fields. Schemas: - UserProfile: Long-term user memory - SessionContext: Current session state - LearnedKnowledge: Reusable knowledge/insights - EntityMemory: Third-party entity facts - Decision: Decision logs (Phase 2) - Feedback: Behavioral feedback (Phase 2) - InstructionUpdate: Self-improvement (Phase 3)'
