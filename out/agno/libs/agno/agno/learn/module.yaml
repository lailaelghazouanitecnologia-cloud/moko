- file: learn/curate.py
  lines: 185
  layer: logic
  purpose: 'Curator ======= Memory maintenance for LearningMachine. Keeps memories tidy through: - Pruning: Remove old memories - Deduplication: Remove exact/near-exact duplicates Usage: >>> learning = LearningMachine(db=db, model=model, user_profile=True) >>> >>> # Remove memories older than 90 days, keep max 100 >>> removed = learning.curator.prune(user_id="alice", max_age_days=90, max_count=100) >>> >>> # Remove duplicate memories >>> deduped = learning.curator.deduplicate(user_id="alice")'
