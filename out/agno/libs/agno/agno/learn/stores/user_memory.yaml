purpose: 'User Memory Store ================= Storage backend for User Memory learning type. Stores unstructured observations about users that don''t fit into structured profile fields. These are long-term memories that persist across sessions. Key Features: - Background extraction from conversations - Agent tools for in-conversation updates - Multi-user isolation (each user has their own memories) - Add, update, delete memory operations Scope: - Memories are retrieved by user_id only - agent_id/team_id stored in DB columns for audit trail - agent_id/team_id stored on individual memories for granular audit Supported Modes: - ALWAYS: Automatic extraction after conversations - AGENTIC: Agent calls update_user_memory tool directly'
