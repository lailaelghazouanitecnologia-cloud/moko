types:
- name: ChromaDb
  kind: struct
  ctx: 'ChromaDb class for managing vector operations with ChromaDB. Args: collection: The name of the ChromaDB collection. If not provided, derived from ''name''. name: Name of the vector database. Also used as collection name if ''collection'' is not provided. description: Description of the vector database. id: Unique identifier for this vector database instance. embedder: The embedder to use when embedding the document contents. distance: The distance metric to use when searching for documents. path: The path to store the ChromaDB data (for persistent client). persistent_client: Whether to use a persistent client. search_type: The search type to use when searching for documents. - SearchType.vector: Pure vector similarity search (default) - SearchType.keyword: Keyword-based search using document content - SearchType.hybrid: Combines vector + FTS with Reciprocal Rank Fusion hybrid_rrf_k: RRF (Reciprocal Rank Fusion) constant for hybrid search. Controls ranking smoothness - higher values give more weight to lower-ranked results, lower values make top results more dominant. Default is 60 (per original RRF paper by Cormack et al.). reranker: The reranker to use when reranking documents. **kwargs: Additional arguments to pass to the ChromaDB client.'
