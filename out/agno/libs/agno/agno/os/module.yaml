- file: os/scopes.py
  lines: 487
  layer: logic
  purpose: 'AgentOS RBAC Scopes This module defines all available permission scopes for AgentOS RBAC (Role-Based Access Control). Scope Format: - Global resource scopes: `resource:action` - Per-resource scopes: `resource:<resource-id>:action` - Wildcards: `resource:*:action` for any resource The AgentOS ID is verified via the JWT `aud` (audience) claim. Examples: - `system:read` - Read system config - `agents:read` - List all agents - `agents:web-agent:read` - Read specific agent - `agents:web-agent:run` - Run specific agent - `agents:*:run` - Run any agent (wildcard) - `agent_os:admin` - Full access to everything'
  types: 1
  functions: 8
  imports: 0
  exports: 9
