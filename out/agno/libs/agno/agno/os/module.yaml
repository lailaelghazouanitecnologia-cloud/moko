  purpose: 'Managers for AgentOS. This module provides various manager classes for AgentOS: - WebSocketManager: WebSocket connection management for real-time streaming - EventsBuffer: Event buffering for agent/team/workflow reconnection support - WebSocketHandler: Handler for sending events over WebSocket connections These managers are used by agents, teams, and workflows for background WebSocket execution.'
