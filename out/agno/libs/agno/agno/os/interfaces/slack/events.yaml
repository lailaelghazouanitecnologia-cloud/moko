layer: logic
purpose: 'Slack Streaming Event Handlers ============================== Processes streaming events from agents, teams, and workflows, translating them into Slack task cards and buffered content. Key concepts: - Events are normalized (Team prefix stripped) for unified handling - Workflow mode suppresses inner agent events to reduce noise - Task cards track progress; content is buffered for streaming - Factory pattern generates simple paired handlers (Started/Completed)'
