- file: postgres/test_trace_upsert.py
  lines: 191
  layer: test
  purpose: 'Test script to reproduce the UniqueViolation race condition in upsert_trace (SYNC version). This script demonstrates the race condition that occurs when multiple concurrent calls to upsert_trace() attempt to insert the same trace_id using the synchronous PostgresDb class. The race condition window: 1. Thread A: SELECT - finds no existing trace 2. Thread B: SELECT - finds no existing trace (before A''s INSERT commits) 3. Thread A: INSERT - succeeds 4. Thread B: INSERT - FAILS with UniqueViolation'
