- file: async_postgres/test_trace_upsert.py
  lines: 184
  layer: test
  purpose: 'Test script to reproduce the UniqueViolation race condition in upsert_trace. This script demonstrates the race condition that occurs when multiple concurrent calls to upsert_trace() attempt to insert the same trace_id. The race condition window: 1. Task A: SELECT - finds no existing trace 2. Task B: SELECT - finds no existing trace (before A''s INSERT commits) 3. Task A: INSERT - succeeds 4. Task B: INSERT - FAILS with UniqueViolation'
