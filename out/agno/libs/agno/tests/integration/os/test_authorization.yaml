## Roska File Descriptor — os/test_authorization.py
file: os/test_authorization.py
lines: 2940
layer: test
purpose: 'Integration tests for JWT middleware with RBAC (scope-based authorization). This test suite validates the AgentOS RBAC system using simplified scopes: - Global resource: resource:action - Per-resource: resource:<resource-id>:action - Wildcards: resource:*:action - Admin: agent_os:admin - Full access to everything The AgentOS ID is verified via the JWT `aud` (audience) claim.'
