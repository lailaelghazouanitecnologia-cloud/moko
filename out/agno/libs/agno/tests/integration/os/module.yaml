- file: os/test_backround_tasks.py
  lines: 376
  layer: test
  purpose: 'Integration tests for background tasks in AgentOS. Note on Testing Background Tasks: When using httpx.AsyncClient with ASGITransport for testing, the ASGI transport waits for all background tasks to complete before returning the response. This is by design in the ASGI specification to ensure background tasks finish before app shutdown. Therefore, we cannot test timing/non-blocking behavior directly. Instead, we use mocking to verify that hooks are properly added to FastAPI''s BackgroundTasks when run_hooks_in_background=True, which proves they will run in the background in production environments. Note: run_hooks_in_background is configured at the AgentOS level (default=False) and propagated to agents/teams, rather than being set on individual agents.'
  types: 0
  functions: 11
  imports: 9
  exports: 11
