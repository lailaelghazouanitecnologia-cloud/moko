layer: test
purpose: 'Integration tests for AWS Bedrock Reranker. These tests require valid AWS credentials with access to Bedrock. Credentials can be provided via: - Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) - AWS credentials file (~/.aws/credentials) - AWS SSO session - IAM role (when running on AWS infrastructure) To run these tests: pytest libs/agno/tests/integration/reranker/test_aws_bedrock_reranker.py -v Note: - Amazon Rerank 1.0 is NOT available in us-east-1 (N. Virginia). - Use us-west-2 or another supported region.'
