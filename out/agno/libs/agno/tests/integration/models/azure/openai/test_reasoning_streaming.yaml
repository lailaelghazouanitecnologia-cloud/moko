layer: test
purpose: 'Integration tests for Azure OpenAI reasoning streaming functionality. This test verifies that reasoning content streams correctly (not all at once) for Azure OpenAI o-series models when used as a reasoning_model. Note: Azure OpenAI o-series models (o1, o3, o4) perform internal reasoning but do not expose the reasoning content via the API. The reasoning happens internally. The content output is treated as reasoning for these models. These tests verify the streaming reasoning feature where reasoning content is delivered incrementally via RunEvent.reasoning_content_delta events.'
