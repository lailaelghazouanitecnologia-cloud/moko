layer: test
purpose: 'Integration tests for team continue_run with add_history_to_context=True (issue #6884). When continue_run is called with run_id, messages are loaded from the DB where history is scrubbed (store_history_messages defaults to False). Without the fix, history from prior runs is missing in the continue_run context. These tests verify that: 1. continue_run(run_id=...) includes history from prior runs for team-level tools 2. A fresh team instance also gets history via run_id'
