  ctx: 'Tests to ensure step configuration is not mutated after HITL resolution. These tests verify that the workflow step definitions remain unchanged after HITL pauses are resolved. This is critical for workflow reusability - the same workflow instance should work correctly for multiple runs. Bug context: Previously, continue_run() would mutate step.requires_confirmation and step.requires_user_input to False after resolution, breaking subsequent runs.'
