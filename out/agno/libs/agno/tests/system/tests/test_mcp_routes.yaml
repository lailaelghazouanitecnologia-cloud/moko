## Roska File Descriptor — tests/test_mcp_routes.py
file: tests/test_mcp_routes.py
lines: 935
layer: test
purpose: 'Comprehensive System Tests for MCP (Model Context Protocol) Routes. These tests verify the MCP interface functionality provided by AgentOS. The MCP server exposes tools that can be called by MCP clients using Streamable HTTP transport (the modern MCP standard). Coverage: - Connection and authentication - Configuration and tool discovery - Running agents (local and remote) - Running teams (remote) - Running workflows (local and remote) - Session management for agents, teams, and workflows - Memory management (CRUD operations) - Error handling Run with: pytest test_mcp_routes.py -v --tb=short Note: These tests require the MCP server to be enabled on the gateway and require both gateway and remote servers to be running.'
