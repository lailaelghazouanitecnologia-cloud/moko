## Roska File Descriptor — agent/test_store_media_scrub_leak.py
file: agent/test_store_media_scrub_leak.py
lines: 217
layer: test
purpose: Reproduction tests for media leak through scrub_media_from_run_output. These tests prove that scrub_media_from_run_output() must null top-level output media fields (images/videos/audio/files), not just input/message media. Without the fix, member responses and workflow executor runs leak media to DB when the member/executor has store_media=False.
