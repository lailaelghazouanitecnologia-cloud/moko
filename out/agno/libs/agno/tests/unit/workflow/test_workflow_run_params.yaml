layer: test
purpose: 'Unit tests for Workflow run-level parameter resolution. Tests cover: - _resolve_run_params(): Merge and precedence logic for dependencies, metadata, and boolean context flags (add_dependencies_to_context, add_session_state_to_context) - RunContext creation: Resolved params are correctly set on RunContext - to_dict() / from_dict(): Round-trip serialization of new fields - Precedence: Workflow-level deps take precedence over agent-level deps when both are set (full replacement, not merge) - End-to-end: Full workflow.run() -> step -> agent.run() chain with MockTestModel'
