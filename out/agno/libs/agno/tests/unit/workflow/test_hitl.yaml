layer: test
purpose: 'Unit tests for Human-In-The-Loop (HITL) workflow functionality. Tests cover: - Step confirmation (requires_confirmation) - Step user input (requires_user_input) - Router user selection (Router.requires_user_input) - Error handling with on_error="pause" - Step rejection with on_reject="skip" - Workflow pause and resume via continue_run() - StepRequirement (including route selection), ErrorRequirement dataclasses - Serialization/deserialization of HITL requirements'
