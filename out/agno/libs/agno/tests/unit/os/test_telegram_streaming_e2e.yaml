layer: test
purpose: 'Comprehensive E2E tests for Telegram interface streaming, events, and edge cases. Tests cover: - Dispatch table event handling for all event types - StreamState lifecycle (build_display_html, send_or_edit, flush, finalize) - BotState dedup, session persistence (timestamp IDs, DB recovery), /new command - Router: streaming path, sync path, error handling, group/DM differences - Edge cases: empty content, overflow, terminal events, team vs agent prefixing'
