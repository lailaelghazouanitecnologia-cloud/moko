## Roska File Descriptor — models/test_generator_session_state.py
file: models/test_generator_session_state.py
lines: 285
layer: test
purpose: 'Tests for session_state persistence in generator-based tools. This test suite verifies that session_state modifications made during generator iteration are properly captured and not overwritten by stale state. The bug: When a tool is a generator function, updated_session_state was captured before the generator body executed. Any session_state modifications made during yield iterations would be lost when merge_dictionaries ran later, overwriting the changes with the stale pre-execution snapshot. Fix: For generators, we don''t capture updated_session_state in execute()/aexecute(). Instead, we re-capture it after the generator is fully consumed in base.py.'
