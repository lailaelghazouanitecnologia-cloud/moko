## Roska File Descriptor — openai/test_mixed_external_tools.py
file: openai/test_mixed_external_tools.py
lines: 427
layer: test
purpose: Tests for handling mixed external_execution and regular tools in OpenAI models. When an agent has a mix of tools where some use external_execution=True and others don't, format_function_call_results must correctly map tool_call_ids to function call results. Previously, index-based mapping caused misalignment when external tool calls were present but not executed (paused), leading to OpenAI API errors like 'No tool output found for function call call_XXX'.
