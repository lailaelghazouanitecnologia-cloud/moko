purpose: Regression test for Anthropic streaming metrics double-counting bug (#6537). Both MessageStartEvent and MessageStopEvent carry .message.usage with full token counts. The old code extracted usage from both, causing input_tokens to be summed twice via the += accumulation in base.py._populate_stream_data. The fix restricts usage extraction to MessageStopEvent only.
