purpose: 'Loop with User Confirmation HITL Example This example demonstrates start confirmation for Loop components. When `requires_confirmation=True`: - Pauses before the first iteration - User confirms -> execute loop - User rejects -> skip loop entirely This is useful for: - Optional iterative processing - User-controlled loop execution - Confirming expensive/time-consuming loops'
