file: loop/02_loop_confirmation_streaming.py
lines: 170
layer: logic
purpose: 'Loop with User Confirmation HITL Example (Streaming) This example demonstrates start confirmation for Loop components with streaming. When `requires_confirmation=True`: - Pauses before the first iteration - User confirms -> execute loop - User rejects -> skip loop entirely Streaming mode emits events like: - WorkflowStartedEvent - StepPausedEvent (when loop requires confirmation) - StepStartedEvent / StepCompletedEvent - WorkflowCompletedEvent Key difference from non-streaming: - Get WorkflowRunOutput from session after streaming completes'
