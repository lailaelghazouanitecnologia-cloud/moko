purpose: 'Basic Step Confirmation Example This example demonstrates how to pause a workflow for user confirmation before executing a step. The user can either: - Confirm: Step executes and workflow continues - Reject with on_reject=OnReject.cancel (default): Workflow is cancelled - Reject with on_reject=OnReject.skip: Step is skipped and workflow continues with next step'
