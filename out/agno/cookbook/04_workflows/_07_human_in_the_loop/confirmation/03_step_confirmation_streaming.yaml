## Roska File Descriptor — confirmation/03_step_confirmation_streaming.py
file: confirmation/03_step_confirmation_streaming.py
lines: 187
layer: logic
purpose: 'Step Confirmation with Streaming This example demonstrates how to pause a workflow for user confirmation before executing a step, with streaming execution for real-time event updates. Key differences from non-streaming: 1. workflow.run(..., stream=True) returns an Iterator of events 2. stream_events=True is required to receive StepStartedEvent/StepCompletedEvent 3. StepPausedEvent is emitted when a step requires confirmation 4. Get WorkflowRunOutput from session after streaming 5. Use workflow.continue_run(..., stream=True, stream_events=True) for consistent streaming The user can either: - Confirm: Step executes and workflow continues - Reject with on_reject=OnReject.cancel (default): Workflow is cancelled - Reject with on_reject=OnReject.skip: Step is skipped and workflow continues with next step'
