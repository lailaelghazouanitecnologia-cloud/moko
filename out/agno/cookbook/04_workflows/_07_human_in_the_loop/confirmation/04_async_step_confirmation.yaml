layer: logic
purpose: 'Demonstrates that the @pause decorator works correctly with async functions. The @pause decorator attaches metadata directly to the function without creating a wrapper, so async functions retain their async nature. This example shows: 1. An async step function decorated with @pause 2. Using acontinue_run for async workflow continuation 3. Simulating async I/O operations within the step'
