purpose: 'Step-Level User Input HITL Example This example demonstrates how to pause a workflow to collect user input using Step parameters directly (without the @pause decorator). This approach is useful when: - Using agent-based steps that need user parameters - You want to configure HITL at the Step level rather than on a function - You need to override or add HITL to existing functions/agents Use case: Collecting user preferences before an agent generates content.'
