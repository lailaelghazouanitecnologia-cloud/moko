layer: logic
purpose: 'Step-Level User Input HITL Example (Streaming) This example demonstrates how to handle HITL with streaming workflows. Key differences from non-streaming: 1. workflow.run(..., stream=True) returns an Iterator of events 2. stream_events=True is required to receive StepStartedEvent/StepCompletedEvent 3. Look for StepPausedEvent to detect HITL pauses 4. Events are processed as they stream in 5. Use workflow.continue_run(..., stream=True, stream_events=True) to continue with streaming This is useful for: - Real-time progress updates - Large workflows where you want incremental feedback - UI integrations that show step-by-step progress'
