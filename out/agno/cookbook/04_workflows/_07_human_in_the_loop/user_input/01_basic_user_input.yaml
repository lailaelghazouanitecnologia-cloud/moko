purpose: 'Basic User Input HITL Example This example demonstrates how to pause a workflow to collect user input before executing a step. The user input is then available to the step via step_input.additional_data["user_input"]. Use case: Collecting parameters from the user before processing data. Two ways to define user_input_schema: 1. List of UserInputField objects (recommended) - explicit and type-safe 2. List of dicts - simple but less explicit'
