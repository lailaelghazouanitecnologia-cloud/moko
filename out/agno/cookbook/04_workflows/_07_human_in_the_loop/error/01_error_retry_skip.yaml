layer: logic
purpose: 'Error HITL: Retry or Skip Failed Steps This example demonstrates how to use HITL when a step encounters an error. When a step with `on_error="pause"` fails, the workflow pauses and lets the user decide to either retry the step or skip it and continue with the next step. Use Case: - API calls that may fail due to rate limits or network issues - Operations that may timeout but could succeed on retry - Steps where intermittent failures are expected'
