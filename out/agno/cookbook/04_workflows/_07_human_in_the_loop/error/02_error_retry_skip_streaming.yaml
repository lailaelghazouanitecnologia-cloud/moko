purpose: 'Error HITL: Retry or Skip Failed Steps (Streaming) This example demonstrates how to use HITL when a step encounters an error, with streaming execution for real-time event updates. Key differences from non-streaming: 1. workflow.run(..., stream=True) returns an Iterator of events 2. stream_events=True is required to receive StepStartedEvent/StepCompletedEvent 3. Events include StepErrorEvent when errors occur 4. Get WorkflowRunOutput from session after streaming 5. Use workflow.continue_run(..., stream=True, stream_events=True) for consistent streaming Use Case: - API calls that may fail due to rate limits or network issues - Operations that may timeout but could succeed on retry - Steps where intermittent failures are expected - Real-time progress updates during workflow execution'
