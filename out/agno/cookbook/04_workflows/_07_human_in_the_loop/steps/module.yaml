  purpose: 'Steps Pipeline with User Confirmation HITL Example This example demonstrates how to use HITL with a Steps component, allowing the user to confirm before executing an entire pipeline of steps. When `requires_confirmation=True` on a Steps component: - User confirms -> Execute all steps in the pipeline - User rejects -> Skip the entire pipeline This is useful for: - Optional processing pipelines - Expensive/time-consuming step groups - User-controlled workflow sections'
