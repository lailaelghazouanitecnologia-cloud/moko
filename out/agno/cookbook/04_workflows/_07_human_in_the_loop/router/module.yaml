- file: router/04_router_confirmation.py
  lines: 167
  layer: logic
  purpose: 'Router with Confirmation HITL Example This example demonstrates the confirmation mode for Router components, which is different from the user selection mode. When `requires_confirmation=True` on a Router (with a selector): - The selector determines which steps to run - User is asked to confirm before executing those steps - User confirms -> Execute the selected steps - User rejects -> Skip the router entirely This is useful for: - Confirming automated routing decisions - Human oversight of programmatic selections - Safety checks before executing routed steps Note: This is different from `requires_user_input=True` which lets the user choose which steps to execute. Here, the selector chooses, but user confirms.'
  types: 0
