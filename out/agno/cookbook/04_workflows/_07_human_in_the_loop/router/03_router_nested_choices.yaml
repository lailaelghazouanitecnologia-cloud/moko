## Roska File Descriptor — router/03_router_nested_choices.py
file: router/03_router_nested_choices.py
lines: 248
layer: logic
purpose: 'Router with Nested Choices HITL Example This example demonstrates how to use HITL with nested step lists in Router choices. When choices contain nested lists like [step_a, [step_b, step_c]], the nested list becomes a Steps container that executes ALL steps in sequence when selected. Use cases: - Pre-defined pipelines that user can choose from - "Packages" of processing steps (e.g., "Basic", "Standard", "Premium") - Workflow templates where user picks a complete flow Flow: 1. Receive input (automatic) 2. User selects a processing package (single step OR a sequence of steps) 3. Execute the selected package (if nested, all steps run in sequence) 4. Generate output (automatic) Key concept: - choices=[step_a, [step_b, step_c], step_d] - "step_a" -> executes just step_a - "steps_group_1" -> executes step_b THEN step_c (chained) - "step_d" -> executes just step_d'
