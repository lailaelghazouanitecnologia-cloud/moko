purpose: 'Router with Multiple Selection HITL Example This example demonstrates how to let users select MULTIPLE paths to execute in sequence using a Router with allow_multiple_selections=True. Use cases: - Build-your-own pipeline (user picks which analyses to run) - Multi-step processing where user controls the steps - Customizable workflows with optional components Flow: 1. Collect data (automatic) 2. User selects one or more processing steps via Router HITL 3. Execute ALL selected steps in sequence (chained) 4. Summarize results (automatic)'
