purpose: 'Router with User Selection HITL Example This example demonstrates how to create a user-driven decision tree using a Router where the user selects which path to take at runtime. The Router with HITL pattern is powerful for: - Interactive wizards - User-driven workflows - Decision trees with human judgment - Dynamic routing based on user preferences Flow: 1. Analyze data (automatic step) 2. User chooses analysis type via Router HITL 3. Execute the chosen analysis path 4. Generate report (automatic step)'
