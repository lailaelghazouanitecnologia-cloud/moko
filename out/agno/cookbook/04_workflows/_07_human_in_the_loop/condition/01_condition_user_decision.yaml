layer: logic
purpose: 'Condition with User Decision HITL Example This example demonstrates how to use HITL with a Condition component, allowing the user to decide which branch to execute at runtime. When `requires_confirmation=True` on a Condition, the `on_reject` setting controls what happens when the user rejects: - on_reject="else" (default): Execute `else_steps` if provided, otherwise skip - on_reject="skip": Skip the entire condition (both branches) - on_reject="cancel": Cancel the workflow This is useful for: - User-driven decision points - Interactive branching workflows - A/B testing with human judgment'
