  purpose: 'Workflow Dependencies ===================== Demonstrates passing dependencies from the workflow level through to downstream agents. Dependencies are key-value pairs injected into RunContext. When add_dependencies_to_context is True, the agent includes them as additional context sent to the model. This is useful for injecting configuration, database connections, or other shared resources that every agent in the workflow should have access to. Dependency merges follow a precedence rule: - Run level dependencies win on key conflicts - Workflow-level dependencies (self.dependencies) fill in the rest'
