purpose: 'Example showing how to use Azure OpenAI Tools with Agno. Requirements: 1. Azure OpenAI service setup with DALL-E deployment and chat model deployment 2. Environment variables: - AZURE_OPENAI_API_KEY - Your Azure OpenAI API key - AZURE_OPENAI_ENDPOINT - The Azure OpenAI endpoint URL - AZURE_OPENAI_DEPLOYMENT - The deployment name for the language model - AZURE_OPENAI_IMAGE_DEPLOYMENT - The deployment name for an image generation model - OPENAI_API_KEY (for standard OpenAI example) The script will automatically run only the examples for which you have the necessary environment variables set.'
