purpose: 'E2B Tools Example - Demonstrates how to use the E2B toolkit for sandboxed code execution. This example shows how to: 1. Set up authentication with E2B API 2. Initialize the E2BTools with proper configuration 3. Create an agent that can run Python code in a secure sandbox 4. Use the sandbox for data analysis, visualization, and more Prerequisites: 1. Create an account and get your API key from E2B: - Visit https://e2b.dev/ - Sign up for an account - Navigate to the Dashboard to get your API key 2. Install required packages: uv pip install e2b_code_interpreter pandas matplotlib 3. Set environment variable: export E2B_API_KEY=your_api_key Features: - Run Python code in a secure sandbox environment - Upload and download files to/from the sandbox - Create and download data visualizations - Run servers within the sandbox with public URLs - Manage sandbox lifecycle (timeout, shutdown) - Access the internet from within the sandbox Usage: Run this script with the E2B_API_KEY environment variable set to interact with the E2B sandbox through natural language commands.'
