purpose: 'Example: Using ShopifyTools with an Agno Agent This example shows how to create an agent that can: - Analyze sales data and identify top-selling products - Find products that are frequently bought together - Track inventory levels and identify low-stock items - Generate sales reports and trends Prerequisites: Set the following environment variables: - SHOPIFY_SHOP_NAME -> Your Shopify shop name, e.g. "my-store" from my-store.myshopify.com - SHOPIFY_ACCESS_TOKEN -> Your Shopify access token You can get your Shopify access token from your Shopify Admin > Settings > Apps and sales channels > Develop apps Required scopes: - read_orders (for order and sales data) - read_products (for product information) - read_customers (for customer insights) - read_analytics (for analytics data)'
