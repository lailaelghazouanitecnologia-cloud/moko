  purpose: 'AWS SES (Simple Email Service) Setup Instructions: 1. Go to AWS SES Console and verify your domain or email address: - For production: a. Go to AWS SES Console > Verified Identities > Create Identity b. Choose "Domain" and follow DNS verification steps c. Add DKIM and SPF records to your domain''s DNS - For testing: a. Choose "Email Address" verification b. Click verification link sent to your email 2. Configure AWS Credentials: a. Create an IAM user: - Go to IAM Console > Users > Add User - Enable "Programmatic access" - Attach ''AmazonSESFullAccess'' policy b. Set up credentials (choose one method): Method 1 - Using AWS CLI: ``` aws configure # Enter your AWS Access Key ID # Enter your AWS Secret Access Key # Enter your default region ``` Method 2 - Set environment variables: ``` export AWS_ACCESS_KEY_ID=YOUR_ACCESS_KEY export AWS_SECRET_ACCESS_KEY=YOUR_SECRET_KEY ``` 3. Install required Python packages: ``` uv pip install boto3 agno ``` 4. Update the variables below with your configuration: - sender_email: Your verified sender email address - sender_name: Display name that appears in email clients - region_name: AWS region where SES is set up (e.g., ''us-east-1'', ''ap-south-1'')'
