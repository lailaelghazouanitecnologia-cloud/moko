purpose: 'Using Pipedream MCP servers with authentication This is an example of how to use Pipedream MCP servers with authentication. This is useful if your app is interfacing with the MCP servers in behalf of your users. 1. Get your access token. You can check how in Pipedream''s docs: https://pipedream.com/docs/connect/mcp/developers/ 2. Get the URL of the MCP server. It will look like this: https://remote.mcp.pipedream.net/<External user id>/<MCP app slug> 3. Set the environment variables: - MCP_SERVER_URL: The URL of the MCP server you previously got - MCP_ACCESS_TOKEN: The access token you previously got - PIPEDREAM_PROJECT_ID: The project id of the Pipedream project you want to use - PIPEDREAM_ENVIRONMENT: The environment of the Pipedream project you want to use 3. Install dependencies: uv pip install agno mcp'
