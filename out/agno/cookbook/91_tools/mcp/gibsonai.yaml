purpose: 'GibsonAI MCP Server - Create and manage databases with prompts This example shows how to connect a local GibsonAI MCP to Agno agent. You can instantly generate, modify database schemas and chat with your relational database using natural language. From prompt to a serverless database (MySQL, PostgresQL, etc.), auto-generated REST APIs for your data. Example prompts to try: - "Create a new GibsonAI project for my e-commerce app" - "Show me the current schema for my project" - "Add a ''products'' table with name, price, and description fields" - "Create a ''users'' table with authentication fields" - "Deploy my schema changes to production" How to setup and run: 1. Install [UV](https://docs.astral.sh/uv/) package manager. 2. Install the GibsonAI CLI: ```bash uvx --from gibson-cli@latest gibson auth login ``` 3. Install the required dependencies: ```bash uv pip install agno mcp openai ``` 4. Export your API key: ```bash export OPENAI_API_KEY="your_openai_api_key" ``` 5. Run the GibsonAI agent by running this file. 6. Check created database and schema on GibsonAI dashboard: https://app.gibsonai.com This logs you into the [GibsonAI CLI](https://docs.gibsonai.com/reference/cli-quickstart) so you can access all the features directly from your agent.'
