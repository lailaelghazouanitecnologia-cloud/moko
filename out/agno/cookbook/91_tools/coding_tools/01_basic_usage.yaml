purpose: 'CodingTools: Minimal Tools for Coding Agents ============================================= A single toolkit with 4 core tools (read, edit, write, shell) that lets an agent perform any coding task. Inspired by the Pi coding agent''s philosophy: a small number of composable tools is more powerful than many specialized ones. Core tools (enabled by default): - read_file: Read files with line numbers and pagination - edit_file: Exact text find-and-replace with diff output - write_file: Create or overwrite files - run_shell: Execute shell commands with timeout Exploration tools (opt-in): - grep: Search file contents - find: Search for files by glob pattern - ls: List directory contents'
