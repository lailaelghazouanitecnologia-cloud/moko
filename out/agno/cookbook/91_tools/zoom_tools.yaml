purpose: 'Zoom Tools Example - Demonstrates how to use the Zoom toolkit for meeting management. This example shows how to: 1. Set up authentication with Zoom API 2. Initialize the ZoomTools with proper credentials 3. Create an agent that can manage Zoom meetings 4. Use various Zoom API functionalities through natural language Prerequisites: ------------- 1. Create a Server-to-Server OAuth app in Zoom Marketplace: - Visit https://marketplace.zoom.us/ - Create a new app. Go to Develop -> Build App -> Server-to-Server OAuth. - Add required scopes: * meeting:write:admin * meeting:read:admin * cloud_recording:read:admin - Copy Account ID, Client ID, and Client Secret 2. Set environment variables: export ZOOM_ACCOUNT_ID=your_account_id export ZOOM_CLIENT_ID=your_client_id export ZOOM_CLIENT_SECRET=your_client_secret Features: --------- - Schedule new meetings - Get meeting details - List all meetings - Get upcoming meetings - Delete meetings - Get meeting recordings Usage: ------ Run this script with proper environment variables set to interact with the Zoom API through natural language commands.'
