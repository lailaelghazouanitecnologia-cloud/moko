purpose: 'Calendar Meeting Scheduler =========================== Finds a time that works for all attendees and creates the meeting. Multi-step workflow: check_availability across attendees, find overlapping free slots, present options, then create_event with the chosen time. Key concepts: - check_availability: FreeBusy API for multi-person scheduling - find_available_slots: user''s own free windows - create_event: with attendees, Google Meet link, and reminders - Multi-step agent reasoning: query -> analyze -> propose -> create Setup: 1. Create OAuth credentials at https://console.cloud.google.com (enable Calendar API) 2. Export GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PROJECT_ID env vars 3. pip install openai google-api-python-client google-auth-httplib2 google-auth-oauthlib 4. First run opens browser for OAuth consent, saves token.json for reuse'
