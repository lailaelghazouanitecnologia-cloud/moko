purpose: 'Gmail Action Item Extractor ============================ Extracts action items from email threads and returns a structured checklist. The agent reads a thread, identifies who needs to do what by when, and returns structured action items. This is an LLM reasoning task -- no special tool needed, just get_thread + output_schema. Key concepts: - get_thread: Fetches full thread context for multi-message analysis - output_schema: Forces structured action item extraction - add_datetime_to_context: Agent knows today''s date for deadline reasoning Setup: 1. Create OAuth credentials at https://console.cloud.google.com (enable Gmail API) 2. Export GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PROJECT_ID env vars 3. pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib 4. First run opens browser for OAuth consent, saves token.json for reuse'
