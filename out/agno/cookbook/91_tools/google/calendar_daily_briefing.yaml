purpose: 'Calendar Daily Briefing ======================= Summarizes today''s schedule into a structured briefing with meeting prep notes. The agent fetches today''s events, classifies each by type (meeting, focus time, personal), identifies gaps, and flags conflicts or back-to-back meetings. Key concepts: - output_schema: structured briefing matching DailyBriefing model - add_datetime_to_context: agent knows today''s date for time-aware queries - get_event + list_events: fetches overview then drills into details Setup: 1. Create OAuth credentials at https://console.cloud.google.com (enable Calendar API) 2. Export GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PROJECT_ID env vars 3. pip install openai google-api-python-client google-auth-httplib2 google-auth-oauthlib 4. First run opens browser for OAuth consent, saves token.json for reuse'
