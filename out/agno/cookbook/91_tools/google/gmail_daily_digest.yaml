purpose: 'Gmail Daily Digest ================== Summarizes recent emails into a structured daily digest grouped by priority. The agent fetches today''s emails, classifies each by category and urgency, and returns a structured report. Key concepts: - output_schema: Forces structured JSON output matching DailyDigest model - add_datetime_to_context: Agent knows today''s date for time-aware queries Setup: 1. Create OAuth credentials at https://console.cloud.google.com (enable Gmail API) 2. Export GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PROJECT_ID env vars 3. pip install openai google-api-python-client google-auth-httplib2 google-auth-oauthlib 4. First run opens browser for OAuth consent, saves token.json for reuse'
