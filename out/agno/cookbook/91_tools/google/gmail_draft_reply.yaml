purpose: 'Gmail Draft Reply Agent ======================= Reads a conversation thread and drafts a contextual reply. The agent never sends -- it only creates drafts for human review. Key concepts: - Thread-aware drafting: thread_id + message_id link the draft to the conversation Setup: 1. Create OAuth credentials at https://console.cloud.google.com (enable Gmail API) 2. Export GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PROJECT_ID env vars 3. pip install openai google-api-python-client google-auth-httplib2 google-auth-oauthlib 4. First run opens browser for OAuth consent, saves token.json for reuse'
