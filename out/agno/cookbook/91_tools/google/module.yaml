  purpose: 'Calendar Event Creator ====================== Creates detailed calendar events from natural language descriptions. The agent parses complex event requests and uses create_event with all available parameters: title, description, location, attendees, timezone, and Google Meet links. Key concepts: - create_event: full event creation with attendees and conferencing - update_event: modify existing events after creation - add_datetime_to_context: agent knows "now" for relative date references Setup: 1. Create OAuth credentials at https://console.cloud.google.com (enable Calendar API) 2. Export GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PROJECT_ID env vars 3. pip install openai google-api-python-client google-auth-httplib2 google-auth-oauthlib 4. First run opens browser for OAuth consent, saves token.json for reuse'
