- file: google/calendar_gmail_meeting_prep.py
  lines: 126
  layer: logic
  purpose: 'Meeting Prep Agent (Calendar + Gmail) ===================================== Prepares you for upcoming meetings by combining calendar and email context. Workflow: 1. Fetches your next meeting (or a specific one) from Google Calendar 2. Identifies attendees and their RSVP status 3. Searches Gmail for recent threads involving those attendees 4. Produces a structured prep brief: who''s coming, recent topics, open threads Key concepts: - Two toolkits on one agent: GoogleCalendarTools + GmailTools - Multi-step reasoning: calendar lookup -> attendee extraction -> email search - output_schema: structured meeting prep brief - add_datetime_to_context: agent knows "now" for finding the next meeting Setup: 1. Enable both Calendar API and Gmail API at https://console.cloud.google.com 2. Export GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PROJECT_ID env vars 3. pip install openai google-api-python-client google-auth-httplib2 google-auth-oauthlib 4. First run opens browser for OAuth consent (grants both Calendar + Gmail access) The same token.json works for both APIs if scopes include both.'
  types: 3
  functions: 0
  imports: 6
  exports: 4
- file: google/gmail_inbox_triage.py
  lines: 84
  layer: logic
  purpose: 'Gmail Inbox Triage ================== A personal inbox triage agent that learns your preferences across sessions. Combines Gmail tools with the Learning Machine to build persistent memory: - Learns your communication tone and style - Remembers frequent contacts and relationships - Adapts drafts to match your writing patterns - Uses date awareness for time-relative queries ("last week", "this month") Key concepts: - LearningMachine with UserMemoryConfig: Persistent preference storage - add_datetime_to_context: Date-aware email queries without unix timestamps - get_thread + get_message: Full context before drafting - Multi-session learning: Agent improves with each interaction Setup: 1. Create OAuth credentials at https://console.cloud.google.com (enable Gmail API) 2. Export GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PROJECT_ID env vars 3. pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib 4. Start PostgreSQL: cookbook/scripts/run_pgvector.sh 5. First run opens browser for OAuth consent, saves token.json for reuse'
  types: 0
  functions: 0
  imports: 7
  exports: 2
