  purpose: 'Gmail Follow-Up Tracker ======================= Finds sent emails that never received a reply and drafts follow-ups. Key concepts: - Multi-step reasoning: agent must compare sender vs user email per thread - add_datetime_to_context: agent calculates days_waiting from message dates - output_schema: structured report of pending follow-ups Setup: 1. Create OAuth credentials at https://console.cloud.google.com (enable Gmail API) 2. Export GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_PROJECT_ID env vars 3. pip install openai google-api-python-client google-auth-httplib2 google-auth-oauthlib 4. First run opens browser for OAuth consent, saves token.json for reuse'
