purpose: 'OpenCV Tools - Computer Vision and Image Processing This example demonstrates how to use OpenCVTools for computer vision tasks. Shows enable_ flag patterns for selective function access. OpenCVTools is a small tool (<6 functions) so it uses enable_ flags. Steps to use OpenCV Tools: 1. Install OpenCV - Run: uv pip install opencv-python 2. Camera Permissions (macOS) - Go to System Settings > Privacy & Security > Camera - Enable camera access for Terminal or your IDE 3. Camera Permissions (Linux) - Ensure your user is in the video group: sudo usermod -a -G video $USER - Restart your session after adding to the group 4. Camera Permissions (Windows) - Go to Settings > Privacy > Camera - Enable "Allow apps to access your camera" Note: Make sure your webcam is connected and not being used by other applications.'
