  purpose: 'Entity Memory: Facts and Events (Deep Dive) ============================================ Semantic (facts) vs episodic (events) memory for entities. Entity Memory stores knowledge about external entities: - Facts: Timeless truths ("Acme uses PostgreSQL") - Events: Time-bound occurrences ("Acme raised $30M on Jan 15") AGENTIC mode gives the agent tools to create/update entities. Compare with: 04_always_extraction.py for automatic extraction. See also: 01_basics/5a_entity_memory_always.py for the basics.'
