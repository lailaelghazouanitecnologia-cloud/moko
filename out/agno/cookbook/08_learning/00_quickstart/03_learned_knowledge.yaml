purpose: 'Learning Machines: Learned Knowledge ==================================== Learned Knowledge stores insights that transfer across users. One person teaches the agent something. Another person benefits. In AGENTIC mode, the agent receives tools to: - search_learnings: Find relevant past knowledge - save_learning: Store a new insight The agent decides when to save and apply learnings.'
