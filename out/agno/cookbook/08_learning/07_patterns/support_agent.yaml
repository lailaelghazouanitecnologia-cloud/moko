purpose: 'Pattern: Support Agent with Learning ==================================== A customer support agent that learns from interactions. This pattern combines: - User Profile: Customer history and preferences - Session Context: Current ticket/issue tracking - Entity Memory: Products, past tickets (shared across org) - Learned Knowledge: Solutions and troubleshooting patterns (shared) The agent gets faster at resolving issues by learning from successes. See also: 01_basics/ for individual store examples.'
