- file: dbs/gcs_json.py
  lines: 84
  layer: logic
  purpose: 'Example showing how to use AgentOS with JSON files hosted in GCS as database. GCS JSON Database Setup: - Uses JSON files stored in Google Cloud Storage as a lightweight database - Only requires a GCS bucket name - authentication follows the standard GCP patterns: * Local development: `gcloud auth application-default login` * Production: Set GOOGLE_APPLICATION_CREDENTIALS env var to service account key path * GCP instances: Uses instance metadata automatically - Optional prefix parameter for organizing files (defaults to empty string) - Automatically creates JSON files in the bucket as needed Prerequisites: 1. Create a GCS bucket 2. Ensure proper GCS permissions 3. Install google-cloud-storage: `uv pip install google-cloud-storage`'
