  purpose: 'Example for AgentOS with Shopify tools. Prerequisites: - Set the following environment variables: - SHOPIFY_SHOP_NAME -> Your Shopify shop name, e.g. "my-store" from my-store.myshopify.com - SHOPIFY_ACCESS_TOKEN -> Your Shopify access token You can get your Shopify access token from your Shopify Admin > Settings > Apps and sales channels > Develop apps Required scopes: - read_orders (for order and sales data) - read_products (for product information) - read_customers (for customer insights) - read_analytics (for analytics data)'
