purpose: 'Advanced Trace Filtering ======================== Demonstrates the FilterExpr DSL for composable trace queries. This cookbook shows how to: 1. Run agents with tracing enabled 2. Use the FilterExpr DSL to build complex search queries 3. Convert filters to SQLAlchemy WHERE clauses 4. Query traces with advanced filters (AND/OR/NOT, CONTAINS, range queries) The FilterExpr DSL supports: - Comparison: EQ, NEQ, GT, GTE, LT, LTE - Inclusion: IN - String matching: CONTAINS (case-insensitive), STARTSWITH (prefix) - Logical: AND, OR, NOT Requirements: uv pip install agno opentelemetry-api opentelemetry-sdk openinference-instrumentation-agno'
