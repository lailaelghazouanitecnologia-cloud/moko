- file: remote/05_agent_os_gateway.py
  lines: 173
  layer: logic
  purpose: 'Example showing how to use an AgentOS instance as a gateway to remote agents, teams and workflows. This gateway demonstrates combining multiple remote agent sources: 1. AgentOS protocol agents (from server.py on port 7778) 2. Agno A2A protocol agents (from agno_a2a_server.py on port 7779) 3. Google ADK A2A protocol agents (from adk_server.py on port 7780) 4. Local agents and workflows Prerequisites: - Start server.py on port 7778 - Start agno_a2a_server.py on port 7779 - Start adk_server.py on port 7780 (requires GOOGLE_API_KEY) # Note: - Remote Workflows via Websocket are not yet supported - If authorization is enabled on remote servers and all endpoints are protected, not all of the functions work correctly on the gateway. Specifically /config, /workflows, /workflows/{workflow_id}, /agents, /teams, /agent/{agent_id}, /team/{team_id} need to be unprotected for the gateway to work correctly.'
