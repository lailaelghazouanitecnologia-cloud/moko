  purpose: 'Advanced RBAC Example with AgentOS - Simplified Scopes with Audience Verification This example demonstrates the AgentOS RBAC system with simplified scope format: Scope Format: 1. Global resource scopes: resource:action 2. Per-resource scopes: resource:<resource-id>:action 3. Wildcard support: resource:*:action Scope Examples: - system:read - Read system config - agents:read - List all agents - agents:web-agent:read - Read specific agent - agents:web-agent:run - Run specific agent - agents:*:run - Run ANY agent (wildcard) - agent_os:admin - Full access to everything Prerequisites: - Set JWT_VERIFICATION_KEY environment variable - Endpoints automatically filter based on user scopes'
