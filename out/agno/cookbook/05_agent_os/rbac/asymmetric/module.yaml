  purpose: 'Basic RBAC Example with AgentOS (Asymmetric Keys) This example demonstrates how to enable RBAC (Role-Based Access Control) with JWT token authentication using RS256 asymmetric keys. RS256 uses: - Private key: Used by your auth server to SIGN tokens - Public key: Used by AgentOS to VERIFY token signatures Prerequisites: - Set JWT_SIGNING_KEY and JWT_VERIFICATION_KEY environment variables with your public and private keys (PEM format) - Or generate keys at runtime for testing (as shown below) - Endpoints are automatically protected with default scope mappings'
