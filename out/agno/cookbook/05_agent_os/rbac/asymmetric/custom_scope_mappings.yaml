purpose: 'Custom Scope Mappings Example This example demonstrates how to define custom scope mappings for your AgentOS endpoints. You can specify exactly which scopes are required for each endpoint. RS256 uses: - Private key: Used by your auth server to SIGN tokens - Public key: Used by AgentOS to VERIFY token signatures Pre-requisites: - Set JWT_SIGNING_KEY and JWT_VERIFICATION_KEY environment variables with your public and private keys (PEM format) - Or generate keys at runtime for testing (as shown below) - Endpoints are automatically protected with default scope mappings'
