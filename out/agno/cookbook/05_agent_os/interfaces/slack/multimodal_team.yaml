purpose: 'Multimodal Team =============== Tests streaming a multi-agent team with multimodal input/output in Slack. Capabilities tested: - Image INPUT:  Send an image to the bot, team analyzes it (GPT-4o vision) - Image OUTPUT: Ask to generate an image, DALL-E creates it, uploaded to Slack - File INPUT:   Send a CSV/text file, team analyzes it - Combined:     Send image + ask to modify/recreate it Team members: - Vision Analyst: Understands images and files via GPT-4o - Creative Agent: Generates images via DALL-E + web search Slack scopes: app_mentions:read, assistant:write, chat:write, im:history, files:read, files:write'
