  purpose: 'Multiple Slack Bot Instances ============================ Deploy multiple agents as separate Slack bots in one workspace. Each bot has its own identity, token, and signing secret. Setup: 1. Create two Slack apps at https://api.slack.com/apps 2. Install both apps to the same workspace 3. Set each app''s Event Subscription URL to its prefix: - @ResearchBot  ->  https://myapp.com/research/events - @AnalystBot   ->  https://myapp.com/analyst/events 4. Set environment variables (or pass tokens directly): RESEARCH_SLACK_TOKEN, RESEARCH_SLACK_SIGNING_SECRET ANALYST_SLACK_TOKEN,  ANALYST_SLACK_SIGNING_SECRET Slack scopes (per app): app_mentions:read, assistant:write, chat:write, im:history'
