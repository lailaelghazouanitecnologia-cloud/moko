purpose: 'Multi-Bot Streaming Test ======================== Two agents on the same Slack workspace, mounted on different prefixes. Both use streaming mode. Tests session isolation: each bot gets its own DB session even when responding in the same thread. Setup: 1. Two Slack apps (Ace + Dash) installed to the same workspace 2. Event Subscription URLs: Ace  -> https://<tunnel>/ace/events Dash -> https://<tunnel>/slack/events 3. Environment variables: ACE_SLACK_TOKEN,  ACE_SLACK_SIGNING_SECRET DASH_SLACK_TOKEN, DASH_SLACK_SIGNING_SECRET 4. ngrok: ngrok http --domain=<your-subdomain>.ngrok-free.dev 7777 Slack scopes (per app): app_mentions:read, assistant:write, chat:write, im:history'
