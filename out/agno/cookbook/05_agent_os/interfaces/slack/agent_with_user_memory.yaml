purpose: 'Agent With User Memory ====================== A personal assistant that remembers users across conversations using ``MemoryManager``. The agent captures names, hobbies, and preferences, then uses that context in future chats. Key concepts: - ``MemoryManager`` extracts and stores user facts after each run. - ``update_memory_on_run=True`` triggers automatic memory capture. - ``memory_capture_instructions`` tell the manager what to look for. Slack scopes: app_mentions:read, assistant:write, chat:write, im:history'
