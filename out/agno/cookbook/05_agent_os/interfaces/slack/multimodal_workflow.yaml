purpose: 'Multimodal Workflow =================== Tests streaming a workflow with multimodal input/output in Slack. Capabilities tested: - Image INPUT:  Send an image, workflow processes it through steps - Image OUTPUT: DALL-E generates images during workflow steps - Parallel execution: Two steps run simultaneously - Sequential synthesis: Final step combines parallel results Workflow structure: Parallel: - Visual Analysis (analyzes any input images/files) - Web Research (searches for related context) Sequential: - Creative Synthesis (generates a new image inspired by analysis + research) Slack scopes: app_mentions:read, assistant:write, chat:write, im:history, files:read, files:write'
