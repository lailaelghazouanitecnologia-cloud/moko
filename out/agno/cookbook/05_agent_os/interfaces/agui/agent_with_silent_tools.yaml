purpose: Silent External Tools - Suppress verbose messages in frontends When using `external_execution=True`, the agent prints "I have tools to execute..." messages. Add `external_execution_silent=True` to suppress these for cleaner UX in production. This cookbook is for AgentOS/AGUI where tool execution happens in the frontend. The frontend will receive the tool call and handle execution on the client side.
