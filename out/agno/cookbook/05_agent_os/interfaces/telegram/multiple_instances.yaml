purpose: 'Multiple Telegram Bot Instances ================================ Runs two agents behind a single Telegram bot using URL path prefixes to route messages. Each agent gets its own webhook endpoint and can optionally use a separate bot token for full isolation. Key concepts: - ``prefix="/basic"`` and ``prefix="/web-research"`` give each agent its own webhook path. - Pass ``token=`` per instance to use separate bot tokens, or omit to share one. - Both agents share the same AgentOS server and SQLite database. Setup: Set TELEGRAM_TOKEN env var from @BotFather.'
