purpose: 'Basic Telegram Agent ==================== Minimal Telegram bot that responds to messages in private chats and when mentioned in groups. Uses SQLite for session persistence so the agent remembers conversation history across restarts. Key concepts: - ``reply_to_mentions_only=True`` ignores regular group messages and only responds when the bot is mentioned with @. - ``add_history_to_context=True`` feeds the last N runs back into the prompt. Setup: Set TELEGRAM_TOKEN env var from @BotFather.'
