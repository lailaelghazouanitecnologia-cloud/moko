layer: logic
purpose: 'Streaming Workflow on Telegram ============================== Two-step research-and-write workflow with real-time step progress in chat. The user sees live status updates as each step runs: > Running step: research... > Completed step: research > Running step: write... Key concepts: - ``streaming=True`` on the Telegram interface enables live progress. - ``Steps`` chains sequential ``Step`` objects (research then write). - Each step has its own agent with specialised instructions and tools. Setup: 1. ``pip install ''agno[telegram,openai]''`` 2. ``export TELEGRAM_TOKEN="..." OPENAI_API_KEY="..."`` 3. Run this file, then expose via ngrok and set the Telegram webhook.'
