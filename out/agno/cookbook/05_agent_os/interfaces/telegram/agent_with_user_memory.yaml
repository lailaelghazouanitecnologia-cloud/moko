purpose: 'Telegram Agent with User Memory ================================ Personal assistant bot that remembers user preferences, hobbies, and interests across conversations. Uses MemoryManager to automatically capture and recall personal details from chat history. Key concepts: - ``MemoryManager`` with custom capture instructions extracts user info. - ``enable_agentic_memory=True`` lets the agent store and retrieve memories. - ``WebSearchTools`` provides live information for conversational context. Setup: Set TELEGRAM_TOKEN env var from @BotFather.'
