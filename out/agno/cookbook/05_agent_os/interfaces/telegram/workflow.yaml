purpose: 'Telegram Workflow Agent ======================= Two-step draft-and-edit workflow on Telegram. A Drafter agent writes an initial response, then an Editor agent polishes it for clarity and conciseness before sending the final result to the user. Key concepts: - ``Workflow`` with sequential ``Steps`` chains multiple agents. - The workflow (not individual agents) is passed to the Telegram interface. - SQLite session persistence keeps conversation history across restarts. Setup: Set TELEGRAM_TOKEN env var from @BotFather.'
