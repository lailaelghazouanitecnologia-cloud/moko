purpose: 'Team Task Streaming Demo with AgentOS This example demonstrates how to expose a Team running in `tasks` mode via AgentOS. You can use the AgentOS API to send requests and test task streaming. Usage: uv run cookbook/05_agent_os/team_tasks_streaming.py Then you can test streaming using curl: curl -X POST http://0.0.0.0:7777/v1/teams/research-team/runs/stream \ -H "Content-Type: application/json" \ -d ''{"message": "What are the key benefits of microservices architecture?"}'''
