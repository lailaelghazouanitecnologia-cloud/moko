purpose: 'Google ADK A2A Server for testing A2AClient. This server uses Google''s Agent Development Kit (ADK) to create an A2A-compatible agent that can be tested with Agno''s A2AClient. Note: To enable streaming, you need to set the `streaming` capability to `true` in the agent card. This means creating a custom agent card and providing it to the `to_a2a` function. For example: ```python agent_card = AgentCard( name="facts_agent", description="Agent that provides interesting facts.", url="http://localhost:8001", version="1.0.0", capabilities=AgentCapabilities(streaming=True, push_notifications=False, state_transition_history=False), skills=[], default_input_modes=["text/plain"], default_output_modes=["text/plain"], ) ``` Prerequisites: uv pip install google-adk a2a-sdk uvicorn export GOOGLE_API_KEY=your_key Usage: python cookbook/06_agent_os/client_a2a/servers/google_adk_server.py The server will start at http://localhost:8001'
