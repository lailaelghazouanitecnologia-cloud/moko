- file: customize/override_routes.py
  lines: 91
  layer: logic
  purpose: 'Example AgentOS app with a custom FastAPI app with conflicting routes. This example demonstrates the `on_route_conflict="preserve_base_app"` functionality which allows your custom routes to take precedence over conflicting AgentOS routes. When `on_route_conflict="preserve_base_app"`: - Your custom routes (/, /health) will be preserved - Conflicting AgentOS routes will be skipped - Non-conflicting AgentOS routes will still be added When `on_route_conflict="preserve_agentos"` (default): - AgentOS routes will override your custom routes - Warnings will be logged about the conflicts'
