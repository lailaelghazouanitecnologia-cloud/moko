purpose: 'Example: Background Output Evaluation with Agent-as-Judge This example demonstrates how to use a validator agent to evaluate the main agent''s output as a background task. Unlike blocking validation, background evaluation: - Does NOT block the response to the user - Logs evaluation results for monitoring and analytics - Can trigger alerts or store metrics without affecting latency Use cases: - Quality monitoring in production - A/B testing response quality - Compliance auditing - Building evaluation datasets'
