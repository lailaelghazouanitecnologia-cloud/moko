file: scheduler/demo.py
lines: 80
layer: logic
purpose: 'Running the scheduler inside AgentOS with programmatic schedule creation. This example demonstrates: - Setting scheduler=True on AgentOS to enable cron polling - Using ScheduleManager to create schedules directly (no curl needed) - The poller starts automatically on app startup and executes due schedules Run with: .venvs/demo/bin/python cookbook/05_agent_os/scheduler/demo.py'
