purpose: 'Running the scheduler inside AgentOS with automatic polling. This example demonstrates the primary DX for the scheduler: - Setting scheduler=True on AgentOS to enable cron polling - The poller starts automatically on app startup and stops on shutdown - Schedules are created via the REST API (POST /schedules) - The internal service token handles auth between scheduler and agent endpoints Run with: .venvs/demo/bin/python cookbook/05_agent_os/scheduler/scheduler_with_agentos.py'
