purpose: Output Model ============================= Use a separate output model to refine the main model's response. The output_model receives the same conversation but generates its own response, replacing the main model's output. This is useful when you want a cheaper model to handle reasoning/tool-use and a more capable model to produce the final polished answer. For structured JSON output, use ``parser_model`` instead (see parser_model.py).
