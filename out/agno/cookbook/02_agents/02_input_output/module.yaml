- file: 02_input_output/followup_suggestions.py
  lines: 64
  layer: logic
  purpose: 'Followups (Built-in) ==================== Enable built-in followup prompts on any agent with a single flag. After the main response, the agent automatically makes a second model call to generate structured followup prompts and attaches them to RunOutput. Key concepts: - followups=True: enables the feature - num_followups: controls how many suggestions (default 3) - followup_model: optional cheaper model for generating followups - run_response.followups: the structured result The main response is never constrained — it streams freely as normal text. Example prompts to try: - "Which national park is the best?" - "What programming language should I learn first?" - "How do I start investing?"'
  types: 0
  functions: 0
  imports: 3
  exports: 1
- file: 02_input_output/followup_suggestions_streaming.py
  lines: 69
  layer: logic
  purpose: 'Followups — Streaming ===================== Stream the main response token-by-token and capture followup suggestions via events at the end. Key concepts: - stream=True, stream_events=True: enables streaming with events - RunEvent.run_content: tokens of the main response - RunEvent.followups_completed: carries the finished followup suggestions'
  types: 0
  functions: 1
