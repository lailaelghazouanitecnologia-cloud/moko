purpose: 'Search Session History ====================== Demonstrates the two-step list-then-read pattern for accessing previous sessions. The agent gets two tools: - search_past_sessions() -- lightweight per-run previews of recent sessions - read_past_session(session_id) -- full conversation for a specific session Enable with `search_past_sessions=True`. Optionally set `num_past_sessions_to_search` to control how many past sessions are searched (default 20) and `num_past_session_runs_in_search` to control how many runs per session appear in the preview (default 3).'
