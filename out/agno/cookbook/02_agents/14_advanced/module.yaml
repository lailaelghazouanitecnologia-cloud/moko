  layer: logic
  purpose: 'Combined Metrics ============================= When an agent uses multiple background features, each model''s calls are tracked under separate detail keys: - "model" for the agent''s own calls - "reasoning_model" for reasoning manager calls - "compression_model" for compression manager calls - "output_model" for output model calls - "memory_model" for memory manager calls - "culture_model" for culture manager calls - "session_summary_model" for session summary calls - "eval_model" for evaluation hook calls This example shows all detail keys and session-level metrics.'
