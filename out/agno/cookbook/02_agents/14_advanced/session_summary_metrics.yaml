purpose: Session Summary Metrics ============================= When an agent uses a SessionSummaryManager, the summary model's token usage is tracked separately under the "session_summary_model" detail key. This lets you see how many tokens are spent summarizing the session versus the agent's own model calls. The session summary runs after each interaction to maintain a concise summary of the conversation so far.
