file: 14_advanced/background_execution.py
lines: 185
layer: logic
purpose: 'Example demonstrating background execution with polling and cancellation. Background execution allows you to start an agent run that returns immediately with a PENDING status, while the actual work continues in the background. You can then poll for completion or cancel the run. Requirements: - PostgreSQL running (./cookbook/scripts/run_pgvector.sh) - OPENAI_API_KEY set Usage: .venvs/demo/bin/python cookbook/02_agents/other/background_execution.py'
