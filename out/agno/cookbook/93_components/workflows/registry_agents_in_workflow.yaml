layer: logic
purpose: 'Cookbook: Code-defined agents available to UI-built workflows. This sets up an AgentOS with code-defined agents. When a user builds a workflow through the UI: 1. The UI fetches available agents from /registry (code-defined) and /components (DB-stored) to populate the step agent dropdown. 2. The user selects a code-defined agent (e.g. "research-agent") for a step. 3. The workflow is saved to DB with just the agent_id reference. 4. When the workflow is loaded back, Step.from_dict() resolves the agent from the Registry first, falling back to DB only if not found. The agents below are never saved to the database -- they live in memory via the Registry, which AgentOS auto-populates on startup. Important: Code-defined agents MUST have explicit, stable `id` values. The UI stores these IDs in the workflow config. If the ID changes between restarts, the workflow will fail to resolve the agent.'
