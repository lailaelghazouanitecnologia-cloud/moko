  purpose: 'Multi-Agent Team - Investment Research Team ============================================ This example shows how to create a team of agents that work together. Each agent has a specialized role, and the team leader coordinates. We''ll build an investment research team with opposing perspectives: - Bull Agent: Makes the case FOR investing - Bear Agent: Makes the case AGAINST investing - Lead Analyst: Synthesizes into a balanced recommendation This adversarial approach produces better analysis than a single agent. Key concepts: - Team: A group of agents coordinated by a leader - Members: Specialized agents with distinct roles - The leader delegates, synthesizes, and produces final output Example prompts to try: - "Should I invest in NVIDIA?" - "Analyze Tesla as a long-term investment" - "Is Apple overvalued right now?"'
