  purpose: 'Agent with Typed Input and Output - Full Type Safety ===================================================== This example shows how to define both input and output schemas for your agent. You get end-to-end type safety: validate what goes in, guarantee what comes out. Perfect for building robust pipelines where you need contracts on both ends. The agent validates inputs and guarantees output structure. Key concepts: - input_schema: A Pydantic model defining what the agent accepts - output_schema: A Pydantic model defining what the agent returns - Pass input as a dict or Pydantic model — both work Example inputs to try: - {"ticker": "NVDA", "analysis_type": "quick", "include_risks": True} - {"ticker": "TSLA", "analysis_type": "deep", "include_risks": True}'
