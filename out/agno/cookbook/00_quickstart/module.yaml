- file: 00_quickstart/human_in_the_loop.py
  lines: 239
  layer: logic
  purpose: 'Human in the Loop - Confirm Before Taking Action ================================================ This example shows how to require user confirmation before executing certain tools. Critical for actions that are irreversible or sensitive. We''ll build on our self-learning agent, and ask for user confirmation before saving a learning. Key concepts: - @tool(requires_confirmation=True): Mark tools that need approval - run_response.active_requirements: Check for pending confirmations - requirement.confirm() / requirement.reject(): Approve or deny - agent.continue_run(): Resume execution after decision Some practical applications: - Confirming sensitive operations before execution - Reviewing API calls before they''re made - Validating data transformations - Approving automated actions in critical systems Example prompts to try: - "What''s a good P/E ratio for tech stocks? Save that insight." - "Analyze NVDA and save any insights" - "What learnings do we have saved?"'
