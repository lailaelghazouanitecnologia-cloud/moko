  lines: 214
  layer: logic
  purpose: 'Custom Tool for Self-Learning - Write Your Own Tools ===================================================== This example shows how to write custom tools for your agent. A tool is just a Python function — the agent calls it when needed. We''ll build a self-learning agent that can save insights to a knowledge base. The key concept: any function can become a tool. Key concepts: - Tools are Python functions with docstrings (the docstring tells the agent what the tool does) - The agent decides when to call your tool based on the conversation - Return a string to communicate results back to the agent Example prompts to try: - "What''s a good P/E ratio for tech stocks? Save that insight." - "Remember that NVDA''s data center revenue is the key growth driver" - "What learnings do we have saved?"'
