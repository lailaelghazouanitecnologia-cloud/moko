purpose: 'Agent with State Management - Finance Agent with Watchlist =========================================================== This example shows how to give your agent persistent state that it can read and modify. The agent maintains a stock watchlist across conversations. Different from storage (conversation history) and memory (user preferences), state is structured data the agent actively manages: counters, lists, flags. Key concepts: - session_state: A dict that persists across runs - Tools can read/write state via run_context.session_state - State variables can be injected into instructions with {variable_name} Example prompts to try: - "Add NVDA and AMD to my watchlist" - "What''s on my watchlist?" - "Remove AMD from the list" - "How are my watched stocks doing today?"'
