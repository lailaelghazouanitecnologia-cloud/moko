purpose: 'Agent OS - Web Interface for Your Agents ========================================= This file starts an Agent OS server that provides a web interface for all the agents, teams, and workflows in this Quick Start guide. What is Agent OS? ----------------- Agent OS is Agno''s runtime that lets you: - Chat with your agents through a beautiful web UI - Explore session history - Monitor traces and debug agent behavior - Manage knowledge bases and memories - Switch between agents, teams, and workflows How to Use ---------- 1. Start the server: python cookbook/00_quickstart/run.py 2. Visit https://os.agno.com in your browser 3. Add your local endpoint: http://localhost:7777 4. Select any agent, team, or workflow and start chatting Prerequisites ------------- - All agents from this quick start are registered automatically - For the knowledge agent, load the knowledge base first: python cookbook/00_quickstart/agent_search_over_knowledge.py Learn More ---------- - Agent OS Overview: https://docs.agno.com/agent-os/overview - Agno Documentation: https://docs.agno.com'
