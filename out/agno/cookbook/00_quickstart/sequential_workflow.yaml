purpose: 'Sequential Workflow - Stock Research Pipeline ============================================== This example shows how to create a workflow with sequential steps. Each step is handled by a specialized agent, and outputs flow to the next step. Different from Teams (agents collaborate dynamically), Workflows give you explicit control over execution order and data flow. Key concepts: - Workflow: Orchestrates a sequence of steps - Step: Wraps an agent with a specific task - Steps execute in order, each building on the previous Example prompts to try: - "Analyze NVDA" - "Research Tesla for investment" - "Give me a report on Apple"'
