purpose: 'Agent with Storage - Finance Agent with Storage ==================================================== Building on the Finance Agent from 01, this example adds persistent storage. Your agent now remembers conversations across runs. Ask about NVDA, close the script, come back later — pick up where you left off. The conversation history is saved to SQLite and restored automatically. Key concepts: - Run: Each time you run the agent (via agent.print_response() or agent.run()) - Session: A conversation thread, identified by session_id - Same session_id = continuous conversation, even across runs Example prompts to try: - "What''s the current price of AAPL?" - "Compare that to Microsoft" (it remembers AAPL) - "Based on our discussion, which looks better?" - "What stocks have we analyzed so far?"'
