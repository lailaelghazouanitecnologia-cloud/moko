purpose: 'Agent with Memory - Finance Agent that Remembers You ===================================================== This example shows how to give your agent memory of user preferences. The agent remembers facts about you across all conversations. Different from storage (which persists conversation history), memory persists user-level information: preferences, facts, context. Key concepts: - MemoryManager: Extracts and stores user memories from conversations - enable_agentic_memory: Agent decides when to store/recall via tool calls (efficient) - update_memory_on_run: Memory manager runs after every response (guaranteed capture) - user_id: Links memories to a specific user Example prompts to try: - "I''m interested in tech stocks, especially AI companies" - "My risk tolerance is moderate" - "What stocks would you recommend for me?"'
