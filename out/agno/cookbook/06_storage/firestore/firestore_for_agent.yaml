purpose: 'This recipe shows how to store agent sessions in a Firestore database. Steps: 1. Ensure your gcloud project is enabled with Firestore. Reference https://cloud.google.com/firestore/docs/create-database-server-client-library ? 2. Run: `uv pip install openai google-cloud-firestore agno` to install dependencies 3. Make sure your gcloud project is set up and you have the necessary permissions to access Firestore 4. Run: `python cookbook/storage/firestore_storage.py` to run the agent'
