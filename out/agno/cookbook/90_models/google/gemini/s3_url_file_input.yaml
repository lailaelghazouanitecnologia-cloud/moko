purpose: 'Example: Analyze files from AWS S3 using pre-signed URLs. The Gemini API now supports external HTTPS URLs (up to 100MB). Generate a pre-signed URL from S3 and pass it directly to Gemini. Requirements: - AWS credentials configured (via environment variables or ~/.aws/credentials) - boto3 installed: uv pip install boto3 Supported formats: PDF, JSON, HTML, CSS, XML, images (PNG, JPEG, WebP, GIF) Note: External URL support requires Gemini 3.x models (e.g., gemini-3-flash-preview). Gemini 2.0 models do not support this feature.'
