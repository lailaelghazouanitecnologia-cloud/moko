  purpose: 'Example: Analyze files directly from Google Cloud Storage (GCS). The Gemini API now supports GCS URIs natively (up to 2GB). No need to download or re-upload - just pass the gs:// URI directly. Requirements: - Vertex AI must be enabled (GCS URIs require OAuth, not API keys) - Run: gcloud auth application-default login - Set environment variables: GOOGLE_CLOUD_PROJECT, GOOGLE_CLOUD_LOCATION - Your GCS bucket must be accessible to your credentials Supported formats: PDF, JSON, HTML, CSS, XML, images (PNG, JPEG, WebP, GIF)'
