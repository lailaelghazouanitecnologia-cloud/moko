  layer: logic
  purpose: 'Example: Analyze files from public HTTPS URLs. The Gemini API now supports external HTTPS URLs (up to 100MB). Pass public URLs directly without downloading first. This works with: - Public URLs (no authentication required) - Pre-signed URLs from AWS S3 - SAS URLs from Azure Blob Storage - Any accessible HTTPS URL Supported formats: PDF, JSON, HTML, CSS, XML, images (PNG, JPEG, WebP, GIF) Note: External URL support requires Gemini 3.x models (e.g., gemini-3-flash-preview). Gemini 2.0 models do not support this feature.'
