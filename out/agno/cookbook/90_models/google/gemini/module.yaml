- file: gemini/parallel_grounding.py
  lines: 56
  layer: logic
  purpose: 'Grounding with Parallel Web Search on Vertex AI. Parallel Web Systems offers a search API optimized for LLM grounding, providing access to live web data from billions of pages. This is available exclusively on Vertex AI through a native first-party integration. Note: This uses the dedicated `parallelAiSearch` tool type in Vertex AI, which is different from the generic `ExternalApi` approach. Parallel has a native integration with Google Cloud that handles authentication and API communication automatically. Requirements: - Set up Google Cloud credentials: `gcloud auth application-default login` - Set environment variables: - GOOGLE_CLOUD_PROJECT: Your GCP project ID - GOOGLE_CLOUD_LOCATION: Your GCP region (e.g., us-central1) - Optionally set PARALLEL_API_KEY if not using GCP Marketplace subscription Run `pip install google-genai` to install dependencies. For more information, see: - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/grounding/grounding-with-parallel - https://docs.parallel.ai/integrations/google-vertex'
  types: 0
  functions: 0
  imports: 2
  exports: 1
