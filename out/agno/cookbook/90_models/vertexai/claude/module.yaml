- file: claude/adaptive_thinking.py
  lines: 50
  layer: logic
  purpose: 'VertexAI Claude Adaptive Thinking ================================= Cookbook example demonstrating adaptive thinking with output_config on VertexAI. For Claude 4.6 VertexAI models, use adaptive thinking with the effort parameter to control thinking depth. Valid effort values: - "low": Most efficient, significant token savings - "medium": Balanced approach with moderate savings - "high": Default, high capability for complex reasoning - "max": Absolute maximum capability (Opus 4.6 only) Prerequisites: - Set GOOGLE_CLOUD_PROJECT and CLOUD_ML_REGION environment variables - Authenticate with: gcloud auth application-default login'
