purpose: 'DeepKnowledge - An AI Agent that iteratively searches a knowledge base to answer questions This agent performs iterative searches through its knowledge base, breaking down complex queries into sub-questions, and synthesizing comprehensive answers. It''s designed to explore topics deeply and thoroughly by following chains of reasoning. In this example, the agent uses the Agno documentation as a knowledge base Key Features: - Iteratively searches a knowledge base - Source attribution and citations Run `uv pip install openai lancedb tantivy inquirer agno groq` to install dependencies.'
