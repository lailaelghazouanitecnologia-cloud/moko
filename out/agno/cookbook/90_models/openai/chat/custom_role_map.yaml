## Roska File Descriptor — chat/custom_role_map.py
file: chat/custom_role_map.py
lines: 49
layer: logic
purpose: 'This example shows how to use a custom role map with the OpenAIChat class. This is useful when using a custom model that doesn''t support the default role map. To run this example: - Set the MISTRAL_API_KEY environment variable. - Run `uv pip install openai agno` to install dependencies.'
imports:
- sym: agno.agent.Agent
- sym: agno.models.openai.OpenAIChat
data:
- name: model_id
  type: str
  val: '"mistral-medium-2505"'
- name: base_url
  type: str
  val: '"https://api.mistral.ai/v1"'
- name: api_key
  type: Any
  val: getenv("MISTRAL_API_KEY")
- name: mistral_role_map
  type: dict
  val: |-
    {
        "system": "system",
        "user": "user",
        "assistant": "assistant",
        "tool": "tool",
        "model": "assistant"...
- name: model
  type: Any
  val: |-
    OpenAIChat(
        id=model_id,
        base_url=base_url,
        api_key=api_key,
        role_map=mistral_role_map,
    )
- name: agent
  type: Any
  val: Agent(model=model, markdown=True)
- name: res
  type: Any
  val: agent.print_response("Hey, how are you doing?")
