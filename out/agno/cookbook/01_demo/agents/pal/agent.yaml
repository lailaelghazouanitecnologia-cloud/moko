purpose: 'Pal - Personal Agent ====================== A personal agent that learns your preferences, context, and history. Uses PostgreSQL for structured data (notes, bookmarks, people, anything) and LearningMachine for meta-knowledge (preferences, patterns, schemas). Pal creates tables on demand -- if the user asks to track something new, Pal designs the schema and creates it. Over time, the database becomes a structured representation of the user''s world. Test: python -m agents.pal.agent'
