purpose: 'Level 5: Agentic System (Production API) ========================================== The most complete level. Production infrastructure for agentic software. Upgrade from development databases to PostgreSQL + PgVector, add tracing, and expose everything as an API with AgentOS. This builds on Level 4 by adding: - PostgresDb: Production-grade session storage - PgVector: Production-grade vector search - AgentOS: FastAPI server with web UI, tracing, and session management Prerequisites: Start PostgreSQL with PgVector: ./cookbook/scripts/run_pgvector.sh This starts a Postgres container on port 5532 with: user=ai, password=ai, database=ai Run standalone: python cookbook/levels_of_agentic_software/level_5_api.py Run via Agent OS: python cookbook/levels_of_agentic_software/run.py Then visit https://os.agno.com and select "L5 Coding Agent" Example prompt: "Write a function that validates email addresses using regex"'
