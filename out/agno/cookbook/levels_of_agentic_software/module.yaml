- file: levels_of_agentic_software/run.py
  lines: 68
  layer: logic
  purpose: 'Agent OS - Web Interface for the 5 Levels of Agentic Software =============================================================== This file starts an Agent OS server that provides a web interface for all 5 levels of agentic software from this cookbook. All levels are available in the Agent OS UI. Level 5 is the most complete, with production databases, learning, and tracing. Levels 1-4 are included so you can compare the progression and test each stage interactively. How to Use ---------- 1. Start PostgreSQL (required for Level 5): ./cookbook/scripts/run_pgvector.sh 2. Start the server: python cookbook/levels_of_agentic_software/run.py 3. Visit https://os.agno.com in your browser 4. Add your local endpoint: http://localhost:7777 5. Select any agent or team and start chatting: - L1 Coding Agent: Stateless tool calling (no setup needed) - L2 Coding Agent: Knowledge + storage (ChromaDb + SQLite) - L3 Coding Agent: Memory + learning (learns from interactions) - L4 Coding Team: Multi-agent team (Coder/Reviewer/Tester) - L5 Coding Agent: Production system (PostgreSQL + PgVector + tracing) Prerequisites ------------- - PostgreSQL with PgVector running on port 5532 (for Level 5) - OPENAI_API_KEY environment variable set'
  types: 0
