purpose: Team Eval Metrics ============================= Demonstrates that eval model metrics are accumulated back into the team's run_output when AgentAsJudgeEval is used as a post_hook. After the team runs, the evaluator agent makes its own model call. Those eval tokens show up under "eval_model" in run_output.metrics.details, separate from the team's own model tokens.
