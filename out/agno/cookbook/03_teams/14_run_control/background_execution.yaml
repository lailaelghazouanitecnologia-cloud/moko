purpose: 'Example demonstrating background execution with a Team. Background execution allows you to start a team run that returns immediately with a PENDING status, while the actual work continues in the background. You can then poll for completion or cancel the run. Requirements: - PostgreSQL running (./cookbook/scripts/run_pgvector.sh) - OPENAI_API_KEY set Usage: .venvs/demo/bin/python cookbook/03_teams/14_run_control/background_execution.py'
