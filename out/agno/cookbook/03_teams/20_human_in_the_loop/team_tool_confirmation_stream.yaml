purpose: 'Team HITL Streaming: Tool on the team itself requiring confirmation. This example demonstrates HITL for tools provided directly to the Team (not to member agents) in streaming mode. When the team leader decides to use a tool that requires confirmation, the entire team run pauses until the human confirms. Note: For team-level tools (not member agent tools), you can use either isinstance(event, TeamRunPausedEvent) or event.is_paused since there''s no member agent pause to confuse it with.'
