purpose: 'Memory + Learning - Agent That Improves Over Time =================================================== The agent learns from interactions so response 1,000 is better than response 1. Key concepts: - LearningMachine: Manages knowledge the agent discovers during conversations - LearningMode.AGENTIC: Agent decides when to save insights (vs ALWAYS or NEVER) - enable_agentic_memory: Builds user profiles from conversation patterns - ReasoningTools: Lets the agent "think" before responding (separate from model thinking) - Two knowledge stores: Static (docs) + dynamic (learned), searched together Example prompts to try: - Session 1: "I''m learning Spanish. I prefer conversations over grammar drills." - Session 2: "Help me practice asking for directions." (agent remembers preferences)'
