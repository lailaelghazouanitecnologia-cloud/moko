  purpose: 'Workflow - Step-Based Agentic Pipeline ======================================== Build a multi-step pipeline where steps execute in a defined order. Key concepts: - Workflow: Orchestrates steps in sequence, with branching and parallelism - Step: A single unit of work, backed by an Agent, Team, or custom function - Parallel: Run multiple steps concurrently - Condition: Branch based on previous step output - StepInput: Carries the original input + all previous step outputs - StepOutput: What a step returns (content, stop flag, success flag) - session_state: Persistent state across steps (saved to db) Example prompts to try: - "Latest developments in AI agents and autonomous systems" - "The impact of climate change on global food production" - "History and future of space exploration"'
