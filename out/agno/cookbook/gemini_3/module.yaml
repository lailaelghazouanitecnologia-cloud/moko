  purpose: 'Extended Thinking - Complex Reasoning with Budget Control ========================================================== Let Gemini "think" before responding for better answers on complex tasks. Key concepts: - thinking_budget: Token budget for thinking (0=disable, -1=dynamic, or a number) - include_thoughts: If True, the model''s reasoning is included in the response - Best with Pro: Thinking is most effective with Gemini Pro models - Trade-off: More thinking = better answers but higher latency and cost Example prompts to try: - "Solve the missionaries and cannibals river-crossing puzzle" - "What is 127 * 389 + 256 * 741? Show your work." - "Write a Python function to find all prime factors of a number. Think through edge cases."'
