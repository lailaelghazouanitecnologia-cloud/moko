purpose: 'Prompt Caching - Save Tokens on Repeated Queries ================================================== Cache large documents server-side so repeated queries skip the full token cost. Key concepts: - genai.Client().caches.create: Creates a server-side cache with TTL - cached_content: Links the cache to your Gemini model - TTL: Time-to-live for the cache (e.g., "300s" = 5 minutes) - Token savings: Subsequent queries skip the cached content''s token cost Example prompts to try: - "Find a lighthearted moment from this transcript" - "What was the most tense moment during the mission?" - "Summarize the key decisions made"'
