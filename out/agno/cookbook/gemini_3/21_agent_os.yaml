purpose: 'Agent OS - Deploy All Agents as a Web Service =============================================== Deploy all agents, teams, and workflows from this guide as a single web service. How to use: 1. Start the server: python cookbook/gemini_3/21_agent_os.py 2. Visit https://os.agno.com in your browser 3. Add your local endpoint: http://localhost:7777 4. Select any agent, team, or workflow and start chatting Key concepts: - AgentOS: Wraps agents, teams, and workflows into a FastAPI web service - get_app(): Returns a FastAPI app you can customize - serve(): Starts the server with uvicorn (hot-reload enabled) - tracing=True: Enables request tracing in the Agent OS UI Prerequisites: - GOOGLE_API_KEY environment variable set'
