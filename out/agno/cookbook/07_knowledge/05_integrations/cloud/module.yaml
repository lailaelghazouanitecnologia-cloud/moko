  purpose: 'AWS Integration: S3 Content Source ==================================== Load files and folders from S3 buckets into your Knowledge base. Supports any S3-compatible storage with AWS credentials. Features: - Load single files or entire prefixes (folders) recursively - Automatic file type detection and reader selection - Metadata tagging per file (bucket, key, region) Requirements: - AWS credentials configured (env vars, profile, or IAM role) - S3 bucket with read access Environment Variables: AWS_ACCESS_KEY_ID     - AWS access key AWS_SECRET_ACCESS_KEY - AWS secret key AWS_REGION            - AWS region (default: us-east-1)'
