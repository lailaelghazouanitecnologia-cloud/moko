purpose: 'PgVector: PostgreSQL Vector Search ==================================== PgVector adds vector similarity search to PostgreSQL, giving you vectors alongside your existing relational data in one database. Features: - Vector, keyword, and hybrid search - Full SQL capabilities for complex queries - HNSW and IVFFlat indexing - Reranking support - Battle-tested PostgreSQL reliability Setup: ./cookbook/scripts/run_pgvector.sh Requires: pip install pgvector psycopg[binary] See also: 01_qdrant.py for recommended default, 02_local.py for local dev.'
