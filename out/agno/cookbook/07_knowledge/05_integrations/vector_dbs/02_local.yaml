purpose: 'Local Vector Databases: ChromaDB and LanceDB ============================================== For local development and prototyping, you can use embedded vector databases that don''t require a server. ChromaDB: - In-memory or persistent storage - Simple setup, good for prototyping - pip install chromadb LanceDB: - File-based storage (no server needed) - Supports hybrid search - pip install lancedb tantivy See also: 01_qdrant.py for production, 03_managed.py for Pinecone, 04_pgvector.py for PostgreSQL.'
