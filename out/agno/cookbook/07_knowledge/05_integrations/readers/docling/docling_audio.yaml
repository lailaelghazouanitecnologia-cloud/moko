purpose: 'Docling Reader: Audio Files ============================ Examples of using Docling to process audio files with speech-to-text transcription. Supported formats: - WAV: Waveform Audio File Format - MP3: MPEG Audio Layer III - MP4: MPEG-4 Part 14 (audio) Output formats: - markdown: Transcription as markdown text (default) - text: Plain text transcription - html: HTML formatted transcription - vtt: WebVTT subtitle format with timestamps Docling uses OpenAI Whisper for high-quality speech recognition. Dependencies: - Python packages: `uv pip install docling openai-whisper` - System requirement: ffmpeg (https://www.ffmpeg.org/download.html)'
