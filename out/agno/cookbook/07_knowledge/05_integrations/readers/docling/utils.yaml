purpose: 'Docling Reader: Shared Utilities ================================= Common setup and utilities for Docling reader examples. Docling uses IBM''s advanced document conversion library to extract content from multiple document formats. Supported formats examples:: - PDF: PDFs with advanced layout understanding and text extraction - DOCX: Microsoft Word documents with structure preservation - PPTX: PowerPoint presentations - Markdown: Markdown files - CSV: CSV spreadsheets - XLSX: Excel spreadsheets Output formats examples: - markdown: Preserves structure and formatting - text: Plain text output - json: Lossless serialization with full document structure - html: HTML with image embedding/referencing support - doctags: Markup format with full content and layout characteristics Key features: - Advanced document structure understanding - Better handling of complex layouts (tables, columns, etc.) - Multiple output formats for different use cases - Ideal for complex documents with rich formatting Run `uv pip install docling openai-whisper` to install python dependencies. System requirement ffmpeg (https://www.ffmpeg.org/download.html) for audio formats. See also: 01_documents.py for PDF/DOCX, 02_data.py for CSV/JSON and 03_web.py for web sources.'
