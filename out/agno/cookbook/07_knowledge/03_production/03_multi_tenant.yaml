layer: logic
purpose: 'Multi-Tenant Knowledge: Isolating Data Per Tenant =================================================== When multiple Knowledge instances share the same vector database, use isolate_vector_search to ensure each instance only searches its own data. This is essential for multi-tenant applications where different users or departments should only access their own documents. Behavior: - isolate_vector_search=False (default): Searches ALL vectors in the database. - isolate_vector_search=True: Only searches vectors tagged with this instance''s name. Important: Existing data without linked_to metadata won''t be found when isolation is enabled. You''ll need to re-index to add the metadata. See also: ../02_building_blocks/04_filtering.py for metadata-based filtering.'
