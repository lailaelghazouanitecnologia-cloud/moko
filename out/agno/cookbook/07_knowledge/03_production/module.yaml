  purpose: 'AgentOS: Serving Knowledge via API ==================================== AgentOS wraps your agents and knowledge instances in a FastAPI server, exposing them as API endpoints. This is how you move from a script to a running service. Key concepts: - Multiple Knowledge instances can share the same vector_db and contents_db - Each instance is identified by its `name` property - Content is isolated per instance via the `linked_to` field - AgentOS exposes /knowledge endpoints for managing content Setup: 1. Run Qdrant: ./cookbook/scripts/run_qdrant.sh 2. pip install uvicorn See also: 03_multi_tenant.py for tenant isolation patterns.'
