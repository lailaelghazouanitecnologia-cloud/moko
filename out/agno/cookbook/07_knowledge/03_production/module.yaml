  purpose: 'Knowledge Lifecycle: Insert, Update, Remove, Track ==================================================== In production, knowledge needs to be managed over time: - Skip re-inserting content that already exists - Remove outdated content - Track content status with a contents database - Re-index when content changes This example shows the full content lifecycle with a contents database for tracking what has been ingested and its current status. See also: 03_multi_tenant.py for isolating knowledge per tenant.'
