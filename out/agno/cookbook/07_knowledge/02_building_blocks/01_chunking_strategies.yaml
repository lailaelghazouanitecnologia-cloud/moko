purpose: 'Chunking Strategies: Side-by-Side Comparison ============================================== Chunking determines how documents are split into pieces for embedding and search. The right strategy depends on your content type. Strategies compared: - Fixed size: Simple, predictable chunk sizes. Good default. - Recursive: Splits on natural boundaries (paragraphs, sentences). Better quality. - Semantic: Groups related sentences by meaning. Best for mixed-topic docs. - Document: Splits on document structure (pages, sections). - Markdown: Splits on headers. Ideal for structured documentation. - Code: Respects function/class boundaries. Use for source code. - Agentic: LLM determines optimal boundaries. Most accurate, slowest. See also: ../reference/chunking_decision_guide.md'
