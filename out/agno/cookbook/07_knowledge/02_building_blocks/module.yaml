  purpose: 'Search Types: Vector, Keyword, and Hybrid =========================================== Knowledge supports three search types. Each has different strengths: - Vector: Semantic similarity search. Finds conceptually related content even when exact words don''t match. - Keyword: Full-text search. Fast and precise for exact term matching. - Hybrid: Combines vector + keyword. Best of both worlds. Recommended default. See also: 03_reranking.py for improving search results with reranking.'
