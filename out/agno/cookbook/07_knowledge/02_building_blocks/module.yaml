  purpose: 'Filtering: Metadata-Based Search Refinement ============================================= Filters let you narrow search results based on document metadata. This is essential for multi-user, multi-topic, or access-controlled systems. Two stages of filtering: 1. On load: Tag documents with metadata at insert time 2. On search: Apply filters when the agent searches Filter approaches: - Dict filters: Simple key-value matching {"category": "recipes"} - FilterExpr: Powerful expressions with AND, OR, NOT, EQ, IN, GT, LT See also: 05_agentic_filtering.py for agent-driven filter selection.'
