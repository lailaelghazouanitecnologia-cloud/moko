- file: 02_building_blocks/01_chunking_strategies.py
  lines: 117
  layer: logic
  purpose: 'Chunking Strategies: Side-by-Side Comparison ============================================== Chunking determines how documents are split into pieces for embedding and search. The right strategy depends on your content type. Strategies compared: - Fixed size: Simple, predictable chunk sizes. Good default. - Recursive: Splits on natural boundaries (paragraphs, sentences). Better quality. - Semantic: Groups related sentences by meaning. Best for mixed-topic docs. - Document: Splits on document structure (pages, sections). - Markdown: Splits on headers. Ideal for structured documentation. - Code: Respects function/class boundaries. Use for source code. - Agentic: LLM determines optimal boundaries. Most accurate, slowest. See also: ../reference/chunking_decision_guide.md'
  types: 0
  functions: 1
  imports: 14
  exports: 9
- file: 02_building_blocks/03_reranking.py
  lines: 81
  layer: logic
  purpose: 'Reranking: Improving Search Quality ===================================== Reranking is a two-stage retrieval process: 1. First, retrieve candidate results using vector/hybrid search 2. Then, a reranker model scores and reorders results by relevance This dramatically improves result quality, especially for complex queries. Supported rerankers: - CohereReranker: Cohere''s rerank models (recommended) - SentenceTransformerReranker: Local reranking with BAAI/bge models - InfinityReranker: Self-hosted reranking - BedrockReranker: AWS Bedrock reranking See also: 02_hybrid_search.py for search type options.'
  types: 0
  functions: 0
