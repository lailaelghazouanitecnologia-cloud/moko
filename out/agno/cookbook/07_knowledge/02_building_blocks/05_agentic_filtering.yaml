purpose: 'Agentic Filtering: Agent-Driven Search Refinement =================================================== With agentic filtering enabled, the agent inspects available metadata keys in the knowledge base and dynamically builds filters from the user query. This is powerful for multi-topic knowledge bases where the user''s intent determines which subset of data to search. Steps: 1. Load documents with metadata tags 2. Enable agentic filtering on the agent 3. The agent automatically builds filters from user queries See also: 04_filtering.py for static (predefined) filters.'
