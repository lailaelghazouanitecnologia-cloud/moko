  purpose: 'Agentic RAG: Tool-Based Search ================================ The agent gets a search_knowledge_base tool and decides when to query the knowledge base. This is more flexible than basic RAG - the agent can choose to search multiple times, refine queries, or skip searching entirely. This is the default behavior when you set knowledge on an Agent. Steps: 1. Create a Knowledge base with a vector database 2. Load a document 3. Create an Agent with search_knowledge=True (the default) 4. Ask questions - agent decides when to search See also: 01_basic_rag.py for automatic context injection.'
