- file: 01_getting_started/01_basic_rag.py
  lines: 77
  layer: logic
  purpose: 'Basic RAG: Context Injection ============================= The simplest way to give an agent access to documents. Content is automatically retrieved and injected into the system prompt before the agent responds. This pattern works well for simple Q&A over documents. The agent doesn''t need to decide whether to search - it always gets relevant context. Steps: 1. Create a Knowledge base with a vector database 2. Load a document 3. Create an Agent with add_knowledge_to_context=True 4. Ask questions - context is injected automatically See also: 02_agentic_rag.py for agent-driven search decisions.'
