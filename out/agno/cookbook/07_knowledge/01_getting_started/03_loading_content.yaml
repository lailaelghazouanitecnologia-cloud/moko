purpose: 'Loading Content: All Source Types ================================== Knowledge supports loading content from many sources: local files, URLs, raw text, topics (Wikipedia/ArXiv), and batch operations. This example demonstrates each source type. In production, you''ll typically use one or two of these patterns. Steps: 1. From a local file path 2. From a URL 3. From raw text 4. From topics (Wikipedia, ArXiv) 5. Batch loading from multiple sources Note: All examples use async methods (ainsert, ainsert_many). Sync equivalents (insert, insert_many) are also available.'
