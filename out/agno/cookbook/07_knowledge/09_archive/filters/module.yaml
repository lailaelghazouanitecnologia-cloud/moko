- file: filters/isolate_vector_search.py
  lines: 109
  layer: logic
  purpose: 'Demonstrates knowledge isolation with isolate_vector_search flag. When multiple Knowledge instances share the same vector database, you can use the `isolate_vector_search` flag to ensure each instance only searches its own data. Behavior: - isolate_vector_search=False (default): Searches ALL vectors in the database. This is backwards-compatible with existing data that doesn''t have linked_to metadata. - isolate_vector_search=True: Only searches vectors that have matching linked_to metadata. Documents inserted with this flag will have linked_to set to the Knowledge instance name. Searches will filter to only return documents with matching linked_to. IMPORTANT: If you have existing production data and want to enable isolation, you will need to re-index your data with isolate_vector_search=True to add the linked_to metadata. Existing documents without linked_to metadata will NOT be found when isolation is enabled. Run: `python cookbook/07_knowledge/basic_operations/async/05_isolate_vector_search.py`'
  types: 0
  functions: 1
  imports: 5
  exports: 5
