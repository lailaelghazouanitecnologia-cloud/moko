- file: filters/isolate_with_filter_expressions.py
  lines: 157
  layer: logic
  purpose: 'Demonstrates isolate_vector_search combined with list-based FilterExpr filters. When multiple Knowledge instances share the same vector database and isolate_vector_search=True, each instance''s searches are scoped to its own data via an auto-injected linked_to filter. This works seamlessly with user-supplied FilterExpr filters — the linked_to filter is prepended automatically. This cookbook shows: 1. Two Knowledge instances sharing one vector database, each isolated. 2. Inserting documents with metadata into each instance. 3. Querying via an Agent with knowledge_filters using EQ, IN, AND, NOT operators. 4. The linked_to filter is auto-injected alongside user filters.'
  types: 0
