- file: cloud/sharepoint.py
  lines: 83
  layer: logic
  purpose: 'SharePoint Content Source for Knowledge ======================================== Load files and folders from SharePoint document libraries into your Knowledge base. Uses Microsoft Graph API with OAuth2 client credentials flow. Features: - Load single files or entire folders recursively - Supports any SharePoint Online site - Automatic file type detection and reader selection - Rich metadata stored for each file (site, path, filename) Requirements: - Azure AD App Registration with: - Application (client) ID - Client secret - API permissions: Sites.Read.All (Application) - SharePoint site ID or site path Setup: 1. Register an app in Azure AD (portal.azure.com) 2. Add API permission: Microsoft Graph > Sites.Read.All (Application) 3. Grant admin consent 4. Create a client secret 5. Set environment variables (see below) Environment Variables: SHAREPOINT_TENANT_ID    - Azure AD tenant ID SHAREPOINT_CLIENT_ID    - App registration client ID SHAREPOINT_CLIENT_SECRET - App registration client secret SHAREPOINT_HOSTNAME     - e.g., "contoso.sharepoint.com" SHAREPOINT_SITE_ID      - Full site ID (hostname,guid,guid format) Run this cookbook: python cookbook/07_knowledge/cloud/sharepoint.py'
  types: 0
  functions: 0
  imports: 3
  exports: 2
