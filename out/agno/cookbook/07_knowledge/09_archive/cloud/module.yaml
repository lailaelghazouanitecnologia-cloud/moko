- file: cloud/azure_blob.py
  lines: 85
  layer: logic
  purpose: 'Azure Blob Storage Content Source for Knowledge ================================================ Load files and folders from Azure Blob Storage containers into your Knowledge base. Uses Azure AD client credentials flow for authentication. Features: - Load single blobs or entire prefixes (folders) recursively - Supports any Azure Storage Account - Automatic file type detection and reader selection - Rich metadata stored for each file (storage account, container, path) Requirements: - Azure AD App Registration with: - Application (client) ID - Client secret - Storage Blob Data Reader role on the storage account - Storage account name and container name Setup: 1. Register an app in Azure AD (portal.azure.com) 2. Assign "Storage Blob Data Reader" role to the app on your storage account 3. Create a client secret 4. Set environment variables (see below) Environment Variables: AZURE_TENANT_ID           - Azure AD tenant ID AZURE_CLIENT_ID           - App registration client ID AZURE_CLIENT_SECRET       - App registration client secret AZURE_STORAGE_ACCOUNT_NAME - Storage account name (without .blob.core.windows.net) AZURE_CONTAINER_NAME      - Container name Run this cookbook: python cookbook/07_knowledge/cloud/azure_blob.py'
