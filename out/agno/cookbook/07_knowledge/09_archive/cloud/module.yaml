- file: cloud/cloud_agentos.py
  lines: 158
  layer: logic
  purpose: 'Cloud Content Sources with AgentOS ============================================================ Sets up an AgentOS app with Knowledge connected to multiple cloud storage backends (S3, GCS, SharePoint, GitHub, Azure Blob). Once running, the AgentOS API lets you browse sources, upload content from any configured source, and search the knowledge base. Run: python cookbook/07_knowledge/cloud/cloud_agentos.py Key Concepts: - Each source type has its own config: S3Config, GcsConfig, SharePointConfig, GitHubConfig, AzureBlobConfig - Configs are registered on Knowledge via `content_sources` parameter - Configs have factory methods (.file(), .folder()) to create content references - Content references are passed to knowledge.insert()'
  types: 0
  functions: 0
  imports: 10
  exports: 7
- file: cloud/github.py
  lines: 101
  layer: logic
  purpose: 'GitHub Content Source for Knowledge ==================================== Load files and folders from GitHub repositories into your Knowledge base, then query them with an Agent. Authentication methods: - Personal Access Token (PAT): simple, set ``token`` - GitHub App: enterprise-grade, set ``app_id``, ``installation_id``, ``private_key`` Requirements: - PostgreSQL with pgvector: ``./cookbook/scripts/run_pgvector.sh`` - For private repos with PAT: GitHub fine-grained PAT with "Contents: read" permission - For GitHub App auth: ``pip install PyJWT cryptography`` Run this cookbook: python cookbook/07_knowledge/cloud/github.py'
  types: 0
