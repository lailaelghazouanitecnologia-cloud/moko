file: os/multiple_knowledge_instances.py
lines: 80
layer: logic
purpose: 'Multiple Knowledge Instances in AgentOS ============================================================ This cookbook demonstrates how to configure multiple Knowledge instances in AgentOS, each with isolated content. Key Concepts: - Multiple Knowledge instances can share the same vector_db and contents_db - Each instance is identified by its `name` property - Content is isolated per instance via the `linked_to` field - Instances with the same name but different databases are treated as separate - The /knowledge/config endpoint returns all registered instances'
