purpose: 'MongoDB Vector DB ================= 1. Create a MongoDB Atlas Account: - Go to https://www.mongodb.com/cloud/atlas/register - Sign up for a free account 2. Create a New Cluster: - Click "Build a Database" - Choose the FREE tier (M0) - Select your preferred cloud provider and region - Click "Create Cluster" 3. Set Up Database Access: - Follow the instructions in the MongoDB Atlas UI - Create a username and password - Click "Add New Database User" 5. Get Connection String: - Select "Drivers" as connection method - Select "Python" as driver - Copy the connection string 7. Test Connection: - Use the connection string in your code - Ensure pymongo is installed: uv pip install "pymongo[srv]" - Test with a simple query to verify connectivity Alternatively to test locally, you can run a docker container docker run -p 27017:27017 -d --name mongodb-container --rm -v ./tmp/mongo-data:/data/db mongodb/mongodb-atlas-local:8.0.3'
