purpose: 'Couchbase Vector DB Example ========================== Setup Couchbase Cluster (Local via Docker): ------------------------------------------- 1. Run Couchbase locally: docker run -d --name couchbase-server \ -p 8091-8096:8091-8096 \ -p 11210:11210 \ -e COUCHBASE_ADMINISTRATOR_USERNAME=Administrator \ -e COUCHBASE_ADMINISTRATOR_PASSWORD=password \ couchbase:latest 2. Access the Couchbase UI at: http://localhost:8091 (Login with the username and password above) 3. Create a new cluster. You can select "Finish with defaults". 4. Create a bucket named ''recipe_bucket'', a scope ''recipe_scope'', and a collection ''recipes''. Managed Couchbase (Capella): ---------------------------- - For a managed cluster, use Couchbase Capella: https://cloud.couchbase.com/ - Follow Capella''s UI to create a database, bucket, scope, and collection as above. Environment Variables (export before running): ---------------------------------------------- Create a shell script (e.g., set_couchbase_env.sh): export COUCHBASE_USER="Administrator" export COUCHBASE_PASSWORD="password" export COUCHBASE_CONNECTION_STRING="couchbase://localhost" export OPENAI_API_KEY="<your-openai-api-key>" # For Capella, set COUCHBASE_CONNECTION_STRING to the Capella connection string. Install couchbase-sdk: ---------------------- uv pip install couchbase'
