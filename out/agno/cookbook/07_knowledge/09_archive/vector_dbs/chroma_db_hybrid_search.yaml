purpose: 'ChromaDB with Hybrid Search using Reciprocal Rank Fusion (RRF) This example demonstrates how to use ChromaDB with hybrid search, which combines dense vector similarity search (semantic) with full-text search (keyword/lexical) using RRF fusion. Hybrid search is useful when you want to: - Combine semantic understanding with exact keyword matching - Improve retrieval accuracy for queries with specific terms - Handle both conceptual and lexical search needs The RRF algorithm fuses rankings from both search methods using: RRF(d) = sum(1 / (k + rank_i(d))) for each ranking i'
