  purpose: 'Custom Retriever: Bypass the Knowledge Class ============================================== Sometimes you need full control over retrieval logic. Instead of using the Knowledge class, you can provide a custom retriever function. The function receives the query and returns a list of dicts. This is useful for: - Non-vector retrieval (SQL queries, API calls, file lookups) - Custom ranking logic - Combining multiple data sources with custom logic See also: ../01_getting_started/02_agentic_rag.py for standard Knowledge-based RAG.'
