  purpose: 'Graph RAG: LightRAG Integration ================================= LightRAG is a managed knowledge backend that builds a knowledge graph from your documents. It handles its own ingestion and retrieval, providing graph-based RAG capabilities. Unlike standard vector-based RAG, LightRAG: - Extracts entities and relationships from documents - Builds a knowledge graph for multi-hop reasoning - Supports graph-traversal queries Requirements: pip install lightrag-agno'
