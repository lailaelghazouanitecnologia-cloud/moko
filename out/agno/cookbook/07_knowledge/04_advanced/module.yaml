  purpose: 'Knowledge Protocol: Custom Knowledge Sources ============================================== KnowledgeProtocol is an interface for building custom knowledge sources that don''t use the standard Knowledge class. Implement this when you need: - Knowledge from a non-standard source (file system, API, database) - Custom search logic that doesn''t fit the vector DB model - Integration with existing retrieval systems The protocol requires implementing build_context(), get_tools(), and aget_tools(). Optionally implement retrieve()/aretrieve() for the search_knowledge feature.'
