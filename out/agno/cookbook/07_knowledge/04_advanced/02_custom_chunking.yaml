purpose: 'Custom Chunking: Implementing Your Own Strategy ================================================= When built-in strategies don''t fit your content, implement a custom one. A chunking strategy is a class that takes a Document and returns a list of Document chunks. You control how content is split. Use cases: - Domain-specific splitting (legal clauses, medical records) - Structured data (tables, forms) - Content with custom delimiters See also: ../02_building_blocks/01_chunking_strategies.py for built-in strategies.'
