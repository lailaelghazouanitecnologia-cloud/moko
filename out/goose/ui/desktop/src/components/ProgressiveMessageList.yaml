purpose: 'ProgressiveMessageList Component A performance-optimized message list that renders messages progressively to prevent UI blocking when loading long chat sessions. This component renders messages in batches with a loading indicator, maintaining full compatibility with the search functionality. Key Features: - Progressive rendering in configurable batches - Loading indicator during batch processing - Maintains search functionality compatibility - Smooth user experience with responsive UI - Configurable batch size and delay'
