purpose: 'McpAppRenderer — Renders interactive MCP App UIs inside a sandboxed iframe. This component implements the host side of the MCP Apps protocol using the proxy setup, CSP enforcement, and bidirectional communication with guest apps. Protocol references: - MCP Apps Extension (ext-apps): https://github.com/modelcontextprotocol/ext-apps - MCP-UI Client SDK: https://github.com/idosal/mcp-ui - App Bridge types: @modelcontextprotocol/ext-apps/app-bridge Display modes: - "inline" | "fullscreen" | "pip" — standard MCP display modes - "standalone" — Goose-specific mode for dedicated Electron windows'
