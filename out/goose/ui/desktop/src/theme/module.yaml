  purpose: 'Theme tokens — the single source of truth for all MCP semantic token values. Every key in McpUiStyleVariableKey must be present in both lightTokens and darkTokens. The TypeScript compiler enforces this: if the SDK adds a new key, the build breaks until both maps are updated. Values are applied to :root via style.setProperty() before first paint (see renderer.tsx). main.css only registers the variable names for Tailwind class generation — it does NOT define values. These tokens serve two purposes: 1. Goose desktop — applied to :root per resolved theme. 2. MCP apps — encoded as light-dark() in hostContext.styles.variables.'
