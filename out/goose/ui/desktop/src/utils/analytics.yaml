## Roska File Descriptor — utils/analytics.ts
file: utils/analytics.ts
lines: 743
layer: logic
purpose: 'Frontend Analytics Module Provides privacy-respecting analytics by routing events through the backend. The backend uses posthog-rs which handles the PostHog API correctly. What we track: - Feature usage (which features users interact with) - Screen/view navigation - Onboarding funnel completion - Error types (without sensitive details) What we never track: - Conversation content - Code or file contents - API keys or credentials - Tool arguments or outputs - Personal identifiable information'
