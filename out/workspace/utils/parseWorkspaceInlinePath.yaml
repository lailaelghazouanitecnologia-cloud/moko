purpose: 'parseWorkspaceInlinePath - Utility for parsing workspace-prefixed paths This utility extracts workspace hints from paths using the @workspace:path syntax. This allows tools to target specific workspaces in multi-root environments. Examples: "@frontend:src/index.ts" -> { workspaceHint: "frontend", relPath: "src/index.ts" } "@backend:package.json" -> { workspaceHint: "backend", relPath: "package.json" } "src/index.ts" -> { workspaceHint: undefined, relPath: "src/index.ts" } "@my-app:src/components/Button.tsx" -> { workspaceHint: "my-app", relPath: "src/components/Button.tsx" }'
