purpose: WorkspacePathAdapter - Utility for resolving paths in single or multi-workspace environments This adapter provides a unified interface for path resolution that works with both single-root (legacy) and multi-root workspace configurations. It encapsulates the logic for determining which workspace a path belongs to and resolving relative paths to their absolute equivalents.
