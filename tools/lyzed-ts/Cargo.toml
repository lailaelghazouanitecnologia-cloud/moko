[package]
name = "lyzed-ts"
version = "0.1.0"
edition = "2021"
description = "Tree-sitter based Python analyzer → Roska YAML descriptors"

[dependencies]
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
