# Evaluation configs for z86 game engine
# Each entry re-implements ONE type with a variation and benchmarks it

evaluations:
  - target_type: Vec3
    target_module: math
    variation: "SIMD-friendly Float32Array with loop unrolling"
    constraints:
      - "Use Float32Array for internal storage"
      - "Inline add/multiply/normalize operations"
      - "Same public interface as main Vec3"
    benchmark_metrics: [loc, density, method_count, tsc_errors]

  - target_type: Mat4
    target_module: math
    variation: "Column-major optimized for WebGL uniform upload"
    constraints:
      - "Column-major storage order"
      - "Direct upload to gl.uniformMatrix4fv without transpose"
      - "Same public interface as main Mat4"
    benchmark_metrics: [loc, density, method_count, tsc_errors]
    temperature: 0.2
