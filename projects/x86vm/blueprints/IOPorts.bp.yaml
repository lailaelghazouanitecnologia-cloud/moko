## Blueprint — IOPorts
name: IOPorts
language: typescript
target_dir: src/IOPorts
description: ''
constraints:
- Must support x86 I/O port addressing (0x0000-0xFFFF)
- Handle legacy hardware emulation accurately
- Support port-mapped I/O only (no memory-mapped I/O)
- Thread-safe for concurrent port access
references:
- x86vm/io/io_ports.yaml
types:
- name: IOPortSpace
  kind: class
  status: pending
  target_file: src/IOPorts/io-port-space.ts
  description: Manages the x86 I/O port address space and device registration
  fields:
  - name: ports
    type: Map<number, IODevice>
    default: new Map()
  - name: handlers
    type: Map<number, PortHandler>
    default: new Map()
  methods:
  - name: registerDevice
    sig: '(port: number, device: IODevice): void'
    hint: Register device at specific port
  - name: unregisterDevice
    sig: '(port: number): void'
    hint: Remove device from port
  - name: readPort
    sig: '(port: number): number'
    hint: Read from port, delegate to device
  - name: writePort
    sig: '(port: number, value: number): void'
    hint: Write to port, delegate to device
  - name: isPortRegistered
    sig: '(port: number): boolean'
    hint: Check if port has device
  - name: getDevice
    sig: '(port: number): IODevice | undefined'
    hint: Get device at port
  - name: reset
    sig: '(): void'
    hint: Clear all port registrations
  - name: getRegisteredPorts
    sig: '(): number[]'
    hint: Return array of registered ports
  - name: registerRange
    sig: '(start: number, count: number, device: IODevice): void'
    hint: Register device for port range
  - name: unregisterRange
    sig: '(start: number, count: number): void'
    hint: Remove device from port range
  references:
  - src/IOPorts/roska/ioportspace.yaml
- name: Timer8254
  kind: class
  status: translated
  target_file: src/IOPorts/timer8254.ts
  description: Emulates Intel 8254 Programmable Interval Timer
  fields:
  - name: counters
    type: TimerCounter[]
    default: new Array(3)
  - name: controlWord
    type: number
    default: '0'
  - name: latchMode
    type: boolean
    default: 'false'
  methods:
  - name: readCounter
    sig: '(counter: number): number'
    hint: Read counter value
  - name: writeCounter
    sig: '(counter: number, value: number): void'
    hint: Write counter value
  - name: writeControl
    sig: '(value: number): void'
    hint: Set control word
  - name: getCounterMode
    sig: '(counter: number): number'
    hint: Get counter operating mode
  - name: setCounterMode
    sig: '(counter: number, mode: number): void'
    hint: Set counter operating mode
  - name: latchCounter
    sig: '(counter: number): void'
    hint: Latch counter for reading
  - name: readStatus
    sig: '(counter: number): number'
    hint: Read counter status
  - name: generateInterrupt
    sig: '(counter: number): void'
    hint: Generate timer interrupt
  - name: updateCount
    sig: '(counter: number, cycles: number): void'
    hint: Update counter based on cycles
  - name: isCounterEnabled
    sig: '(counter: number): boolean'
    hint: Check if counter active
  - name: getOutput
    sig: '(counter: number): boolean'
    hint: Get counter output state
  - name: setGate
    sig: '(counter: number, gate: boolean): void'
    hint: Set gate input
  - name: reset
    sig: '(): void'
    hint: Reset all counters
  - name: getFrequency
    sig: '(counter: number): number'
    hint: Calculate counter frequency
  - name: readBack
    sig: '(counters: number): number'
    hint: Read back multiple counters
  references:
  - src/IOPorts/roska/timer8254.yaml
