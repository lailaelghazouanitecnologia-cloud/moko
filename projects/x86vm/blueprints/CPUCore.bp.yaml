## Blueprint — CPUCore
name: CPUCore
language: typescript
target_dir: src/CPUCore
description: ''
constraints:
- Must handle x86 instruction execution pipeline
- Support protected mode and real mode
- Handle interrupts and exceptions
- Implement instruction prefetch and decode
- Support micro-op translation
- 'CONTRACT: CPUCore.executionEngine is ExecutionEngine — use its API: execute(instruction: Instruction): void, executeMicroOp(microOp:
  MicroOp): void, executeArithmetic(op: ArithmeticOp): void, executeLogic(op: LogicOp): void'
- 'CONTRACT: CPUCore.instructionCache is InstructionCache — use its API: fetch(address: number): CacheLine, read(address:
  number): number, prefetch(address: number): void, invalidate(address: number): void'
- 'CONTRACT: CPUCore.interruptController is InterruptController — use its API: requestInterrupt(vector: number): void, acknowledgeInterrupt():
  number, endOfInterrupt(vector: number): void, raiseException(vector: number, errorCode?: number): void'
- 'CONTRACT: CPUCore.microOpQueue is MicroOpQueue — use its API: enqueue(microOp: MicroOp): boolean, dequeue(): MicroOp |
  null, peek(): MicroOp | null, isEmpty(): boolean'
references:
- x86vm/cpu/cpu_core.yaml
types:
- name: CPUCore
  kind: class
  status: translated
  target_file: src/CPUCore/cpu-core.ts
  description: Main CPU execution engine coordinating all components
  fields:
  - name: executionEngine
    type: ExecutionEngine
  - name: interruptController
    type: InterruptController
  - name: instructionCache
    type: InstructionCache
  - name: microOpQueue
    type: MicroOpQueue
  - name: registers
    type: Registers
  - name: memoryManager
    type: MemoryManager
  - name: decoder
    type: InstructionDecoder
  - name: ioPorts
    type: Map<number, IOPort>
  - name: halted
    type: boolean
    default: 'False'
  - name: cycles
    type: number
    default: '0'
  methods:
  - name: initialize
    sig: '(): void'
    hint: Initialize all components and reset state
  - name: reset
    sig: '(): void'
    hint: Reset CPU to initial state
  - name: step
    sig: '(): boolean'
    hint: Execute one instruction cycle
  - name: run
    sig: '(cycles: number): void'
    hint: Run for specified cycles
  - name: fetchInstruction
    sig: '(): number'
    hint: Fetch next instruction byte
  - name: handleInterrupt
    sig: '(vector: number): void'
    hint: Process interrupt request
  - name: handleException
    sig: '(vector: number, errorCode?: number): void'
    hint: Process CPU exception
  - name: checkPendingInterrupts
    sig: '(): boolean'
    hint: Check if interrupts pending
  - name: getCurrentPrivilegeLevel
    sig: '(): number'
    hint: Return CPL from CS
  - name: setProtectedMode
    sig: '(enabled: boolean): void'
    hint: Switch CPU mode
  - name: isProtectedMode
    sig: '(): boolean'
    hint: Check if protected mode
  - name: updateInstructionPointer
    sig: '(offset: number): void'
    hint: Advance IP/EIP/RIP
  - name: getLinearAddress
    sig: '(): number'
    hint: Calculate CS:IP linear address
  - name: handleHLT
    sig: '(): void'
    hint: Process HLT instruction
  - name: dumpState
    sig: '(): string'
    hint: Return CPU state string
  references:
  - src/CPUCore/roska_descriptor.yaml
