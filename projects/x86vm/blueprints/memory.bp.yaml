## Blueprint — memory
name: memory
language: typescript
target_dir: src/memory
description: ''
constraints:
- x86 memory management
- page-based protection
- physical/virtual mapping
- 'CONTRACT: MemoryManager.protection is MemoryProtection — use its API: setPrivilegeLevel(level: number): void, getPrivilegeLevel():
  number, checkReadAccess(address: number): boolean, checkWriteAccess(address: number): boolean'
- 'CONTRACT: MemoryManager.pageTable is PageTable — use its API: setCR3(value: number): void, getCR3(): number, mapPage(virtual:
  number, physical: number, flags: number): void, unmapPage(virtual: number): void'
- 'CONTRACT: MemoryManager.physicalMemory is PhysicalMemory — use its API: constructor(size: number), read(address: number):
  number, write(address: number, value: number): void, readWord(address: number): number'
references:
- x86vm/src/mem/MemoryManager.ts
- x86vm/src/mem/PageTable.yaml
types:
- name: MemoryManager
  kind: class
  status: translated
  target_file: src/memory/memory-manager.ts
  description: Manages virtual memory allocation and protection
  fields:
  - name: pageTable
    type: PageTable
  - name: physicalMemory
    type: PhysicalMemory
  - name: protection
    type: MemoryProtection
  methods:
  - name: allocate
    sig: '(size: number, flags: number): number'
    hint: allocate virtual pages
  - name: free
    sig: '(address: number): void'
    hint: release virtual pages
  - name: read
    sig: '(address: number): number'
    hint: read byte from virtual
  - name: write
    sig: '(address: number, value: number): void'
    hint: write byte to virtual
  - name: readWord
    sig: '(address: number): number'
    hint: read 16-bit word
  - name: writeWord
    sig: '(address: number, value: number): void'
    hint: write 16-bit word
  - name: readDWord
    sig: '(address: number): number'
    hint: read 32-bit dword
  - name: writeDWord
    sig: '(address: number, value: number): void'
    hint: write 32-bit dword
  - name: translateAddress
    sig: '(virtual: number): number'
    hint: virtual to physical
  - name: checkAccess
    sig: '(address: number, access: number): boolean'
    hint: verify permissions
  - name: handlePageFault
    sig: '(address: number): void'
    hint: page fault handler
  - name: getPageInfo
    sig: '(address: number): PageInfo'
    hint: get page metadata
- name: PageTable
  kind: class
  status: translated
  target_file: src/memory/page-table.ts
  description: Manages x86 page tables and address translation
  fields:
  - name: entries
    type: PageEntry[]
  - name: cr3
    type: number
  methods:
  - name: setCR3
    sig: '(value: number): void'
    hint: set page directory base
  - name: getCR3
    sig: '(): number'
    hint: get page directory base
  - name: mapPage
    sig: '(virtual: number, physical: number, flags: number): void'
    hint: map virtual to physical
  - name: unmapPage
    sig: '(virtual: number): void'
    hint: remove mapping
  - name: getPhysicalAddress
    sig: '(virtual: number): number'
    hint: translate address
  - name: isPresent
    sig: '(virtual: number): boolean'
    hint: check page present
  - name: getPageFlags
    sig: '(virtual: number): number'
    hint: get page attributes
  - name: setPageFlags
    sig: '(virtual: number, flags: number): void'
    hint: set page attributes
  - name: invalidateTLB
    sig: '(address: number): void'
    hint: flush TLB entry
  - name: invalidateAll
    sig: '(): void'
    hint: flush entire TLB
  - name: walkPageTable
    sig: '(virtual: number): PageWalkResult'
    hint: traverse page tables
- name: PhysicalMemory
  kind: class
  status: pending
  target_file: src/memory/physical-memory.ts
  description: Manages physical RAM allocation and access
  fields:
  - name: memory
    type: Uint8Array
  - name: size
    type: number
  - name: allocatedBlocks
    type: Set<number>
  methods:
  - name: constructor
    sig: '(size: number)'
    hint: create physical memory
  - name: read
    sig: '(address: number): number'
    hint: read physical byte
  - name: write
    sig: '(address: number, value: number): void'
    hint: write physical byte
  - name: readWord
    sig: '(address: number): number'
    hint: read 16-bit word
  - name: writeWord
    sig: '(address: number, value: number): void'
    hint: write 16-bit word
  - name: readDWord
    sig: '(address: number): number'
    hint: read 32-bit dword
  - name: writeDWord
    sig: '(address: number, value: number): void'
    hint: write 32-bit dword
  - name: allocateBlock
    sig: '(size: number): number'
    hint: allocate physical block
  - name: freeBlock
    sig: '(address: number): void'
    hint: release physical block
  - name: isValidAddress
    sig: '(address: number): boolean'
    hint: check address range
  - name: getSize
    sig: '(): number'
    hint: get total size
  - name: dump
    sig: '(start: number, length: number): number[]'
    hint: get memory dump
- name: MemoryProtection
  kind: class
  status: translated
  target_file: src/memory/memory-protection.ts
  description: Handles memory access permissions and protection violations
  fields:
  - name: protectionLevels
    type: Map<number, number>
  - name: currentPrivilege
    type: number
  methods:
  - name: setPrivilegeLevel
    sig: '(level: number): void'
    hint: set CPL
  - name: getPrivilegeLevel
    sig: '(): number'
    hint: get CPL
  - name: checkReadAccess
    sig: '(address: number): boolean'
    hint: verify read permission
  - name: checkWriteAccess
    sig: '(address: number): boolean'
    hint: verify write permission
  - name: checkExecuteAccess
    sig: '(address: number): boolean'
    hint: verify execute permission
  - name: setPageProtection
    sig: '(address: number, flags: number): void'
    hint: set page permissions
  - name: handleProtectionFault
    sig: '(address: number, access: number): void'
    hint: protection violation
  - name: canAccessPage
    sig: '(virtual: number, access: number): boolean'
    hint: check page access
  - name: raisePageFault
    sig: '(address: number, present: boolean): void'
    hint: trigger page fault
  - name: getAccessFlags
    sig: '(address: number): number'
    hint: get access flags
- name: PageEntry
  kind: interface
  status: pending
  target_file: src/memory/page-entry.ts
  description: Represents a page table entry
  fields:
  - name: present
    type: boolean
  - name: physicalAddress
    type: number
  - name: flags
    type: number
- name: PageInfo
  kind: interface
  status: pending
  target_file: src/memory/page-info.ts
  description: Contains page metadata
  fields:
  - name: virtualAddress
    type: number
  - name: physicalAddress
    type: number
  - name: size
    type: number
  - name: flags
    type: number
- name: PageWalkResult
  kind: interface
  status: pending
  target_file: src/memory/page-walk-result.ts
  description: Result of page table walk
  fields:
  - name: found
    type: boolean
  - name: entry
    type: PageEntry
  - name: level
    type: number
