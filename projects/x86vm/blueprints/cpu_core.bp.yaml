## Blueprint — cpu_core
name: cpu_core
language: typescript
target_dir: src/cpu_core
description: ''
constraints:
- Must support 16-bit x86 registers
- Little-endian byte ordering
- Flags must be updated after each ALU operation
- 'CONTRACT: RegisterBank.flags is FlagsRegister — use its API: getCF(): boolean, setCF(value: boolean): void, getPF(): boolean,
  setPF(value: boolean): void'
- 'CONTRACT: ALU.flags is FlagsRegister — use its API: getCF(): boolean, setCF(value: boolean): void, getPF(): boolean, setPF(value:
  boolean): void'
references:
- x86vm/src/cpu_core/registers.yaml
- x86vm/src/cpu_core/alu.yaml
