## Blueprint — decoder
name: decoder
language: typescript
target_dir: src/decoder
description: ''
constraints:
- Must support 16/32/64-bit modes
- Handle all x86 instruction prefixes
- Decode ModR/M and SIB bytes
- Support operand size overrides
- 'CONTRACT: InstructionDecoder.modRmParser is ModRmParser — use its API: parse(byte: number): ModRmInfo, getMod(byte: number):
  number, getReg(byte: number): number, getRm(byte: number): number'
- 'CONTRACT: InstructionDecoder.opcodeMap is OpcodeMap — use its API: lookup(opcode: number[]): OpcodeEntry, lookupOneByte(opcode:
  number): OpcodeEntry, lookupTwoByte(opcode: number): OpcodeEntry, lookupThreeByte(byte1: number, byte2: number): OpcodeEntry'
- 'CONTRACT: InstructionDecoder.prefixScanner is PrefixScanner — use its API: scan(bytes: Uint8Array, offset: number): PrefixScanResult,
  isPrefix(byte: number): boolean, getPrefixType(byte: number): PrefixType, processLock(info: PrefixInfo): void'
- 'CONTRACT: InstructionDecoder.sibParser is SibParser — use its API: parse(byte: number): SibInfo, getScale(byte: number):
  number, getIndex(byte: number): number, getBase(byte: number): number'
references:
- dosbox/hardware/cpu/cpu_decode.yaml
types:
- name: InstructionDecoder
  kind: class
  status: translated
  target_file: src/decoder/instruction-decoder.ts
  description: Decodes x86 instructions into internal representation
  fields:
  - name: opcodeMap
    type: OpcodeMap
  - name: modRmParser
    type: ModRmParser
  - name: sibParser
    type: SibParser
  - name: prefixScanner
    type: PrefixScanner
  - name: cpuMode
    type: CpuMode
  - name: instructionPointer
    type: number
  methods:
  - name: decode
    sig: '(bytes: Uint8Array): DecodedInstruction'
    hint: Main decode entry point
  - name: decodeInstruction
    sig: '(bytes: Uint8Array, offset: number): DecodedInstruction'
    hint: Decode from offset
  - name: parsePrefixes
    sig: '(bytes: Uint8Array, offset: number): PrefixInfo'
    hint: Extract instruction prefixes
  - name: parseOpcode
    sig: '(bytes: Uint8Array, offset: number): OpcodeInfo'
    hint: Parse opcode bytes
  - name: parseOperands
    sig: '(bytes: Uint8Array, offset: number, opcode: OpcodeInfo): OperandInfo[]'
    hint: Parse operand bytes
  - name: getInstructionLength
    sig: '(bytes: Uint8Array, offset: number): number'
    hint: Calculate total length
  - name: isValidInstruction
    sig: '(bytes: Uint8Array, offset: number): boolean'
    hint: Check if valid instruction
  - name: decodeModRm
    sig: '(modRm: number): ModRmInfo'
    hint: Decode ModR/M byte
  - name: decodeSib
    sig: '(sib: number): SibInfo'
    hint: Decode SIB byte
  - name: calculateDisplacement
    sig: '(modRm: ModRmInfo, sib: SibInfo): number'
    hint: Get displacement value
  - name: calculateImmediate
    sig: '(opcode: OpcodeInfo, operands: OperandInfo[]): number'
    hint: Get immediate value
  - name: determineOperandSize
    sig: '(prefixes: PrefixInfo, opcode: OpcodeInfo): OperandSize'
    hint: Calculate operand size
  - name: determineAddressSize
    sig: '(prefixes: PrefixInfo): AddressSize'
    hint: Calculate address size
  - name: handleOperandSizeOverride
    sig: '(prefixes: PrefixInfo, defaultSize: OperandSize): OperandSize'
    hint: Apply size override
  - name: handleAddressSizeOverride
    sig: '(prefixes: PrefixInfo, defaultSize: AddressSize): AddressSize'
    hint: Apply address override
  - name: decodeRegisterOperand
    sig: '(reg: number, size: OperandSize, is64Bit: boolean): RegisterOperand'
    hint: Decode register operand
  - name: decodeMemoryOperand
    sig: '(modRm: ModRmInfo, sib: SibInfo, displacement: number): MemoryOperand'
    hint: Decode memory operand
  - name: decodeImmediateOperand
    sig: '(bytes: Uint8Array, offset: number, size: OperandSize): ImmediateOperand'
    hint: Decode immediate operand
  - name: decodeRelativeOffset
    sig: '(bytes: Uint8Array, offset: number, size: OperandSize): number'
    hint: Decode relative offset
  - name: isRexPrefix
    sig: '(byte: number): boolean'
    hint: Check for REX prefix
  - name: parseRexPrefix
    sig: '(byte: number): RexInfo'
    hint: Parse REX prefix
  - name: isTwoByteOpcode
    sig: '(byte: number): boolean'
    hint: Check for two-byte opcode
  - name: isThreeByteOpcode
    sig: '(bytes: Uint8Array, offset: number): boolean'
    hint: Check for three-byte opcode
  - name: getVexPrefixLength
    sig: '(byte: number): number'
    hint: Get VEX prefix length
  - name: parseVexPrefix
    sig: '(bytes: Uint8Array, offset: number): VexInfo'
    hint: Parse VEX prefix
  references:
  - src/roska/instruction_decoder.yaml
- name: OpcodeMap
