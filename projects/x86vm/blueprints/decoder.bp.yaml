  - name: twoByteMap
    type: Map<number, OpcodeEntry>
  - name: threeByteMap
    type: Map<number, Map<number, OpcodeEntry>>
  - name: vexMap
    type: Map<number, OpcodeEntry>
  methods:
  - name: lookup
    sig: '(opcode: number[]): OpcodeEntry'
