## Blueprint — decoder
name: decoder
language: typescript
target_dir: src/decoder
description: ''
constraints:
- Must decode x86 instructions from byte stream
- Support 16-bit and 32-bit modes
- Handle instruction prefixes
- Generate micro-ops for execution
- 'CONTRACT: InstructionDecoder.modrmParser is ModRMParser — use its API: parseModRM(byte: number): ModRMInfo, parseSIB(byte:
  number): SIBInfo, needsSIB(mod: number, rm: number): boolean, getDisplacementSize(mod: number, rm: number, is32Bit: boolean):
  0 | 1 | 4'
- 'CONTRACT: InstructionDecoder.opcodeMap is OpcodeMap — use its API: initialize(): void, addOpcode(byte: number, info: OpcodeInfo):
  void, addSecondaryOpcode(byte: number, info: OpcodeInfo): void, addGroupOpcode(group: number, subcode: number, info: OpcodeInfo):
  void'
references:
- x86vm/src/decoder/decoder.yaml
- x86vm/src/decoder/opcodes.yaml
types:
- name: InstructionDecoder
  kind: class
  status: translated
  target_file: src/decoder/instruction-decoder.ts
  description: Decodes x86 instructions into micro-operations
  fields:
  - name: opcodeMap
    type: OpcodeMap
    default: new OpcodeMap()
  - name: modrmParser
    type: ModRMParser
    default: new ModRMParser()
  - name: is32BitMode
    type: boolean
    default: 'false'
  - name: prefixes
    type: number
    default: '0'
  - name: instructionPointer
    type: number
    default: '0'
  methods:
  - name: decode
    sig: '(bytes: Uint8Array): MicroOp[]'
    hint: Main decode loop with prefix handling
  - name: decodeInstruction
    sig: '(bytes: Uint8Array, offset: number): {microOps: MicroOp[], length: number}'
    hint: Decode single instruction at offset
  - name: handlePrefixes
    sig: '(bytes: Uint8Array, offset: number): {prefixes: number, newOffset: number}'
    hint: Process 0x66, 0x67, segment prefixes
  - name: decodeOpcode
    sig: '(byte: number): OpcodeInfo'
    hint: Look up opcode in primary/secondary map
  - name: decodeModRM
    sig: '(byte: number): {mod: number, reg: number, rm: number}'
    hint: Extract mod-reg-rm fields
  - name: decodeSIB
    sig: '(byte: number): {scale: number, index: number, base: number}'
    hint: Decode scale-index-base byte
  - name: decodeDisplacement
    sig: '(bytes: Uint8Array, offset: number, mod: number): {value: number, size: number}'
    hint: 8-bit or 32-bit displacement
  - name: decodeImmediate
    sig: '(bytes: Uint8Array, offset: number, size: OperandSize): {value: number, size: number}'
    hint: 8, 16, or 32-bit immediate
  - name: calculateEffectiveAddress
    sig: '(modrm: ModRMInfo, sib?: SIBInfo): number'
    hint: Compute memory address from modrm/sib
  - name: getOperandSize
    sig: '(prefixes: number, defaultSize: OperandSize): OperandSize'
    hint: Apply 0x66 prefix to size
  - name: getAddressSize
    sig: '(prefixes: number): 16 | 32'
    hint: Apply 0x67 prefix
  - name: readMemory
    sig: '(address: number, size: number): number'
    hint: Read from memory subsystem
  - name: createMicroOp
    sig: '(opcode: OpcodeInfo, operands: Operand[]): MicroOp'
    hint: Convert decoded info to micro-op
  - name: handleGroupOpcode
    sig: '(opcode: number, modrm: number): OpcodeInfo'
    hint: Decode /0 to /7 group instructions
  - name: validateInstruction
    sig: '(microOp: MicroOp): boolean'
    hint: Check for invalid combinations
  references:
  - src/cpu_core/alu.yaml
- name: OpcodeMap
  kind: class
  status: translated
  target_file: src/decoder/opcode-map.ts
  description: Maps opcodes to instruction metadata
  fields:
  - name: primaryMap
    type: Map<number, OpcodeInfo>
    default: new Map()
  - name: secondaryMap
    type: Map<number, OpcodeInfo>
    default: new Map()
  - name: groupMaps
    type: Map<number, Map<number, OpcodeInfo>>
    default: new Map()
  methods:
  - name: initialize
    sig: '(): void'
    hint: Populate all opcode mappings
  - name: addOpcode
    sig: '(byte: number, info: OpcodeInfo): void'
    hint: Add to primary opcode map
  - name: addSecondaryOpcode
    sig: '(byte: number, info: OpcodeInfo): void'
    hint: Add opcode after 0x0F prefix
  - name: addGroupOpcode
    sig: '(group: number, subcode: number, info: OpcodeInfo): void'
    hint: Add /0 to /7 group instruction
  - name: getOpcode
    sig: '(byte: number, has0F: boolean): OpcodeInfo | null'
    hint: Look up by primary/secondary
  - name: getGroupOpcode
    sig: '(group: number, subcode: number): OpcodeInfo | null'
    hint: Look up group instruction
  - name: populateArithmetic
    sig: '(): void'
    hint: Add ADD, SUB, MUL, etc
  - name: populateLogical
    sig: '(): void'
    hint: Add AND, OR, XOR, NOT
  - name: populateShift
    sig: '(): void'
    hint: Add SHL, SHR, SAR, ROL, ROR
  - name: populateFlags
    sig: '(): void'
    hint: Add STC, CLC, CMC, STD, CLD
  - name: populateStack
    sig: '(): void'
    hint: Add PUSH, POP, PUSHF, POPF
  - name: populateJump
    sig: '(): void'
    hint: Add JMP, CALL, RET, conditional jumps
  - name: populateMove
    sig: '(): void'
    hint: Add MOV variants
  - name: populateString
    sig: '(): void'
    hint: Add MOVS, LODS, STOS, SCAS
  - name: populateIO
    sig: '(): void'
    hint: Add IN, OUT, INS, OUTS
  - name: populateInterrupt
    sig: '(): void'
    hint: Add INT, INTO, IRET
  - name: populateProtected
    sig: '(): void'
    hint: Add LGDT, LIDT, LLDT, LTR
  static:
  - name: OPCODE_TABLE_SIZE
    hint: 256 entries for primary map
  references:
  - src/cpu_core/alu.yaml
- name: ModRMParser
  kind: class
  status: pending
  target_file: src/decoder/mod-rm-parser.ts
  description: Parses ModRM and SIB bytes for addressing modes
  fields:
  - name: mod
    type: number
    default: '0'
  - name: reg
    type: number
    default: '0'
  - name: rm
    type: number
    default: '0'
  - name: hasSIB
    type: boolean
    default: 'false'
  - name: displacementSize
    type: number
    default: '0'
  methods:
  - name: parseModRM
    sig: '(byte: number): ModRMInfo'
    hint: Extract mod, reg, rm fields
  - name: parseSIB
    sig: '(byte: number): SIBInfo'
    hint: Extract scale, index, base
  - name: needsSIB
    sig: '(mod: number, rm: number): boolean'
    hint: Check if rm=4 requires SIB
  - name: getDisplacementSize
    sig: '(mod: number, rm: number, is32Bit: boolean): 0 | 1 | 4'
    hint: Determine disp8, disp16, disp32
  - name: decodeRegister
    sig: '(reg: number, is32Bit: boolean, isSegment: boolean): Register'
    hint: Map reg field to register enum
  - name: decodeRMRegister
    sig: '(rm: number, is32Bit: boolean): Register'
    hint: Map rm to register when mod=11
  - name: calculateMemoryAddress
    sig: '(modrm: ModRMInfo, sib?: SIBInfo, displacement?: number, segment?: Segment): number'
    hint: Compute effective address
  - name: getBaseRegister
    sig: '(rm: number, mod: number): Register | null'
    hint: Get base from rm or SIB
  - name: getIndexRegister
    sig: '(sib: SIBInfo): Register | null'
    hint: Get index from SIB
  - name: getScaleFactor
    sig: '(scale: number): 1 | 2 | 4 | 8'
    hint: Convert 2-bit scale field
  - name: isValidCombination
    sig: '(modrm: ModRMInfo, sib?: SIBInfo): boolean'
    hint: Check for reserved encodings
  - name: getSegmentOverride
    sig: '(modrm: ModRMInfo, defaultSegment: Segment): Segment'
    hint: Apply segment prefix
  - name: parseAddressingMode
    sig: '(modrm: ModRMInfo, sib?: SIBInfo): AddressingMode'
    hint: Classify as register or memory
  - name: getRegisterList
    sig: '(modrm: ModRMInfo): Register[]'
    hint: List all registers used
  - name: dump
    sig: '(info: ModRMInfo): string'
    hint: Debug string representation
  references:
  - src/cpu_core/alu.yaml
