  - name: lookupOneByte
    sig: '(opcode: number): OpcodeEntry'
    hint: Lookup one-byte opcode
  - name: lookupTwoByte
    sig: '(opcode: number): OpcodeEntry'
    hint: Lookup two-byte opcode
  - name: lookupThreeByte
    sig: '(byte1: number, byte2: number): OpcodeEntry'
    hint: Lookup three-byte opcode
  - name: lookupVex
    sig: '(byte1: number, byte2: number): OpcodeEntry'
    hint: Lookup VEX opcode
  - name: getInstructionMnemonic
    sig: '(entry: OpcodeEntry): string'
    hint: Get instruction name
  - name: getOperandTypes
    sig: '(entry: OpcodeEntry): OperandType[]'
    hint: Get operand types
  - name: getInstructionFlags
    sig: '(entry: OpcodeEntry): InstructionFlags'
    hint: Get instruction flags
  - name: isValidOpcode
    sig: '(opcode: number[]): boolean'
    hint: Check opcode validity
  - name: getOpcodeLength
    sig: '(opcode: number[]): number'
    hint: Get opcode length
  - name: getDefaultOperandSize
    sig: '(entry: OpcodeEntry): OperandSize'
    hint: Get default size
  - name: requiresModRm
    sig: '(entry: OpcodeEntry): boolean'
    hint: Check if needs ModR/M
  - name: hasImmediate
    sig: '(entry: OpcodeEntry): boolean'
    hint: Check if has immediate
  - name: getImmediateSize
    sig: '(entry: OpcodeEntry): OperandSize'
    hint: Get immediate size
  - name: isConditionalJump
    sig: '(entry: OpcodeEntry): boolean'
    hint: Check if conditional jump
  - name: isUnconditionalJump
    sig: '(entry: OpcodeEntry): boolean'
    hint: Check if unconditional jump
  - name: isCall
    sig: '(entry: OpcodeEntry): boolean'
    hint: Check if call instruction
  - name: isReturn
    sig: '(entry: OpcodeEntry): boolean'
    hint: Check if return instruction
  - name: isStringInstruction
    sig: '(entry: OpcodeEntry): boolean'
    hint: Check if string op
  - name: isInputOutput
    sig: '(entry: OpcodeEntry): boolean'
    hint: Check if I/O instruction
  - name: isSystemInstruction
    sig: '(entry: OpcodeEntry): boolean'
    hint: Check if system instruction
  - name: initializeMaps
    sig: '(): void'
    hint: Build opcode maps
  - name: addOpcodeEntry
    sig: '(map: Map, key: number, entry: OpcodeEntry): void'
    hint: Add opcode entry
  references:
  - src/roska/opcode_map.yaml
