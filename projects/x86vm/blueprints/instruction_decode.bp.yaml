## Blueprint — instruction_decode
name: instruction_decode
language: typescript
target_dir: src/instruction_decode
description: ''
constraints:
- Decode x86 instructions
- Handle prefixes
- ModRM/SIB parsing
- 'CONTRACT: InstructionDecoder.modrmParser is ModRMParser — use its API: parse(byte: number): ModRMInfo, hasModRM(opcode:
  number): boolean, getModRMByte(inst: DecodedInstruction): number, parseDisplacement(modrm: ModRMInfo, addressSize: number):
  number'
- 'CONTRACT: InstructionDecoder.opcodeMap is OpcodeMap — use its API: getInstruction(opcode: number, has66: boolean, hasF2:
  boolean, hasF3: boolean): InstructionInfo, addOpcode(opcode: number, info: InstructionInfo): void, isTwoByteOpcode(firstByte:
  number): boolean, isThreeByteOpcode(firstBytes: Uint8Array): boolean'
- 'CONTRACT: InstructionDecoder.sibParser is SIBParser — use its API: parse(byte: number): SIBInfo, calculateAddress(sib:
  SIBInfo, displacement: number, registers: RegisterBank, addressSize: number): number, getScaleFactor(scale: number): number,
  needsDisplacement(sib: SIBInfo, mod: number): boolean'
- 'CONTRACT: ModRMParser uses RegisterBank from cpu_core [class] — import from ''../cpu_core'', API: getAX(): number, setAX(value:
  number): void, getAH(): number, setAH(value: number): void, getAL(): number'
- 'CONTRACT: SIBParser uses RegisterBank from cpu_core [class] — import from ''../cpu_core'', API: getAX(): number, setAX(value:
  number): void, getAH(): number, setAH(value: number): void, getAL(): number'
references:
- x86vm/src/decode/InstructionDecoder.ts
- x86vm/src/decode/OpcodeMap.yaml
