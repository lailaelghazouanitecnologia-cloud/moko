## Blueprint — InstructionDecoder
name: InstructionDecoder
language: typescript
target_dir: src/InstructionDecoder
description: ''
constraints:
- Must handle x86 16/32/64-bit modes
- Support all general-purpose instructions
- Efficient decoding for VM execution
- 'CONTRACT: InstructionDecoder.displacementFetcher is DisplacementFetcher — use its API: fetch(bytes: Uint8Array, offset:
  number, size: number): number, fetch8(bytes: Uint8Array, offset: number): number, fetch16(bytes: Uint8Array, offset: number):
  number, fetch32(bytes: Uint8Array, offset: number): number'
- 'CONTRACT: InstructionDecoder.modrmParser is ModRMParser — use its API: parse(modrm: number): ModRMInfo, getMod(modrm: number):
  number, getReg(modrm: number): number, getRM(modrm: number): number'
- 'CONTRACT: InstructionDecoder.opcodeMap is OpcodeMap — use its API: initialize(): void, getOpcodeInfo(opcode: number, has0F:
  boolean, byte2?: number, byte3?: number): OpcodeInfo, addOneByteOpcode(opcode: number, info: OpcodeInfo): void, addTwoByteOpcode(opcode:
  number, info: OpcodeInfo): void'
- 'CONTRACT: InstructionDecoder.sibParser is SIBParser — use its API: parse(sib: number): SIBInfo, getScale(sib: number):
  number, getIndex(sib: number): number, getBase(sib: number): number'
references:
- x86vm/decoder/instruction_decoder.yaml
types:
- name: InstructionDecoder
  kind: class
  status: translated
  target_file: src/InstructionDecoder/instruction-decoder.ts
  description: Decodes x86 instructions into executable format
  fields:
  - name: opcodeMap
    type: OpcodeMap
    default: new OpcodeMap()
  - name: modrmParser
    type: ModRMParser
    default: new ModRMParser()
  - name: sibParser
    type: SIBParser
    default: new SIBParser()
  - name: displacementFetcher
    type: DisplacementFetcher
    default: new DisplacementFetcher()
  - name: currentMode
    type: ProcessorMode
    default: ProcessorMode.PROTECTED_32
  methods:
  - name: decode
    sig: '(bytes: Uint8Array, offset: number): DecodedInstruction'
    hint: Main decode entry point
  - name: decodeOpcode
    sig: '(bytes: Uint8Array, offset: number): OpcodeInfo'
    hint: Extract opcode and prefixes
  - name: decodeOperands
    sig: '(instruction: DecodedInstruction, bytes: Uint8Array, offset: number): void'
    hint: Parse ModRM, SIB, displacement
  - name: decodeImmediate
    sig: '(instruction: DecodedInstruction, bytes: Uint8Array, offset: number): void'
    hint: Extract immediate values
  - name: handlePrefixes
    sig: '(bytes: Uint8Array, offset: number): PrefixInfo'
    hint: Process instruction prefixes
  - name: determineOperandSize
    sig: '(prefixes: PrefixInfo, defaultSize: number): number'
    hint: Calculate operand size from prefixes
  - name: determineAddressSize
    sig: '(prefixes: PrefixInfo, defaultSize: number): number'
    hint: Calculate address size from prefixes
  - name: validateInstruction
    sig: '(instruction: DecodedInstruction): boolean'
    hint: Check instruction validity
  - name: getInstructionLength
    sig: '(instruction: DecodedInstruction): number'
    hint: Calculate total instruction size
  - name: isValidOpcode
    sig: '(opcode: number): boolean'
    hint: Check if opcode exists
  - name: getInstructionMnemonic
    sig: '(opcode: number): string'
    hint: Get assembly mnemonic
  - name: setProcessorMode
    sig: '(mode: ProcessorMode): void'
    hint: Switch 16/32/64-bit mode
  - name: decodeTwoByteOpcode
    sig: '(bytes: Uint8Array, offset: number): OpcodeInfo'
