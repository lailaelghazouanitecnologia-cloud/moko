## Blueprint — Registers
name: Registers
language: typescript
target_dir: src/Registers
description: ''
constraints:
- Must support 16-bit, 32-bit, and 64-bit register widths
- Must maintain backward compatibility with 8086
- Must support register aliasing (e.g., AX/AH/AL)
- Must track flags accurately for conditional jumps
references:
- x86vm/registers/register_file.yaml
types:
- name: GeneralPurposeRegisters
  kind: class
  status: pending
  target_file: src/Registers/general-purpose-registers.ts
  description: Manages AX, BX, CX, DX, SI, DI, BP, SP and their subregisters
  fields:
  - name: registers
    type: Map<string, number>
    default: new Map()
  - name: width
    type: number
    default: '32'
  methods:
  - name: getAX
    sig: '(): number'
    hint: Return AX register value
  - name: setAX
    sig: '(value: number): void'
    hint: Set AX register value
  - name: getAH
    sig: '(): number'
    hint: Return high byte of AX
  - name: setAH
    sig: '(value: number): void'
    hint: Set high byte of AX
  - name: getAL
    sig: '(): number'
    hint: Return low byte of AX
  - name: setAL
    sig: '(value: number): void'
    hint: Set low byte of AX
  - name: getBX
    sig: '(): number'
    hint: Return BX register value
  - name: setBX
    sig: '(value: number): void'
    hint: Set BX register value
  - name: getCX
    sig: '(): number'
    hint: Return CX register value
  - name: setCX
    sig: '(value: number): void'
    hint: Set CX register value
  - name: getDX
    sig: '(): number'
    hint: Return DX register value
  - name: setDX
    sig: '(value: number): void'
    hint: Set DX register value
  - name: getSI
    sig: '(): number'
    hint: Return SI register value
  - name: setSI
    sig: '(value: number): void'
    hint: Set SI register value
  - name: getDI
    sig: '(): number'
    hint: Return DI register value
  - name: setDI
    sig: '(value: number): void'
    hint: Set DI register value
  - name: getBP
    sig: '(): number'
    hint: Return BP register value
  - name: setBP
    sig: '(value: number): void'
    hint: Set BP register value
  - name: getSP
    sig: '(): number'
    hint: Return SP register value
  - name: setSP
    sig: '(value: number): void'
    hint: Set SP register value
  - name: getRegister
    sig: '(name: string): number'
    hint: Get register by name
  - name: setRegister
    sig: '(name: string, value: number): void'
    hint: Set register by name
  - name: push
    sig: '(value: number): void'
    hint: Push value to stack
  - name: pop
    sig: '(): number'
    hint: Pop value from stack
  references:
  - src/Registers/roska.yaml
