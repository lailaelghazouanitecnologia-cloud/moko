    type: Float64Array
    default: new Float64Array(8)
  - name: tags
    type: Uint8Array
    default: new Uint8Array(8)
  - name: top
    type: number
    default: '0'
  - name: control
    type: number
    default: '0x037F'
  - name: status
    type: number
    default: '0x0000'
  methods:
  - name: push
    sig: '(value: number): void'
    hint: push value onto FPU stack
  - name: pop
    sig: '(): number'
    hint: pop value from FPU stack
  - name: get
    sig: '(index: number): number'
    hint: get ST(i) value
  - name: set
    sig: '(index: number, value: number): void'
    hint: set ST(i) value
  - name: getST0
