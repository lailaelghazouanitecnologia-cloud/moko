## Blueprint — registers
name: registers
language: typescript
target_dir: src/registers
description: ''
constraints:
- Must support 32-bit x86 register model
- Must handle register aliasing (e.g., AX = AL+AH)
- Must track register state changes
- Must support register renaming for optimization
- 'CONTRACT: MmXRegisters.fpu is FpuRegisters — use its API: push(value: number): void, pop(): number, get(index: number):
  number, set(index: number, value: number): void'
references:
- dosbox/hardware/cpu/cpu_regs.yaml
types:
- name: GpRegisters
  kind: class
  status: pending
  target_file: src/registers/gp-registers.ts
  description: General purpose register file with 8 32-bit registers and subregisters
  fields:
  - name: registers
    type: Uint32Array
    default: new Uint32Array(8)
  - name: changeCallbacks
    type: Map<number, Set<RegisterChangeCallback>>
    default: new Map()
  methods:
  - name: get
    sig: '(reg: RegisterIndex): number'
    hint: return 32-bit register value
  - name: set
    sig: '(reg: RegisterIndex, value: number): void'
    hint: set 32-bit register and trigger callbacks
  - name: get8
    sig: '(reg: RegisterIndex8): number'
    hint: return 8-bit subregister value
  - name: set8
    sig: '(reg: RegisterIndex8, value: number): void'
    hint: set 8-bit subregister with proper masking
  - name: get16
    sig: '(reg: RegisterIndex16): number'
    hint: return 16-bit subregister value
  - name: set16
    sig: '(reg: RegisterIndex16, value: number): void'
    hint: set 16-bit subregister
  - name: get32
    sig: '(reg: RegisterIndex): number'
    hint: alias for get()
  - name: set32
    sig: '(reg: RegisterIndex, value: number): void'
    hint: alias for set()
  - name: get64
    sig: '(reg: RegisterIndex): bigint'
    hint: return 64-bit value from two registers
  - name: set64
    sig: '(reg: RegisterIndex, value: bigint): void'
    hint: set 64-bit value across two registers
  - name: reset
    sig: '(): void'
    hint: zero all registers
  - name: clone
    sig: '(): GpRegisters'
    hint: create deep copy
  - name: onChange
    sig: '(reg: RegisterIndex, callback: RegisterChangeCallback): void'
    hint: register change listener
  - name: offChange
    sig: '(reg: RegisterIndex, callback: RegisterChangeCallback): void'
    hint: remove change listener
  - name: getFlags
    sig: '(): number'
    hint: return EFLAGS register value
  - name: setFlags
    sig: '(value: number): void'
    hint: set EFLAGS register value
  static:
  - name: COUNT
    hint: 8 general purpose registers
  - name: INDEX_EAX
    hint: '0'
  - name: INDEX_ECX
    hint: '1'
  - name: INDEX_EDX
    hint: '2'
  - name: INDEX_EBX
    hint: '3'
  - name: INDEX_ESP
    hint: '4'
  - name: INDEX_EBP
    hint: '5'
  - name: INDEX_ESI
    hint: '6'
  - name: INDEX_EDI
    hint: '7'
  references:
  - src/vm_core/registers.roska
- name: SegmentRegisters
  kind: class
  status: pending
  target_file: src/registers/segment-registers.ts
  description: x86 segment register file with 6 segment registers
  fields:
  - name: selectors
    type: Uint16Array
    default: new Uint16Array(6)
  - name: descriptors
    type: SegmentDescriptor[]
    default: new Array(6)
  methods:
  - name: getSelector
    sig: '(reg: SegmentRegister): number'
    hint: return 16-bit segment selector
  - name: setSelector
    sig: '(reg: SegmentRegister, selector: number): void'
    hint: set segment selector and load descriptor
  - name: getBase
    sig: '(reg: SegmentRegister): number'
    hint: return segment base address
  - name: getLimit
    sig: '(reg: SegmentRegister): number'
    hint: return segment limit
  - name: getAccess
    sig: '(reg: SegmentRegister): number'
    hint: return segment access rights
  - name: loadDescriptor
    sig: '(reg: SegmentRegister): void'
    hint: load descriptor from GDT/LDT
  - name: checkAccess
    sig: '(reg: SegmentRegister, offset: number, size: number, write: boolean): boolean'
    hint: validate memory access
  - name: getEffectiveAddress
    sig: '(reg: SegmentRegister, offset: number): number'
    hint: calculate linear address
  - name: reset
    sig: '(): void'
    hint: reset to default values
  - name: clone
    sig: '(): SegmentRegisters'
    hint: create deep copy
  static:
  - name: COUNT
    hint: 6 segment registers
  - name: INDEX_ES
    hint: '0'
  - name: INDEX_CS
    hint: '1'
  - name: INDEX_SS
    hint: '2'
  - name: INDEX_DS
    hint: '3'
  - name: INDEX_FS
    hint: '4'
  - name: INDEX_GS
    hint: '5'
  references:
  - src/vm_core/registers.roska
