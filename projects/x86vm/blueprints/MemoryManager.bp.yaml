## Blueprint — MemoryManager
name: MemoryManager
language: typescript
target_dir: src/MemoryManager
description: ''
constraints:
- Must support x86 protected mode paging
- Must handle 4KB page granularity
- Must support both physical and virtual addressing
- Must implement TLB for performance
- 'CONTRACT: VirtualMemory.physicalMemory is PhysicalMemory — use its API: read8(addr: number): number, read16(addr: number):
  number, read32(addr: number): number, write8(addr: number, value: number): void'
- 'CONTRACT: MemoryMapper.physicalMemory is PhysicalMemory — use its API: read8(addr: number): number, read16(addr: number):
  number, read32(addr: number): number, write8(addr: number, value: number): void'
- 'CONTRACT: MemoryMapper.tlb is TLB — use its API: lookup(linear: number): number | undefined, insert(linear: number, physical:
  number, flags: number): void, invalidate(linear: number): void, invalidateAll(): void'
- 'CONTRACT: MemoryMapper.virtualMemory is VirtualMemory — use its API: enable(cr0: number, cr3: number): void, disable():
  void, isPagingEnabled(): boolean, translateAddress(linear: number): number'
references:
- x86vm/memory/memory_manager.yaml
types:
- name: PhysicalMemory
  kind: class
  status: translated
  target_file: src/MemoryManager/physical-memory.ts
  description: Manages physical RAM and memory-mapped I/O regions
  fields:
  - name: ram
    type: Uint8Array
    default: new Uint8Array(0x1000000)
  - name: ioRegions
    type: Map<number, IODevice>
    default: new Map()
  - name: size
    type: number
    default: '0x1000000'
  methods:
  - name: read8
    sig: '(addr: number): number'
    hint: Read byte from physical address
  - name: read16
    sig: '(addr: number): number'
    hint: Read 16-bit word from physical address
  - name: read32
    sig: '(addr: number): number'
    hint: Read 32-bit dword from physical address
  - name: write8
    sig: '(addr: number, value: number): void'
    hint: Write byte to physical address
  - name: write16
    sig: '(addr: number, value: number): void'
    hint: Write 16-bit word to physical address
  - name: write32
    sig: '(addr: number, value: number): void'
    hint: Write 32-bit dword to physical address
  - name: isValidAddress
    sig: '(addr: number): boolean'
    hint: Check if address is within RAM bounds
  - name: mapIODevice
    sig: '(base: number, device: IODevice, size: number): void'
    hint: Map I/O device to physical address range
  - name: unmapIODevice
    sig: '(base: number): void'
    hint: Remove I/O device mapping
  - name: getIODevice
    sig: '(addr: number): IODevice | undefined'
    hint: Get I/O device at address
  - name: load
    sig: '(data: Uint8Array, offset: number): void'
    hint: Load binary data at offset
  - name: dump
    sig: '(start: number, length: number): Uint8Array'
    hint: Extract memory region as bytes
  - name: clear
    sig: '(): void'
    hint: Zero all RAM contents
  references:
  - roska/x86/memory/physical_memory.yaml
- name: VirtualMemory
  kind: class
  status: translated
  target_file: src/MemoryManager/virtual-memory.ts
  description: Handles virtual address translation and page management
  fields:
  - name: pageDirectory
    type: Uint32Array
    default: new Uint32Array(1024)
  - name: pageTables
    type: Map<number, Uint32Array>
    default: new Map()
  - name: isEnabled
    type: boolean
    default: 'false'
  - name: physicalMemory
    type: PhysicalMemory
    default: 'null'
  methods:
  - name: enable
    sig: '(cr0: number, cr3: number): void'
    hint: Enable paging with CR0 and CR3
  - name: disable
    sig: '(): void'
    hint: Disable paging
  - name: isPagingEnabled
    sig: '(): boolean'
    hint: Check if paging is active
  - name: translateAddress
    sig: '(linear: number): number'
    hint: Convert linear to physical address
  - name: read8
    sig: '(linear: number): number'
    hint: Read byte from linear address
  - name: read16
    sig: '(linear: number): number'
    hint: Read 16-bit word from linear address
  - name: read32
    sig: '(linear: number): number'
    hint: Read 32-bit dword from linear address
  - name: write8
    sig: '(linear: number, value: number): void'
    hint: Write byte to linear address
  - name: write16
    sig: '(linear: number, value: number): void'
    hint: Write 16-bit word to linear address
  - name: write32
    sig: '(linear: number, value: number): void'
    hint: Write 32-bit dword to linear address
  - name: setPageTableEntry
    sig: '(linear: number, entry: number): void'
    hint: Set page table entry
  - name: getPageTableEntry
    sig: '(linear: number): number'
    hint: Get page table entry
  - name: invalidatePage
    sig: '(linear: number): void'
    hint: Invalidate single page
  - name: invalidateTLB
    sig: '(): void'
    hint: Invalidate entire TLB
  - name: handlePageFault
    sig: '(linear: number, isWrite: boolean): void'
    hint: Handle page fault exception
  references:
  - roska/x86/memory/virtual_memory.yaml
- name: PageTable
  kind: class
  status: pending
  target_file: src/MemoryManager/page-table.ts
  description: Manages x86 hierarchical page tables
  fields:
  - name: entries
    type: Uint32Array
    default: new Uint32Array(1024)
  - name: level
    type: number
    default: '0'
  methods:
  - name: getEntry
    sig: '(index: number): number'
    hint: Get page table entry
  - name: setEntry
    sig: '(index: number, entry: number): void'
    hint: Set page table entry
  - name: isPresent
    sig: '(index: number): boolean'
    hint: Check if page is present
  - name: isWritable
    sig: '(index: number): boolean'
    hint: Check if page is writable
  - name: isUser
    sig: '(index: number): boolean'
    hint: Check if page is user accessible
  - name: isAccessed
    sig: '(index: number): boolean'
    hint: Check if page was accessed
  - name: isDirty
    sig: '(index: number): boolean'
    hint: Check if page was written
  - name: getPhysicalAddress
    sig: '(index: number): number'
    hint: Extract physical address from entry
  - name: setPhysicalAddress
    sig: '(index: number, addr: number): void'
    hint: Set physical address in entry
  - name: getFlags
    sig: '(index: number): number'
    hint: Extract flags from entry
  - name: setFlags
    sig: '(index: number, flags: number): void'
    hint: Set flags in entry
  - name: clear
    sig: '(): void'
    hint: Clear all entries
  - name: clone
    sig: '(): PageTable'
    hint: Create copy of page table
  references:
  - roska/x86/memory/page_table.yaml
- name: TLB
  kind: class
  status: pending
  target_file: src/MemoryManager/tlb.ts
  description: Translation Lookaside Buffer for fast address translation
  fields:
  - name: entries
    type: TLBEntry[]
    default: '[]'
  - name: size
    type: number
    default: '64'
  - name: replacementPolicy
    type: string
    default: '''LRU'''
  methods:
  - name: lookup
    sig: '(linear: number): number | undefined'
    hint: Find physical address for linear
  - name: insert
    sig: '(linear: number, physical: number, flags: number): void'
    hint: Add new TLB entry
  - name: invalidate
    sig: '(linear: number): void'
    hint: Remove specific TLB entry
  - name: invalidateAll
    sig: '(): void'
    hint: Clear entire TLB
  - name: flush
    sig: '(): void'
    hint: Clear all entries
  - name: getHitRate
    sig: '(): number'
    hint: Calculate cache hit rate
  - name: getMissRate
    sig: '(): number'
    hint: Calculate cache miss rate
  - name: setReplacementPolicy
    sig: '(policy: string): void'
    hint: Set LRU or FIFO policy
  - name: isEntryValid
    sig: '(entry: TLBEntry): boolean'
    hint: Check if TLB entry valid
  - name: evictEntry
    sig: '(): void'
    hint: Remove entry per policy
  references:
  - roska/x86/memory/tlb.yaml
- name: MemoryMapper
  kind: class
  status: translated
  target_file: src/MemoryManager/memory-mapper.ts
  description: Coordinates between physical, virtual memory and TLB
  fields:
  - name: physicalMemory
    type: PhysicalMemory
    default: 'null'
  - name: virtualMemory
    type: VirtualMemory
    default: 'null'
  - name: tlb
    type: TLB
    default: 'null'
  methods:
  - name: mapMemory
    sig: '(linear: number, physical: number, size: number, flags: number): void'
    hint: Map linear to physical range
  - name: unmapMemory
    sig: '(linear: number, size: number): void'
    hint: Remove linear mapping
  - name: readMemory
    sig: '(linear: number, size: number): number'
    hint: Read from linear address
  - name: writeMemory
    sig: '(linear: number, value: number, size: number): void'
    hint: Write to linear address
  - name: protectMemory
    sig: '(linear: number, size: number, flags: number): void'
    hint: Change memory protection
  - name: allocatePages
    sig: '(linear: number, count: number, flags: number): void'
    hint: Allocate contiguous pages
  - name: freePages
    sig: '(linear: number, count: number): void'
    hint: Free contiguous pages
  - name: handleTLBMiss
    sig: '(linear: number): number'
    hint: Process TLB miss
  - name: switchAddressSpace
    sig: '(cr3: number): void'
    hint: Change page directory
  - name: getMemoryInfo
    sig: '(linear: number): MemoryInfo'
    hint: Get mapping information
  references:
  - roska/x86/memory/mapper.yaml
