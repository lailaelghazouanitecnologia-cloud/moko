## Project Blueprint — nova
name: nova
goal: Build nova game engine
language: typescript
layers:
- name: core
  order: 0
  types:
  - name: EventEmitter
    kind: class
    description: pub/sub event system
  - name: Timer
    kind: class
    description: frame timing and delta
  - name: ResourceLoader
    kind: class
    description: async resource loading
  - name: Tags
    kind: class
    description: tag-based filtering
  - name: Platform
    kind: class
    description: platform detection and capabilities
  requires: []
  description: Foundation utilities with zero dependencies
  constraints: []
- name: math
  order: 1
  types:
  - name: Vec2
    kind: class
    description: 2D vector
  - name: Vec3
    kind: class
    description: 3D vector
  - name: Vec4
    kind: class
    description: 4D vector / homogeneous
  - name: Mat3
    kind: class
    description: 3x3 matrix, normals
  - name: Mat4
    kind: class
    description: 4x4 matrix, transforms
  - name: Quat
    kind: class
    description: quaternion rotation
  - name: Color
    kind: class
    description: RGBA color with conversions
  - name: Ray
    kind: class
    description: origin + direction for raycasting
  - name: BoundingBox
    kind: class
    description: AABB collision
  - name: BoundingSphere
    kind: class
    description: sphere collision
  - name: Frustum
    kind: class
    description: camera frustum culling
  - name: Curve
    kind: class
    description: interpolation curves
  requires:
  - core
  description: Math library, Float32Array storage, column-major
  constraints: []
- name: graphics
  order: 2
  types:
  - name: GraphicsDevice
    kind: interface
    description: abstract GPU interface
  - name: WebGLDevice
    kind: class
    description: WebGL implementation
  - name: VertexFormat
    kind: class
    description: vertex attribute layout
  - name: VertexBuffer
    kind: class
    description: GPU vertex data
  - name: IndexBuffer
    kind: class
    description: GPU index data
  - name: Shader
    kind: class
    description: shader program management
  - name: Texture
    kind: class
    description: 2D texture with mipmaps
  - name: RenderTarget
    kind: class
    description: offscreen framebuffer
  - name: Material
    kind: class
    description: shader + parameters
  - name: Mesh
    kind: class
    description: geometry container
  - name: MeshInstance
    kind: class
    description: mesh + material + transform
  - name: ScopeSpace
    kind: class
    description: shader uniform scope
  requires:
  - core
  - math
  description: GPU abstraction layer
  constraints: []
- name: scene
  order: 3
  types:
  - name: GraphNode
    kind: class
    description: scene tree node with transform
  - name: Entity
    kind: class
    description: game object with components
  - name: Component
    kind: class
    description: base component
  - name: ComponentSystem
    kind: class
    description: manages component lifecycle
  - name: Camera
    kind: class
    description: projection and view matrices
  - name: Light
    kind: class
    description: directional/point/spot
  - name: MeshRenderer
    kind: class
    description: renders MeshInstance
  - name: Scene
    kind: class
    description: root container, sky, fog, ambient
  - name: BatchManager
    kind: class
    description: draw call batching
  - name: ForwardRenderer
    kind: class
    description: forward rendering pipeline
  requires:
  - core
  - math
  - graphics
  description: Scene graph and rendering pipeline
  constraints: []
- name: input
  order: 4
  types:
  - name: Keyboard
    kind: class
    description: key state tracking
  - name: Mouse
    kind: class
    description: position, buttons, wheel
  - name: Touch
    kind: class
    description: multi-touch support
  - name: Gamepad
    kind: class
    description: gamepad API wrapper
  - name: InputManager
    kind: class
    description: unified input facade
  - name: ElementInput
    kind: class
    description: UI raycasting input
  requires:
  - core
  - math
  description: Input device abstraction
  constraints: []
- name: audio
  order: 5
  types:
  - name: AudioManager
    kind: class
    description: Web Audio API manager
  - name: Sound
    kind: class
    description: audio asset wrapper
  - name: Channel
    kind: class
    description: playing sound instance
  - name: Channel3d
    kind: class
    description: spatialized audio
  - name: Listener
    kind: class
    description: audio listener position
  requires:
  - core
  - math
  description: 3D audio system
  constraints: []
- name: animation
  order: 6
  types:
  - name: AnimClip
    kind: class
    description: animation clip data
  - name: AnimTrack
    kind: class
    description: single property track
  - name: AnimCurve
    kind: class
    description: keyframe interpolation
  - name: AnimController
    kind: class
    description: state machine
  - name: AnimState
    kind: class
    description: one state in controller
  - name: Skeleton
    kind: class
    description: bone hierarchy
  - name: Bone
    kind: class
    description: single bone with bind pose
  requires:
  - core
  - math
  - scene
  description: Skeletal and property animation
  constraints: []
- name: physics
  order: 7
  types:
  - name: PhysicsWorld
    kind: class
    description: simulation world
  - name: RigidBody
    kind: class
    description: dynamic/static/kinematic
  - name: Collider
    kind: class
    description: collision shape
  - name: ContactResult
    kind: class
    description: collision contact data
  - name: RaycastResult
    kind: class
    description: raycast hit info
  - name: CollisionMesh
    kind: class
    description: trimesh collider
  requires:
  - core
  - math
  - scene
  description: Physics simulation abstraction
  constraints: []
- name: ui
  order: 8
  types:
  - name: Element
    kind: class
    description: base UI element
  - name: Screen
    kind: class
    description: UI root, scaling
  - name: Button
    kind: class
    description: interactive button
  - name: Text
    kind: class
    description: text rendering
  - name: Image
    kind: class
    description: image display
  - name: LayoutGroup
    kind: class
    description: flex/grid layout
  - name: ScrollView
    kind: class
    description: scrollable container
  requires:
  - core
  - math
  - graphics
  - scene
  - input
  description: 2D UI system
  constraints: []
- name: app
  order: 9
  types:
  - name: Application
    kind: class
    description: main app lifecycle
  - name: SceneRegistry
    kind: class
    description: scene loading/switching
  - name: AssetRegistry
    kind: class
    description: asset management
  - name: ScriptRegistry
    kind: class
    description: script component system
  requires:
  - core
  - math
  - graphics
  - scene
  - input
  - audio
  description: Application framework tying everything together
  constraints: []
