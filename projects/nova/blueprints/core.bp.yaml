## Blueprint — core
name: core
language: typescript
target_dir: src/core
description: ''
constraints:
- zero dependencies
- foundation utilities only
references:
- playcanvas/platform/graphics/graphics-device.yaml
- playcanvas/scene/renderer/forward-renderer.yaml
- playcanvas/framework/entity.yaml
- playcanvas/core/math/vec3.yaml
types:
- name: EventEmitter
  kind: class
  status: pending
  target_file: src/core/event-emitter.ts
  description: Minimal event bus with typed listeners
  fields:
  - name: _events
    type: Map<string, Set<Function>>
    default: new Map()
  methods:
  - name: true
    sig: '(event: string, listener: Function): void'
    hint: add listener to event set
  - name: false
    sig: '(event: string, listener?: Function): void'
    hint: remove listener or entire event
  - name: emit
    sig: '(event: string, ...args: any[]): void'
    hint: invoke all listeners for event
  - name: once
    sig: '(event: string, listener: Function): void'
    hint: auto-remove after first emit
  - name: listenerCount
    sig: '(event: string): number'
    hint: count listeners for event
  - name: eventNames
    sig: '(): string[]'
    hint: return all registered events
  - name: removeAllListeners
    sig: '(event?: string): void'
    hint: clear one or all events
  references:
  - playcanvas/framework/entity.yaml
- name: Timer
  kind: class
  status: pending
  target_file: src/core/timer.ts
  description: High-resolution time utilities
  static:
  - name: now
    sig: '(): number'
    hint: performance.now() wrapper
  - name: delta
    sig: '(last: number): number'
    hint: ms since last timestamp
  - name: sleep
    sig: '(ms: number): Promise<void>'
    hint: async delay via setTimeout
  - name: frame
    sig: '(): Promise<number>'
    hint: resolve on next animation frame
  - name: benchmark
    sig: '<T>(fn: () => T): [T, number]'
    hint: return value and duration
  - name: throttle
    sig: '(fn: Function, ms: number): Function'
    hint: limit calls per window
  - name: debounce
    sig: '(fn: Function, ms: number): Function'
    hint: delay until idle
  - name: lerp
    sig: '(a: number, b: number, t: number): number'
    hint: linear interpolation
  - name: clamp
    sig: '(v: number, min: number, max: number): number'
    hint: bound value
  - name: fps
    sig: '(frames: number, elapsed: number): number'
    hint: calculate frames per second
- name: ResourceLoader
  kind: class
  status: translated
  target_file: src/core/resource-loader.ts
  description: Async resource fetcher with cache
  fields:
  - name: cache
    type: Map<string, any>
    default: new Map()
  - name: inflight
    type: Map<string, Promise<any>>
    default: new Map()
  methods:
  - name: load
    sig: '(url: string, type?: string): Promise<any>'
    hint: fetch and cache by url
  - name: loadImage
    sig: '(url: string): Promise<HTMLImageElement>'
    hint: create img with onload
  - name: loadText
    sig: '(url: string): Promise<string>'
    hint: fetch as string
  - name: loadJson
    sig: '(url: string): Promise<any>'
    hint: fetch and JSON.parse
  - name: loadArrayBuffer
    sig: '(url: string): Promise<ArrayBuffer>'
    hint: fetch as buffer
  - name: loadBlob
    sig: '(url: string): Promise<Blob>'
    hint: fetch as blob
  - name: preload
    sig: '(urls: string[]): Promise<any[]>'
    hint: parallel load array
  - name: clearCache
    sig: '(url?: string): void'
    hint: drop one or all
  - name: isCached
    sig: '(url: string): boolean'
    hint: check cache existence
  static:
  - name: createObjectURL
    sig: '(buffer: ArrayBuffer, type: string): string'
    hint: generate temporary url
  - name: revokeObjectURL
    sig: '(url: string): void'
    hint: cleanup blob url
- name: Tags
  kind: class
  status: pending
  target_file: src/core/tags.ts
  description: String set with fast query support
  fields:
  - name: _list
    type: Set<string>
    default: new Set()
  methods:
  - name: add
    sig: '(...tags: string[]): void'
    hint: insert lowercase strings
  - name: remove
    sig: '(...tags: string[]): void'
    hint: delete if present
  - name: has
    sig: '(tag: string): boolean'
    hint: case-insensitive check
  - name: hasAll
    sig: '(tags: string[]): boolean'
    hint: every tag present
  - name: hasAny
    sig: '(tags: string[]): boolean'
    hint: at least one present
  - name: clear
    sig: '(): void'
    hint: empty the set
  - name: list
    sig: '(): string[]'
    hint: return sorted array
  - name: toString
    sig: '(): string'
    hint: comma-separated list
  - name: fromString
    sig: '(str: string, sep?: string): void'
    hint: split and add
  - name: size
    sig: '(): number'
    hint: count unique tags
  static:
  - name: union
    sig: '(a: Tags, b: Tags): string[]'
    hint: sorted unique merge
  - name: intersect
    sig: '(a: Tags, b: Tags): string[]'
    hint: common tags sorted
- name: Platform
  kind: class
  status: translated
  target_file: src/core/platform.ts
  description: Runtime environment detection
  static:
  - name: isBrowser
    sig: '(): boolean'
    hint: typeof window !== undefined
  - name: isNode
    sig: '(): boolean'
    hint: typeof process !== undefined
  - name: isWorker
    sig: '(): boolean'
    hint: typeof importScripts === function
  - name: userAgent
    sig: '(): string'
    hint: navigator.userAgent or empty
  - name: language
    sig: '(): string'
    hint: navigator.language or en
  - name: languages
    sig: '(): string[]'
    hint: navigator.languages or [en]
  - name: touch
    sig: '(): boolean'
    hint: ontouchstart in window
  - name: webgl
    sig: '(): boolean'
    hint: create canvas context
  - name: webgpu
    sig: '(): boolean'
    hint: navigator.gpu exists
  - name: webWorkers
    sig: '(): boolean'
    hint: typeof Worker !== undefined
  - name: offscreenCanvas
    sig: '(): boolean'
    hint: typeof OffscreenCanvas !== undefined
  - name: screen
    sig: '(): {width: number, height: number}'
    hint: window inner size
  - name: pixelRatio
    sig: '(): number'
    hint: devicePixelRatio or 1
  - name: now
    sig: '(): number'
    hint: performance.now() or Date.now
  - name: raf
    sig: '(cb: FrameRequestCallback): number'
    hint: requestAnimationFrame wrapper
  - name: caf
    sig: '(id: number): void'
    hint: cancelAnimationFrame wrapper
