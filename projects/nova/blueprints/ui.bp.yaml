## Blueprint — ui
name: ui
language: typescript
target_dir: src/ui
description: ''
constraints:
- 2D UI system for nova game engine
- integrates with scene graph and input system
- supports layout, scrolling, and interaction
references:
- playcanvas/platform/graphics/graphics-device.yaml
- playcanvas/scene/renderer/forward-renderer.yaml
- playcanvas/framework/entity.yaml
- playcanvas/core/math/vec3.yaml
types:
- name: Element
  kind: class
  status: pending
  target_file: src/ui/element.ts
  extends: Entity
  description: Base UI element with transform, anchor, and layout properties
  fields:
  - name: anchor
    type: Vec4
    default: new Vec4(0.5, 0.5, 0.5, 0.5)
  - name: pivot
    type: Vec2
    default: new Vec2(0.5, 0.5)
  - name: margin
    type: Vec4
    default: new Vec4(0, 0, 0, 0)
  - name: size
    type: Vec2
    default: new Vec2(100, 100)
  - name: color
    type: Color
    default: new Color(1, 1, 1, 1)
  - name: opacity
    type: number
    default: '1'
  - name: enabled
    type: boolean
    default: 'true'
  - name: screen
    type: Screen
    default: 'null'
  methods:
  - name: setAnchor
    sig: '(x: number, y: number, x2?: number, y2?: number): void'
    hint: set anchor min/max or uniform
  - name: setPivot
    sig: '(x: number, y: number): void'
    hint: set pivot point for transform
  - name: setMargin
    sig: '(left: number, bottom: number, right: number, top: number): void'
    hint: set margin offsets
  - name: setSize
    sig: '(width: number, height: number): void'
    hint: set element size
  - name: setColor
    sig: '(r: number, g: number, b: number, a?: number): void'
    hint: set color and opacity
  - name: getWorldPosition
    sig: '(): Vec3'
    hint: compute world position from anchors
  - name: getWorldSize
    sig: '(): Vec2'
    hint: compute world size after layout
  - name: containsPoint
    sig: '(x: number, y: number): boolean'
    hint: test if point inside element
  - name: updateLayout
    sig: '(): void'
    hint: recalculate size from anchors/margins
  - name: onEnable
    sig: '(): void'
    hint: called when element enabled
  - name: onDisable
    sig: '(): void'
    hint: called when element disabled
  - name: destroy
    sig: '(): void'
    hint: cleanup and remove from screen
  references:
  - playcanvas/framework/entity.yaml
- name: Screen
  kind: class
  status: pending
  target_file: src/ui/screen.ts
  extends: Entity
  description: Root UI container that manages layout and input for all child elements
  fields:
  - name: resolution
    type: Vec2
    default: new Vec2(1280, 720)
  - name: referenceResolution
    type: Vec2
    default: new Vec2(1280, 720)
  - name: scaleMode
    type: string
    default: '''blend'''
  - name: screenSpace
    type: boolean
    default: 'true'
  - name: priority
    type: number
    default: '0'
  - name: elements
    type: Element[]
    default: '[]'
  methods:
  - name: setResolution
    sig: '(width: number, height: number): void'
    hint: set screen pixel resolution
  - name: setReferenceResolution
    sig: '(width: number, height: number): void'
    hint: set design resolution for scaling
  - name: setScaleMode
    sig: '(mode: string): void'
    hint: set scaling mode (none, blend, blend-zoom)
  - name: getScale
    sig: '(): Vec2'
    hint: compute scale factor from resolution
  - name: addElement
    sig: '(element: Element): void'
    hint: add element to screen
  - name: removeElement
    sig: '(element: Element): void'
    hint: remove element from screen
  - name: getElementAt
    sig: '(x: number, y: number): Element'
    hint: find topmost element at point
  - name: updateLayout
    sig: '(): void'
    hint: update all element layouts
  - name: handleInput
    sig: '(input: InputManager): void'
    hint: process input events
  - name: render
    sig: '(renderer: ForwardRenderer): void'
    hint: render all visible elements
  references:
  - playcanvas/framework/entity.yaml
- name: Button
  kind: class
  status: pending
  target_file: src/ui/button.ts
  extends: Element
  description: Interactive button element with states and transitions
  fields:
  - name: text
    type: string
    default: ''''''
  - name: active
    type: boolean
    default: 'true'
  - name: pressed
    type: boolean
    default: 'false'
  - name: hovered
    type: boolean
    default: 'false'
  - name: transitionMode
    type: string
    default: '''color'''
  - name: normalColor
    type: Color
    default: new Color(1, 1, 1, 1)
  - name: hoverColor
    type: Color
    default: new Color(0.8, 0.8, 0.8, 1)
  - name: pressedColor
    type: Color
    default: new Color(0.6, 0.6, 0.6, 1)
  - name: disabledColor
    type: Color
    default: new Color(0.5, 0.5, 0.5, 0.5)
  - name: onClick
    type: Function
    default: 'null'
  methods:
  - name: setText
    sig: '(text: string): void'
    hint: update button text
  - name: setActive
    sig: '(active: boolean): void'
    hint: enable/disable interaction
  - name: setTransitionMode
    sig: '(mode: string): void'
    hint: set transition type (none, color, sprite, scale)
  - name: setNormalColor
    sig: '(color: Color): void'
    hint: set normal state color
  - name: setHoverColor
    sig: '(color: Color): void'
    hint: set hover state color
  - name: setPressedColor
    sig: '(color: Color): void'
    hint: set pressed state color
  - name: setDisabledColor
    sig: '(color: Color): void'
    hint: set disabled state color
  - name: onMouseEnter
    sig: '(): void'
    hint: handle mouse enter
  - name: onMouseLeave
    sig: '(): void'
    hint: handle mouse leave
  - name: onMouseDown
    sig: '(): void'
    hint: handle mouse press
  - name: onMouseUp
    sig: '(): void'
    hint: handle mouse release
  - name: updateVisualState
    sig: '(): void'
    hint: apply current state colors
  references:
  - playcanvas/framework/entity.yaml
- name: Text
  kind: class
  status: translated
  target_file: src/ui/text.ts
  extends: Element
  description: Text rendering element with font and alignment properties
  fields:
  - name: text
    type: string
    default: ''''''
  - name: font
    type: Font
    default: 'null'
  - name: fontSize
    type: number
    default: '32'
  - name: color
    type: Color
    default: new Color(1, 1, 1, 1)
  - name: alignment
    type: Vec2
    default: new Vec2(0.5, 0.5)
  - name: wrap
    type: boolean
    default: 'false'
  - name: maxLines
    type: number
    default: '0'
  - name: lineHeight
    type: number
    default: '1.2'
  - name: spacing
    type: number
    default: '0'
  methods:
  - name: setText
    sig: '(text: string): void'
    hint: update displayed text
  - name: setFont
    sig: '(font: Font): void'
    hint: set font asset
  - name: setFontSize
    sig: '(size: number): void'
    hint: set font size in pixels
  - name: setAlignment
    sig: '(x: number, y: number): void'
    hint: set text alignment (0-1)
  - name: setWrap
    sig: '(wrap: boolean): void'
    hint: enable/disable text wrapping
  - name: setMaxLines
    sig: '(lines: number): void'
    hint: set max lines (0 = unlimited)
  - name: setLineHeight
    sig: '(height: number): void'
    hint: set line height multiplier
  - name: setSpacing
    sig: '(spacing: number): void'
    hint: set character spacing
  - name: getTextWidth
    sig: '(): number'
    hint: measure text width in pixels
  - name: getTextHeight
    sig: '(): number'
    hint: measure text height in pixels
  - name: updateLayout
    sig: '(): void'
    hint: recalculate text layout
  references:
  - playcanvas/framework/entity.yaml
- name: Image
  kind: class
  status: pending
  target_file: src/ui/image.ts
  extends: Element
  description: Image element that displays textures or sprites
  fields:
  - name: texture
    type: Texture
    default: 'null'
  - name: sprite
    type: Sprite
    default: 'null'
  - name: color
    type: Color
    default: new Color(1, 1, 1, 1)
  - name: opacity
    type: number
    default: '1'
  - name: fillMode
    type: string
    default: '''stretch'''
  - name: preserveAspect
    type: boolean
    default: 'false'
  - name: slice
    type: Vec4
    default: new Vec4(0, 0, 1, 1)
  - name: pixelsPerUnit
    type: number
    default: '100'
  methods:
  - name: setTexture
    sig: '(texture: Texture): void'
    hint: set texture to display
  - name: setSprite
    sig: '(sprite: Sprite): void'
    hint: set sprite to display
  - name: setColor
    sig: '(color: Color): void'
    hint: set tint color
  - name: setOpacity
    sig: '(opacity: number): void'
    hint: set opacity (0-1)
  - name: setFillMode
    sig: '(mode: string): void'
    hint: set fill mode (none, stretch, fit, fill)
  - name: setPreserveAspect
    sig: '(preserve: boolean): void'
    hint: enable aspect ratio preservation
  - name: setSlice
    sig: '(left: number, bottom: number, right: number, top: number): void'
    hint: set 9-slice borders
  - name: setPixelsPerUnit
    sig: '(ppu: number): void'
    hint: set sprite pixels per unit
  - name: getAspectRatio
    sig: '(): number'
    hint: get texture aspect ratio
  - name: updateMesh
    sig: '(): void'
    hint: regenerate image mesh
  references:
  - playcanvas/framework/entity.yaml
- name: LayoutGroup
  kind: class
  status: pending
  target_file: src/ui/layout-group.ts
  extends: Element
  description: Container that arranges child elements automatically
  fields:
  - name: orientation
    type: string
    default: '''horizontal'''
  - name: spacing
    type: number
    default: '0'
  - name: padding
    type: Vec4
    default: new Vec4(0, 0, 0, 0)
  - name: alignment
    type: Vec2
    default: new Vec2(0.5, 0.5)
  - name: reverse
    type: boolean
    default: 'false'
  - name: wrap
    type: boolean
    default: 'false'
  - name: widthFit
    type: string
    default: '''none'''
  - name: heightFit
    type: string
    default: '''none'''
  methods:
  - name: setOrientation
    sig: '(orientation: string): void'
    hint: set layout direction (horizontal, vertical)
  - name: setSpacing
    sig: '(spacing: number): void'
    hint: set spacing between elements
  - name: setPadding
    sig: '(left: number, bottom: number, right: number, top: number): void'
    hint: set container padding
  - name: setAlignment
    sig: '(x: number, y: number): void'
    hint: set child alignment (0-1)
  - name: setReverse
    sig: '(reverse: boolean): void'
    hint: reverse element order
  - name: setWrap
    sig: '(wrap: boolean): void'
    hint: enable element wrapping
  - name: setWidthFit
    sig: '(fit: string): void'
    hint: set width fitting (none, children, container)
  - name: setHeightFit
    sig: '(fit: string): void'
    hint: set height fitting (none, children, container)
  - name: addChild
    sig: '(child: Element): void'
    hint: add child with layout
  - name: removeChild
    sig: '(child: Element): void'
    hint: remove child and reflow
  - name: reflow
    sig: '(): void'
    hint: recalculate all child positions
  references:
  - playcanvas/framework/entity.yaml
- name: ScrollView
  kind: class
  status: translated
  target_file: src/ui/scroll-view.ts
  extends: Element
  description: Scrollable container with scrollbars and inertia
  fields:
  - name: content
    type: Element
    default: 'null'
  - name: horizontal
    type: boolean
    default: 'true'
  - name: vertical
    type: boolean
    default: 'true'
  - name: inertia
    type: number
    default: '0.95'
  - name: elasticity
    type: number
    default: '0.3'
  - name: scrollSensitivity
    type: number
    default: '1'
  - name: viewport
    type: Element
    default: 'null'
  - name: scrollbarH
    type: Element
    default: 'null'
  - name: scrollbarV
    type: Element
    default: 'null'
  - name: scrollPosition
    type: Vec2
    default: new Vec2(0, 0)
  methods:
  - name: setContent
    sig: '(content: Element): void'
    hint: set scrollable content element
  - name: setHorizontal
    sig: '(enabled: boolean): void'
    hint: enable horizontal scrolling
  - name: setVertical
    sig: '(enabled: boolean): void'
    hint: enable vertical scrolling
  - name: setInertia
    sig: '(inertia: number): void'
    hint: set scroll inertia (0-1)
  - name: setElasticity
    sig: '(elasticity: number): void'
    hint: set bounce elasticity
  - name: setScrollSensitivity
    sig: '(sensitivity: number): void'
    hint: set scroll wheel sensitivity
  - name: scrollTo
    sig: '(x: number, y: number, animate?: boolean): void'
    hint: scroll to position
  - name: scrollToElement
    sig: '(element: Element, animate?: boolean): void'
    hint: scroll to make element visible
  - name: updateScrollbars
    sig: '(): void'
    hint: update scrollbar positions
  - name: onMouseWheel
    sig: '(delta: number): void'
    hint: handle mouse wheel input
  - name: onDrag
    sig: '(dx: number, dy: number): void'
    hint: handle drag input
  references:
  - playcanvas/framework/entity.yaml
