## Blueprint — input
name: input
language: typescript
target_dir: src/input
description: ''
constraints:
- Cross-platform input abstraction
- Event-driven architecture
- Support for keyboard, mouse, touch, gamepad
- Element-specific input handling
references:
- playcanvas/platform/graphics/graphics-device.yaml
- playcanvas/scene/renderer/forward-renderer.yaml
- playcanvas/framework/entity.yaml
- playcanvas/core/math/vec3.yaml
types:
- name: Keyboard
  kind: class
  status: pending
  target_file: src/input/keyboard.ts
  description: Keyboard input device with key state tracking
  fields:
  - name: keys
    type: Map<string, boolean>
    default: new Map()
  - name: prevKeys
    type: Map<string, boolean>
    default: new Map()
  - name: events
    type: EventHandler
    default: new EventHandler()
  methods:
  - name: isPressed
    sig: '(key: string): boolean'
    hint: Check if key is currently pressed
  - name: wasPressed
    sig: '(key: string): boolean'
    hint: Check if key was pressed this frame
  - name: wasReleased
    sig: '(key: string): boolean'
    hint: Check if key was released this frame
  - name: update
    sig: '(): void'
    hint: Update previous key states
  - name: onKeyDown
    sig: '(event: KeyboardEvent): void'
    hint: Handle key down event
  - name: onKeyUp
    sig: '(event: KeyboardEvent): void'
    hint: Handle key up event
  - name: attach
    sig: '(element: HTMLElement): void'
    hint: Attach keyboard events to element
  - name: detach
    sig: '(): void'
    hint: Remove keyboard event listeners
  - name: destroy
    sig: '(): void'
    hint: Clean up resources
  static:
  - name: KEY_A
    hint: A key constant
  - name: KEY_SPACE
    hint: Space key constant
  - name: KEY_ENTER
    hint: Enter key constant
  - name: KEY_SHIFT
    hint: Shift key constant
  - name: KEY_CTRL
    hint: Control key constant
  - name: KEY_ALT
    hint: Alt key constant
  - name: KEY_ESC
    hint: Escape key constant
  references:
  - playcanvas/framework/entity.yaml
- name: Mouse
  kind: class
  status: pending
  target_file: src/input/mouse.ts
  description: Mouse input device with position and button tracking
  fields:
  - name: position
    type: Vec2
    default: new Vec2()
  - name: delta
    type: Vec2
    default: new Vec2()
  - name: buttons
    type: Map<number, boolean>
    default: new Map()
  - name: prevButtons
    type: Map<number, boolean>
    default: new Map()
  - name: wheel
    type: number
    default: '0'
  - name: events
    type: EventHandler
    default: new EventHandler()
  methods:
  - name: isPressed
    sig: '(button: number): boolean'
    hint: Check if mouse button is pressed
  - name: wasPressed
    sig: '(button: number): boolean'
    hint: Check if button was pressed this frame
  - name: wasReleased
    sig: '(button: number): boolean'
    hint: Check if button was released this frame
  - name: getX
    sig: '(): number'
    hint: Get mouse X position
  - name: getY
    sig: '(): number'
    hint: Get mouse Y position
  - name: getDeltaX
    sig: '(): number'
    hint: Get mouse X delta movement
  - name: getDeltaY
    sig: '(): number'
    hint: Get mouse Y delta movement
  - name: getWheel
    sig: '(): number'
    hint: Get mouse wheel delta
  - name: update
    sig: '(): void'
    hint: Update previous button states and reset delta
  - name: onMouseMove
    sig: '(event: MouseEvent): void'
    hint: Handle mouse move event
  - name: onMouseDown
    sig: '(event: MouseEvent): void'
    hint: Handle mouse down event
  - name: onMouseUp
    sig: '(event: MouseEvent): void'
    hint: Handle mouse up event
  - name: onWheel
    sig: '(event: WheelEvent): void'
    hint: Handle mouse wheel event
  - name: attach
    sig: '(element: HTMLElement): void'
    hint: Attach mouse events to element
  - name: detach
    sig: '(): void'
    hint: Remove mouse event listeners
  - name: destroy
    sig: '(): void'
    hint: Clean up resources
  static:
  - name: BUTTON_LEFT
    hint: Left mouse button constant
  - name: BUTTON_MIDDLE
    hint: Middle mouse button constant
  - name: BUTTON_RIGHT
    hint: Right mouse button constant
  references:
  - playcanvas/core/math/vec3.yaml
- name: Touch
  kind: class
  status: pending
  target_file: src/input/touch.ts
  description: Touch input device with multi-touch tracking
  fields:
  - name: touches
    type: Map<number, TouchData>
    default: new Map()
  - name: changedTouches
    type: TouchData[]
    default: '[]'
  - name: events
    type: EventHandler
    default: new EventHandler()
  methods:
  - name: getTouch
    sig: '(id: number): TouchData | undefined'
    hint: Get touch by identifier
  - name: getAllTouches
    sig: '(): TouchData[]'
    hint: Get all active touches
  - name: getTouchCount
    sig: '(): number'
    hint: Get number of active touches
  - name: onTouchStart
    sig: '(event: TouchEvent): void'
    hint: Handle touch start event
  - name: onTouchMove
    sig: '(event: TouchEvent): void'
    hint: Handle touch move event
  - name: onTouchEnd
    sig: '(event: TouchEvent): void'
    hint: Handle touch end event
  - name: onTouchCancel
    sig: '(event: TouchEvent): void'
    hint: Handle touch cancel event
  - name: attach
    sig: '(element: HTMLElement): void'
    hint: Attach touch events to element
  - name: detach
    sig: '(): void'
    hint: Remove touch event listeners
  - name: destroy
    sig: '(): void'
    hint: Clean up resources
  references:
  - playcanvas/core/math/vec3.yaml
- name: TouchData
  kind: class
  status: pending
  target_file: src/input/touch-data.ts
  description: Single touch point data
  fields:
  - name: id
    type: number
    default: '0'
  - name: x
    type: number
    default: '0'
  - name: y
    type: number
    default: '0'
  - name: startX
    type: number
    default: '0'
  - name: startY
    type: number
    default: '0'
  - name: timestamp
    type: number
    default: '0'
  methods:
  - name: getDeltaX
    sig: '(): number'
    hint: Get X delta from start position
  - name: getDeltaY
    sig: '(): number'
    hint: Get Y delta from start position
  - name: getDistance
    sig: '(): number'
    hint: Get distance from start position
  - name: clone
    sig: '(): TouchData'
    hint: Create copy of touch data
- name: Gamepad
  kind: class
  status: translated
  target_file: src/input/gamepad.ts
  description: Gamepad input device with button and axis tracking
  fields:
  - name: id
    type: string
  - name: index
    type: number
    default: '0'
  - name: connected
    type: boolean
    default: 'False'
  - name: timestamp
    type: number
    default: '0'
  - name: buttons
    type: Map<number, GamepadButton>
    default: new Map()
  - name: axes
    type: Map<number, number>
    default: new Map()
  - name: prevButtons
    type: Map<number, GamepadButton>
    default: new Map()
  - name: prevAxes
    type: Map<number, number>
    default: new Map()
  - name: events
    type: EventHandler
    default: new EventHandler()
  methods:
  - name: isPressed
    sig: '(button: number): boolean'
    hint: Check if button is pressed
  - name: wasPressed
    sig: '(button: number): boolean'
    hint: Check if button was pressed this frame
  - name: wasReleased
    sig: '(button: number): boolean'
    hint: Check if button was released this frame
  - name: getAxis
    sig: '(axis: number): number'
    hint: Get axis value -1 to 1
  - name: getAxisDelta
    sig: '(axis: number): number'
    hint: Get axis delta from last frame
  - name: update
    sig: '(gamepad: Gamepad): void'
    hint: Update from browser gamepad object
  - name: vibrate
    sig: '(duration: number, weak: number, strong: number): void'
    hint: Trigger vibration if supported
  - name: destroy
    sig: '(): void'
    hint: Clean up resources
  static:
  - name: BUTTON_A
    hint: A button constant
  - name: BUTTON_B
    hint: B button constant
  - name: BUTTON_X
    hint: X button constant
  - name: BUTTON_Y
    hint: Y button constant
  - name: AXIS_LEFT_X
    hint: Left stick X axis
  - name: AXIS_LEFT_Y
    hint: Left stick Y axis
  - name: AXIS_RIGHT_X
    hint: Right stick X axis
  - name: AXIS_RIGHT_Y
    hint: Right stick Y axis
  references:
  - playcanvas/framework/entity.yaml
- name: GamepadButton
  kind: class
  status: pending
  target_file: src/input/gamepad-button.ts
  description: Gamepad button state
  fields:
  - name: pressed
    type: boolean
    default: 'False'
  - name: value
    type: number
    default: '0'
  - name: touched
    type: boolean
    default: 'False'
  methods:
  - name: clone
    sig: '(): GamepadButton'
    hint: Create copy of button state
- name: InputManager
  kind: class
  status: translated
  target_file: src/input/input-manager.ts
  description: Central input manager coordinating all input devices
  fields:
  - name: keyboard
    type: Keyboard
    default: new Keyboard()
  - name: mouse
    type: Mouse
    default: new Mouse()
  - name: touch
    type: Touch
    default: new Touch()
  - name: gamepads
    type: Gamepad[]
    default: '[]'
  - name: enabled
    type: boolean
    default: 'True'
  - name: events
    type: EventHandler
    default: new EventHandler()
  methods:
  - name: update
    sig: '(dt: number): void'
    hint: Update all input devices
  - name: isAnyKeyPressed
    sig: '(): boolean'
    hint: Check if any key is pressed
  - name: wasAnyKeyPressed
    sig: '(): boolean'
    hint: Check if any key was pressed this frame
  - name: getGamepad
    sig: '(index: number): Gamepad | undefined'
    hint: Get gamepad by index
  - name: getGamepads
    sig: '(): Gamepad[]'
    hint: Get all connected gamepads
  - name: scanGamepads
    sig: '(): void'
    hint: Scan for connected gamepads
  - name: attach
    sig: '(element: HTMLElement): void'
    hint: Attach all input devices to element
  - name: detach
    sig: '(): void'
    hint: Detach all input devices
  - name: enable
    sig: '(): void'
    hint: Enable input processing
  - name: disable
    sig: '(): void'
    hint: Disable input processing
  - name: destroy
    sig: '(): void'
    hint: Clean up all input devices
  - name: onGamepadConnected
    sig: '(gamepad: Gamepad): void'
    hint: Handle gamepad connection
  - name: onGamepadDisconnected
    sig: '(gamepad: Gamepad): void'
    hint: Handle gamepad disconnection
  references:
  - playcanvas/framework/entity.yaml
- name: ElementInput
  kind: class
  status: pending
  target_file: src/input/element-input.ts
  description: Element-specific input handling with focus and capture
  fields:
  - name: element
    type: HTMLElement
    default: None
  - name: focused
    type: boolean
    default: 'False'
  - name: captured
    type: boolean
    default: 'False'
  - name: keyboard
    type: Keyboard
    default: None
  - name: mouse
    type: Mouse
    default: None
  - name: touch
    type: Touch
    default: None
  - name: events
    type: EventHandler
    default: new EventHandler()
  methods:
  - name: attach
    sig: '(element: HTMLElement): void'
    hint: Attach to specific element
  - name: detach
    sig: '(): void'
    hint: Detach from element
  - name: focus
    sig: '(): void'
    hint: Focus the element
  - name: blur
    sig: '(): void'
    hint: Blur the element
  - name: capture
    sig: '(): void'
    hint: Capture all input
  - name: release
    sig: '(): void'
    hint: Release input capture
  - name: isFocused
    sig: '(): boolean'
    hint: Check if element is focused
  - name: isCaptured
    sig: '(): boolean'
    hint: Check if input is captured
  - name: getKeyboard
    sig: '(): Keyboard'
    hint: Get element keyboard instance
  - name: getMouse
    sig: '(): Mouse'
    hint: Get element mouse instance
  - name: getTouch
    sig: '(): Touch'
    hint: Get element touch instance
  - name: destroy
    sig: '(): void'
    hint: Clean up element input
  references:
  - playcanvas/framework/entity.yaml
