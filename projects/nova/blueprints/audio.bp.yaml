## Blueprint — audio
name: audio
language: typescript
target_dir: src/audio
description: ''
constraints:
- Web Audio API only
- No external deps beyond core/math
- Support 3D positional audio
- ResourceLoader integration
references:
- playcanvas/platform/graphics/graphics-device.yaml
- playcanvas/scene/renderer/forward-renderer.yaml
- playcanvas/framework/entity.yaml
- playcanvas/core/math/vec3.yaml
types:
- name: AudioManager
  kind: class
  status: pending
  target_file: src/audio/audio-manager.ts
  description: Global audio service, handles Web Audio context and resource loading
  fields:
  - name: context
    type: AudioContext
    default: None
  - name: loader
    type: ResourceLoader
    default: new ResourceLoader()
  - name: volume
    type: number
    default: '1'
  - name: suspended
    type: boolean
    default: 'False'
  - name: sounds
    type: Map<string, Sound>
    default: new Map()
  methods:
  - name: initialize
    sig: '(): Promise<void>'
    hint: resume context on user gesture
  - name: createSound
    sig: '(url: string, options?: SoundOptions): Promise<Sound>'
    hint: load buffer via loader, cache in sounds
  - name: createChannel
    sig: '(sound?: Sound): Channel'
    hint: factory for 2d channel
  - name: createChannel3d
    sig: '(sound?: Sound): Channel3d'
    hint: factory for 3d channel
  - name: setVolume
    sig: '(v: number): void'
    hint: global volume 0-1
  - name: getVolume
    sig: '(): number'
    hint: return current volume
  - name: suspend
    sig: '(): void'
    hint: suspend context
  - name: resume
    sig: '(): void'
    hint: resume context
  - name: update
    sig: '(dt: number): void'
    hint: update 3d channels and listener
  - name: destroy
    sig: '(): void'
    hint: close context and clear sounds
  static:
  - name: instance
    hint: singleton instance
  references:
  - playcanvas/platform/graphics/graphics-device.yaml
- name: Sound
  kind: class
  status: pending
  target_file: src/audio/sound.ts
  description: Container for AudioBuffer and metadata
  fields:
  - name: buffer
    type: AudioBuffer
    default: None
  - name: duration
    type: number
    default: '0'
  - name: sampleRate
    type: number
    default: '0'
  - name: length
    type: number
    default: '0'
  - name: name
    type: string
  methods:
  - name: fromBuffer
    sig: '(buffer: AudioBuffer): Sound'
    hint: static factory
  - name: fromUrl
    sig: '(url: string, loader: ResourceLoader): Promise<Sound>'
    hint: static async factory
  - name: clone
    sig: '(): Sound'
    hint: duplicate buffer
  - name: destroy
    sig: '(): void'
    hint: release buffer
  references:
  - playcanvas/framework/entity.yaml
- name: Channel
  kind: class
  status: translated
  target_file: src/audio/channel.ts
  description: 2D audio playback controller
  fields:
  - name: sound
    type: Sound
    default: None
  - name: source
    type: AudioBufferSourceNode
    default: None
  - name: gain
    type: GainNode
    default: None
  - name: panner
    type: StereoPannerNode
    default: None
  - name: playing
    type: boolean
    default: 'False'
  - name: paused
    type: boolean
    default: 'False'
  - name: currentTime
    type: number
    default: '0'
  - name: volume
    type: number
    default: '1'
  - name: pitch
    type: number
    default: '1'
  - name: loop
    type: boolean
    default: 'False'
  methods:
  - name: play
    sig: '(): void'
    hint: create source and start
  - name: pause
    sig: '(): void'
    hint: pause source
  - name: stop
    sig: '(): void'
    hint: stop and cleanup
  - name: setVolume
    sig: '(v: number): void'
    hint: 0-1 gain
  - name: getVolume
    sig: '(): number'
    hint: return volume
  - name: setPitch
    sig: '(p: number): void'
    hint: playback rate
  - name: getPitch
    sig: '(): number'
    hint: return pitch
  - name: setLoop
    sig: '(l: boolean): void'
    hint: enable/disable loop
  - name: getLoop
    sig: '(): boolean'
    hint: return loop
  - name: setPan
    sig: '(p: number): void'
    hint: -1 left, 1 right
  - name: getPan
    sig: '(): number'
    hint: return pan
  - name: getCurrentTime
    sig: '(): number'
    hint: return playback time
  - name: getDuration
    sig: '(): number'
    hint: return sound duration
  - name: isPlaying
    sig: '(): boolean'
    hint: return playing state
  - name: isPaused
    sig: '(): boolean'
    hint: return paused state
  - name: destroy
    sig: '(): void'
    hint: cleanup nodes
  references:
  - playcanvas/scene/renderer/forward-renderer.yaml
- name: Channel3d
  kind: class
  status: pending
  target_file: src/audio/channel3d.ts
  extends: Channel
  description: 3D positional audio channel
  fields:
  - name: panner
    type: PannerNode
    default: None
  - name: position
    type: Vec3
    default: Vec3.ZERO.clone()
  - name: velocity
    type: Vec3
    default: Vec3.ZERO.clone()
  - name: minDistance
    type: number
    default: '1'
  - name: maxDistance
    type: number
    default: '10000'
  - name: rollOffFactor
    type: number
    default: '1'
  - name: distanceModel
    type: DistanceModelType
    default: inverse
  - name: coneInnerAngle
    type: number
    default: '360'
  - name: coneOuterAngle
    type: number
    default: '360'
  - name: coneOuterGain
    type: number
    default: '0'
  methods:
  - name: setPosition
    sig: '(p: Vec3): void'
    hint: update panner position
  - name: getPosition
    sig: '(): Vec3'
    hint: return position
  - name: setVelocity
    sig: '(v: Vec3): void'
    hint: update panner velocity
  - name: getVelocity
    sig: '(): Vec3'
    hint: return velocity
  - name: setMinDistance
    sig: '(d: number): void'
    hint: within this no attenuation
  - name: getMinDistance
    sig: '(): number'
    hint: return min distance
  - name: setMaxDistance
    sig: '(d: number): void'
    hint: beyond this max attenuation
  - name: getMaxDistance
    sig: '(): number'
    hint: return max distance
  - name: setRollOffFactor
    sig: '(f: number): void'
    hint: attenuation curve
  - name: getRollOffFactor
    sig: '(): number'
    hint: return roll off
  - name: setDistanceModel
    sig: '(m: DistanceModelType): void'
    hint: linear, inverse, exponential
  - name: getDistanceModel
    sig: '(): DistanceModelType'
    hint: return model
  - name: setCone
    sig: '(inner: number, outer: number, gain: number): void'
    hint: directional cone
  - name: getConeInnerAngle
    sig: '(): number'
    hint: degrees
  - name: getConeOuterAngle
    sig: '(): number'
    hint: degrees
  - name: getConeOuterGain
    sig: '(): number'
    hint: 0-1 gain
  - name: update
    sig: '(dt: number): void'
    hint: apply doppler if moving
  references:
  - playcanvas/core/math/vec3.yaml
- name: Listener
  kind: class
  status: translated
  target_file: src/audio/listener.ts
  description: 3D audio listener attached to camera
  fields:
  - name: position
    type: Vec3
    default: Vec3.ZERO.clone()
  - name: velocity
    type: Vec3
    default: Vec3.ZERO.clone()
  - name: forward
    type: Vec3
    default: Vec3.FORWARD.clone()
  - name: up
    type: Vec3
    default: Vec3.UP.clone()
  - name: context
    type: AudioListener
    default: None
  methods:
  - name: setPosition
    sig: '(p: Vec3): void'
    hint: set listener position
  - name: getPosition
    sig: '(): Vec3'
    hint: return position
  - name: setVelocity
    sig: '(v: Vec3): void'
    hint: for doppler
  - name: getVelocity
    sig: '(): Vec3'
    hint: return velocity
  - name: setOrientation
    sig: '(f: Vec3, u: Vec3): void'
    hint: forward and up
  - name: getForward
    sig: '(): Vec3'
    hint: return forward
  - name: getUp
    sig: '(): Vec3'
    hint: return up
  - name: update
    sig: '(dt: number): void'
    hint: apply to Web Audio
  - name: attachToEntity
    sig: '(entity: Entity): void'
    hint: sync position from entity
  - name: detach
    sig: '(): void'
    hint: stop following entity
  references:
  - playcanvas/framework/entity.yaml
