## Blueprint — animation
name: animation
language: typescript
target_dir: src/animation
description: ''
constraints:
- Support skeletal and property animation
- GPU-friendly curve evaluation
- State machine for complex behaviors
- Blend trees for smooth transitions
- Time-scaled playback control
references:
- playcanvas/platform/graphics/graphics-device.yaml
- playcanvas/scene/renderer/forward-renderer.yaml
- playcanvas/framework/entity.yaml
- playcanvas/core/math/vec3.yaml
types:
- name: AnimClip
  kind: class
  status: translated
  target_file: src/animation/anim-clip.ts
  description: 'Container for animation data: curves, duration, events'
  fields:
  - name: name
    type: string
  - name: duration
    type: number
  - name: curves
    type: AnimCurve[]
  - name: events
    type: AnimEvent[]
  methods:
  - name: evaluate
    sig: '(time: number, loop: boolean): Map<string, any>'
    hint: sample all curves at time
  - name: getDuration
    sig: '(): number'
    hint: return clip length in seconds
  - name: addCurve
    sig: '(path: string, curve: AnimCurve): void'
    hint: insert curve targeting property path
  - name: removeCurve
    sig: '(path: string): void'
    hint: delete curve by path
  - name: getCurve
    sig: '(path: string): AnimCurve | null'
    hint: find curve by property path
  - name: addEvent
    sig: '(time: number, name: string, data?: any): void'
    hint: schedule named event at time
  - name: removeEvent
    sig: '(index: number): void'
    hint: delete event by index
  - name: getEvents
    sig: '(): AnimEvent[]'
    hint: return sorted event array
  - name: clone
    sig: '(): AnimClip'
    hint: deep copy curves and events
  - name: optimize
    sig: '(tolerance: number): void'
    hint: remove redundant keys within tolerance
  references:
  - playcanvas/framework/entity.yaml
- name: AnimTrack
  kind: class
  status: pending
  target_file: src/animation/anim-track.ts
  description: Runtime track playing a clip with time control
  fields:
  - name: clip
    type: AnimClip
  - name: time
    type: number
  - name: speed
    type: number
  - name: loop
    type: boolean
  - name: weight
    type: number
  methods:
  - name: update
    sig: '(dt: number): void'
    hint: advance time by delta
  - name: evaluate
    sig: '(): Map<string, any>'
    hint: sample clip at current time
  - name: play
    sig: '(): void'
    hint: set speed to 1
  - name: pause
    sig: '(): void'
    hint: set speed to 0
  - name: stop
    sig: '(): void'
    hint: reset time to 0 and pause
  - name: setTime
    sig: '(t: number): void'
    hint: clamp to duration
  - name: getTime
    sig: '(): number'
    hint: return current time
  - name: setSpeed
    sig: '(s: number): void'
    hint: negative for reverse
  - name: setLoop
    sig: '(l: boolean): void'
    hint: enable/disable looping
  - name: setWeight
    sig: '(w: number): void'
    hint: for blending
  - name: isPlaying
    sig: '(): boolean'
    hint: true if speed != 0
  - name: getDuration
    sig: '(): number'
    hint: delegate to clip
  - name: fadeTo
    sig: '(target: number, duration: number): void'
    hint: smooth weight transition
  references:
  - playcanvas/framework/entity.yaml
- name: AnimCurve
  kind: class
  status: pending
  target_file: src/animation/anim-curve.ts
  description: Keyframe curve with interpolation
  fields:
  - name: keys
    type: Float32Array
  - name: values
    type: Float32Array
  - name: interpolation
    type: InterpolationType
  - name: tangentType
    type: TangentType
  methods:
  - name: evaluate
    sig: '(time: number): number'
    hint: lerp/slerp/catmull-rom
  - name: addKey
    sig: '(t: number, v: number): void'
    hint: insert sorted, rebuild tangents
  - name: removeKey
    sig: '(index: number): void'
    hint: shift array left
  - name: getKeyTime
    sig: '(index: number): number'
    hint: return key timestamp
  - name: getKeyValue
    sig: '(index: number): number'
    hint: return key value
  - name: setKey
    sig: '(index: number, t: number, v: number): void'
    hint: update key and neighbors
  - name: getLength
    sig: '(): number'
    hint: number of keys
  - name: getDuration
    sig: '(): number'
    hint: last key time
  - name: optimize
    sig: '(tolerance: number): void'
    hint: decimate keys within tolerance
  - name: clone
    sig: '(): AnimCurve'
    hint: copy keys and metadata
  - name: setStep
    sig: '(): void'
    hint: set interpolation to step
  - name: setLinear
    sig: '(): void'
    hint: set interpolation to linear
  - name: setSmooth
    sig: '(): void'
    hint: set interpolation to catmull-rom
  static:
  - name: CONSTANT
    hint: step interpolation enum
  - name: LINEAR
    hint: linear interpolation enum
  - name: SMOOTH
    hint: catmull-rom interpolation enum
  references:
  - playcanvas/core/math/vec3.yaml
- name: AnimController
  kind: class
  status: pending
  target_file: src/animation/anim-controller.ts
  description: State machine driving animation tracks
  fields:
  - name: states
    type: Map<string, AnimState>
  - name: currentState
    type: AnimState
  - name: previousState
    type: AnimState
  - name: transitions
    type: AnimTransition[]
  - name: parameters
    type: Map<string, any>
  methods:
  - name: update
    sig: '(dt: number): void'
    hint: evaluate current state and transitions
  - name: addState
    sig: '(name: string, state: AnimState): void'
    hint: register state machine node
  - name: removeState
    sig: '(name: string): void'
    hint: delete state and its transitions
  - name: getState
    sig: '(name: string): AnimState | null'
    hint: find state by name
  - name: setParameter
    sig: '(name: string, value: any): void'
    hint: set float/bool/trigger
  - name: getParameter
    sig: '(name: string): any'
    hint: return parameter value
  - name: transition
    sig: '(to: string, fade: number): void'
    hint: switch state with blend
  - name: play
    sig: '(name: string): void'
    hint: force enter state
  - name: updateTracks
    sig: '(dt: number): void'
    hint: advance active tracks
  - name: evaluate
    sig: '(): Map<string, any>'
    hint: blend current states
  - name: addTransition
    sig: '(from: string, to: string, condition?: string, fade?: number): void'
    hint: register conditional transition
  - name: removeTransition
    sig: '(from: string, to: string): void'
    hint: delete transition
  - name: getCurrentStateName
    sig: '(): string'
    hint: return active state name
  references:
  - playcanvas/framework/entity.yaml
- name: AnimState
  kind: class
  status: translated
  target_file: src/animation/anim-state.ts
  description: Single state in animation state machine
  fields:
  - name: name
    type: string
  - name: tracks
    type: AnimTrack[]
  - name: speed
    type: number
  - name: loop
    type: boolean
  - name: blendTree
    type: BlendTreeNode
  methods:
  - name: addTrack
    sig: '(track: AnimTrack): void'
    hint: append to track list
  - name: removeTrack
    sig: '(index: number): void'
    hint: delete by index
  - name: getTrack
    sig: '(index: number): AnimTrack'
    hint: return track at index
  - name: getTrackCount
    sig: '(): number'
    hint: return list length
  - name: setSpeed
    sig: '(s: number): void'
    hint: multiply all tracks
  - name: setLoop
    sig: '(l: boolean): void'
    hint: affect all tracks
  - name: update
    sig: '(dt: number): void'
    hint: advance all tracks
  - name: evaluate
    sig: '(): Map<string, any>'
    hint: blend track results
  - name: setBlendTree
    sig: '(tree: BlendTreeNode): void'
    hint: replace track list
  - name: getDuration
    sig: '(): number'
    hint: longest track duration
  - name: normalizeTime
    sig: '(t: number): number'
    hint: apply loop and duration
  references:
  - playcanvas/framework/entity.yaml
- name: Skeleton
  kind: class
  status: pending
  target_file: src/animation/skeleton.ts
  description: Hierarchy of bones for skeletal animation
  fields:
  - name: bones
    type: Bone[]
  - name: hierarchy
    type: number[]
  - name: inverseBindMatrices
    type: Mat4[]
  methods:
  - name: addBone
    sig: '(bone: Bone): number'
    hint: append and return index
  - name: getBone
    sig: '(index: number): Bone'
    hint: return bone at index
  - name: getBoneByName
    sig: '(name: string): Bone | null'
    hint: linear search
  - name: getBoneCount
    sig: '(): number'
    hint: return array length
  - name: setParent
    sig: '(child: number, parent: number): void'
    hint: reparent in hierarchy
  - name: getParent
    sig: '(index: number): number'
    hint: return parent index or -1
  - name: getChildren
    sig: '(index: number): number[]'
    hint: return child indices
  - name: computeWorldMatrices
    sig: '(out: Mat4[]): void'
    hint: traverse hierarchy
  - name: computeSkinMatrices
    sig: '(out: Mat4[]): void'
    hint: world * inverseBind
  - name: update
    sig: '(): void'
    hint: mark dirty flags
  - name: clone
    sig: '(): Skeleton'
    hint: deep copy bones
  references:
  - playcanvas/core/math/vec3.yaml
- name: Bone
  kind: class
  status: pending
  target_file: src/animation/bone.ts
  description: Single bone in skeletal hierarchy
  fields:
  - name: name
    type: string
  - name: position
    type: Vec3
  - name: rotation
    type: Quat
  - name: scale
    type: Vec3
  - name: worldPosition
    type: Vec3
  - name: worldRotation
    type: Quat
  - name: worldScale
    type: Vec3
  - name: worldMatrix
    type: Mat4
  methods:
  - name: setPosition
    sig: '(x: number, y: number, z: number): void'
    hint: set local position
  - name: setRotation
    sig: '(x: number, y: number, z: number, w: number): void'
    hint: set local rotation
  - name: setEulerAngles
    sig: '(x: number, y: number, z: number): void'
    hint: euler to quat
  - name: setScale
    sig: '(x: number, y: number, z: number): void'
    hint: set local scale
  - name: translate
    sig: '(x: number, y: number, z: number): void'
    hint: add to local position
  - name: rotate
    sig: '(x: number, y: number, z: number): void'
    hint: multiply local rotation
  - name: lookAt
    sig: '(target: Vec3, up: Vec3): void'
    hint: set world rotation
  - name: getWorldPosition
    sig: '(): Vec3'
    hint: return computed world pos
  - name: getWorldRotation
    sig: '(): Quat'
    hint: return computed world rot
  - name: getWorldMatrix
    sig: '(): Mat4'
    hint: return computed matrix
  - name: updateWorldMatrix
    sig: '(parentMat?: Mat4): void'
    hint: compute from parent
  - name: clone
    sig: '(): Bone'
    hint: copy transform
  references:
  - playcanvas/core/math/vec3.yaml
