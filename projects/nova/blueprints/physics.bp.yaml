## Blueprint — physics
name: physics
language: typescript
target_dir: src/physics
description: ''
constraints:
- Physics simulation abstraction layer
- Supports multiple physics backends (Ammo.js, Cannon.js, etc.)
- Integrates with Entity-Component-System
- Provides collision detection and response
- Supports raycasting and collision queries
references:
- playcanvas/platform/graphics/graphics-device.yaml
- playcanvas/scene/renderer/forward-renderer.yaml
- playcanvas/framework/entity.yaml
- playcanvas/core/math/vec3.yaml
types:
- name: PhysicsWorld
  kind: class
  status: pending
  target_file: src/physics/physics-world.ts
  description: Manages physics simulation and collision detection
  fields:
  - name: gravity
    type: Vec3
    default: '{x:0, y:-9.8, z:0}'
  - name: bodies
    type: RigidBody[]
    default: '[]'
  - name: colliders
    type: Collider[]
    default: '[]'
  - name: contacts
    type: ContactResult[]
    default: '[]'
  - name: timeStep
    type: number
    default: 1/60
  - name: maxSubSteps
    type: number
    default: '4'
  - name: solverIterations
    type: number
    default: '10'
  methods:
  - name: step
    sig: '(deltaTime: number): void'
    hint: Advance simulation by deltaTime
  - name: addRigidBody
    sig: '(body: RigidBody): void'
    hint: Register rigid body with world
  - name: removeRigidBody
    sig: '(body: RigidBody): void'
    hint: Unregister rigid body
  - name: addCollider
    sig: '(collider: Collider): void'
    hint: Register collision shape
  - name: removeCollider
    sig: '(collider: Collider): void'
    hint: Unregister collision shape
  - name: raycast
    sig: '(from: Vec3, to: Vec3, options?: RaycastOptions): RaycastResult[]'
    hint: Cast ray through world
  - name: raycastFirst
    sig: '(from: Vec3, to: Vec3, options?: RaycastOptions): RaycastResult | null'
    hint: Get first hit only
  - name: sphereCast
    sig: '(center: Vec3, radius: number, direction: Vec3, distance: number): RaycastResult[]'
    hint: Cast sphere through world
  - name: boxCast
    sig: '(center: Vec3, halfExtents: Vec3, orientation: Quat, direction: Vec3, distance: number): RaycastResult[]'
    hint: Cast box through world
  - name: overlapSphere
    sig: '(center: Vec3, radius: number): Collider[]'
    hint: Find colliders in sphere
  - name: overlapBox
    sig: '(center: Vec3, halfExtents: Vec3, orientation: Quat): Collider[]'
    hint: Find colliders in box
  - name: setGravity
    sig: '(gravity: Vec3): void'
    hint: Update world gravity
  - name: getGravity
    sig: '(): Vec3'
    hint: Get current gravity
  - name: enableCCD
    sig: '(enabled: boolean): void'
    hint: Toggle continuous collision detection
  - name: setSolverIterations
    sig: '(iterations: number): void'
    hint: Set constraint solver iterations
  - name: getContacts
    sig: '(): ContactResult[]'
    hint: Get current frame contacts
  - name: clearForces
    sig: '(): void'
    hint: Clear all accumulated forces
  references:
  - playcanvas/framework/entity.yaml
- name: RigidBody
  kind: class
  status: translated
  target_file: src/physics/rigid-body.ts
  description: Physics body with mass, velocity, and forces
  fields:
  - name: entity
    type: Entity
    default: 'null'
  - name: mass
    type: number
    default: '1.0'
  - name: linearVelocity
    type: Vec3
    default: '{x:0, y:0, z:0}'
  - name: angularVelocity
    type: Vec3
    default: '{x:0, y:0, z:0}'
  - name: linearDamping
    type: number
    default: '0.01'
  - name: angularDamping
    type: number
    default: '0.01'
  - name: restitution
    type: number
    default: '0.5'
  - name: friction
    type: number
    default: '0.5'
  - name: rollingFriction
    type: number
    default: '0.0'
  - name: spinningFriction
    type: number
    default: '0.0'
  - name: isKinematic
    type: boolean
    default: 'false'
  - name: isStatic
    type: boolean
    default: 'false'
  - name: isTrigger
    type: boolean
    default: 'false'
  - name: linearFactor
    type: Vec3
    default: '{x:1, y:1, z:1}'
  - name: angularFactor
    type: Vec3
    default: '{x:1, y:1, z:1}'
  methods:
  - name: applyForce
    sig: '(force: Vec3, point?: Vec3): void'
    hint: Apply force at point or center
  - name: applyImpulse
    sig: '(impulse: Vec3, point?: Vec3): void'
    hint: Apply instantaneous impulse
  - name: applyTorque
    sig: '(torque: Vec3): void'
    hint: Apply rotational force
  - name: applyTorqueImpulse
    sig: '(torque: Vec3): void'
    hint: Apply rotational impulse
  - name: setLinearVelocity
    sig: '(velocity: Vec3): void'
    hint: Set velocity directly
  - name: setAngularVelocity
    sig: '(velocity: Vec3): void'
    hint: Set angular velocity
  - name: getLinearVelocity
    sig: '(): Vec3'
    hint: Get current velocity
  - name: getAngularVelocity
    sig: '(): Vec3'
    hint: Get angular velocity
  - name: setMass
    sig: '(mass: number): void'
    hint: Update body mass
  - name: getMass
    sig: '(): number'
    hint: Get current mass
  - name: setKinematic
    sig: '(kinematic: boolean): void'
    hint: Toggle kinematic mode
  - name: isKinematic
    sig: '(): boolean'
    hint: Check kinematic state
  - name: setStatic
    sig: '(static: boolean): void'
    hint: Toggle static mode
  - name: isStatic
    sig: '(): boolean'
    hint: Check static state
  - name: setTrigger
    sig: '(trigger: boolean): void'
    hint: Toggle trigger mode
  - name: isTrigger
    sig: '(): boolean'
    hint: Check trigger state
  - name: wakeUp
    sig: '(): void'
    hint: Wake from sleep
  - name: putToSleep
    sig: '(): void'
    hint: Force sleep state
  - name: isSleeping
    sig: '(): boolean'
    hint: Check sleep state
  - name: getWorldTransform
    sig: '(): Mat4'
    hint: Get world transform matrix
  - name: setWorldTransform
    sig: '(transform: Mat4): void'
    hint: Set world transform directly
  - name: getAABB
    sig: '(): BoundingBox'
    hint: Get world space AABB
  references:
  - playcanvas/framework/entity.yaml
  - playcanvas/core/math/vec3.yaml
- name: Collider
  kind: class
  status: pending
  target_file: src/physics/collider.ts
  description: Collision shape attached to rigid body
  fields:
  - name: entity
    type: Entity
    default: 'null'
  - name: shape
    type: ColliderShape
    default: ColliderShape.BOX
  - name: size
    type: Vec3
    default: '{x:1, y:1, z:1}'
  - name: radius
    type: number
    default: '0.5'
  - name: height
    type: number
    default: '2.0'
  - name: mesh
    type: CollisionMesh
    default: 'null'
  - name: offset
    type: Vec3
    default: '{x:0, y:0, z:0}'
  - name: orientation
    type: Quat
    default: '{x:0, y:0, z:0, w:1}'
  - name: material
    type: PhysicsMaterial
    default: 'null'
  - name: isTrigger
    type: boolean
    default: 'false'
  methods:
  - name: setShape
    sig: '(shape: ColliderShape): void'
    hint: Change collision shape type
  - name: getShape
    sig: '(): ColliderShape'
    hint: Get current shape type
  - name: setSize
    sig: '(size: Vec3): void'
    hint: Update box/sphere size
  - name: getSize
    sig: '(): Vec3'
    hint: Get current size
  - name: setRadius
    sig: '(radius: number): void'
    hint: Update sphere/capsule radius
  - name: getRadius
    sig: '(): number'
    hint: Get current radius
  - name: setHeight
    sig: '(height: number): void'
    hint: Update capsule/cylinder height
  - name: getHeight
    sig: '(): number'
    hint: Get current height
  - name: setMesh
    sig: '(mesh: CollisionMesh): void'
    hint: Set triangle mesh
  - name: getMesh
    sig: '(): CollisionMesh'
    hint: Get triangle mesh
  - name: setOffset
    sig: '(offset: Vec3): void'
    hint: Set local offset
  - name: getOffset
    sig: '(): Vec3'
    hint: Get local offset
  - name: setOrientation
    sig: '(orientation: Quat): void'
    hint: Set local rotation
  - name: getOrientation
    sig: '(): Quat'
    hint: Get local rotation
  - name: setMaterial
    sig: '(material: PhysicsMaterial): void'
    hint: Set physics material
  - name: getMaterial
    sig: '(): PhysicsMaterial'
    hint: Get physics material
  - name: setTrigger
    sig: '(trigger: boolean): void'
    hint: Toggle trigger mode
  - name: isTrigger
    sig: '(): boolean'
    hint: Check trigger state
  - name: getAABB
    sig: '(): BoundingBox'
    hint: Get world space AABB
  - name: raycast
    sig: '(from: Vec3, to: Vec3): RaycastResult | null'
    hint: Test ray against collider
  references:
  - playcanvas/framework/entity.yaml
  - playcanvas/core/math/vec3.yaml
- name: ContactResult
  kind: class
  status: pending
  target_file: src/physics/contact-result.ts
  description: Information about collision between two colliders
  fields:
  - name: colliderA
    type: Collider
    default: 'null'
  - name: colliderB
    type: Collider
    default: 'null'
  - name: point
    type: Vec3
    default: '{x:0, y:0, z:0}'
  - name: normal
    type: Vec3
    default: '{x:0, y:1, z:0}'
  - name: penetration
    type: number
    default: '0.0'
  - name: impulse
    type: number
    default: '0.0'
  - name: friction
    type: number
    default: '0.5'
  - name: restitution
    type: number
    default: '0.5'
  methods:
  - name: getColliderA
    sig: '(): Collider'
    hint: Get first collider
  - name: getColliderB
    sig: '(): Collider'
    hint: Get second collider
  - name: getPoint
    sig: '(): Vec3'
    hint: Get contact point
  - name: getNormal
    sig: '(): Vec3'
    hint: Get contact normal
  - name: getPenetration
    sig: '(): number'
    hint: Get penetration depth
  - name: getImpulse
    sig: '(): number'
    hint: Get impulse magnitude
  - name: getFriction
    sig: '(): number'
    hint: Get friction coefficient
  - name: getRestitution
    sig: '(): number'
    hint: Get restitution coefficient
  - name: setPoint
    sig: '(point: Vec3): void'
    hint: Set contact point
  - name: setNormal
    sig: '(normal: Vec3): void'
    hint: Set contact normal
  - name: setPenetration
    sig: '(penetration: number): void'
    hint: Set penetration depth
  - name: setImpulse
    sig: '(impulse: number): void'
    hint: Set impulse magnitude
  references:
  - playcanvas/core/math/vec3.yaml
- name: RaycastResult
  kind: class
  status: pending
  target_file: src/physics/raycast-result.ts
  description: Result of raycast query
  fields:
  - name: collider
    type: Collider
    default: 'null'
  - name: entity
    type: Entity
    default: 'null'
  - name: point
    type: Vec3
    default: '{x:0, y:0, z:0}'
  - name: normal
    type: Vec3
    default: '{x:0, y:1, z:0}'
  - name: distance
    type: number
    default: '0.0'
  - name: hit
    type: boolean
    default: 'false'
  methods:
  - name: getCollider
    sig: '(): Collider'
    hint: Get hit collider
  - name: getEntity
    sig: '(): Entity'
    hint: Get hit entity
  - name: getPoint
    sig: '(): Vec3'
    hint: Get hit point
  - name: getNormal
    sig: '(): Vec3'
    hint: Get hit normal
  - name: getDistance
    sig: '(): number'
    hint: Get hit distance
  - name: hasHit
    sig: '(): boolean'
    hint: Check if hit occurred
  - name: setHit
    sig: '(hit: boolean): void'
    hint: Set hit state
  - name: setPoint
    sig: '(point: Vec3): void'
    hint: Set hit point
  - name: setNormal
    sig: '(normal: Vec3): void'
    hint: Set hit normal
  - name: setDistance
    sig: '(distance: number): void'
    hint: Set hit distance
  references:
  - playcanvas/framework/entity.yaml
  - playcanvas/core/math/vec3.yaml
- name: CollisionMesh
  kind: class
  status: translated
  target_file: src/physics/collision-mesh.ts
  description: Triangle mesh for mesh colliders
  fields:
  - name: vertices
    type: Float32Array
    default: new Float32Array()
  - name: indices
    type: Uint16Array
    default: new Uint16Array()
  - name: normals
    type: Float32Array
    default: new Float32Array()
  - name: aabb
    type: BoundingBox
    default: new BoundingBox()
  methods:
  - name: setVertices
    sig: '(vertices: Float32Array): void'
    hint: Set vertex positions
  - name: getVertices
    sig: '(): Float32Array'
    hint: Get vertex positions
  - name: setIndices
    sig: '(indices: Uint16Array): void'
    hint: Set triangle indices
  - name: getIndices
    sig: '(): Uint16Array'
    hint: Get triangle indices
  - name: setNormals
    sig: '(normals: Float32Array): void'
    hint: Set vertex normals
  - name: getNormals
    sig: '(): Float32Array'
    hint: Get vertex normals
  - name: getAABB
    sig: '(): BoundingBox'
    hint: Get bounding box
  - name: updateAABB
    sig: '(): void'
    hint: Recalculate bounding box
  - name: raycast
    sig: '(from: Vec3, to: Vec3): RaycastResult | null'
    hint: Test ray against mesh
  - name: getTriangle
    sig: '(index: number, out?: Vec3[]): Vec3[]'
    hint: Get triangle vertices
  - name: getTriangleNormal
    sig: '(index: number): Vec3'
    hint: Get triangle normal
  - name: getVertexCount
    sig: '(): number'
    hint: Get vertex count
  - name: getTriangleCount
    sig: '(): number'
    hint: Get triangle count
  references:
  - playcanvas/core/math/vec3.yaml
- name: ColliderShape
  kind: enum
  status: pending
  target_file: src/physics/collider-shape.ts
  description: Types of collision shapes
  fields:
  - name: BOX
  - name: SPHERE
  - name: CAPSULE
  - name: CYLINDER
  - name: MESH
  - name: CONVEX_HULL
  - name: PLANE
  - name: HEIGHTFIELD
- name: PhysicsMaterial
  kind: class
  status: pending
  target_file: src/physics/physics-material.ts
  description: Material properties for physics objects
  fields:
  - name: friction
    type: number
    default: '0.5'
  - name: rollingFriction
    type: number
    default: '0.0'
  - name: spinningFriction
    type: number
    default: '0.0'
  - name: restitution
    type: number
    default: '0.5'
  - name: density
    type: number
    default: '1000.0'
  methods:
  - name: setFriction
    sig: '(friction: number): void'
    hint: Set friction coefficient
  - name: getFriction
    sig: '(): number'
    hint: Get friction coefficient
  - name: setRollingFriction
    sig: '(friction: number): void'
    hint: Set rolling friction
  - name: getRollingFriction
    sig: '(): number'
    hint: Get rolling friction
  - name: setSpinningFriction
    sig: '(friction: number): void'
    hint: Set spinning friction
  - name: getSpinningFriction
    sig: '(): number'
    hint: Get spinning friction
  - name: setRestitution
    sig: '(restitution: number): void'
    hint: Set bounciness
  - name: getRestitution
    sig: '(): number'
    hint: Get bounciness
  - name: setDensity
    sig: '(density: number): void'
    hint: Set density kg/m³
  - name: getDensity
    sig: '(): number'
    hint: Get density
- name: RaycastOptions
  kind: interface
  status: pending
  target_file: src/physics/raycast-options.ts
  description: Options for raycast queries
  fields:
  - name: filter
    type: '(collider: Collider) => boolean'
    default: () => true
  - name: maxHits
    type: number
    default: '1'
  - name: layerMask
    type: number
    default: '0xFFFFFFFF'
  - name: queryTriggerInteraction
    type: QueryTriggerInteraction
    default: QueryTriggerInteraction.UseGlobal
