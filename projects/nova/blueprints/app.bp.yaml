## Blueprint — app
name: app
language: typescript
target_dir: src/app
description: ''
constraints:
- Single entry point for engine initialization
- Manages all subsystems (graphics, input, audio, scene)
- Registry pattern for scenes, assets, scripts
- Frame-based update loop with fixed/variable timesteps
references:
- playcanvas/platform/graphics/graphics-device.yaml
- playcanvas/scene/renderer/forward-renderer.yaml
- playcanvas/framework/entity.yaml
- playcanvas/core/math/vec3.yaml
types:
- name: Application
  kind: class
  status: pending
  target_file: src/app/application.ts
  description: Main engine application class managing lifecycle and subsystems
  fields:
  - name: graphicsDevice
    type: GraphicsDevice
    default: None
  - name: scene
    type: Scene
    default: None
  - name: renderer
    type: ForwardRenderer
    default: None
  - name: input
    type: InputManager
    default: None
  - name: audioContext
    type: AudioContext
    default: None
  - name: listener
    type: Listener
    default: None
  - name: loader
    type: ResourceLoader
    default: None
  - name: sceneRegistry
    type: SceneRegistry
    default: None
  - name: assetRegistry
    type: AssetRegistry
    default: None
  - name: scriptRegistry
    type: ScriptRegistry
    default: None
  - name: time
    type: number
    default: '0'
  - name: deltaTime
    type: number
    default: '0'
  - name: fixedTimeStep
    type: number
    default: 1/60
  - name: maxDeltaTime
    type: number
    default: '0.1'
  - name: running
    type: boolean
    default: 'False'
  - name: _frameId
    type: number
    default: '0'
  methods:
  - name: constructor
    sig: '(canvas: HTMLCanvasElement, options?: ApplicationOptions)'
    hint: Initialize all subsystems and registries
  - name: start
    sig: '(): Promise<void>'
    hint: Create graphics device and begin frame loop
  - name: destroy
    sig: '(): void'
    hint: Cleanup all subsystems and release resources
  - name: update
    sig: '(deltaTime: number): void'
    hint: Update all systems with clamped delta
  - name: render
    sig: '(): void'
    hint: Render current scene with active camera
  - name: setScene
    sig: '(scene: Scene): void'
    hint: Set active scene and trigger events
  - name: loadScene
    sig: '(url: string): Promise<Scene>'
    hint: Load scene via registry and switch to it
  - name: preload
    sig: '(assetUrls: string[]): Promise<void>'
    hint: Batch load assets before start
  - name: true
    sig: '(event: string, callback: Function): void'
    hint: Subscribe to app-level events
  - name: false
    sig: '(event: string, callback: Function): void'
    hint: Unsubscribe from app-level events
  - name: fire
    sig: '(event: string, ...args: any[]): void'
    hint: Emit app-level events
  - name: configure
    sig: '(settings: AppSettings): void'
    hint: Apply quality and behavior settings
  - name: enableFullscreen
    sig: '(element?: HTMLElement): Promise<void>'
    hint: Request fullscreen mode
  - name: exitFullscreen
    sig: '(): void'
    hint: Exit fullscreen mode
  - name: isFullscreen
    sig: '(): boolean'
    hint: Check fullscreen state
  - name: setTimeScale
    sig: '(scale: number): void'
    hint: Scale delta time for slow/fast motion
  - name: getTimeScale
    sig: '(): number'
    hint: Get current time scale
  static:
  - name: getApplication
    sig: '(): Application'
    hint: Return global app instance
  references:
  - playcanvas/platform/graphics/graphics-device.yaml
  - playcanvas/scene/renderer/forward-renderer.yaml
- name: SceneRegistry
  kind: class
  status: translated
  target_file: src/app/scene-registry.ts
  description: Registry for scene templates and instances
  fields:
  - name: _scenes
    type: Map<string, SceneTemplate>
    default: new Map()
  - name: _loader
    type: ResourceLoader
    default: None
  methods:
  - name: constructor
    sig: '(loader: ResourceLoader)'
    hint: Initialize with resource loader
  - name: add
    sig: '(name: string, url: string): void'
    hint: Register scene template by name
  - name: remove
    sig: '(name: string): void'
    hint: Unregister scene template
  - name: has
    sig: '(name: string): boolean'
    hint: Check if scene exists
  - name: get
    sig: '(name: string): SceneTemplate'
    hint: Get scene template by name
  - name: load
    sig: '(name: string): Promise<Scene>'
    hint: Load and instantiate scene
  - name: loadFromUrl
    sig: '(url: string): Promise<Scene>'
    hint: Load scene directly from URL
  - name: list
    sig: '(): string[]'
    hint: Get all registered scene names
  - name: clear
    sig: '(): void'
    hint: Remove all scenes
  - name: _createScene
    sig: '(data: any): Scene'
    hint: Build scene from loaded data
  references:
  - playcanvas/framework/entity.yaml
- name: AssetRegistry
  kind: class
  status: pending
  target_file: src/app/asset-registry.ts
  description: Central registry for all game assets
  fields:
  - name: _assets
    type: Map<string, Asset>
    default: new Map()
  - name: _loader
    type: ResourceLoader
    default: None
  - name: _prefix
    type: string
  methods:
  - name: constructor
    sig: '(loader: ResourceLoader)'
    hint: Initialize with resource loader
  - name: add
    sig: '(asset: Asset): void'
    hint: Register loaded asset
  - name: remove
    sig: '(id: string): void'
    hint: Unregister asset
  - name: get
    sig: '(id: string): Asset'
    hint: Get asset by ID
  - name: find
    sig: '(name: string): Asset'
    hint: Find first asset by name
  - name: findAll
    sig: '(name: string): Asset[]'
    hint: Find all assets by name
  - name: load
    sig: '(url: string, type: string): Promise<Asset>'
    hint: Load and register asset
  - name: loadBatch
    sig: '(urls: string[]): Promise<Asset[]>'
    hint: Load multiple assets
  - name: setPrefix
    sig: '(prefix: string): void'
    hint: Set base path prefix
  - name: getPrefix
    sig: '(): string'
    hint: Get current prefix
  - name: list
    sig: '(): Asset[]'
    hint: Get all assets
  - name: clear
    sig: '(): void'
    hint: Remove all assets
  - name: _createAsset
    sig: '(data: any, type: string): Asset'
    hint: Factory method for assets
  references:
  - playcanvas/platform/graphics/graphics-device.yaml
- name: ScriptRegistry
  kind: class
  status: pending
  target_file: src/app/script-registry.ts
  description: Registry for script components and instances
  fields:
  - name: _scripts
    type: Map<string, ScriptConstructor>
    default: new Map()
  - name: _instances
    type: Set<Script>
    default: new Set()
  methods:
  - name: constructor
    sig: ()
    hint: Initialize empty registry
  - name: add
    sig: '(name: string, constructor: ScriptConstructor): void'
    hint: Register script class
  - name: remove
    sig: '(name: string): void'
    hint: Unregister script
  - name: has
    sig: '(name: string): boolean'
    hint: Check if script exists
  - name: get
    sig: '(name: string): ScriptConstructor'
    hint: Get script constructor
  - name: create
    sig: '(name: string, entity: Entity): Script'
    hint: Create script instance
  - name: destroy
    sig: '(script: Script): void'
    hint: Remove and cleanup instance
  - name: list
    sig: '(): string[]'
    hint: Get all script names
  - name: clear
    sig: '(): void'
    hint: Remove all scripts
  - name: update
    sig: '(deltaTime: number): void'
    hint: Update all active instances
  - name: onEnable
    sig: '(): void'
    hint: Enable all instances
  - name: onDisable
    sig: '(): void'
    hint: Disable all instances
  - name: onFixedUpdate
    sig: '(deltaTime: number): void'
    hint: Fixed timestep update
  references:
  - playcanvas/framework/entity.yaml
