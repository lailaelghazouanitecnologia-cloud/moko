- target_type: Entity
  target_module: framework
  variation: Minimal-ECS
  constraints:
  - Strip concrete component references from Entity class (anim, camera, collision,
    light, model, render, script, sprite, sound).
  - 'Keep only the generic storage (c: Map<string, Component>) and lifecycle methods.'
  - ComponentSystem becomes a lightweight registry; no schema validation at this stage.
  - No reflection/serialization in the first milestone—add later via opt-in mixin.
  - Keep the EventHandler parent for both Component and ComponentSystem so enable/disable
    propagation is trivial.
  - 'Unit-test boundary: <200 lines for Entity, <100 lines for ComponentSystem, <50
    lines for Component.'
