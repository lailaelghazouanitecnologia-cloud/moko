- target_type: Entity
  target_module: framework
  variation: Prototype a minimal version in TypeScript with strict component data
    schema (no methods on components) and benchmark 10 000 moving sprites against
    an OOP equivalent. Measure frame-time and memory traffic; if < 2× speed-up, keep
    the OOP path as fallback.
  constraints:
  - Keep component definitions to plain structs (no prototype methods)
  - Systems must own all update logic; entities are strictly IDs
  - GraphNode transform updates remain single-threaded for v1
  - Editor must be able to add/remove components without code reload
  - Maintain < 1 k LOC for the entire ECS layer
  benchmark_metrics:
  - loc
  - density
  - method_count
  - tsc_errors
  _source: features/advocate
  _feature: Entity-Component System
  _confidence: 0.92
- target_type: Entity
