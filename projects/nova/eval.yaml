- target_type: GraphicsDevice
  target_module: graphics
  variation: Re-implement the factory and the GraphicsDevice interface in C++ with
    the same fallback chain (Vulkan → D3D12 → Null) and expose it through a single
    header `graphics_device.h`.  Keep the same method names and signature order so
    that higher-level code can be ported verbatim.  Internally use a lightweight vtable
    + PIMPL to swap backends at runtime (hot-reload for VR/Editor).  Add a compile-time
    flag `GRAPHICS_FORCE_NULL` for headless CI runs.
  constraints:
  - Must compile on MSVC, Clang, GCC with zero warnings at /W4 -Wall
  - Backend switch must be <1 ms on a 2020 laptop
  - Public header must be C++17 only (no STL in interface)
  - All state-setters must assert in debug if called inside a render-pass that does
    not allow that state change
  - Keep the same debug-marker names so PIX/RenderDoc captures line up with Web traces
  benchmark_metrics:
  - loc
  - density
  - method_count
  - tsc_errors
  _source: features/advocate
  _feature: Low-level Graphics
  _confidence: 0.92
- target_type: GraphicsDevice
  target_module: graphics
  variation: 'WebGPU-only backend with a thin WebGL2 polyfill (≤1500 lines) that implements
    the same 12-method interface. Ship only two code-paths: WebGPU and the polyfill;
    drop Null backend entirely. Provide a compile-time flag to disable the polyfill
    for projects that can require WebGPU.'
  constraints:
  - Must run on Chrome/Edge 113+, Firefox 115+ (WebGPU enabled).
  - Polyfill must pass 95% of the same visual test suite as the WebGPU path.
  - Total backend code must stay under 5 kLOC (currently ~15 kLOC for three backends).
  - No runtime backend selection—build-time flag only—to avoid combinatorial QA.
  benchmark_metrics:
  - loc
  - density
  - method_count
  - tsc_errors
  _source: features/critic
  _feature: Low-level Graphics
  _confidence: 0.75
- target_type: GraphicsDevice
  target_module: graphics
  variation: Single-backend compile-time GraphicsDevice
  constraints:
  - Choose ONE backend at compile/cmake time (WebGPU-only for new projects, WebGL2-only
    for legacy).
  - Keep the same 12 public methods but move them to a pure-virtual base class; each
    backend is a separate build target that implements only that interface.
  - Remove the factory and the fallback chain; the host page or native main() explicitly
    instantiates the chosen backend, so no dead code is shipped.
  - Add a minimal capability-query struct (maxTextures, etc.) so higher-level code
    can branch on features instead of on renderer strings.
  - Defer advanced features (queries, barriers, read-back) to backend-specific extensions
    or a future v2 interface; the MVP stays at 12 methods.
  - Provide a Null backend only for headless CI testing; it is not bundled in release
    builds.
  benchmark_metrics:
  - loc
  - density
  - method_count
  - tsc_errors
  _source: features/pragmatist
  _feature: Low-level Graphics
  _confidence: 0.75
- target_type: ForwardRenderer
  target_module: renderer
  variation: 'Port the 1 200-line core into src/render/forward_renderer.hpp/.cpp (or
    .js/ts) keeping the identical public API.  Replace PlayCanvas-specific containers
    (e.g. pc.MeshInstance) with the target engine’s own scene types.  Evaluate performance
    on a 50k-triangle Stanford dragon scene with a 4-cascade shadow map: target ≥
    60 fps on an RTX 3060 at 1080p.  Constraints: (1) keep the sort mode constants
    as an enum, no dynamic polymorphism for sorting; (2) shadow map cache must stay
    a plain LRU with ≤ 32 MB budget; (3) no external dependencies beyond the existing
    GraphicsDevice abstraction.'
  constraints:
  - Keep public API surface identical
  - ≤ 32 MB shadow-map cache
  - No external deps beyond GraphicsDevice
