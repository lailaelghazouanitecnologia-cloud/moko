evaluations:
- target_type: Vec3
  target_module: math
  variation: Port the PlayCanvas math folder verbatim into src/engine/math/, convert
    to TypeScript definitions, and add a single Jest snapshot test per type that golden-files
    every method against known-good values. Benchmark the hot paths (Vec3.add, Mat4.mul,
    Quat.slerp) in Node and browser to ensure they run in <100 ns/op on desktop and
    <1 µs on mobile.
  constraints:
  - Must keep Float32Array internal storage for WebGL interop
  - Must expose both allocation-free (out-param) and fluent (return-new) overloads
  - Must not depend on any external NPM packages
  - Must pass 100% of the original PlayCanvas unit-equivalent tests
  benchmark_metrics:
  - loc
  - density
  - method_count
  - tsc_errors
  _source: features/advocate
  _feature: 3D Math Library
  _confidence: 0.95
