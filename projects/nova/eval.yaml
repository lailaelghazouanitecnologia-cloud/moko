- target_type: Vec3
  target_module: math
  variation: Minimal SIMD-friendly math core
  constraints:
  - 'One storage type per domain: Vec3=Float32Array(3), Vec2=Float32Array(2), Mat4=Float32Array(16),
    Quat=Float32Array(4)'
  - 'No method chaining; all ops are static mutating functions: Vec3.add(out,a,b)'
  - 'Only ops needed to get a cube spinning: add/sub/mulScalar/dot/cross/normalize/length,
    Mat4.mul/setTRS/lookAt/perspective, Quat.mul/slerp'
  - Constants live in a separate frozen object to avoid per-instance allocations
  - Unit test coverage ≥ 90 %; no docs beyond JSDoc one-liners
  - 'Size cap: entire module ≤ 1 kLOC'
  - Future ops added only after two real engine systems request them
  benchmark_metrics:
  - loc
  - density
  - method_count
  - tsc_errors
  _source: features/pragmatist
  _feature: 3D Math Library
  _confidence: 0.8
- target_type: GraphicsDevice
  target_module: graphics
  variation: Port the three files as-is, but replace WebGPU backend with a second
