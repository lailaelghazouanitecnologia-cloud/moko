## Blueprint — response
name: response
language: typescript
target_dir: src/response
description: ''
constraints:
- Must support JSON, text, buffer, stream responses
- Must handle status codes and headers correctly
- Must be immutable after creation
references:
- httpx/src/response/response.yaml
- httpx/src/response/serializer.yaml
types:
- name: Response
  kind: class
  status: translated
  target_file: src/response/response.ts
  description: HTTP response representation with status, headers, and body
  fields:
  - name: statusCode
    type: number
    default: '200'
  - name: headers
    type: ResponseHeaders
  - name: body
    type: ResponseBody
  - name: cookies
    type: Map<string, Cookie>
  methods:
  - name: status
    sig: '(code: number): Response'
    hint: Create new response with status
  - name: header
    sig: '(name: string, value: string): Response'
    hint: Add header to response
  - name: json
    sig: '(data: any): Response'
    hint: Create JSON response
  - name: text
    sig: '(content: string): Response'
    hint: Create text response
  - name: html
    sig: '(content: string): Response'
    hint: Create HTML response
  - name: redirect
    sig: '(url: string, code?: number): Response'
    hint: Create redirect response
  - name: cookie
    sig: '(name: string, value: string, options?: CookieOptions): Response'
    hint: Add cookie to response
  - name: clearCookie
    sig: '(name: string): Response'
    hint: Remove cookie from response
  - name: attachment
    sig: '(filename?: string): Response'
    hint: Set content-disposition header
  - name: download
    sig: '(path: string, filename?: string): Response'
    hint: Create file download response
  - name: sendStatus
    sig: '(code: number): Response'
    hint: Send status with message body
  - name: send
    sig: '(data?: any): Response'
    hint: Auto-detect content type
  - name: type
    sig: '(contentType: string): Response'
    hint: Set content-type header
  - name: vary
    sig: '(field: string): Response'
    hint: Add vary header
  - name: links
    sig: '(links: Record<string, string>): Response'
    hint: Set link header
  - name: location
    sig: '(url: string): Response'
    hint: Set location header
  - name: get
    sig: '(field: string): string | undefined'
    hint: Get header value
  - name: hasHeader
    sig: '(field: string): boolean'
    hint: Check header exists
  - name: removeHeader
    sig: '(field: string): Response'
    hint: Remove header field
  - name: toJSON
    sig: '(): ResponseJSON'
    hint: Serialize to plain object
  static:
  - name: create
    sig: '(init?: ResponseInit): Response'
    hint: Factory method
  references:
  - src/roska/response.roska
- name: ResponseHeaders
  kind: class
  status: pending
  target_file: src/response/response-headers.ts
  description: Immutable HTTP headers container
  fields:
  - name: headers
    type: Map<string, string[]>
  methods:
  - name: set
    sig: '(name: string, value: string | string[]): ResponseHeaders'
    hint: Create new headers with field
  - name: append
    sig: '(name: string, value: string): ResponseHeaders'
    hint: Add value to existing header
  - name: get
    sig: '(name: string): string | undefined'
    hint: Get first header value
  - name: getAll
    sig: '(name: string): string[]'
    hint: Get all values for header
  - name: has
    sig: '(name: string): boolean'
    hint: Check header exists
  - name: delete
    sig: '(name: string): ResponseHeaders'
    hint: Remove header field
  - name: keys
    sig: '(): IterableIterator<string>'
    hint: Get header names
  - name: values
    sig: '(): IterableIterator<string>'
    hint: Get header values
  - name: entries
    sig: '(): IterableIterator<[string, string]>'
    hint: Get header pairs
  - name: forEach
    sig: '(callback: (value: string, name: string) => void): void'
    hint: Iterate headers
  - name: toObject
    sig: '(): Record<string, string | string[]>'
    hint: Convert to plain object
  - name: toJSON
    sig: '(): Record<string, string>'
    hint: Serialize headers
  - name: normalize
    sig: '(name: string): string'
    hint: Normalize header name
  - name: clone
    sig: '(): ResponseHeaders'
    hint: Create copy
  references:
  - src/roska/response.roska
- name: ResponseBody
  kind: class
  status: pending
  target_file: src/response/response-body.ts
  description: HTTP response body container supporting multiple formats
  fields:
  - name: type
    type: BodyType
  - name: data
    type: Buffer | string | object | null
  - name: stream
    type: Readable | null
  methods:
  - name: isEmpty
    sig: '(): boolean'
    hint: Check if body has content
  - name: isStream
    sig: '(): boolean'
    hint: Check if body is stream
  - name: isBuffer
    sig: '(): boolean'
    hint: Check if body is buffer
  - name: isText
    sig: '(): boolean'
    hint: Check if body is text
  - name: isJSON
    sig: '(): boolean'
    hint: Check if body is JSON
  - name: getSize
    sig: '(): number'
    hint: Get content length
  - name: getContentType
    sig: '(): string | undefined'
    hint: Get content type
  - name: toBuffer
    sig: '(): Buffer'
    hint: Convert to buffer
  - name: toString
    sig: '(): string'
    hint: Convert to string
  - name: toJSON
    sig: '(): any'
    hint: Parse as JSON
  - name: getStream
    sig: '(): Readable | null'
    hint: Get stream if present
  - name: pipe
    sig: '(destination: Writable): Writable'
    hint: Pipe to stream
  - name: create
    sig: '(data: any): ResponseBody'
    hint: Factory from data
  - name: fromStream
    sig: '(stream: Readable): ResponseBody'
    hint: Create from stream
  - name: fromFile
    sig: '(path: string): ResponseBody'
    hint: Create from file
  static:
  - name: EMPTY
    sig: ResponseBody
    hint: Empty body instance
  references:
  - src/roska/response.roska
- name: ResponseSerializer
  kind: class
  status: pending
  target_file: src/response/response-serializer.ts
  description: Serializes Response objects to HTTP format
  methods:
  - name: serialize
    sig: '(response: Response): SerializedResponse'
    hint: Convert response to HTTP
  - name: serializeHeaders
    sig: '(headers: ResponseHeaders): Record<string, string>'
    hint: Convert headers to plain
  - name: serializeBody
    sig: '(body: ResponseBody): Buffer | string | null'
    hint: Convert body to transport
  - name: serializeCookies
    sig: '(cookies: Map<string, Cookie>): string[]'
    hint: Convert cookies to headers
  - name: calculateContentLength
    sig: '(body: ResponseBody): number'
    hint: Get body size
  - name: determineContentType
    sig: '(body: ResponseBody): string | undefined'
    hint: Auto-detect content type
  - name: createStatusLine
    sig: '(code: number): string'
    hint: Create HTTP status line
  - name: formatHeader
    sig: '(name: string, value: string): string'
    hint: Format header line
  - name: shouldCompress
    sig: '(response: Response): boolean'
    hint: Check if compressible
  - name: compress
    sig: '(data: Buffer): Buffer'
    hint: Apply gzip compression
  - name: addSecurityHeaders
    sig: '(headers: ResponseHeaders): ResponseHeaders'
    hint: Add security headers
  - name: addCorsHeaders
    sig: '(headers: ResponseHeaders, origin?: string): ResponseHeaders'
    hint: Add CORS headers
  - name: addCacheHeaders
    sig: '(headers: ResponseHeaders, maxAge?: number): ResponseHeaders'
    hint: Add cache headers
  - name: addEtag
    sig: '(body: Buffer): string'
    hint: Generate ETag
  - name: addLastModified
    sig: '(headers: ResponseHeaders, date: Date): ResponseHeaders'
    hint: Add last-modified
  - name: validateHeaders
    sig: '(headers: ResponseHeaders): void'
    hint: Check header validity
  references:
  - src/roska/response.roska
