## Blueprint — request
name: request
language: typescript
target_dir: src/request
description: ''
constraints:
- immutable request objects
- streaming body support
- header normalization
references:
- httpx/src/request/request.yaml
- httpx/src/request/parser.yaml
types:
- name: Request
  kind: class
  status: translated
  target_file: src/request/request.ts
  description: immutable HTTP request representation
  fields:
  - name: method
    type: string
  - name: url
    type: string
  - name: headers
    type: RequestHeaders
  - name: body
    type: RequestBody
  - name: params
    type: Record<string,string>
  - name: query
    type: Record<string,string>
  - name: cookies
    type: Record<string,string>
  - name: ip
    type: string
  - name: protocol
    type: string
  - name: hostname
    type: string
  - name: port
    type: number
  methods:
  - name: clone
    sig: '(updates?: Partial<Request>): Request'
    hint: create immutable copy with updates
  - name: get
    sig: '(header: string): string | undefined'
    hint: case-insensitive header lookup
  - name: has
    sig: '(header: string): boolean'
    hint: check header existence
  - name: accepts
    sig: '(type: string): boolean'
    hint: check content-type acceptance
  - name: acceptsEncodings
    sig: '(encoding: string): boolean'
    hint: check encoding acceptance
  - name: acceptsCharsets
    sig: '(charset: string): boolean'
    hint: check charset acceptance
  - name: acceptsLanguages
    sig: '(language: string): boolean'
    hint: check language acceptance
  - name: is
    sig: '(type: string): boolean'
    hint: check content-type match
  - name: range
    sig: '(size: number): Range[] | undefined'
    hint: parse range header
  - name: fresh
    sig: '(etag: string, lastModified: Date): boolean'
    hint: check cache freshness
  - name: stale
    sig: '(etag: string, lastModified: Date): boolean'
    hint: inverse of fresh
  - name: secure
    sig: '(): boolean'
    hint: check https protocol
  - name: xhr
    sig: '(): boolean'
    hint: check X-Requested-With header
  - name: subdomains
    sig: '(): string[]'
    hint: parse subdomain array
  - name: path
    sig: '(): string'
    hint: get pathname from url
  references:
  - src/roska/http.roska
- name: RequestHeaders
  kind: class
  status: pending
  target_file: src/request/request-headers.ts
  description: normalized HTTP headers container
  fields:
  - name: store
    type: Map<string,string[]>
  methods:
  - name: constructor
    sig: '(raw?: Record<string,string | string[]>)'
    hint: normalize input headers
  - name: get
    sig: '(name: string): string | undefined'
    hint: case-insensitive single value
  - name: getAll
    sig: '(name: string): string[]'
    hint: all values for header
  - name: set
    sig: '(name: string, value: string | string[]): void'
    hint: overwrite header
  - name: append
    sig: '(name: string, value: string): void'
    hint: add value to header
  - name: delete
    sig: '(name: string): void'
    hint: remove header
  - name: has
    sig: '(name: string): boolean'
    hint: check existence
  - name: keys
    sig: '(): IterableIterator<string>'
    hint: header names iterator
  - name: values
    sig: '(): IterableIterator<string[]>'
    hint: header values iterator
  - name: entries
    sig: '(): IterableIterator<[string,string[]]>'
    hint: key-value pairs
  - name: raw
    sig: '(): Record<string,string | string[]>'
    hint: raw header object
  - name: toJSON
    sig: '(): Record<string,string>'
    hint: single-value serialization
  references:
  - src/roska/http.roska
- name: RequestBody
  kind: class
  status: pending
  target_file: src/request/request-body.ts
  description: streaming request body with parsing helpers
  fields:
  - name: stream
    type: ReadableStream
  - name: used
    type: boolean
  methods:
  - name: text
    sig: '(): Promise<string>'
    hint: read as utf-8 text
  - name: json
    sig: '(): Promise<any>'
    hint: parse as JSON
  - name: arrayBuffer
    sig: '(): Promise<ArrayBuffer>'
    hint: read as binary
  - name: blob
    sig: '(): Promise<Blob>'
    hint: read as blob
  - name: formData
    sig: '(): Promise<FormData>'
    hint: parse multipart/form-data
  - name: stream
    sig: '(): ReadableStream'
    hint: get raw stream
  - name: pipe
    sig: '(destination: WritableStream): Promise<void>'
    hint: pipe to writable
  - name: tee
    sig: '(): [RequestBody, RequestBody]'
    hint: duplicate stream
  - name: cancel
    sig: '(): Promise<void>'
    hint: abort reading
  - name: getReader
    sig: '(): ReadableStreamDefaultReader'
    hint: get stream reader
  references:
  - src/roska/http.roska
- name: RequestParser
  kind: class
  status: pending
  target_file: src/request/request-parser.ts
  description: parses raw HTTP into Request objects
  fields:
  - name: maxSize
    type: number
  methods:
  - name: constructor
    sig: '(options?: { maxSize?: number })'
    hint: set size limits
  - name: parse
    sig: '(stream: ReadableStream): Promise<Request>'
    hint: parse HTTP stream
  - name: parseStartLine
    sig: '(line: string): { method: string, url: string, version: string }'
    hint: split request line
  - name: parseHeaders
    sig: '(lines: string[]): RequestHeaders'
    hint: build headers object
  - name: parseQuery
    sig: '(url: string): Record<string,string>'
    hint: extract query params
  - name: parseCookies
    sig: '(cookieHeader: string): Record<string,string>'
    hint: parse cookie string
  - name: parseBody
    sig: '(headers: RequestHeaders, stream: ReadableStream): RequestBody'
    hint: create body wrapper
  - name: validateMethod
    sig: '(method: string): boolean'
    hint: check HTTP method
  - name: validateUrl
    sig: '(url: string): boolean'
    hint: check URL format
  - name: validateHeaders
    sig: '(headers: RequestHeaders): boolean'
    hint: check header limits
  - name: extractIp
    sig: '(headers: RequestHeaders, socket: any): string'
    hint: get client IP
  - name: extractProtocol
    sig: '(headers: RequestHeaders, encrypted: boolean): string'
    hint: determine http/https
  - name: extractHostname
    sig: '(headers: RequestHeaders): string'
    hint: parse host header
  - name: extractPort
    sig: '(headers: RequestHeaders): number'
    hint: parse port number
  references:
  - src/roska/http.roska
