## Blueprint — router
name: router
language: typescript
target_dir: src/router
description: ''
constraints:
- Support dynamic route parameters
- Support middleware chains
- Support HTTP methods
- Support route matching and dispatch
references:
- httpx/src/router/router.yaml
- httpx/src/router/route.yaml
types:
- name: Router
  kind: class
  status: translated
  target_file: src/router/router.ts
  description: Main router class for handling HTTP routing
  fields:
  - name: root
    type: RouteNode
    default: new RouteNode()
  - name: middleware
    type: Middleware[]
    default: '[]'
  - name: routes
    type: Map<string, Route>
    default: new Map()
  methods:
  - name: get
    sig: '(path: string, ...handlers: RequestHandler[]): Router'
    hint: Register GET route
  - name: post
    sig: '(path: string, ...handlers: RequestHandler[]): Router'
    hint: Register POST route
  - name: put
    sig: '(path: string, ...handlers: RequestHandler[]): Router'
    hint: Register PUT route
  - name: delete
    sig: '(path: string, ...handlers: RequestHandler[]): Router'
    hint: Register DELETE route
  - name: patch
    sig: '(path: string, ...handlers: RequestHandler[]): Router'
    hint: Register PATCH route
  - name: head
    sig: '(path: string, ...handlers: RequestHandler[]): Router'
    hint: Register HEAD route
  - name: options
    sig: '(path: string, ...handlers: RequestHandler[]): Router'
    hint: Register OPTIONS route
  - name: use
    sig: '(path: string | RequestHandler, handler?: RequestHandler): Router'
    hint: Register middleware
  - name: route
    sig: '(path: string): Route'
    hint: Create route builder
  - name: find
    sig: '(method: string, pathname: string): RouteMatch | null'
    hint: Find matching route
  - name: handle
    sig: '(req: Request, res: Response): Promise<void>'
    hint: Process request
  - name: param
    sig: '(name: string, handler: ParamHandler): Router'
    hint: Register param handler
  - name: all
    sig: '(path: string, ...handlers: RequestHandler[]): Router'
    hint: Register all methods
  - name: addRoute
    sig: '(method: string, path: string, handlers: RequestHandler[]): void'
    hint: Internal add route
  - name: buildRouteTree
    sig: '(): void'
    hint: Compile routes to tree
  references:
  - src/router/router.roska
- name: Route
  kind: class
  status: pending
  target_file: src/router/route.ts
  description: Route builder for chaining route handlers
  fields:
  - name: path
    type: string
  - name: handlers
    type: RequestHandler[]
    default: '[]'
  - name: router
    type: Router
  methods:
  - name: get
    sig: '(...handlers: RequestHandler[]): Route'
    hint: Add GET handler
  - name: post
    sig: '(...handlers: RequestHandler[]): Route'
    hint: Add POST handler
  - name: put
    sig: '(...handlers: RequestHandler[]): Route'
    hint: Add PUT handler
  - name: delete
    sig: '(...handlers: RequestHandler[]): Route'
    hint: Add DELETE handler
  - name: patch
    sig: '(...handlers: RequestHandler[]): Route'
    hint: Add PATCH handler
  - name: head
    sig: '(...handlers: RequestHandler[]): Route'
    hint: Add HEAD handler
  - name: options
    sig: '(...handlers: RequestHandler[]): Route'
    hint: Add OPTIONS handler
  - name: all
    sig: '(...handlers: RequestHandler[]): Route'
    hint: Add all methods
  - name: middleware
    sig: '(...handlers: RequestHandler[]): Route'
    hint: Add middleware
  - name: param
    sig: '(name: string, handler: ParamHandler): Route'
    hint: Add param handler
  - name: build
    sig: '(): void'
    hint: Register route
  - name: clone
    sig: '(): Route'
    hint: Create copy
  references:
  - src/router/route.roska
- name: RouteNode
  kind: class
  status: pending
  target_file: src/router/route-node.ts
  description: Node in the route tree for efficient matching
  fields:
  - name: children
    type: Map<string, RouteNode>
    default: new Map()
  - name: paramChild
    type: RouteNode | null
    default: 'null'
  - name: wildcardChild
    type: RouteNode | null
    default: 'null'
  - name: handlers
    type: Map<string, RequestHandler[]>
    default: new Map()
  - name: paramName
    type: string | null
    default: 'null'
  - name: isWildcard
    type: boolean
    default: 'false'
  methods:
  - name: insert
    sig: '(method: string, segments: string[], handlers: RequestHandler[]): void'
    hint: Insert route path
  - name: match
    sig: '(segments: string[], params: Record<string, string>): RouteMatch | null'
    hint: Find matching route
  - name: addHandler
    sig: '(method: string, handlers: RequestHandler[]): void'
    hint: Add method handlers
  - name: getHandler
    sig: '(method: string): RequestHandler[] | null'
    hint: Get method handlers
  - name: isParameter
    sig: '(segment: string): boolean'
    hint: Check if parameter
  - name: isWildcard
    sig: '(segment: string): boolean'
    hint: Check if wildcard
  - name: extractParamName
    sig: '(segment: string): string'
    hint: Get param name
  - name: createParamChild
    sig: '(paramName: string): RouteNode'
    hint: Create param node
  - name: createWildcardChild
    sig: '(): RouteNode'
    hint: Create wildcard node
  - name: hasChildren
    sig: '(): boolean'
    hint: Check has children
  references:
  - src/router/route-node.roska
- name: RouteMatch
  kind: class
  status: pending
  target_file: src/router/route-match.ts
  description: Result of route matching with handlers and params
  fields:
  - name: handlers
    type: RequestHandler[]
  - name: params
    type: Record<string, string>
    default: '{}'
  - name: method
    type: string
  - name: pathname
    type: string
  methods:
  - name: constructor
    sig: '(handlers: RequestHandler[], params: Record<string, string>, method: string, pathname: string)'
    hint: Create match
  - name: hasHandlers
    sig: '(): boolean'
    hint: Check has handlers
  - name: getParams
    sig: '(): Record<string, string>'
    hint: Get parameters
  - name: getHandler
    sig: '(): RequestHandler[]'
    hint: Get handlers
  - name: getMethod
    sig: '(): string'
    hint: Get method
  - name: getPathname
    sig: '(): string'
    hint: Get pathname
  - name: toString
    sig: '(): string'
    hint: String representation
  references:
  - src/router/route-match.roska
