## Blueprint — middleware
name: middleware
language: typescript
target_dir: src/middleware
description: ''
constraints:
- Middleware must be composable and reusable
- Middleware execution order must be predictable
- Context must be immutable after creation
references:
- httpx/src/middleware/middleware.yaml
- httpx/src/middleware/stack.yaml
types:
- name: Middleware
  kind: interface
  status: pending
  target_file: src/middleware/middleware.ts
  description: Function signature for middleware components
  methods:
  - name: execute
    sig: '(context: MiddlewareContext, next: NextFunction): Promise<void>'
    hint: Process request and call next
  references:
  - src/middleware/middleware.roska
- name: MiddlewareStack
  kind: class
  status: pending
  target_file: src/middleware/middleware-stack.ts
  description: Manages ordered collection of middleware
  fields:
  - name: middlewares
    type: Middleware[]
    default: '[]'
  methods:
  - name: use
    sig: '(middleware: Middleware): void'
    hint: Add middleware to end
  - name: unshift
    sig: '(middleware: Middleware): void'
    hint: Add middleware to start
  - name: insert
    sig: '(index: number, middleware: Middleware): void'
    hint: Insert at specific position
  - name: remove
    sig: '(middleware: Middleware): boolean'
    hint: Remove first matching
  - name: removeAt
    sig: '(index: number): Middleware | undefined'
    hint: Remove and return at index
  - name: clear
    sig: '(): void'
    hint: Remove all middleware
  - name: clone
    sig: '(): MiddlewareStack'
    hint: Create shallow copy
  - name: length
    sig: '(): number'
    hint: Get middleware count
  - name: get
    sig: '(index: number): Middleware | undefined'
    hint: Get middleware at index
  - name: indexOf
    sig: '(middleware: Middleware): number'
    hint: Find middleware index
  - name: has
    sig: '(middleware: Middleware): boolean'
    hint: Check if exists
  - name: forEach
    sig: '(callback: (mw: Middleware, idx: number) => void): void'
    hint: Iterate middlewares
  - name: map
    sig: '<T>(callback: (mw: Middleware, idx: number) => T): T[]'
    hint: Transform to array
  - name: filter
    sig: '(predicate: (mw: Middleware, idx: number) => boolean): Middleware[]'
    hint: Get matching subset
  - name: toArray
    sig: '(): Middleware[]'
    hint: Convert to array
  references:
  - src/middleware/stack.roska
- name: MiddlewareRunner
  kind: class
  status: translated
  target_file: src/middleware/middleware-runner.ts
  description: Executes middleware chain with proper error handling
  fields:
  - name: stack
    type: MiddlewareStack
    default: new MiddlewareStack()
  methods:
  - name: constructor
    sig: '(stack?: MiddlewareStack)'
    hint: Initialize with optional stack
  - name: run
    sig: '(context: MiddlewareContext): Promise<void>'
    hint: Execute entire chain
  - name: runUntil
    sig: '(context: MiddlewareContext, predicate: (ctx: MiddlewareContext) => boolean): Promise<void>'
    hint: Stop when predicate true
  - name: runWhile
    sig: '(context: MiddlewareContext, predicate: (ctx: MiddlewareContext) => boolean): Promise<void>'
    hint: Continue while predicate true
  - name: compose
    sig: '(middlewares: Middleware[]): Middleware'
    hint: Create single middleware
  - name: wrap
    sig: '(handler: RequestHandler): Middleware'
    hint: Convert handler to middleware
  - name: errorHandler
    sig: '(error: Error, context: MiddlewareContext): Promise<void>'
    hint: Handle chain errors
  - name: setErrorHandler
    sig: '(handler: ErrorHandler): void'
    hint: Set custom error handler
  - name: getStack
    sig: '(): MiddlewareStack'
    hint: Get current stack
  - name: setStack
    sig: '(stack: MiddlewareStack): void'
    hint: Replace entire stack
  - name: add
    sig: '(middleware: Middleware): void'
    hint: Add to stack
  - name: addBefore
    sig: '(target: Middleware, middleware: Middleware): void'
    hint: Insert before target
  - name: addAfter
    sig: '(target: Middleware, middleware: Middleware): void'
    hint: Insert after target
  - name: remove
    sig: '(middleware: Middleware): boolean'
    hint: Remove from stack
  - name: clear
    sig: '(): void'
    hint: Empty the stack
  - name: clone
    sig: '(): MiddlewareRunner'
    hint: Create copy with same stack
  references:
  - src/middleware/runner.roska
- name: MiddlewareContext
  kind: class
  status: pending
  target_file: src/middleware/middleware-context.ts
  description: Immutable request context passed through middleware chain
  fields:
  - name: request
    type: Request
    default: required
  - name: response
    type: Response
    default: required
  - name: state
    type: Map<string, unknown>
    default: new Map()
  - name: params
    type: Record<string, string>
    default: '{}'
  - name: query
    type: Record<string, string>
    default: '{}'
  - name: body
    type: unknown
    default: undefined
  methods:
  - name: constructor
    sig: '(request: Request, response: Response)'
    hint: Create new context
  - name: get
    sig: '<T>(key: string): T | undefined'
    hint: Get state value
  - name: set
    sig: '<T>(key: string, value: T): MiddlewareContext'
    hint: Create new context with value
  - name: has
    sig: '(key: string): boolean'
    hint: Check state exists
  - name: delete
    sig: '(key: string): MiddlewareContext'
    hint: Create without key
  - name: merge
    sig: '(values: Record<string, unknown>): MiddlewareContext'
    hint: Add multiple values
  - name: clear
    sig: '(): MiddlewareContext'
    hint: Create empty state copy
  - name: getRequest
    sig: '(): Request'
    hint: Get request object
  - name: getResponse
    sig: '(): Response'
    hint: Get response object
  - name: setResponse
    sig: '(response: Response): MiddlewareContext'
    hint: Create with new response
  - name: getParams
    sig: '(): Record<string, string>'
    hint: Get route params
  - name: setParams
    sig: '(params: Record<string, string>): MiddlewareContext'
    hint: Create with new params
  - name: getQuery
    sig: '(): Record<string, string>'
    hint: Get query params
  - name: setQuery
    sig: '(query: Record<string, string>): MiddlewareContext'
    hint: Create with new query
  - name: getBody
    sig: '<T>(): T'
    hint: Get request body
  - name: setBody
    sig: '<T>(body: T): MiddlewareContext'
    hint: Create with new body
  - name: clone
    sig: '(): MiddlewareContext'
    hint: Deep copy context
  - name: toJSON
    sig: '(): object'
    hint: Serialize for logging
  references:
  - src/middleware/context.roska
