## Blueprint — commands
name: commands
language: typescript
target_dir: src/commands
description: ''
constraints:
- All commands must implement BaseCommand interface
- Commands must handle git worktree operations safely
- All commands must provide proper error handling
- Commands must support verbose logging
references:
- wt-cli/src/commands/create.yaml
- wt-cli/src/commands/list.yaml
- wt-cli/src/commands/switch.yaml
- wt-cli/src/commands/delete.yaml
types:
- name: BaseCommand
  kind: interface
  status: pending
  target_file: src/commands/base-command.ts
  description: Base interface for all git worktree commands
  methods:
  - name: execute
    sig: '(args: string[]): Promise<void>'
    hint: Execute command with parsed arguments
  - name: validateArgs
    sig: '(args: string[]): boolean'
    hint: Validate command arguments
  - name: getHelp
    sig: '(): string'
    hint: Return command help text
  - name: getDescription
    sig: '(): string'
    hint: Return command description
  references:
  - src/commands/base-command.yaml
