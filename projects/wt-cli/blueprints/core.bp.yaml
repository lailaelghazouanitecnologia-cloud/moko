## Blueprint — core
name: core
language: typescript
target_dir: src/core
description: ''
constraints:
- Use Node.js fs/promises for file operations
- Store worktree metadata in .git/worktrees.json
- Validate worktree paths are within repo
references:
- wt-cli/src/core/worktree.yaml
- wt-cli/src/core/manager.yaml
- wt-cli/src/core/store.yaml
types:
- name: Worktree
  kind: class
  status: pending
  target_file: src/core/worktree.ts
  description: Represents a single git worktree
  fields:
  - name: path
    type: string
  - name: branch
    type: string
  - name: head
    type: string
  - name: isMain
    type: boolean
    default: 'False'
  - name: isLocked
    type: boolean
    default: 'False'
  methods:
  - name: validate
    sig: '(): void'
    hint: Check path exists and is git worktree
  - name: lock
    sig: '(reason?: string): void'
    hint: Mark worktree as locked
  - name: unlock
    sig: '(): void'
    hint: Remove lock from worktree
  - name: isValid
    sig: '(): boolean'
    hint: Verify worktree integrity
  - name: getBranchName
    sig: '(): string'
    hint: Extract branch from git files
  - name: getHeadCommit
    sig: '(): string'
    hint: Read HEAD ref
  - name: isDirty
    sig: '(): boolean'
    hint: Check for uncommitted changes
  - name: toJSON
    sig: '(): object'
    hint: Serialize for storage
  - name: fromJSON
    sig: '(data: object): Worktree'
    hint: Deserialize from storage
  references:
  - src/descriptors/core.yaml
- name: WorktreeManager
  kind: class
  status: translated
  target_file: src/core/worktree-manager.ts
  description: Manages creation and deletion of worktrees
  fields:
  - name: repoPath
    type: string
  - name: store
    type: WorktreeStore
  methods:
  - name: create
    sig: '(branch: string, path?: string): Promise<Worktree>'
    hint: Create new worktree at path
  - name: remove
    sig: '(path: string, force?: boolean): Promise<void>'
    hint: Delete worktree directory
  - name: list
    sig: '(): Promise<Worktree[]>'
    hint: Get all worktrees
  - name: findByBranch
    sig: '(branch: string): Worktree | undefined'
    hint: Search by branch name
  - name: findByPath
    sig: '(path: string): Worktree | undefined'
    hint: Search by path
  - name: switchTo
    sig: '(path: string): Promise<void>'
    hint: Change current worktree
  - name: validatePath
    sig: '(path: string): boolean'
    hint: Ensure within repo
  - name: isBranchExists
    sig: '(branch: string): boolean'
    hint: Check git branches
  - name: createBranch
    sig: '(branch: string, base?: string): Promise<void>'
    hint: Create new branch
  - name: getCurrentWorktree
    sig: '(): Worktree | undefined'
    hint: Find active worktree
  - name: lock
    sig: '(path: string): Promise<void>'
    hint: Lock worktree
  - name: unlock
    sig: '(path: string): Promise<void>'
    hint: Unlock worktree
  - name: prune
    sig: '(): Promise<void>'
    hint: Remove invalid entries
  - name: getMainWorktree
    sig: '(): Worktree'
    hint: Return main repo worktree
  references:
  - src/descriptors/core.yaml
- name: WorktreeStore
  kind: class
  status: pending
  target_file: src/core/worktree-store.ts
  description: Persists worktree metadata
  fields:
  - name: storagePath
    type: string
  - name: worktrees
    type: Map<string, Worktree>
  methods:
  - name: load
    sig: '(): Promise<void>'
    hint: Read from .git/worktrees.json
  - name: save
    sig: '(): Promise<void>'
    hint: Write to .git/worktrees.json
  - name: add
    sig: '(worktree: Worktree): void'
    hint: Add to cache
  - name: remove
    sig: '(path: string): boolean'
    hint: Delete from cache
  - name: get
    sig: '(path: string): Worktree | undefined'
    hint: Find by path
  - name: getAll
    sig: '(): Worktree[]'
    hint: Return all worktrees
  - name: clear
    sig: '(): void'
    hint: Empty cache
  - name: exists
    sig: '(path: string): boolean'
    hint: Check existence
  - name: update
    sig: '(worktree: Worktree): void'
    hint: Replace entry
  - name: isDirty
    sig: '(): boolean'
    hint: Check if modified
  - name: markClean
    sig: '(): void'
    hint: Reset dirty flag
  - name: ensureStorage
    sig: '(): Promise<void>'
    hint: Create if missing
  references:
  - src/descriptors/core.yaml
