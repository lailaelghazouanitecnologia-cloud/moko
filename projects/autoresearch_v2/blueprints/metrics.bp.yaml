## Blueprint — metrics
name: metrics
language: typescript
target_dir: src/metrics
description: ''
constraints:
- Compute standardized metrics from logs
- Register and retrieve metrics
- Type-safe metric computation
references: []
types:
- name: MetricsComputer
  kind: class
  status: translated
  target_file: src/metrics/metrics-computer.ts
  description: Computes standardized metrics from training logs and model outputs
  fields:
  - name: registry
    type: MetricRegistry
  methods:
  - name: computeAccuracy
    sig: '(predictions: number[], labels: number[]): number'
    hint: count correct / total
  - name: computePrecision
    sig: '(predictions: number[], labels: number[], classId: number): number'
    hint: TP / (TP + FP)
  - name: computeRecall
    sig: '(predictions: number[], labels: number[], classId: number): number'
    hint: TP / (TP + FN)
  - name: computeF1Score
    sig: '(precision: number, recall: number): number'
    hint: harmonic mean
  - name: computeConfusionMatrix
    sig: '(predictions: number[], labels: number[]): number[][]'
    hint: build NxN matrix
  - name: computeLoss
    sig: '(predictions: number[], labels: number[]): number'
- name: MetricRegistry
  kind: class
  status: translated
  target_file: src/metrics/metric-registry.ts
