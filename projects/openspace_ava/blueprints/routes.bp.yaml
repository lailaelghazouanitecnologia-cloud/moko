types:
- name: Router
  kind: class
  status: translated
  target_file: src/routes/router.ts
  description: HTTP request router
  fields:
  - name: routes
    type: Map<string, RouteHandler>
  - name: middlewares
    type: 'Array<(req: any, res: any, next: any) => void>'
  methods:
  - name: get
    sig: '(path: string, handler: RouteHandler): void'
    hint: register GET route
  - name: post
    sig: '(path: string, handler: RouteHandler): void'
    hint: register POST route
  - name: put
    sig: '(path: string, handler: RouteHandler): void'
    hint: register PUT route
  - name: delete
    sig: '(path: string, handler: RouteHandler): void'
    hint: register DELETE route
  - name: use
    sig: '(middleware: (req: any, res: any, next: any) => void): void'
    hint: add middleware
  - name: resolve
    sig: '(method: string, url: string): RouteHandler | null'
    hint: find handler
  - name: dispatch
    sig: '(req: any, res: any): Promise<void>'
    hint: execute handler
- name: RouteHandler
  kind: interface
  status: translated
  target_file: src/routes/route-handler.ts
  description: Handles HTTP route processing
  fields:
  - name: path
    type: string
  - name: method
    type: string
  - name: middleware
    type: Array<Function>
  methods:
  - name: handle
    sig: '(req: Request, res: Response): Promise<void>'
    hint: Process incoming request
  - name: validate
    sig: '(req: Request): boolean'
    hint: Check request validity
  - name: parseParams
    sig: '(req: Request): Record<string, string>'
    hint: Extract route parameters
  - name: setMiddleware
    sig: '(fn: Function): void'
    hint: Add middleware function
  - name: getPath
    sig: '(): string'
    hint: Return route path
- name: ResponseBuilder
  kind: class
  status: translated
  target_file: src/routes/response-builder.ts
  description: Fluent HTTP response builder
  fields:
  - name: statusCode
    type: number
  - name: headers
    type: Map<string, string>
  - name: body
    type: any
  methods:
  - name: status
    sig: '(code: number): ResponseBuilder'
    hint: set status code
  - name: header
    sig: '(key: string, value: string): ResponseBuilder'
    hint: add header
  - name: json
    sig: '(data: any): ResponseBuilder'
    hint: send json body
  - name: text
    sig: '(text: string): ResponseBuilder'
    hint: send text body
  - name: redirect
    sig: '(url: string): ResponseBuilder'
    hint: redirect response
  - name: cookie
    sig: '(name: string, value: string, options?: any): ResponseBuilder'
    hint: set cookie
  - name: build
    sig: '(): any'
    hint: finalize response
