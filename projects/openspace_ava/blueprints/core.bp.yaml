types:
- name: AppConfig
  kind: class
  status: translated
  target_file: src/core/app-config.ts
  description: Central configuration container
  fields:
  - name: apiBaseUrl
    type: string
  - name: apiKey
    type: string
  - name: timeout
    type: number
  - name: retries
    type: number
  - name: enableLogging
    type: boolean
  methods:
  - name: loadFromFile
    sig: '(path: string): AppConfig'
    hint: load config file
  - name: validate
    sig: '(): boolean'
    hint: check required fields
  - name: toJSON
    sig: '(): string'
    hint: serialize config
  - name: merge
    sig: '(partial: Partial<AppConfig>): AppConfig'
    hint: merge partial config
  - name: clone
    sig: '(): AppConfig'
    hint: deep copy instance
- name: ApiError
  kind: class
  status: translated
  target_file: src/core/api-error.ts
  description: Standardized API error representation
  fields:
  - name: code
    type: string
  - name: message
    type: string
  - name: status
    type: number
  - name: details
    type: Record<string, any>
  methods:
  - name: constructor
    sig: '(code: string, message: string, status?: number, details?: Record<string, any>)'
    hint: create error instance
  - name: toJSON
    sig: '(): { code: string; message: string; status: number; details: Record<string, any> }'
    hint: serialize to JSON
  - name: toString
    sig: '(): string'
    hint: string representation
  - name: isClientError
    sig: '(): boolean'
    hint: check 4xx status
  - name: isServerError
    sig: '(): boolean'
    hint: check 5xx status
  - name: getDetail
    sig: '(key: string): any'
    hint: retrieve detail value
- name: Middleware
  kind: interface
  status: translated
  target_file: src/core/middleware.ts
  description: Request/response processing pipeline
  fields:
  - name: name
    type: string
  - name: priority
    type: number
  methods:
  - name: process
    sig: '(context: any, next: () => Promise<void>): Promise<void>'
    hint: Execute middleware logic
  - name: before
    sig: '(context: any): Promise<void>'
    hint: Pre-process hook
  - name: after
    sig: '(context: any): Promise<void>'
    hint: Post-process hook
  - name: onError
    sig: '(error: ApiError, context: any): Promise<void>'
    hint: Handle errors
  - name: supports
    sig: '(context: any): boolean'
    hint: Check applicability
