types:
- name: ResearchPlanner
  kind: class
  status: translated
  target_file: src/reasoning/research-planner.ts
  description: Plans research steps and orchestrates evidence gathering
  fields:
  - name: hypotheses
    type: HypothesisEvaluator[]
  - name: evidencePool
    type: EvidenceRanker[]
  - name: currentStep
    type: number
  - name: completedSteps
    type: string[]
  methods:
  - name: planResearch
    sig: '(topic: string): string[]'
    hint: generate step sequence
  - name: addHypothesis
    sig: '(evaluator: HypothesisEvaluator): void'
    hint: register evaluator
  - name: addEvidenceRanker
    sig: '(ranker: EvidenceRanker): void'
    hint: register ranker
  - name: executeStep
    sig: '(stepIndex: number): boolean'
    hint: run single step
  - name: advanceStep
    sig: '(): boolean'
    hint: move to next
  - name: getRemainingSteps
    sig: '(): string[]'
    hint: list remaining
  - name: resetPlan
    sig: '(): void'
    hint: clear progress
  - name: validatePlan
    sig: '(): boolean'
    hint: check completeness
- name: HypothesisEvaluator
  kind: class
  status: translated
  target_file: src/reasoning/hypothesis-evaluator.ts
  description: Evaluates and scores research hypotheses
  fields:
  - name: scoringWeights
    type: Record<string, number>
  - name: evidenceThreshold
    type: number
  - name: evaluationHistory
    type: Array<EvaluationResult>
  methods:
  - name: evaluate
    sig: '(hypothesis: Hypothesis, evidence: Evidence[]): Evaluation'
    hint: score single hypothesis
  - name: scorePlausibility
    sig: '(hypothesis: Hypothesis): number'
    hint: compute plausibility score
  - name: validateEvidence
    sig: '(evidence: Evidence): boolean'
    hint: check evidence validity
  - name: rankHypotheses
    sig: '(hypotheses: Hypothesis[]): RankedHypothesis[]'
    hint: order by score
  - name: mergeEvaluations
    sig: '(evaluations: Evaluation[]): Evaluation'
    hint: combine multiple scores
  - name: getConfidence
    sig: '(evaluation: Evaluation): number'
    hint: extract confidence value
  - name: updateWeights
    sig: '(weights: Record<string, number>): void'
    hint: adjust scoring weights
  - name: resetHistory
    sig: '(): void'
    hint: clear evaluation log
- name: EvidenceRanker
  kind: class
  status: translated
  target_file: src/reasoning/evidence-ranker.ts
  description: Ranks evidence by relevance and reliability
  fields:
  - name: evidencePool
    type: EvidenceItem[]
  - name: rankingStrategy
    type: RankingStrategy
  - name: reliabilityWeights
    type: Map<string, number>
  methods:
  - name: addEvidence
    sig: '(item: EvidenceItem): void'
    hint: add evidence item
  - name: rankAll
    sig: '(): RankedEvidence[]'
    hint: rank all evidence
  - name: scoreRelevance
    sig: '(item: EvidenceItem): number'
    hint: compute relevance score
  - name: scoreReliability
    sig: '(item: EvidenceItem): number'
    hint: compute reliability score
  - name: applyWeights
    sig: '(scores: number[]): number'
    hint: apply weighting model
  - name: topK
    sig: '(k: number): RankedEvidence[]'
    hint: get top k items
  - name: sortByScore
    sig: '(items: RankedEvidence[]): RankedEvidence[]'
    hint: descending sort
  - name: filterByThreshold
    sig: '(threshold: number): RankedEvidence[]'
    hint: filter low scores
