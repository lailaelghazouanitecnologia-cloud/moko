## Blueprint — evaluator
name: evaluator
language: typescript
target_dir: src/evaluator
description: ''
constraints:
- Compute standardized metrics from experiment outputs
- Support multiple metric types (accuracy, F1, etc)
- Parse structured and unstructured results
references: []
types:
- name: MetricComputer
  kind: class
  status: translated
  target_file: src/evaluator/metric-computer.ts
  description: Computes standardized metrics from raw predictions and labels
  fields:
  - name: metricType
    type: string
  - name: threshold
    type: number
  - name: classWeights
    type: Map<string, number>
  methods:
  - name: computeAccuracy
    sig: '(predictions: number[], labels: number[]): number'
    hint: count correct/ total
  - name: computePrecision
    hint: TP / (TP + FP)
  - name: computeRecall
    hint: TP / (TP + FN)
  - name: computeF1
    sig: '(precision: number, recall: number): number'
    hint: harmonic mean
  - name: computeAUC
    sig: '(scores: number[], labels: number[]): number'
    hint: area under curve
  - name: computeMSE
    sig: '(predictions: number[], targets: number[]): number'
    hint: mean squared error
  - name: computeMAE
    sig: '(predictions: number[], targets: number[]): number'
  - name: computeConfusionMatrix
    sig: '(predictions: number[], labels: number[]): number[][]'
    hint: build 2x2 matrix
  - name: computePerClassMetrics
    sig: '(predictions: number[], labels: number[]): Map<string, number>'
    hint: metrics per class
  - name: aggregateMetrics
    sig: '(metrics: Map<string, number[]>): Map<string, number>'
    hint: mean/std per metric
  static:
  - name: SUPPORTED_METRICS
  - name: create
    sig: '(metricType: string): MetricComputer'
    hint: factory method
- name: ResultParser
  kind: class
  status: translated
  target_file: src/evaluator/result-parser.ts
  extends: BaseParser
  description: Parses raw experiment outputs into structured format
  fields:
  - name: format
    type: string
  - name: schema
    type: object
  - name: validationRules
    type: ValidationRule[]
  methods:
  - name: parseJSON
    sig: '(data: string): ParsedResult'
    hint: parse JSON output
  - name: parseCSV
    sig: '(data: string): ParsedResult'
    hint: parse CSV output
  - name: parseXML
    sig: '(data: string): ParsedResult'
  - name: parseLog
    sig: '(data: string): ParsedResult'
    hint: parse log files
  - name: extractPredictions
    sig: '(data: ParsedResult): number[]'
    hint: extract prediction array
  - name: extractLabels
    sig: '(data: ParsedResult): number[]'
    hint: extract label array
  - name: extractScores
    sig: '(data: ParsedResult): number[]'
    hint: extract scores array
  - name: validateFormat
    sig: '(data: string): boolean'
    hint: check format validity
  - name: convertFormat
    sig: '(data: string, targetFormat: string): string'
    hint: convert between formats
  - name: mergeResults
    sig: '(results: ParsedResult[]): ParsedResult'
    hint: merge multiple results
  static:
  - name: detectFormat
    sig: '(data: string): string'
    hint: auto-detect format
- name: ScoreAggregator
  kind: class
  status: translated
  target_file: src/evaluator/score-aggregator.ts
  description: Aggregates scores across multiple runs and experiments
  fields:
  - name: aggregationMethod
    type: string
  - name: weightingScheme
    type: string
  - name: outlierHandling
    type: string
  methods:
  - name: aggregate
    sig: '(scores: number[]): number'
    hint: apply aggregation method
  - name: aggregateWeighted
    sig: '(scores: number[], weights: number[]): number'
    hint: weighted aggregation
  - name: aggregateByGroup
    sig: '(groups: Map<string, number[]>): Map<string, number>'
    hint: group by key
  - name: computeStatistics
    sig: '(scores: number[]): Statistics'
    hint: mean, std, min, max
  - name: handleOutliers
    sig: '(scores: number[]): number[]'
    hint: remove outliers
  - name: mergeAggregations
    sig: '(agg1: Aggregation, agg2: Aggregation): Aggregation'
    hint: merge two results
  - name: getConfidenceInterval
    sig: '(scores: number[], confidence: number): Range'
    hint: compute CI
  - name: aggregateOverTime
    sig: '(timeSeries: TimeSeriesPoint[]): TimeSeriesPoint'
    hint: time window aggregation
  - name: aggregateCrossValidation
    sig: '(folds: number[]): number'
    hint: CV score aggregation
  - name: aggregateEnsemble
    sig: '(modelScores: Map<string, number>): number'
    hint: ensemble voting
  static:
  - name: METHODS
  - name: create
    sig: '(method: string): ScoreAggregator'
    hint: factory method
- name: ValidationRule
  kind: interface
  status: translated
  target_file: src/evaluator/validation-rule.ts
  description: Defines validation rules for data parsing
  methods:
  - name: validate
    sig: '(data: any): boolean'
  - name: getErrorMessage
    sig: '(): string'
- name: ParsedResult
  kind: interface
  status: translated
  target_file: src/evaluator/parsed-result.ts
  fields:
  - name: data
    type: any
  - name: format
    type: string
  - name: metadata
    type: object
- name: Statistics
  kind: interface
  status: translated
  target_file: src/evaluator/statistics.ts
  fields:
  - name: mean
    type: number
  - name: std
    type: number
  - name: min
    type: number
  - name: max
    type: number
  - name: median
    type: number
- name: Aggregation
  kind: interface
  status: translated
  target_file: src/evaluator/aggregation.ts
  fields:
  - name: value
    type: number
  - name: method
    type: string
  - name: metadata
    type: object
- name: TimeSeriesPoint
  kind: interface
  status: translated
  target_file: src/evaluator/time-series-point.ts
  fields:
  - name: timestamp
    type: Date
  - name: value
    type: number
- name: Range
  kind: interface
  status: translated
  target_file: src/evaluator/range.ts
  fields:
  - name: lower
    type: number
  - name: upper
    type: number
