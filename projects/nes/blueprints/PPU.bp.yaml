## Blueprint — PPU
name: PPU
language: typescript
target_dir: src/PPU
description: ''
constraints:
- Must accurately emulate NES PPU behavior
- Support all NES rendering modes and features
- Handle sprite/background priority correctly
- Implement proper NTSC timing
- 'CONTRACT: PictureProcessingUnit.backgroundRenderer is BackgroundRenderer — use its API: reset(): void, fetchNameTable(vramAddr:
  number): void, fetchAttribute(vramAddr: number): void, fetchPatternLow(fineY: number): void'
- 'CONTRACT: PictureProcessingUnit.paletteTable is PaletteTable — use its API: read(address: number): number, write(address:
  number, value: number): void, getColor(index: number): number, getEmphasizedColor(color: number): number'
- 'CONTRACT: PictureProcessingUnit.spriteRenderer is SpriteRenderer — use its API: reset(): void, evaluate(scanline: number):
  void, fetchPattern(index: number, row: number): number, getPixel(x: number, y: number): {index: number, priority: number,
  palette: number}'
references:
- nes/ppu/ppu.yaml
types:
- name: PictureProcessingUnit
  kind: class
  status: translated
  target_file: src/PPU/picture-processing-unit.ts
  description: Main PPU controller handling rendering pipeline
  fields:
  - name: ctrl
    type: number
    default: '0'
  - name: mask
    type: number
    default: '0'
  - name: status
    type: number
    default: '0'
  - name: oamAddr
    type: number
    default: '0'
  - name: scroll
    type: number
    default: '0'
  - name: addr
    type: number
    default: '0'
  - name: data
    type: number
    default: '0'
  - name: vramAddr
    type: number
    default: '0'
  - name: tempAddr
    type: number
    default: '0'
  - name: fineX
    type: number
    default: '0'
  - name: writeToggle
    type: boolean
    default: 'False'
  - name: scanline
    type: number
    default: '0'
  - name: cycle
    type: number
    default: '0'
  - name: frame
    type: number
    default: '0'
  - name: vramReadBuffer
    type: number
    default: '0'
  - name: spriteRenderer
    type: SpriteRenderer
  - name: backgroundRenderer
    type: BackgroundRenderer
  - name: paletteTable
    type: PaletteTable
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset all registers and counters
  - name: step
    sig: '(): void'
    hint: Execute one PPU cycle
  - name: readRegister
    sig: '(address: number): number'
    hint: Read from PPU register
  - name: writeRegister
    sig: '(address: number, value: number): void'
    hint: Write to PPU register
  - name: readVRAM
    sig: '(address: number): number'
    hint: Read from VRAM with mirroring
  - name: writeVRAM
    sig: '(address: number, value: number): void'
    hint: Write to VRAM with mirroring
  - name: readOAM
    sig: '(address: number): number'
    hint: Read from OAM memory
  - name: writeOAM
    sig: '(address: number, value: number): void'
    hint: Write to OAM memory
  - name: renderPixel
    sig: '(): void'
    hint: Render single pixel to framebuffer
  - name: fetchTile
    sig: '(): void'
    hint: Fetch background tile data
  - name: evaluateSprites
    sig: '(): void'
    hint: Evaluate sprites for current scanline
  - name: incrementVRAM
    sig: '(): void'
    hint: Increment VRAM address
  - name: updateVerticalScroll
    sig: '(): void'
    hint: Update vertical scroll bits
  - name: updateHorizontalScroll
    sig: '(): void'
    hint: Update horizontal scroll bits
  - name: copyHorizontal
    sig: '(): void'
    hint: Copy horizontal bits from temp
  - name: copyVertical
    sig: '(): void'
    hint: Copy vertical bits from temp
  - name: triggerNMI
    sig: '(): void'
    hint: Generate NMI interrupt
  - name: isRendering
    sig: '(): boolean'
    hint: Check if PPU is rendering
  - name: getMirroringType
    sig: '(): number'
    hint: Get cartridge mirroring type
  references:
  - NES/PPU/descriptor.yaml
- name: SpriteRenderer
  kind: class
  status: pending
  target_file: src/PPU/sprite-renderer.ts
  description: Handles sprite evaluation and rendering
  fields:
  - name: oamData
    type: Uint8Array
    default: new Uint8Array(256)
  - name: secondaryOAM
    type: Uint8Array
    default: new Uint8Array(32)
  - name: spriteCount
    type: number
    default: '0'
  - name: spriteHeight
    type: number
    default: '8'
  - name: spriteOverflow
    type: boolean
    default: 'False'
  methods:
  - name: reset
    sig: '(): void'
    hint: Clear OAM and counters
  - name: evaluate
    sig: '(scanline: number): void'
    hint: Find sprites on scanline
  - name: fetchPattern
    sig: '(index: number, row: number): number'
    hint: Get sprite pattern data
  - name: getPixel
    sig: '(x: number, y: number): {index: number, priority: number, palette: number}'
    hint: Get sprite pixel at coords
  - name: checkOverflow
    sig: '(): boolean'
    hint: Test sprite overflow flag
  - name: setSpriteSize
    sig: '(size: number): void'
    hint: Set 8x8 or 8x16 mode
  - name: readOAM
    sig: '(address: number): number'
    hint: Read from OAM
  - name: writeOAM
    sig: '(address: number, value: number): void'
    hint: Write to OAM
  - name: clearSecondary
    sig: '(): void'
    hint: Clear secondary OAM
  - name: loadSprites
    sig: '(): void'
    hint: Load sprites into secondary OAM
  - name: getSpriteData
    sig: '(index: number): {y: number, tile: number, attr: number, x: number}'
    hint: Get sprite attributes
  - name: isSpriteZero
    sig: '(index: number): boolean'
    hint: Check if sprite is zero
  - name: hasSpriteZeroHit
    sig: '(x: number): boolean'
    hint: Test sprite zero hit
  - name: getPriority
    sig: '(index: number): number'
    hint: Get sprite priority bit
  - name: getPalette
    sig: '(index: number): number'
    hint: Get sprite palette index
  references:
  - NES/PPU/descriptor.yaml
- name: BackgroundRenderer
  kind: class
  status: pending
  target_file: src/PPU/background-renderer.ts
  description: Handles background tile rendering
  fields:
  - name: nameTable
    type: number
    default: '0'
  - name: patternTable
    type: number
    default: '0'
  - name: tileIndex
    type: number
    default: '0'
  - name: tileAttribute
    type: number
    default: '0'
  - name: tileLsb
    type: number
    default: '0'
  - name: tileMsb
    type: number
    default: '0'
  - name: shiftLow
    type: number
    default: '0'
  - name: shiftHigh
    type: number
    default: '0'
  - name: shiftAttrLow
    type: number
    default: '0'
  - name: shiftAttrHigh
    type: number
    default: '0'
  methods:
  - name: reset
    sig: '(): void'
    hint: Clear shift registers
  - name: fetchNameTable
    sig: '(vramAddr: number): void'
    hint: Get name table byte
  - name: fetchAttribute
    sig: '(vramAddr: number): void'
    hint: Get attribute table byte
  - name: fetchPatternLow
    sig: '(fineY: number): void'
    hint: Get pattern low byte
  - name: fetchPatternHigh
    sig: '(fineY: number): void'
    hint: Get pattern high byte
  - name: getPixel
    sig: '(fineX: number): {index: number, palette: number}'
    hint: Get background pixel
  - name: updateShifters
    sig: '(): void'
    hint: Shift registers left
  - name: reloadShifters
    sig: '(): void'
    hint: Load new tile data
  - name: getAttribute
    sig: '(tileX: number, tileY: number): number'
    hint: Get attribute nibble
  - name: getPatternAddress
    sig: '(table: number, tile: number, fineY: number, low: boolean): number'
    hint: Calculate pattern address
  - name: getNameTableAddress
    sig: '(vramAddr: number): number'
    hint: Calculate name table address
  - name: getAttributeAddress
    sig: '(vramAddr: number): number'
    hint: Calculate attribute address
  - name: isLeftEdge
    sig: '(x: number): boolean'
    hint: Check if left edge
  - name: clipLeft
    sig: '(mask: number): boolean'
    hint: Check left edge clipping
  references:
  - NES/PPU/descriptor.yaml
- name: PaletteTable
  kind: class
  status: translated
  target_file: src/PPU/palette-table.ts
  description: Manages color palette and indices
  fields:
  - name: paletteRAM
    type: Uint8Array
    default: new Uint8Array(32)
  - name: emphasis
    type: number
    default: '0'
  methods:
  - name: read
    sig: '(address: number): number'
    hint: Read palette entry
  - name: write
    sig: '(address: number, value: number): void'
    hint: Write palette entry
  - name: getColor
    sig: '(index: number): number'
    hint: Get RGB color value
  - name: getEmphasizedColor
    sig: '(color: number): number'
    hint: Apply emphasis bits
  - name: isSpritePalette
    sig: '(address: number): boolean'
    hint: Check if sprite palette
  - name: mirrorAddress
    sig: '(address: number): number'
    hint: Mirror palette address
  - name: loadNTSC
    sig: '(): void'
    hint: Load NTSC palette
  - name: loadPAL
    sig: '(): void'
    hint: Load PAL palette
  - name: setEmphasis
    sig: '(emphasis: number): void'
    hint: Set emphasis bits
  - name: getUniversal
    sig: '(): number'
    hint: Get universal color
  - name: getBackground
    sig: '(index: number): number'
    hint: Get background color
  - name: getSprite
    sig: '(index: number): number'
    hint: Get sprite color
  - name: isGrayscale
    sig: '(mask: number): boolean'
    hint: Check grayscale mode
  - name: applyGrayscale
    sig: '(color: number): number'
    hint: Apply grayscale mask
  references:
  - NES/PPU/descriptor.yaml
