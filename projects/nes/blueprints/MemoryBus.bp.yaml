## Blueprint — MemoryBus
name: MemoryBus
language: typescript
target_dir: src/MemoryBus
description: ''
constraints:
- Must handle 16-bit addressing (0x0000-0xFFFF)
- Support memory mapping and bank switching
- Provide cycle-accurate memory access timing
- Handle PPU/OAM/DMA transfers efficiently
references:
- nes/memory/bus.yaml
types:
- name: MemoryMapper
  kind: interface
  status: pending
  target_file: src/MemoryBus/memory-mapper.ts
  description: Abstract interface for memory mapping strategies
  methods:
  - name: mapRead
    sig: '(address: number): number'
    hint: Map logical to physical address for reads
  - name: mapWrite
    sig: '(address: number): number'
    hint: Map logical to physical address for writes
  - name: getReadDevice
    sig: '(address: number): MemoryDevice'
    hint: Get device responsible for read address
  - name: getWriteDevice
    sig: '(address: number): MemoryDevice'
    hint: Get device responsible for write address
  - name: onReset
    sig: '(): void'
    hint: Reset mapping state
  - name: onBankSwitch
    sig: '(bank: number, value: number): void'
    hint: Handle bank switch requests
  references:
  - src/MemoryBus/roska.yaml
- name: CartridgeInterface
  kind: interface
  status: translated
  target_file: src/MemoryBus/cartridge-interface.ts
  description: Interface for cartridge with PRG/CHR ROM/RAM
  fields:
  - name: prgROM
    type: Uint8Array
  - name: prgRAM
    type: Uint8Array
  - name: chrROM
    type: Uint8Array
  - name: chrRAM
    type: Uint8Array
  - name: mapperId
    type: number
  - name: hasBattery
    type: boolean
  methods:
  - name: readPRG
    sig: '(address: number): number'
    hint: Read from PRG ROM/RAM
  - name: writePRG
    sig: '(address: number, value: number): void'
    hint: Write to PRG ROM/RAM
  - name: readCHR
    sig: '(address: number): number'
    hint: Read from CHR ROM/RAM
  - name: writeCHR
    sig: '(address: number, value: number): void'
    hint: Write to CHR ROM/RAM
  - name: getNameTableMirroring
    sig: '(): MirroringMode'
    hint: Get name table mirroring type
  - name: saveBattery
    sig: '(): Uint8Array'
    hint: Save battery-backed RAM
  - name: loadBattery
    sig: '(data: Uint8Array): void'
    hint: Load battery-backed RAM
  - name: onScanline
    sig: '(scanline: number): void'
    hint: Notify mapper of scanline
  - name: onPPURead
    sig: '(address: number): void'
    hint: Notify mapper of PPU read
  - name: onPPUWrite
    sig: '(address: number): void'
    hint: Notify mapper of PPU write
  references:
  - src/MemoryBus/roska.yaml
- name: Ram8K
  kind: class
  status: pending
  target_file: src/MemoryBus/ram8-k.ts
  description: 8KB of system RAM (0x0000-0x1FFF mirrored)
  fields:
  - name: ram
    type: Uint8Array
    default: new Uint8Array(0x2000)
  methods:
  - name: read
    sig: '(address: number): number'
    hint: Read with 0x7FF mirroring
  - name: write
    sig: '(address: number, value: number): void'
    hint: Write with 0x7FF mirroring
  - name: reset
    sig: '(): void'
    hint: Clear all RAM to 0
  - name: loadState
    sig: '(state: Uint8Array): void'
    hint: Restore RAM state
  - name: saveState
    sig: '(): Uint8Array'
    hint: Save RAM state
  references:
  - src/MemoryBus/roska.yaml
- name: IoRegisters
