## Blueprint — cpu
name: cpu
language: typescript
target_dir: src/cpu
description: ''
constraints:
- 6502 processor only
- little-endian byte order
- decimal mode optional
references:
- nes/cpu/cpu.yaml
types:
- name: CPU6502
  kind: class
  status: translated
  target_file: src/cpu/cpu6502.ts
  description: 6502 processor core with fetch-decode-execute cycle
  fields:
  - name: registers
    type: Registers
    default: new Registers()
  - name: memory
    type: MemoryBus
    default: 'null'
  - name: cycles
    type: number
    default: '0'
  - name: totalCycles
    type: number
    default: '0'
  - name: stalled
    type: number
    default: '0'
  methods:
  - name: reset
    sig: '(): void'
    hint: set PC to RESET vector
  - name: irq
    sig: '(): void'
    hint: trigger maskable interrupt
  - name: nmi
    sig: '(): void'
    hint: trigger non-maskable interrupt
  - name: step
    sig: '(): number'
    hint: execute one instruction
  - name: fetch
    sig: '(): number'
    hint: read byte at PC++
  - name: fetch16
    sig: '(): number'
    hint: read little-endian word
  - name: push
    sig: '(value: number): void'
    hint: stack push byte
  - name: pull
    sig: '(): number'
    hint: stack pull byte
  - name: push16
    sig: '(value: number): void'
    hint: stack push word
  - name: pull16
    sig: '(): number'
    hint: stack pull word
  - name: setFlags
    sig: '(value: number): void'
    hint: update NZ flags
  - name: setZN
    sig: '(value: number): void'
    hint: set Z and N from value
  - name: pageCrossed
    sig: '(a: number, b: number): boolean'
    hint: check hi byte differs
  - name: branch
    sig: '(offset: number): void'
    hint: add signed offset to PC
  - name: compare
    sig: '(a: number, b: number): void'
    hint: set CZN from a-b
  - name: adc
    sig: '(operand: number): number'
    hint: add with carry
  - name: sbc
    sig: '(operand: number): number'
    hint: subtract with carry
  - name: asl
    sig: '(value: number): number'
    hint: arithmetic shift left
  - name: lsr
    sig: '(value: number): number'
    hint: logical shift right
  - name: rol
    sig: '(value: number): number'
    hint: rotate left through carry
  - name: ror
    sig: '(value: number): number'
    hint: rotate right through carry
  - name: bit
    sig: '(value: number): void'
    hint: bit test against A
  - name: load
    sig: '(addr: number): number'
    hint: read memory byte
  - name: store
    sig: '(addr: number, value: number): void'
    hint: write memory byte
  references:
  - src/cpu/cpu6502.yaml
- name: Instruction
  kind: class
  status: pending
  target_file: src/cpu/instruction.ts
  description: 6502 instruction metadata
  fields:
  - name: name
    type: string
    default: ???
  - name: operation
    type: Operation
    default: 'null'
  - name: mode
    type: AddressingMode
    default: 'null'
  - name: cycles
    type: number
    default: '0'
  - name: pageCycles
    type: number
    default: '0'
  static:
  - name: TABLE
    hint: 256-entry opcode array
  references:
  - src/cpu/instruction.yaml
- name: AddressingMode
  kind: enum
  status: pending
  target_file: src/cpu/addressing-mode.ts
  description: 6502 addressing modes
  fields:
  - name: IMPLICIT
    default: '0'
  - name: ACCUMULATOR
    default: '1'
  - name: IMMEDIATE
    default: '2'
  - name: ZERO_PAGE
    default: '3'
  - name: ZERO_PAGE_X
    default: '4'
  - name: ZERO_PAGE_Y
    default: '5'
  - name: ABSOLUTE
    default: '6'
  - name: ABSOLUTE_X
    default: '7'
  - name: ABSOLUTE_Y
    default: '8'
  - name: RELATIVE
    default: '9'
  - name: INDIRECT
    default: '10'
  - name: INDIRECT_X
    default: '11'
  - name: INDIRECT_Y
    default: '12'
  references:
  - src/cpu/addressing_mode.yaml
- name: Registers
  kind: class
  status: pending
  target_file: src/cpu/registers.ts
  description: 6502 register set
  fields:
  - name: a
    type: number
    default: '0'
  - name: x
    type: number
    default: '0'
  - name: y
    type: number
    default: '0'
  - name: sp
    type: number
    default: '253'
  - name: pc
    type: number
    default: '0'
  - name: p
    type: Flags
    default: new Flags()
  methods:
  - name: getStatus
    sig: '(): number'
    hint: pack flags to byte
  - name: setStatus
    sig: '(value: number): void'
    hint: unpack byte to flags
  - name: clone
    sig: '(): Registers'
    hint: deep copy
  references:
  - src/cpu/registers.yaml
- name: Flags
  kind: class
  status: translated
  target_file: src/cpu/flags.ts
  description: 6502 status register flags
  fields:
  - name: c
    type: boolean
    default: 'False'
  - name: z
    type: boolean
    default: 'False'
  - name: i
    type: boolean
    default: 'False'
  - name: d
    type: boolean
    default: 'False'
  - name: b
    type: boolean
    default: 'False'
  - name: u
    type: boolean
    default: 'False'
  - name: v
    type: boolean
    default: 'False'
  - name: n
    type: boolean
    default: 'False'
  methods:
  - name: toByte
    sig: '(): number'
    hint: bitmask to byte
  - name: fromByte
    sig: '(value: number): void'
    hint: byte to bitmask
  - name: set
    sig: '(mask: number, on: boolean): void'
    hint: toggle bit mask
  static:
  - name: C
    hint: 0x01 carry
  - name: Z
    hint: 0x02 zero
  - name: I
    hint: 0x04 interrupt disable
  - name: D
    hint: 0x08 decimal
  - name: B
    hint: 0x10 break
  - name: U
    hint: 0x20 unused
  - name: V
    hint: 0x40 overflow
  - name: N
    hint: 0x80 negative
  references:
  - src/cpu/flags.yaml
