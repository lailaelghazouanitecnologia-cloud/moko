## Blueprint — input
name: input
language: typescript
target_dir: src/input
description: ''
constraints:
- 'NES controller has 8 buttons: A, B, Select, Start, Up, Down, Left, Right'
- Controllers connect via memory-mapped registers at 0x4016 and 0x4017
- Controller state is read serially, one bit at a time
- Input polling happens once per frame
- Support for up to 4 controllers (standard NES supports 2)
references:
- nes/input/input.yaml
types:
- name: Button
  kind: enum
  status: translated
  target_file: src/input/button.ts
  description: NES controller button constants
  static:
  - name: A
    hint: '0x80'
  - name: B
    hint: '0x40'
  - name: SELECT
    hint: '0x20'
  - name: START
    hint: '0x10'
  - name: UP
    hint: '0x08'
  - name: DOWN
    hint: '0x04'
  - name: LEFT
    hint: '0x02'
  - name: RIGHT
    hint: '0x01'
  references:
  - src/input/controller.roska
- name: InputState
  kind: class
  status: translated
  target_file: src/input/input-state.ts
  description: Represents the current state of all controller buttons
  fields:
  - name: buttons
    type: number
    default: '0'
  methods:
  - name: isPressed
    sig: '(button: Button): boolean'
    hint: Check if specific button is pressed
  - name: setPressed
    sig: '(button: Button, pressed: boolean): void'
    hint: Set button state
  - name: clear
    sig: '(): void'
    hint: Clear all button states
  - name: copy
    sig: '(): InputState'
    hint: Create deep copy
  references:
  - src/input/controller.roska
- name: Joypad
  kind: class
  status: translated
  target_file: src/input/joypad.ts
  description: Represents a physical NES controller
  fields:
  - name: currentState
    type: InputState
    default: new InputState()
  - name: previousState
    type: InputState
    default: new InputState()
  - name: shiftRegister
    type: number
    default: '0'
  - name: strobe
    type: boolean
    default: 'false'
  methods:
  - name: press
    sig: '(button: Button): void'
    hint: Mark button as pressed
  - name: release
    sig: '(button: Button): void'
    hint: Mark button as released
  - name: update
    sig: '(): void'
    hint: Update previous state
  - name: read
    sig: '(): number'
    hint: Read next bit from shift register
  - name: write
    sig: '(value: number): void'
    hint: Handle strobe write
  - name: isPressed
    sig: '(button: Button): boolean'
    hint: Check current button state
  - name: isJustPressed
    sig: '(button: Button): boolean'
    hint: Check if button just pressed this frame
  - name: isJustReleased
    sig: '(button: Button): boolean'
    hint: Check if button just released this frame
  - name: getAllPressed
    sig: '(): Button[]'
    hint: Return array of pressed buttons
  - name: reset
    sig: '(): void'
    hint: Reset controller state
  references:
  - src/input/controller.roska
- name: Controller
  kind: class
  status: translated
  target_file: src/input/controller.ts
  description: Manages all connected controllers and memory-mapped I/O
  fields:
  - name: joypads
    type: Joypad[]
    default: '[new Joypad(), new Joypad()]'
  - name: joypad1
    type: Joypad
    default: this.joypads[0]
  - name: joypad2
    type: Joypad
    default: this.joypads[1]
  methods:
  - name: cpuRead
    sig: '(address: number): number'
    hint: Read from 0x4016 or 0x4017
  - name: cpuWrite
    sig: '(address: number, value: number): void'
    hint: Write to 0x4016 (strobe)
  - name: connectJoypad
    sig: '(index: number, joypad: Joypad): void'
    hint: Connect controller at index
  - name: disconnectJoypad
    sig: '(index: number): void'
    hint: Disconnect controller
  - name: update
    sig: '(): void'
    hint: Update all controllers
  - name: reset
    sig: '(): void'
    hint: Reset all controllers
  - name: getJoypad
    sig: '(index: number): Joypad'
    hint: Get controller by index
  - name: isConnected
    sig: '(index: number): boolean'
    hint: Check if controller connected
  - name: handleStrobe
    sig: '(value: number): void'
    hint: Handle strobe signal
  - name: saveState
    sig: '(): object'
    hint: Save controller states
  - name: loadState
    sig: '(state: object): void'
    hint: Restore controller states
  references:
  - src/input/controller.roska
