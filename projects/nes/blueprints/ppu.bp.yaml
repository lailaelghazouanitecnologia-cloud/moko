  - name: read
    sig: '(address: number): number'
    hint: Read from PPU register
  - name: write
    sig: '(address: number, value: number): void'
    hint: Write to PPU register
  - name: readRegister
    sig: '(address: number): number'
    hint: Handle register-specific read logic
  - name: writeRegister
    sig: '(address: number, value: number): void'
    hint: Handle register-specific write logic
  - name: step
    sig: '(): void'
    hint: Execute one PPU cycle
  - name: renderPixel
    sig: '(): void'
    hint: Draw pixel at current scanline/cycle
  - name: fetchNameTableByte
    sig: '(): void'
    hint: Get nametable byte for current tile
  - name: fetchAttributeByte
    sig: '(): void'
    hint: Get attribute byte for current tile
  - name: fetchLowTileByte
    sig: '(): void'
    hint: Get low tile byte from pattern table
  - name: fetchHighTileByte
    sig: '(): void'
    hint: Get high tile byte from pattern table
