    sig: '(): number'
    hint: Get background pixel value
  - name: backgroundPalette
    sig: '(): number'
    hint: Get background palette index
  - name: spritePixel
    sig: '(): [number, number]'
    hint: Get sprite pixel and palette
  - name: incrementX
    sig: '(): void'
    hint: Increment coarse X scroll
  - name: incrementY
    sig: '(): void'
    hint: Increment Y scroll
  - name: copyX
    sig: '(): void'
    hint: Copy X scroll from t to v
  - name: copyY
    sig: '(): void'
    hint: Copy Y scroll from t to v
  - name: nmiChange
    sig: '(): void'
    hint: Update NMI output based on flags
  - name: triggerNmi
    sig: '(): void'
    hint: Raise NMI interrupt
