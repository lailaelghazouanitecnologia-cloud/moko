## Blueprint — ppu
name: ppu
language: typescript
target_dir: src/ppu
description: ''
constraints:
- Must interface with CPU6502 via memory bus
- Must generate NTSC video output
- Must handle sprite rendering priority
references:
- nes/ppu/ppu.yaml
