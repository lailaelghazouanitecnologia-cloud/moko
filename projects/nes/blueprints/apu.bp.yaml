## Blueprint — apu
name: apu
language: typescript
target_dir: src/apu
description: ''
constraints:
- Must emulate Ricoh 2A03 APU behavior
- All channels must generate 44.1kHz audio
- Frame sequencer runs at 240Hz or 192Hz
- DMC can trigger CPU interrupts
references:
- nes/apu/apu.yaml
types:
- name: APU2A03
  kind: class
  status: translated
  target_file: src/apu/apu2-a03.ts
  description: Main APU controller for NES audio processing
  fields:
  - name: pulse1
    type: PulseChannel
  - name: pulse2
    type: PulseChannel
  - name: triangle
    type: TriangleChannel
  - name: noise
    type: NoiseChannel
  - name: dmc
    type: DMCChannel
  - name: frameCounter
    type: number
