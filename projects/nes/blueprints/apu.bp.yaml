    type: number
  - name: frameInterrupt
    type: boolean
  - name: cycle
    type: number
  - name: sampleRate
    type: number
  - name: bufferSize
    type: number
  - name: audioBuffer
    type: Float32Array
  methods:
  - name: cpuRead
    sig: '(address: number): number'
    hint: Read APU register at address
  - name: cpuWrite
    sig: '(address: number, data: number): void'
    hint: Write to APU register at address
  - name: step
    sig: '(): void'
    hint: Advance APU by one CPU cycle
  - name: clockFrameCounter
    sig: '(): void'
    hint: Update frame sequencer at 240/192Hz
  - name: generateSample
    sig: '(): number'
    hint: Mix all channels to single sample
  - name: enableChannel
    sig: '(channel: number, enable: boolean): void'
    hint: Enable/disable specific channel
  - name: setFrameCounterMode
    sig: '(mode: number): void'
    hint: Set 4-step or 5-step mode
  - name: getChannelOutput
    sig: '(channel: number): number'
    hint: Get individual channel output level
  - name: reset
    sig: '(): void'
    hint: Reset all APU state
  - name: saveState
    sig: '(): Uint8Array'
    hint: Serialize APU state
  - name: loadState
    sig: '(state: Uint8Array): void'
    hint: Deserialize APU state
  - name: setSampleRate
    sig: '(rate: number): void'
    hint: Configure audio output rate
  - name: getAudioBuffer
    sig: '(): Float32Array'
    hint: Get current audio buffer
  - name: clearAudioBuffer
    sig: '(): void'
    hint: Reset audio buffer pointer
  - name: triggerFrameInterrupt
    sig: '(): void'
    hint: Signal frame counter interrupt
