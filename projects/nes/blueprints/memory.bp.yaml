## Blueprint — memory
name: memory
language: typescript
target_dir: src/memory
description: ''
constraints:
- Must support 6502 memory mapping
- Must handle NES cartridge mappers
- Must provide PPU memory access
references:
- nes/memory/memory.yaml
types:
- name: MemoryBus
  kind: class
  status: translated
  target_file: src/memory/memory-bus.ts
  description: Central memory bus connecting CPU, PPU, and cartridge
  fields:
  - name: cpu
    type: CPU6502
  - name: ppu
    type: PPU2C02
  - name: cartridge
    type: Cartridge
  - name: cpuRam
    type: RAM
  - name: ppuMemory
    type: PPU2C02Memory
  methods:
  - name: cpuRead
    sig: '(address: number): number'
    hint: Map address to device and read
  - name: cpuWrite
    sig: '(address: number, data: number): void'
    hint: Map address to device and write
  - name: ppuRead
    sig: '(address: number): number'
    hint: Read from PPU memory space
  - name: ppuWrite
    sig: '(address: number, data: number): void'
    hint: Write to PPU memory space
  - name: dmaTransfer
    sig: '(page: number): void'
    hint: Transfer 256 bytes to OAM
  - name: getMapper
    sig: '(): Mapper'
    hint: Return cartridge mapper
  - name: reset
    sig: '(): void'
    hint: Reset all memory devices
  - name: saveState
    sig: '(): MemoryState'
    hint: Serialize memory state
  - name: loadState
    sig: '(state: MemoryState): void'
    hint: Restore memory state
  references:
  - src/cpu/cpu6502.ts
  - src/ppu/ppu2c02.ts
- name: Cartridge
  kind: class
  status: translated
  target_file: src/memory/cartridge.ts
  description: NES cartridge containing PRG-ROM and CHR-ROM
  fields:
  - name: prgRom
    type: ROM
  - name: chrRom
    type: ROM
  - name: mapper
    type: Mapper
  - name: mirroring
    type: MirroringType
  - name: battery
    type: boolean
  methods:
  - name: readPrg
    sig: '(address: number): number'
    hint: Read from PRG-ROM via mapper
  - name: writePrg
    sig: '(address: number, data: number): void'
    hint: Write to PRG-ROM via mapper
  - name: readChr
    sig: '(address: number): number'
    hint: Read from CHR-ROM via mapper
  - name: writeChr
    sig: '(address: number, data: number): void'
    hint: Write to CHR-ROM via mapper
  - name: getMapperType
    sig: '(): number'
    hint: Return mapper number
  - name: hasBattery
    sig: '(): boolean'
    hint: Check for battery-backed RAM
  - name: saveSram
    sig: '(): Uint8Array'
    hint: Extract battery-backed RAM
  - name: loadSram
    sig: '(data: Uint8Array): void'
    hint: Load battery-backed RAM
  - name: reset
    sig: '(): void'
    hint: Reset mapper state
  references:
  - src/memory/mapper.ts
- name: Mapper
  kind: interface
  status: translated
  target_file: src/memory/mapper.ts
  description: Base interface for NES cartridge mappers
  methods:
  - name: readPrg
    sig: '(address: number): number'
    hint: Map PRG address to ROM
  - name: writePrg
    sig: '(address: number, data: number): void'
    hint: Handle PRG write with registers
  - name: readChr
    sig: '(address: number): number'
    hint: Map CHR address to ROM
  - name: writeChr
    sig: '(address: number, data: number): void'
    hint: Handle CHR write if RAM
  - name: getMirroring
    sig: '(): MirroringType'
    hint: Return current mirroring
  - name: irqActive
    sig: '(): boolean'
    hint: Check if IRQ triggered
  - name: scanline
    sig: '(): void'
    hint: Notify mapper of scanline
  - name: reset
    sig: '(): void'
    hint: Reset mapper registers
  references:
  - src/memory/cartridge.ts
- name: RAM
  kind: class
  status: translated
  target_file: src/memory/ram.ts
  description: Random Access Memory with read/write capabilities
  fields:
  - name: data
    type: Uint8Array
  - name: size
    type: number
  methods:
  - name: read
    sig: '(address: number): number'
    hint: Read byte from address
  - name: write
    sig: '(address: number, data: number): void'
    hint: Write byte to address
  - name: read16
    sig: '(address: number): number'
    hint: Read 16-bit little-endian
  - name: write16
    sig: '(address: number, data: number): void'
    hint: Write 16-bit little-endian
  - name: fill
    sig: '(value: number): void'
    hint: Fill all memory with value
  - name: copy
    sig: '(): Uint8Array'
    hint: Return copy of data
  - name: load
    sig: '(data: Uint8Array): void'
    hint: Load data array
  - name: getSize
    sig: '(): number'
    hint: Return memory size
  references:
  - src/memory/memory_bus.ts
- name: ROM
  kind: class
  status: translated
  target_file: src/memory/rom.ts
  description: Read-Only Memory that cannot be modified
  fields:
  - name: data
    type: Uint8Array
  - name: size
    type: number
  methods:
  - name: read
    sig: '(address: number): number'
    hint: Read byte from address
  - name: read16
    sig: '(address: number): number'
    hint: Read 16-bit little-endian
  - name: getSize
    sig: '(): number'
    hint: Return ROM size
  - name: getData
    sig: '(): Uint8Array'
    hint: Return readonly data
  - name: slice
    sig: '(start: number, end: number): Uint8Array'
    hint: Return data slice
  references:
  - src/memory/cartridge.ts
