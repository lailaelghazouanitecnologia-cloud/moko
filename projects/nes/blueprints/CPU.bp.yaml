## Blueprint — CPU
name: CPU
language: typescript
target_dir: src/CPU
description: ''
constraints:
- 6502-compatible instruction set
- Little-endian byte order
- Decimal mode not implemented
- 'CONTRACT: Cpu6502.decoder is InstructionDecoder — use its API: decode(opcode: number): Instruction, getAddressingMode(opcode:
  number): AddressingMode, getCycles(opcode: number): number, isBranch(opcode: number): boolean'
- 'CONTRACT: Cpu6502.registers is RegisterFile — use its API: getA(): number, setA(value: number): void, getX(): number, setX(value:
  number): void'
- 'CONTRACT: InstructionDecoder uses AddressingMode [enum] values: IMPLIED, ACCUMULATOR, IMMEDIATE, ZERO_PAGE, ZERO_PAGE_X'
references:
- nes/cpu/cpu.yaml
types:
- name: Cpu6502
  kind: class
  status: translated
  target_file: src/CPU/cpu6502.ts
  description: Main 6502 processor implementation
  fields:
  - name: registers
    type: RegisterFile
  - name: decoder
    type: InstructionDecoder
  - name: memory
    type: MemoryBus
  - name: cycles
    type: number
  - name: interruptFlags
    type: number
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset CPU state to initial values
  - name: step
    sig: '(): number'
    hint: Execute one instruction, return cycles used
  - name: irq
    sig: '(): void'
    hint: Trigger maskable interrupt
  - name: nmi
    sig: '(): void'
    hint: Trigger non-maskable interrupt
  - name: fetch
    sig: '(): number'
    hint: Read next byte from PC
  - name: fetchWord
    sig: '(): number'
    hint: Read next word from PC
  - name: push
    sig: '(value: number): void'
    hint: Push byte to stack
  - name: pull
    sig: '(): number'
    hint: Pull byte from stack
  - name: pushWord
    sig: '(value: number): void'
    hint: Push word to stack
  - name: pullWord
    sig: '(): number'
    hint: Pull word from stack
  - name: setFlags
    sig: '(value: number): void'
    hint: Update NZ flags from value
  - name: setCarry
    sig: '(carry: boolean): void'
    hint: Set carry flag
  - name: setZero
    sig: '(zero: boolean): void'
    hint: Set zero flag
  - name: setInterrupt
    sig: '(disable: boolean): void'
    hint: Set interrupt disable flag
  - name: setDecimal
    sig: '(decimal: boolean): void'
    hint: Set decimal flag (unused)
  - name: setOverflow
    sig: '(overflow: boolean): void'
    hint: Set overflow flag
  - name: setNegative
    sig: '(negative: boolean): void'
    hint: Set negative flag
  - name: getCarry
    sig: '(): boolean'
    hint: Get carry flag
  - name: getZero
    sig: '(): boolean'
    hint: Get zero flag
  - name: adc
    sig: '(operand: number): void'
    hint: Add with carry
  - name: sbc
    sig: '(operand: number): void'
    hint: Subtract with carry
  - name: cmp
    sig: '(register: number, operand: number): void'
    hint: Compare register with operand
  - name: branch
    sig: '(condition: boolean): void'
    hint: Branch if condition true
  - name: jump
    sig: '(address: number): void'
    hint: Jump to address
  - name: read
    sig: '(address: number): number'
    hint: Read from memory
  - name: write
    sig: '(address: number, value: number): void'
    hint: Write to memory
  references:
  - src/CPU/Cpu6502.yaml
