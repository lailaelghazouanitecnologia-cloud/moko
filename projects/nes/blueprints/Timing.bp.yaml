## Blueprint — Timing
name: Timing
language: typescript
target_dir: src/Timing
description: ''
constraints:
- Must synchronize CPU, PPU, APU at cycle level
- Must support NTSC timing (1.789773 MHz CPU, 5.369318 MHz PPU)
- Must handle fractional cycles accurately
- 'CONTRACT: MasterClock.cpuClock is CpuClock — use its API: reset(): void, addCycles(n: number): void, addStall(n: number):
  void, addDma(n: number): void'
- 'CONTRACT: MasterClock.frameSequencer is FrameSequencer — use its API: reset(): void, step(): void, getScanline(): number,
  getDot(): number'
- 'CONTRACT: MasterClock.ppuClock is PpuClock — use its API: reset(): void, step(): void, stepPixel(): void, getPixelX():
  number'
references:
- nes/timing/clock.yaml
types:
- name: MasterClock
  kind: class
  status: translated
  target_file: src/Timing/master-clock.ts
  description: Central timing coordinator for entire NES system
  fields:
  - name: cpuClock
    type: CpuClock
  - name: ppuClock
    type: PpuClock
  - name: frameSequencer
    type: FrameSequencer
  - name: cpuCycles
    type: number
    default: '0'
  - name: ppuCycles
    type: number
    default: '0'
  - name: apuCycles
    type: number
    default: '0'
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset all counters and clocks
  - name: step
    sig: '(): void'
    hint: Advance one master clock cycle
  - name: stepCpu
    sig: '(cycles: number): void'
    hint: Step CPU by given cycles
  - name: stepPpu
    sig: '(): void'
    hint: Step PPU by 4 cycles (1 pixel)
  - name: stepApu
    sig: '(): void'
    hint: Step APU by 1 cycle
  - name: getCpuCycles
    sig: '(): number'
    hint: Return total CPU cycles elapsed
  - name: getPpuCycles
    sig: '(): number'
    hint: Return total PPU cycles elapsed
  - name: getFrameCount
    sig: '(): number'
    hint: Return completed frames count
  - name: isEvenFrame
    sig: '(): boolean'
    hint: Check if current frame is even
  - name: synchronize
    sig: '(): void'
    hint: Align all components to current cycle
  references:
  - src/Timing/descriptor.yaml
- name: FrameSequencer
  kind: class
  status: pending
  target_file: src/Timing/frame-sequencer.ts
  description: Manages frame timing and vertical blanking periods
  fields:
  - name: scanline
    type: number
    default: '0'
  - name: dot
    type: number
    default: '0'
  - name: frame
    type: number
    default: '0'
  - name: isVblank
    type: boolean
    default: 'False'
  - name: isRendering
    type: boolean
    default: 'False'
  - name: oddFrame
    type: boolean
    default: 'False'
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset to top-left of frame 0
  - name: step
    sig: '(): void'
    hint: Advance one PPU dot
  - name: getScanline
    sig: '(): number'
    hint: Return current scanline 0-261
  - name: getDot
    sig: '(): number'
    hint: Return current dot 0-340
  - name: isPreRender
    sig: '(): boolean'
    hint: Check if in pre-render scanline
  - name: isVisible
    sig: '(): boolean'
    hint: Check if in visible scanlines
  - name: isVblankPeriod
    sig: '(): boolean'
    hint: Check if in vertical blank
  - name: isRenderCycle
    sig: '(): boolean'
    hint: Check if rendering enabled this cycle
  - name: triggerVblank
    sig: '(): void'
    hint: Signal start of vblank
  - name: endVblank
    sig: '(): void'
    hint: Signal end of vblank
  - name: getFrameParity
    sig: '(): boolean'
    hint: Return odd/even frame
  - name: shouldSkipCycle
    sig: '(): boolean'
    hint: Check if skip cycle on odd frame
  - name: getCurrentCycle
    sig: '(): number'
    hint: Return absolute cycle count
  references:
  - src/Timing/descriptor.yaml
- name: CpuClock
  kind: class
  status: translated
  target_file: src/Timing/cpu-clock.ts
  description: Manages CPU timing and clock cycles
  fields:
  - name: cycles
    type: number
    default: '0'
  - name: stallCycles
    type: number
    default: '0'
  - name: dmaCycles
    type: number
    default: '0'
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset cycle counters
  - name: addCycles
    sig: '(n: number): void'
    hint: Add CPU cycles
  - name: addStall
    sig: '(n: number): void'
    hint: Add stall cycles
  - name: addDma
    sig: '(n: number): void'
    hint: Add DMA transfer cycles
  - name: getTotal
    sig: '(): number'
    hint: Return total cycles
  - name: getStall
    sig: '(): number'
    hint: Return stall cycles
  - name: getDma
    sig: '(): number'
    hint: Return DMA cycles
  - name: isStalled
    sig: '(): boolean'
    hint: Check if CPU stalled
  - name: step
    sig: '(): void'
    hint: Step by 1 cycle
  references:
  - src/CPU/descriptor.yaml
- name: PpuClock
  kind: class
  status: pending
  target_file: src/Timing/ppu-clock.ts
  description: Manages PPU timing and pixel clock cycles
  fields:
  - name: cycles
    type: number
    default: '0'
  - name: frameCycles
    type: number
    default: '0'
  - name: pixelX
    type: number
    default: '0'
  - name: pixelY
    type: number
    default: '0'
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset PPU timing
  - name: step
    sig: '(): void'
    hint: Step by 1 PPU cycle
  - name: stepPixel
    sig: '(): void'
    hint: Step by 4 cycles (1 pixel)
  - name: getPixelX
    sig: '(): number'
    hint: Return X pixel coordinate
  - name: getPixelY
    sig: '(): number'
    hint: Return Y pixel coordinate
  - name: getFrameCycle
    sig: '(): number'
    hint: Return cycle within frame
  - name: isPixelCycle
    sig: '(): boolean'
    hint: Check if pixel-aligned
  - name: alignToPixel
    sig: '(): void'
    hint: Round to nearest pixel
  references:
  - src/PPU/descriptor.yaml
