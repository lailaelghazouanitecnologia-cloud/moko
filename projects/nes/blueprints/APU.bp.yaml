    type: number
    default: '0'
  - name: envelopeVolume
    type: number
    default: '0'
  - name: envelopeStart
    type: boolean
    default: 'False'
  - name: constantVolume
    type: boolean
    default: 'False'
  - name: timer
    type: number
    default: '0'
  - name: timerPeriod
    type: number
    default: '0'
  - name: duty
    type: number
    default: '0'
  - name: dutyCycle
    type: number
    default: '0'
  - name: sweep
    type: number
    default: '0'
  - name: sweepPeriod
    type: number
    default: '0'
  - name: sweepNegate
    type: boolean
    default: 'False'
  - name: sweepShift
    type: number
