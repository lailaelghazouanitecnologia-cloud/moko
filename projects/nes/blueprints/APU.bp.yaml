## Blueprint — APU
name: APU
language: typescript
target_dir: src/APU
description: ''
constraints:
- Must generate 44.1kHz PCM audio
- Must support all 5 NES audio channels
- Must handle frame sequencer timing
- Must implement sweep, envelope, length counter units
- 'CONTRACT: AudioProcessingUnit.noise is NoiseChannel — use its API: reset(): void, writeControl(value: number): void, writePeriod(value:
  number): void, writeLength(value: number): void'
- 'CONTRACT: AudioProcessingUnit.pulse1 is PulseChannel — use its API: reset(): void, writeControl(value: number): void, writeSweep(value:
  number): void, writeTimerLow(value: number): void'
- 'CONTRACT: AudioProcessingUnit.pulse2 is PulseChannel — use its API: reset(): void, writeControl(value: number): void, writeSweep(value:
  number): void, writeTimerLow(value: number): void'
- 'CONTRACT: AudioProcessingUnit.triangle is TriangleChannel — use its API: reset(): void, writeControl(value: number): void,
  writeTimerLow(value: number): void, writeTimerHigh(value: number): void'
references:
- nes/apu/apu.yaml
types:
- name: AudioProcessingUnit
  kind: class
  status: translated
  target_file: src/APU/audio-processing-unit.ts
  description: Main APU controller managing all audio channels and mixing
  fields:
  - name: pulse1
    type: PulseChannel
    default: new PulseChannel(true)
  - name: pulse2
    type: PulseChannel
    default: new PulseChannel(false)
  - name: triangle
    type: TriangleChannel
    default: new TriangleChannel()
  - name: noise
    type: NoiseChannel
    default: new NoiseChannel()
  - name: frameCounter
    type: number
    default: '0'
  - name: frameCounterMode
    type: number
    default: '0'
  - name: frameInterrupt
    type: boolean
    default: 'False'
  - name: sampleBuffer
    type: Float32Array
    default: new Float32Array(4096)
  - name: sampleIndex
    type: number
    default: '0'
  - name: cycleCounter
    type: number
    default: '0'
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset all channels and counters
  - name: step
    sig: '(cpuCycles: number): void'
    hint: Advance APU by CPU cycles
  - name: readRegister
    sig: '(address: number): number'
    hint: Read from APU registers
  - name: writeRegister
    sig: '(address: number, value: number): void'
    hint: Write to APU registers
  - name: getSample
    sig: '(): number'
    hint: Mix all channels to single sample
  - name: generateSamples
    sig: '(count: number): void'
    hint: Fill sample buffer
  - name: setFrameCounterMode
    sig: '(mode: number): void'
    hint: Set 4-step or 5-step mode
  - name: enableFrameInterrupt
    sig: '(enable: boolean): void'
    hint: Control frame counter IRQ
  - name: getFrameInterrupt
    sig: '(): boolean'
    hint: Check if frame IRQ occurred
  - name: clearFrameInterrupt
    sig: '(): void'
    hint: Clear frame IRQ flag
  - name: clockFrameCounter
    sig: '(): void'
    hint: Clock length counters and sweep units
  - name: clockEnvelopes
    sig: '(): void'
    hint: Clock envelope units on quarter frame
  - name: clockSweepUnits
    sig: '(): void'
    hint: Clock sweep units on half frame
  - name: mixChannels
    sig: '(p1: number, p2: number, t: number, n: number): number'
    hint: Combine channel outputs
  - name: getAudioBuffer
    sig: '(): Float32Array'
    hint: Return filled sample buffer
  references:
  - src/APU/roska_descriptor.yaml
- name: PulseChannel
