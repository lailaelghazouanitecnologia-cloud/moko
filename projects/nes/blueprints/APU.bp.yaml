    default: '0'
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset all channel state
  - name: writeControl
    sig: '(value: number): void'
    hint: Set duty, envelope params
  - name: writeSweep
    sig: '(value: number): void'
    hint: Configure sweep unit
  - name: writeTimerLow
    sig: '(value: number): void'
    hint: Set timer low 8 bits
  - name: writeTimerHigh
    sig: '(value: number): void'
    hint: Set length counter and timer high
  - name: clockTimer
    sig: '(): void'
    hint: Decrement timer, advance sequencer
  - name: clockLengthCounter
    sig: '(): void'
    hint: Decrement length if not halted
  - name: clockEnvelope
    sig: '(): void'
    hint: Clock envelope divider
  - name: clockSweep
    sig: '(): void'
    hint: Clock sweep unit
  - name: getVolume
    sig: '(): number'
    hint: Return current volume
  - name: getOutput
    sig: '(): number'
    hint: Generate audio sample
  - name: setEnabled
    sig: '(enable: boolean): void'
    hint: Enable/disable channel
  - name: isEnabled
    sig: '(): boolean'
    hint: Check if channel active
  - name: updateSweep
    sig: '(): void'
    hint: Calculate sweep target period
  - name: reloadSweep
    sig: '(): void'
    hint: Reload sweep counter
  - name: getDutyValue
    sig: '(): number'
    hint: Get duty cycle output
  - name: getSequencer
    sig: '(): number'
    hint: Return current sequencer position
  references:
  - src/APU/roska_descriptor.yaml
