## Blueprint — Input
name: Input
language: typescript
target_dir: src/Input
description: ''
constraints:
- Handle controller input polling and state
- Support standard NES joypad layout
- Provide interface for CPU to read controller data
- 'CONTRACT: InputPoller.joypad1 is JoypadState — use its API: setButton(button: string, pressed: boolean): void, getButton(button:
  string): boolean, toByte(): number, fromByte(byte: number): void'
- 'CONTRACT: InputPoller.joypad2 is JoypadState — use its API: setButton(button: string, pressed: boolean): void, getButton(button:
  string): boolean, toByte(): number, fromByte(byte: number): void'
references:
- nes/input/controller.yaml
types:
- name: ControllerPort
  kind: interface
  status: pending
  target_file: src/Input/controller-port.ts
  description: Interface for reading controller input state
  methods:
  - name: read
    sig: '(): number'
    hint: Return 8-bit controller state
  - name: write
    sig: '(value: number): void'
    hint: Latch or reset controller state
  - name: isStrobeActive
    sig: '(): boolean'
    hint: Check if strobe bit set
  references:
  - src/Input/controller_port.yaml
- name: JoypadState
  kind: class
  status: translated
  target_file: src/Input/joypad-state.ts
  description: Represents current state of NES joypad buttons
  fields:
  - name: a
    type: boolean
    default: 'False'
  - name: b
    type: boolean
    default: 'False'
  - name: select
    type: boolean
    default: 'False'
  - name: start
    type: boolean
    default: 'False'
  - name: up
    type: boolean
    default: 'False'
  - name: down
    type: boolean
    default: 'False'
  - name: left
    type: boolean
    default: 'False'
  - name: right
    type: boolean
    default: 'False'
  methods:
  - name: setButton
    sig: '(button: string, pressed: boolean): void'
    hint: Update specific button state
  - name: getButton
    sig: '(button: string): boolean'
    hint: Get current button state
  - name: toByte
    sig: '(): number'
    hint: Convert to 8-bit representation
  - name: fromByte
    sig: '(byte: number): void'
    hint: Load from 8-bit value
  - name: reset
    sig: '(): void'
    hint: Clear all button states
  - name: clone
    sig: '(): JoypadState'
    hint: Create deep copy
  references:
  - src/Input/joypad_state.yaml
- name: InputPoller
  kind: class
  status: translated
  target_file: src/Input/input-poller.ts
  description: Polls and manages controller input for CPU access
  fields:
  - name: joypad1
    type: JoypadState
  - name: joypad2
    type: JoypadState
  - name: joypad1Shift
    type: number
    default: '0'
  - name: joypad2Shift
    type: number
    default: '0'
  - name: strobe
    type: boolean
    default: 'False'
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset all controller states
  - name: setJoypad1State
    sig: '(state: JoypadState): void'
    hint: Update player 1 controller
  - name: setJoypad2State
    sig: '(state: JoypadState): void'
    hint: Update player 2 controller
  - name: readJoypad1
    sig: '(): number'
    hint: Read next bit from joypad1
  - name: readJoypad2
    sig: '(): number'
    hint: Read next bit from joypad2
  - name: writeStrobe
    sig: '(value: number): void'
    hint: Handle strobe register write
  - name: updateShiftRegisters
    sig: '(): void'
    hint: Reload shift registers if strobe
  - name: getJoypad1State
    sig: '(): JoypadState'
    hint: Get current joypad1 state
  - name: getJoypad2State
    sig: '(): JoypadState'
    hint: Get current joypad2 state
  - name: isStrobeEnabled
    sig: '(): boolean'
    hint: Check if strobe active
  static:
  - name: JOYPAD1_ADDRESS
    hint: '0x4016'
  - name: JOYPAD2_ADDRESS
    hint: '0x4017'
  references:
  - src/Input/input_poller.yaml
