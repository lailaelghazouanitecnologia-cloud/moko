## Blueprint — reporter
name: reporter
language: typescript
target_dir: src/reporter
description: ''
constraints: []
references: []
types:
- name: ChangeReporter
  kind: class
  status: translated
  target_file: src/reporter/change-reporter.ts
  description: Generates and outputs change summaries
  fields:
  - name: formatter
    type: DiffFormatter
  - name: outputTarget
    type: string
  - name: includeDetails
    type: boolean
  methods:
  - name: report
    sig: '(changes: Change[]): void'
    hint: output change summary
  - name: setFormatter
    sig: '(formatter: DiffFormatter): void'
    hint: set diff formatter
  - name: setOutputTarget
    sig: '(target: string): void'
    hint: set output destination
  - name: enableDetails
    sig: '(enable: boolean): void'
    hint: toggle detail level
  - name: generateSummary
    sig: '(changes: Change[]): string'
    hint: create summary text
  - name: writeOutput
    sig: '(content: string): void'
    hint: write to target
- name: DiffFormatter
  kind: class
  status: translated
  target_file: src/reporter/diff-formatter.ts
  description: Formats change diffs for output
  fields:
  - name: contextLines
    type: number
  - name: colorize
    type: boolean
  methods:
  - name: format
    sig: '(diff: Diff): string'
    hint: render diff string
  - name: addLineNumbers
    sig: '(input: string[]): string[]'
    hint: prepend line numbers
  - name: highlightSyntax
    sig: '(code: string, lang: string): string'
    hint: apply syntax colors
  - name: truncate
    sig: '(text: string, maxLen: number): string'
    hint: limit string length
  - name: joinSections
    sig: '(parts: string[]): string'
    hint: merge diff parts
  - name: indent
    sig: '(text: string, spaces: number): string'
    hint: add left padding
