## Blueprint — memory
name: memory
language: typescript
target_dir: src/memory
description: ''
constraints:
- Must support streaming updates
- Must be thread-safe for concurrent access
- Must support persistent storage
references:
- swarm/examples/customer_service_streaming/src/swarm/assistants.yaml
types:
- name: MemoryStore
  kind: class
  status: pending
  target_file: src/memory/memory-store.ts
  description: Central storage for all memory sessions and indices
  fields:
  - name: sessions
    type: Map<string, MemorySession>
    default: new Map()
  - name: indices
    type: Map<string, MemoryIndex>
    default: new Map()
  - name: persistencePath
    type: string
    default: 'null'
  methods:
  - name: createSession
    sig: '(sessionId: string, metadata?: Record<string, any>): MemorySession'
    hint: Create new session or return existing
  - name: getSession
    sig: '(sessionId: string): MemorySession | null'
    hint: Retrieve session by ID
  - name: deleteSession
    sig: '(sessionId: string): boolean'
    hint: Remove session and cleanup
  - name: createIndex
    sig: '(indexId: string, type: string): MemoryIndex'
    hint: Create new memory index
  - name: getIndex
    sig: '(indexId: string): MemoryIndex | null'
    hint: Retrieve index by ID
  - name: query
    sig: '(query: MemoryQuery): Promise<any[]>'
    hint: Search across all indices
  - name: persist
    sig: '(): Promise<void>'
    hint: Save to disk if path set
  - name: load
    sig: '(path: string): Promise<void>'
    hint: Load from disk
  - name: getStats
    sig: '(): {sessions: number, indices: number, size: number}'
    hint: Return memory usage stats
  - name: clear
    sig: '(): void'
    hint: Clear all sessions and indices
  - name: exportSession
    sig: '(sessionId: string): string'
    hint: Export session as JSON
  - name: importSession
    sig: '(data: string): MemorySession'
    hint: Import session from JSON
  static:
  - name: MAX_SESSIONS
    hint: Maximum concurrent sessions
  - name: MAX_INDEX_SIZE
    hint: Maximum entries per index
  references:
  - swarm/examples/customer_service_streaming/src/swarm/assistants.yaml
- name: MemorySession
  kind: class
  status: pending
  target_file: src/memory/memory-session.ts
  description: Manages conversation history and context for a single session
  fields:
  - name: id
    type: string
    default: uuid
  - name: history
    type: Array<any>
    default: '[]'
  - name: metadata
    type: Record<string, any>
    default: '{}'
  - name: createdAt
    type: Date
    default: new Date()
  - name: updatedAt
    type: Date
    default: new Date()
  methods:
  - name: addUserMessage
    sig: '(message: string): void'
    hint: Append user message to history
  - name: addAssistantMessage
    sig: '(message: string): void'
    hint: Append assistant message to history
  - name: addToolMessage
    sig: '(toolName: string, args: any, result: any): void'
    hint: Append tool call and result
  - name: getHistory
    sig: '(): Array<any>'
    hint: Return full conversation history
  - name: getRecentMessages
    sig: '(count: number): Array<any>'
    hint: Return last N messages
  - name: getMessagesByTask
    sig: '(taskId: string): Array<any>'
    hint: Filter messages by task ID
  - name: clearHistory
    sig: '(): void'
    hint: Remove all messages
  - name: trimHistory
    sig: '(maxLength: number): void'
    hint: Keep only recent messages
  - name: updateMetadata
    sig: '(key: string, value: any): void'
    hint: Update session metadata
  - name: toJSON
    sig: '(): string'
    hint: Serialize session data
  - name: fromJSON
    sig: '(data: string): MemorySession'
    hint: Deserialize session data
  - name: getContext
    sig: '(): Record<string, any>'
    hint: Return current context
  - name: setContext
    sig: '(context: Record<string, any>): void'
    hint: Update entire context
  - name: evaluate
    sig: '(task: string, plan: string): Promise<boolean>'
    hint: Evaluate task completion
  - name: save
    sig: '(path: string): Promise<void>'
    hint: Save session to file
  references:
  - swarm/examples/customer_service_streaming/src/swarm/assistants.yaml
- name: MemoryIndex
  kind: class
  status: translated
  target_file: src/memory/memory-index.ts
  description: Indexed storage for efficient memory retrieval
  fields:
  - name: id
    type: string
    default: uuid
  - name: type
    type: string
    default: '''default'''
  - name: entries
    type: Map<string, any>
    default: new Map()
  - name: vectors
    type: Array<number[]>
    default: '[]'
  - name: metadata
    type: Record<string, any>
    default: '{}'
  methods:
  - name: add
    sig: '(key: string, value: any, vector?: number[]): void'
    hint: Add entry with optional vector
  - name: get
    sig: '(key: string): any | null'
    hint: Retrieve by key
  - name: update
    sig: '(key: string, value: any): boolean'
    hint: Update existing entry
  - name: delete
    sig: '(key: string): boolean'
    hint: Remove entry
  - name: search
    sig: '(query: number[], k?: number): Array<{key: string, score: number}>'
    hint: Vector similarity search
  - name: searchByKey
    sig: '(pattern: string): Array<string>'
    hint: Key pattern matching
  - name: getAll
    sig: '(): Array<[string, any]>'
    hint: Return all entries
  - name: clear
    sig: '(): void'
    hint: Remove all entries
  - name: size
    sig: '(): number'
    hint: Return entry count
  - name: buildIndex
    sig: '(): Promise<void>'
    hint: Build search index
  - name: getSimilar
    sig: '(key: string, k?: number): Array<string>'
    hint: Find similar entries
  - name: export
    sig: '(): Record<string, any>'
    hint: Export as plain object
  - name: import
    sig: '(data: Record<string, any>): void'
    hint: Import from object
  - name: getStats
    sig: '(): {size: number, dimensions: number}'
    hint: Return index statistics
  references:
  - swarm/examples/customer_service_streaming/src/swarm/assistants.yaml
- name: MemoryQuery
  kind: class
  status: pending
  target_file: src/memory/memory-query.ts
  description: Query specification for memory retrieval
  fields:
  - name: text
    type: string
    default: ''''''
  - name: vector
    type: number[]
    default: '[]'
  - name: filters
    type: Record<string, any>
    default: '{}'
  - name: indices
    type: string[]
    default: '[]'
  - name: limit
    type: number
    default: '10'
  - name: threshold
    type: number
    default: '0.7'
  methods:
  - name: setText
    sig: '(text: string): MemoryQuery'
    hint: Set text query
  - name: setVector
    sig: '(vector: number[]): MemoryQuery'
    hint: Set vector query
  - name: addFilter
    sig: '(key: string, value: any): MemoryQuery'
    hint: Add filter condition
  - name: setIndices
    sig: '(indices: string[]): MemoryQuery'
    hint: Limit to specific indices
  - name: setLimit
    sig: '(limit: number): MemoryQuery'
    hint: Set result limit
  - name: setThreshold
    sig: '(threshold: number): MemoryQuery'
    hint: Set similarity threshold
  - name: build
    sig: '(): Record<string, any>'
    hint: Build query object
  - name: fromText
    sig: '(text: string): MemoryQuery'
    hint: Create text query
  - name: fromVector
    sig: '(vector: number[]): MemoryQuery'
    hint: Create vector query
  - name: combine
    sig: '(other: MemoryQuery): MemoryQuery'
    hint: Combine with another query
  - name: validate
    sig: '(): boolean'
    hint: Check query validity
  - name: toJSON
    sig: '(): string'
    hint: Serialize query
  - name: fromJSON
    sig: '(data: string): MemoryQuery'
    hint: Deserialize query
  static:
  - name: DEFAULT_LIMIT
    hint: Default result limit
  - name: DEFAULT_THRESHOLD
    hint: Default similarity threshold
  references:
  - swarm/examples/customer_service_streaming/src/swarm/assistants.yaml
