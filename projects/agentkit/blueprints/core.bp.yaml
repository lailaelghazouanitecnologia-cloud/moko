## Blueprint — core
name: core
language: typescript
target_dir: src/core
description: ''
constraints:
- Must support tool calling and memory management
- Must handle conversation flow and message history
- Must be extensible for different AI providers
references:
- swarm/swarm/module.yaml
- swarm/examples/customer_service_streaming/src/swarm/swarm.yaml
- swarm/examples/customer_service_streaming/src/swarm/conversation.yaml
types:
- name: Agent
  kind: class
  status: pending
  target_file: src/core/agent.ts
  description: AI agent with tool calling and memory capabilities
  fields:
  - name: id
    type: string
    default: uuid.v4()
  - name: name
    type: string
    default: Agent
  - name: model
    type: string
    default: gpt-4
  - name: tools
    type: Map<string, Tool>
    default: new Map()
  - name: memory
    type: Memory
    default: new Memory()
  - name: systemPrompt
    type: string
    default: ''''''
  methods:
  - name: addTool
    sig: '(name: string, tool: Tool): void'
    hint: Register tool with name and implementation
  - name: removeTool
    sig: '(name: string): boolean'
    hint: Remove tool by name
  - name: listTools
    sig: '(): string[]'
    hint: Get all registered tool names
  - name: callTool
    sig: '(name: string, args: any): Promise<any>'
    hint: Execute tool with arguments
  - name: hasTool
    sig: '(name: string): boolean'
    hint: Check if tool exists
  - name: updateSystemPrompt
    sig: '(prompt: string): void'
    hint: Update agent's system prompt
  - name: getMemory
    sig: '(): Memory'
    hint: Access agent's memory store
  - name: clearMemory
    sig: '(): void'
    hint: Reset agent's memory
  - name: clone
    sig: '(): Agent'
    hint: Create deep copy of agent
  - name: toJSON
    sig: '(): AgentConfig'
    hint: Serialize agent configuration
  - name: fromJSON
    sig: '(config: AgentConfig): Agent'
    hint: Deserialize agent from config
  references:
  - swarm/swarm/module.yaml
- name: Swarm
  kind: class
  status: pending
  target_file: src/core/swarm.ts
  description: Manages multiple agents and their interactions
  fields:
  - name: agents
    type: Map<string, Agent>
    default: new Map()
  - name: conversations
    type: Map<string, Conversation>
    default: new Map()
  - name: defaultAgent
    type: string
    default: ''''''
  - name: maxAgents
    type: number
    default: '100'
  methods:
  - name: addAgent
    sig: '(agent: Agent): string'
    hint: Register agent and return ID
  - name: removeAgent
    sig: '(id: string): boolean'
    hint: Remove agent by ID
  - name: getAgent
    sig: '(id: string): Agent | undefined'
    hint: Retrieve agent by ID
  - name: listAgents
    sig: '(): string[]'
    hint: Get all agent IDs
  - name: createConversation
    sig: '(agentIds?: string[]): string'
    hint: Create new conversation with agents
  - name: getConversation
    sig: '(id: string): Conversation | undefined'
    hint: Retrieve conversation by ID
  - name: deleteConversation
    sig: '(id: string): boolean'
    hint: Remove conversation
  - name: broadcast
    sig: '(message: Message, conversationId: string): void'
    hint: Send message to all agents in conversation
  - name: setDefaultAgent
    sig: '(id: string): void'
    hint: Set default agent for new conversations
  - name: getDefaultAgent
    sig: '(): Agent | undefined'
    hint: Get current default agent
  - name: clearAll
    sig: '(): void'
    hint: Remove all agents and conversations
  - name: getStats
    sig: '(): SwarmStats'
    hint: Get swarm statistics
  references:
  - swarm/examples/customer_service_streaming/src/swarm/swarm.yaml
- name: Conversation
  kind: class
  status: pending
  target_file: src/core/conversation.ts
  description: Manages message history and conversation flow
  fields:
  - name: id
    type: string
    default: uuid.v4()
  - name: history
    type: Message[]
    default: '[]'
  - name: currentMessages
    type: Message[]
    default: '[]'
  - name: summary
    type: string
    default: ''''''
  - name: participants
    type: string[]
    default: '[]'
  - name: metadata
    type: Record<string, any>
    default: '{}'
  methods:
  - name: addMessage
    sig: '(message: Message): void'
    hint: Add message to conversation
  - name: addToolCall
    sig: '(toolCall: ToolCall): void'
    hint: Record tool call in history
  - name: addOutput
    sig: '(output: ToolOutput): void'
    hint: Record tool output
  - name: getHistory
    sig: '(): Message[]'
    hint: Get full message history
  - name: getRecent
    sig: '(count: number): Message[]'
    hint: Get last N messages
  - name: summarize
    sig: '(): Promise<string>'
    hint: Generate conversation summary
  - name: getSummary
    sig: '(): string'
    hint: Get or generate summary
  - name: clearCurrent
    sig: '(): void'
    hint: Clear current message buffer
  - name: clearHistory
    sig: '(): void'
    hint: Clear all messages
  - name: addParticipant
    sig: '(agentId: string): void'
    hint: Add agent to conversation
  - name: removeParticipant
    sig: '(agentId: string): boolean'
    hint: Remove agent from conversation
  - name: getParticipants
    sig: '(): string[]'
    hint: Get all participant IDs
  - name: export
    sig: '(): ConversationExport'
    hint: Export conversation data
  - name: search
    sig: '(query: string): Message[]'
    hint: Search messages by content
  references:
  - swarm/examples/customer_service_streaming/src/swarm/conversation.yaml
- name: Message
  kind: class
  status: translated
  target_file: src/core/message.ts
  description: Represents a single message in conversation
  fields:
  - name: id
    type: string
    default: uuid.v4()
  - name: role
    type: MessageRole
    default: MessageRole.USER
  - name: content
    type: string
    default: ''''''
  - name: timestamp
    type: Date
    default: new Date()
  - name: metadata
    type: Record<string, any>
    default: '{}'
  - name: toolCalls
    type: ToolCall[]
    default: '[]'
  - name: toolOutputs
    type: ToolOutput[]
    default: '[]'
  methods:
  - name: isUser
    sig: '(): boolean'
    hint: Check if user message
  - name: isAssistant
    sig: '(): boolean'
    hint: Check if assistant message
  - name: isSystem
    sig: '(): boolean'
    hint: Check if system message
  - name: hasToolCalls
    sig: '(): boolean'
    hint: Check for tool calls
  - name: addToolCall
    sig: '(call: ToolCall): void'
    hint: Add tool call to message
  - name: addToolOutput
    sig: '(output: ToolOutput): void'
    hint: Add tool output
  - name: getToolCalls
    sig: '(): ToolCall[]'
    hint: Get all tool calls
  - name: getContent
    sig: '(): string'
    hint: Get message content
  - name: setContent
    sig: '(content: string): void'
    hint: Update message content
  - name: getTimestamp
    sig: '(): Date'
    hint: Get creation time
  - name: clone
    sig: '(): Message'
    hint: Create message copy
  - name: toJSON
    sig: '(): MessageJSON'
    hint: Serialize to JSON
  - name: fromJSON
    sig: '(data: MessageJSON): Message'
    hint: Deserialize from JSON
  static:
  - name: createUser
    sig: '(content: string): Message'
    hint: Factory for user messages
  - name: createAssistant
    sig: '(content: string): Message'
    hint: Factory for assistant messages
  - name: createSystem
    sig: '(content: string): Message'
    hint: Factory for system messages
  references:
  - swarm/examples/customer_service_streaming/src/swarm/conversation.yaml
