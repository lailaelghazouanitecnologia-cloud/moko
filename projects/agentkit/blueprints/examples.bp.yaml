## Blueprint — examples
name: examples
language: typescript
target_dir: src/examples
description: ''
constraints:
- Each agent must extend BaseAgent
- All tools must be async
- Memory must be session-based
references:
- swarm/examples/airline/module.yaml
- swarm/examples/personal_shopper/module.yaml
- swarm/examples/triage_agent/module.yaml
- swarm/examples/weather_agent/module.yaml
types:
- name: AirlineAgent
  kind: class
  status: pending
  target_file: src/examples/airline-agent.ts
  extends: BaseAgent
  description: Handles flight booking, cancellation, and customer service
  fields:
  - name: bookingApi
    type: BookingAPI
    default: None
  - name: flightCache
    type: Map<string, Flight>
    default: new Map()
  methods:
  - name: searchFlights
    sig: '(origin: string, destination: string, date: string): Promise<Flight[]>'
    hint: Query bookingApi with cache fallback
  - name: bookFlight
    sig: '(flightId: string, passenger: Passenger): Promise<Booking>'
    hint: Reserve seat via bookingApi
  - name: cancelBooking
    sig: '(bookingId: string): Promise<boolean>'
    hint: Call bookingApi cancel endpoint
  - name: getBookingDetails
    sig: '(bookingId: string): Promise<Booking>'
    hint: Fetch from bookingApi
  - name: upgradeSeat
    sig: '(bookingId: string, newClass: string): Promise<boolean>'
    hint: Check availability then upgrade
  - name: checkIn
    sig: '(bookingId: string): Promise<BoardingPass>'
    hint: Generate boarding pass
  - name: getFlightStatus
    sig: '(flightNumber: string): Promise<FlightStatus>'
    hint: Real-time status from API
  - name: rebookFlight
    sig: '(bookingId: string, newFlightId: string): Promise<Booking>'
    hint: Cancel old then book new
  - name: addBaggage
    sig: '(bookingId: string, bags: Baggage[]): Promise<number>'
    hint: Calculate fee and add
  - name: selectSeat
    sig: '(bookingId: string, seatNumber: string): Promise<boolean>'
    hint: Check map then assign
  - name: getMealOptions
    sig: '(flightId: string): Promise<MealOption[]>'
    hint: Load from flight service
  - name: setMealPreference
    sig: '(bookingId: string, mealCode: string): Promise<boolean>'
    hint: Update booking record
  - name: getSpecialServices
    sig: '(flightId: string): Promise<Service[]>'
    hint: List available services
  - name: requestSpecialService
    sig: '(bookingId: string, serviceCode: string): Promise<boolean>'
    hint: Add to booking notes
  - name: getLoyaltyPoints
    sig: '(customerId: string): Promise<number>'
    hint: Query loyalty system
  references:
  - swarm/examples/airline/module.yaml
- name: PersonalShopperAgent
  kind: class
  status: pending
  target_file: src/examples/personal-shopper-agent.ts
  extends: BaseAgent
  description: Curates products, manages cart, and places orders
  fields:
  - name: productCatalog
    type: ProductCatalog
    default: None
  - name: cart
    type: Map<string, CartItem>
    default: new Map()
  - name: orderService
    type: OrderService
    default: None
  methods:
  - name: searchProducts
    sig: '(query: string, filters: Filter[]): Promise<Product[]>'
    hint: Query catalog with filters
  - name: getRecommendations
    sig: '(userId: string, category: string): Promise<Product[]>'
    hint: ML-based suggestions
  - name: addToCart
    sig: '(productId: string, quantity: number): Promise<boolean>'
    hint: Update cart map
  - name: removeFromCart
    sig: '(productId: string): Promise<boolean>'
    hint: Delete from cart
  - name: updateCartQuantity
    sig: '(productId: string, quantity: number): Promise<boolean>'
    hint: Adjust quantity
  - name: getCartTotal
    sig: '(): Promise<number>'
    hint: Sum items with tax
  - name: applyPromoCode
    sig: '(code: string): Promise<number>'
    hint: Validate and discount
  - name: checkout
    sig: '(payment: Payment): Promise<Order>'
    hint: Create order via service
  - name: trackOrder
    sig: '(orderId: string): Promise<OrderStatus>'
    hint: Query order service
  - name: cancelOrder
    sig: '(orderId: string): Promise<boolean>'
    hint: Call cancel endpoint
  - name: returnItem
    sig: '(orderId: string, itemId: string): Promise<ReturnLabel>'
    hint: Generate return label
  - name: getWishlist
    sig: '(userId: string): Promise<Product[]>'
    hint: Load from user profile
  - name: addToWishlist
    sig: '(userId: string, productId: string): Promise<boolean>'
    hint: Persist to profile
  - name: compareProducts
    sig: '(productIds: string[]): Promise<Comparison>'
    hint: Side-by-side analysis
  - name: getPriceAlerts
    sig: '(userId: string): Promise<Alert[]>'
    hint: Check price drops
  references:
  - swarm/examples/personal_shopper/module.yaml
- name: TriageAgent
  kind: class
  status: pending
  target_file: src/examples/triage-agent.ts
  extends: BaseAgent
  description: Routes user queries to appropriate specialized agents
  fields:
  - name: agentRegistry
    type: Map<string, BaseAgent>
    default: new Map()
  - name: intentClassifier
    type: IntentClassifier
    default: None
  methods:
  - name: registerAgent
    sig: '(intent: string, agent: BaseAgent): void'
    hint: Add to registry map
  - name: classifyIntent
    sig: '(message: string): Promise<string>'
    hint: ML model prediction
  - name: routeMessage
    sig: '(message: string, context: Context): Promise<Response>'
    hint: Classify then delegate
  - name: getAgentCapabilities
    sig: '(agentName: string): Promise<string[]>'
    hint: List agent tools
  - name: transferContext
    sig: '(fromAgent: string, toAgent: string, context: Context): Promise<void>'
    hint: Pass conversation state
  - name: escalateToHuman
    sig: '(reason: string, context: Context): Promise<void>'
    hint: Queue for human review
  - name: getConfidenceScore
    sig: '(message: string, intent: string): Promise<number>'
    hint: Classifier probability
  - name: suggestAgents
    sig: '(message: string): Promise<string[]>'
    hint: Top matching agents
  - name: logRoutingDecision
    sig: '(message: string, intent: string, agent: string): void'
    hint: Audit trail
  - name: getRoutingHistory
    sig: '(sessionId: string): Promise<RoutingEvent[]>'
    hint: Load from memory
  - name: updateClassifier
    sig: '(feedback: Feedback): Promise<void>'
    hint: Retrain model
  - name: handleUnknownIntent
    sig: '(message: string): Promise<Response>'
    hint: Fallback response
  - name: getFallbackAgent
    sig: '(): BaseAgent'
    hint: Default agent
  - name: setConfidenceThreshold
    sig: '(threshold: number): void'
    hint: Adjust routing bar
  - name: getPerformanceMetrics
    sig: '(): Promise<Metrics>'
    hint: Accuracy stats
  references:
  - swarm/examples/triage_agent/module.yaml
- name: WeatherAgent
  kind: class
  status: translated
  target_file: src/examples/weather-agent.ts
  extends: BaseAgent
  description: Provides weather forecasts and alerts
  fields:
  - name: weatherApi
    type: WeatherAPI
    default: None
  - name: locationCache
    type: Map<string, Location>
    default: new Map()
  - name: alertSubscriptions
    type: Map<string, AlertConfig>
    default: new Map()
  methods:
  - name: getCurrentWeather
    sig: '(location: string): Promise<Weather>'
    hint: Fetch from weatherApi
  - name: getForecast
    sig: '(location: string, days: number): Promise<Forecast[]>'
    hint: Multi-day prediction
  - name: getHourlyForecast
    sig: '(location: string, hours: number): Promise<HourlyForecast[]>'
    hint: Next n hours
  - name: searchLocation
    sig: '(query: string): Promise<Location[]>'
    hint: Geocode query
  - name: getAlerts
    sig: '(location: string): Promise<Alert[]>'
    hint: Active warnings
  - name: subscribeAlerts
    sig: '(location: string, types: AlertType[]): Promise<string>'
    hint: Register webhook
  - name: unsubscribeAlerts
    sig: '(subscriptionId: string): Promise<boolean>'
    hint: Remove webhook
  - name: getHistoricalWeather
    sig: '(location: string, date: string): Promise<HistoricalWeather>'
    hint: Past conditions
  - name: compareCities
    sig: '(cities: string[]): Promise<CityComparison>'
    hint: Side-by-side temps
  - name: getUVIndex
    sig: '(location: string): Promise<number>'
    hint: UV level
  - name: getPollenCount
    sig: '(location: string): Promise<PollenData>'
    hint: Allergen levels
  - name: getAirQuality
    sig: '(location: string): Promise<AQI>'
    hint: EPA index
  - name: getSunriseSunset
    sig: '(location: string, date: string): Promise<Times>'
    hint: Astronomical times
  - name: getMoonPhase
    sig: '(date: string): Promise<string>'
    hint: Lunar phase
  - name: convertTemperature
    sig: '(value: number, from: Unit, to: Unit): Promise<number>'
    hint: Unit conversion
  references:
  - swarm/examples/weather_agent/module.yaml
