## Blueprint — graphics
name: graphics
language: typescript
target_dir: src/graphics
description: ''
constraints:
- WebGL2 as primary backend with WebGPU fallback
- Instanced rendering for performance
- Texture batching to reduce draw calls
- VAO usage for vertex array management
references:
- playcanvas/platform/graphics/graphics-device.yaml
- thief-engine/graphics/render-engine.yaml
types:
- name: GraphicsDevice
  kind: class
  status: translated
  target_file: src/graphics/graphics-device.ts
  extends: EventHandler
  description: WebGL/WebGPU abstraction layer for rendering operations
  fields:
  - name: canvas
    type: HTMLCanvasElement
  - name: gl
    type: WebGL2RenderingContext
  - name: isWebGPU
    type: boolean
    default: 'False'
  - name: maxTextures
    type: number
  - name: maxTextureSize
    type: number
  - name: maxCubeMapSize
    type: number
  - name: maxVolumeSize
    type: number
  - name: maxAnisotropy
    type: number
  - name: supportsInstancing
    type: boolean
    default: 'True'
  - name: supportsUniformBuffers
    type: boolean
    default: 'False'
  - name: renderState
    type: RenderState
  methods:
  - name: setViewport
    sig: '(x: number, y: number, width: number, height: number): void'
    hint: Set viewport rectangle
  - name: setScissor
    sig: '(x: number, y: number, width: number, height: number): void'
    hint: Set scissor rectangle
  - name: clear
    sig: '(color?: Color, depth?: number, stencil?: number): void'
    hint: Clear framebuffer attachments
  - name: draw
    sig: '(primitiveType: number, vertexCount: number, offset?: number): void'
    hint: Issue draw call
  - name: drawIndexed
    sig: '(primitiveType: number, indexCount: number, offset?: number): void'
    hint: Issue indexed draw call
  - name: drawInstanced
    sig: '(primitiveType: number, vertexCount: number, instanceCount: number): void'
    hint: Issue instanced draw call
  - name: setBlendState
    sig: '(enabled: boolean, srcFactor?: number, dstFactor?: number): void'
    hint: Configure blending state
  - name: setDepthState
    sig: '(enabled: boolean, func?: number, write?: boolean): void'
    hint: Configure depth testing
  - name: setCullMode
    sig: '(mode: number): void'
    hint: Set face culling mode
  - name: setStencilState
    sig: '(enabled: boolean, func?: number, ref?: number): void'
    hint: Configure stencil testing
  - name: copyRenderTarget
    sig: '(src: RenderTarget, dst: RenderTarget): void'
    hint: Copy between render targets
  - name: pushMarker
    sig: '(name: string): void'
    hint: Push debug marker
  - name: popMarker
    sig: '(): void'
    hint: Pop debug marker
  - name: beginFrame
    sig: '(): void'
    hint: Start frame rendering
  - name: endFrame
    sig: '(): void'
    hint: End frame rendering
  - name: resize
    sig: '(width: number, height: number): void'
    hint: Resize canvas and buffers
  static:
  - name: create
    sig: '(canvas: HTMLCanvasElement, options?: object): Promise<GraphicsDevice>'
    hint: Factory method with fallback
  references:
  - playcanvas/platform/graphics/graphics-device.yaml
- name: Shader
  kind: class
  status: translated
  target_file: src/graphics/shader.ts
  description: Shader program wrapper with compilation and binding
  fields:
