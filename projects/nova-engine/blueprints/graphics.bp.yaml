## Blueprint — graphics
name: graphics
language: typescript
target_dir: src/graphics
description: ''
constraints:
- WebGL2 with WebGPU fallback
- Instanced rendering support
- Texture batching by bind
references:
- playcanvas/platform/graphics/graphics-device.yaml
- thief-engine/graphics/render-engine.yaml
types:
- name: GraphicsDevice
  kind: class
  status: translated
  target_file: src/graphics/graphics-device.ts
  extends: EventHandler
  description: Low-level graphics abstraction over WebGL/WebGPU
  fields:
  - name: canvas
    type: HTMLCanvasElement
  - name: gl
    type: WebGL2RenderingContext
  - name: maxTextures
    type: number
  - name: maxTextureSize
    type: number
  - name: maxCubeMapSize
    type: number
  - name: maxVolumeSize
    type: number
  - name: maxAnisotropy
    type: number
  - name: supportsInstancing
    type: boolean
  - name: supportsUniformBuffers
    type: boolean
  - name: renderState
    type: RenderState
  methods:
  - name: setViewport
    sig: '(x: number, y: number, w: number, h: number): void'
    hint: set gl.viewport
  - name: setScissor
    sig: '(x: number, y: number, w: number, h: number): void'
    hint: set scissor test rect
  - name: clear
    sig: '(flags: number, color?: Color, depth?: number, stencil?: number): void'
    hint: clear buffers bitwise flags
  - name: draw
    sig: '(primitive: number, vertexCount: number, first?: number): void'
    hint: single draw call
  - name: drawIndexed
    sig: '(primitive: number, indexCount: number, indexType: number): void'
    hint: indexed draw
  - name: drawInstanced
    sig: '(primitive: number, vertexCount: number, instanceCount: number): void'
    hint: instanced draw
  - name: setBlendState
    sig: '(state: BlendState): void'
    hint: update blend func/equation
  - name: setDepthState
    sig: '(state: DepthState): void'
    hint: update depth test/write
  - name: setCullMode
    sig: '(mode: CullMode): void'
    hint: set face culling
  - name: setStencilState
    sig: '(state: StencilState): void'
    hint: update stencil func/ops
  - name: copyRenderTarget
    sig: '(src: RenderTarget, dst: RenderTarget): void'
    hint: blit color/depth
  - name: pushMarker
    sig: '(name: string): void'
    hint: insert debug marker
  - name: popMarker
    sig: '(): void'
    hint: pop debug group
  - name: beginRenderPass
    sig: '(target: RenderTarget): void'
    hint: bind framebuffer
  - name: endRenderPass
    sig: '(): void'
    hint: unbind framebuffer
  static:
  - name: create
    sig: '(canvas: HTMLCanvasElement, options?: object): Promise<GraphicsDevice>'
    hint: factory tries webgpu then webgl2
  references:
  - playcanvas/platform/graphics/graphics-device.yaml
- name: Shader
  kind: class
  status: translated
  target_file: src/graphics/shader.ts
  description: Compiled GPU shader program
  fields:
  - name: program
    type: WebGLProgram
  - name: uniforms
    type: Map<string, WebGLUniformLocation>
  - name: attributes
    type: Map<string, number>
  methods:
  - name: compile
    sig: '(gl: WebGL2RenderingContext, vsSrc: string, fsSrc: string): boolean'
    hint: compile and link program
  - name: bind
    sig: '(gl: WebGL2RenderingContext): void'
    hint: gl.useProgram
  - name: getUniform
    sig: '(name: string): WebGLUniformLocation | null'
    hint: cache lookup
  - name: getAttrib
    sig: '(name: string): number'
    hint: cache lookup
  - name: setUniform1f
    sig: '(loc: WebGLUniformLocation, v: number): void'
    hint: gl.uniform1f
  - name: setUniform2fv
    sig: '(loc: WebGLUniformLocation, v: Float32Array): void'
    hint: gl.uniform2fv
  - name: setUniform3fv
    sig: '(loc: WebGLUniformLocation, v: Float32Array): void'
    hint: gl.uniform3fv
  - name: setUniform4fv
    sig: '(loc: WebGLUniformLocation, v: Float32Array): void'
    hint: gl.uniform4fv
  - name: setUniformMatrix4fv
    sig: '(loc: WebGLUniformLocation, m: Float32Array): void'
    hint: gl.uniformMatrix4fv
  - name: setTexture
    sig: '(loc: WebGLUniformLocation, unit: number): void'
    hint: gl.uniform1i(unit)
  - name: destroy
    sig: '(gl: WebGL2RenderingContext): void'
    hint: delete program
  static:
  - name: fromSources
    sig: '(gl: WebGL2RenderingContext, vs: string, fs: string): Shader | null'
    hint: helper factory
  references:
  - thief-engine/graphics/render-engine.yaml
- name: Texture
  kind: class
  status: translated
  target_file: src/graphics/texture.ts
  description: 2D texture wrapper with mips and filtering
  fields:
  - name: gl
    type: WebGL2RenderingContext
  - name: texture
    type: WebGLTexture
  - name: width
    type: number
  - name: height
    type: number
  - name: format
    type: number
  - name: internalFormat
    type: number
  - name: type
    type: number
  - name: wrapU
    type: number
  - name: wrapV
    type: number
  - name: minFilter
    type: number
  - name: magFilter
    type: number
  - name: anisotropy
    type: number
  methods:
  - name: bind
    sig: '(unit: number): void'
    hint: gl.activeTexture + bind
  - name: setFilters
    sig: '(min: number, mag: number): void'
    hint: update min/mag filter
  - name: setWrap
    sig: '(u: number, v: number): void'
    hint: update wrap modes
  - name: generateMips
    sig: '(): void'
    hint: gl.generateMipmap
  - name: upload
    sig: '(data: ArrayBufferView | HTMLImageElement): void'
    hint: texImage2D/subImage
  - name: uploadSub
    sig: '(x: number, y: number, w: number, h: number, data: ArrayBufferView): void'
    hint: texSubImage2D
  - name: destroy
    sig: '(): void'
    hint: delete texture
  static:
  - name: fromImage
    sig: '(gl: WebGL2RenderingContext, img: HTMLImageElement): Texture'
    hint: create and upload
  - name: fromData
    sig: '(gl: WebGL2RenderingContext, w: number, h: number, data: Uint8Array): Texture'
    hint: create and upload
  references:
  - playcanvas/platform/graphics/graphics-device.yaml
- name: RenderTarget
  kind: class
  status: translated
  target_file: src/graphics/render-target.ts
  description: Framebuffer with color/depth attachments
  fields:
  - name: gl
    type: WebGL2RenderingContext
  - name: framebuffer
    type: WebGLFramebuffer
  - name: colorBuffer
    type: Texture | null
  - name: depthBuffer
    type: WebGLRenderbuffer | null
  - name: width
    type: number
  - name: height
    type: number
  methods:
  - name: bind
    sig: '(): void'
    hint: gl.bindFramebuffer
  - name: unbind
    sig: '(): void'
    hint: bind null
  - name: resize
    sig: '(w: number, h: number): void'
    hint: recreate attachments
  - name: readPixels
    sig: '(x: number, y: number, w: number, h: number, data: Uint8Array): void'
    hint: gl.readPixels
  - name: destroy
    sig: '(): void'
    hint: delete fb and attachments
  static:
  - name: createColor
    sig: '(gl: WebGL2RenderingContext, w: number, h: number): RenderTarget'
    hint: color only
  - name: createColorDepth
    sig: '(gl: WebGL2RenderingContext, w: number, h: number): RenderTarget'
    hint: color + depth
  references:
  - playcanvas/platform/graphics/graphics-device.yaml
