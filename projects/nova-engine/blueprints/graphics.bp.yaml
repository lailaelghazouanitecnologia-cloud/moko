    type: WebGLProgram
  - name: vertexShader
    type: WebGLShader
  - name: fragmentShader
    type: WebGLShader
  - name: uniforms
    type: Map<string, WebGLUniformLocation>
  - name: attributes
    type: Map<string, number>
  - name: compiled
    type: boolean
    default: 'False'
  methods:
  - name: compile
    sig: '(vertexSource: string, fragmentSource: string): boolean'
    hint: Compile shader program
  - name: bind
    sig: '(): void'
    hint: Use shader program
  - name: unbind
    sig: '(): void'
    hint: Unuse shader program
  - name: getUniform
    sig: '(name: string): WebGLUniformLocation'
    hint: Get uniform location
  - name: getAttribute
    sig: '(name: string): number'
    hint: Get attribute location
  - name: setUniform1f
    sig: '(name: string, value: number): void'
    hint: Set float uniform
  - name: setUniform2f
    sig: '(name: string, x: number, y: number): void'
    hint: Set vec2 uniform
  - name: setUniform3f
    sig: '(name: string, x: number, y: number, z: number): void'
    hint: Set vec3 uniform
  - name: setUniform4f
    sig: '(name: string, x: number, y: number, z: number, w: number): void'
    hint: Set vec4 uniform
  - name: setUniformMatrix4fv
    sig: '(name: string, matrix: Float32Array): void'
    hint: Set mat4 uniform
  - name: setUniform1i
    sig: '(name: string, value: number): void'
    hint: Set int uniform
  - name: destroy
    sig: '(): void'
    hint: Delete shader resources
  static:
  - name: fromSource
    sig: '(vertexSource: string, fragmentSource: string): Shader'
    hint: Create from source strings
  - name: fromFiles
    sig: '(vertexPath: string, fragmentPath: string): Promise<Shader>'
