## Blueprint — input
name: input
language: typescript
target_dir: src/input
description: ''
constraints:
- WebGL game engine input module
- Support keyboard, mouse, touch, gamepad
- Event-driven with polling fallback
- TypeScript strict mode
references:
- thief-engine/core/engine.yaml
types:
- name: InputManager
  kind: class
  status: translated
  target_file: src/input/InputManager.ts
  description: Central hub for all input devices
  fields:
  - name: keyboard
    type: Keyboard
    default: new Keyboard()
  - name: mouse
    type: Mouse
    default: new Mouse()
  - name: touch
    type: Touch
    default: new Touch()
  - name: gamepad
    type: Gamepad
    default: new Gamepad()
  - name: enabled
    type: boolean
    default: 'True'
  methods:
  - name: update
    sig: '(): void'
    hint: Poll all devices each frame
  - name: isAnyPressed
    sig: '(): boolean'
    hint: Check if any input active
  - name: clearAll
    sig: '(): void'
    hint: Reset all input states
  - name: enable
    sig: '(): void'
    hint: Enable input processing
  - name: disable
    sig: '(): void'
    hint: Disable input processing
  - name: getKeyboard
    sig: '(): Keyboard'
    hint: Access keyboard instance
  - name: getMouse
    sig: '(): Mouse'
    hint: Access mouse instance
  - name: getTouch
    sig: '(): Touch'
    hint: Access touch instance
  - name: getGamepad
    sig: '(): Gamepad'
    hint: Access gamepad instance
  references:
  - thief-engine/core/engine.yaml
- name: Keyboard
  kind: class
  status: translated
  target_file: src/input/Keyboard.ts
  description: Keyboard input handler with key mapping
  fields:
  - name: keys
    type: Map<string, boolean>
    default: new Map()
  - name: prevKeys
    type: Map<string, boolean>
    default: new Map()
  methods:
  - name: isKeyDown
    sig: '(key: string): boolean'
    hint: Check key currently pressed
  - name: isKeyPressed
    sig: '(key: string): boolean'
    hint: Check key just pressed
  - name: isKeyReleased
    sig: '(key: string): boolean'
    hint: Check key just released
  - name: getKeyName
    sig: '(code: string): string'
    hint: Map code to readable name
  - name: update
    sig: '(): void'
    hint: Save current as previous
  - name: handleKeyDown
    sig: '(event: KeyboardEvent): void'
    hint: Process key down event
  - name: handleKeyUp
    sig: '(event: KeyboardEvent): void'
    hint: Process key up event
  - name: clear
    sig: '(): void'
    hint: Reset all key states
  - name: isAnyKeyPressed
    sig: '(): boolean'
    hint: Check if any key active
  - name: getPressedKeys
    sig: '(): string[]'
    hint: Return array of pressed keys
  static:
  - name: KEY_CODES
    hint: Map of common key codes
  references:
  - thief-engine/core/engine.yaml
- name: Mouse
  kind: class
  status: translated
  target_file: src/input/Mouse.ts
  description: Mouse input with position and button tracking
  fields:
  - name: x
    type: number
    default: '0'
  - name: y
    type: number
    default: '0'
  - name: deltaX
    type: number
    default: '0'
  - name: deltaY
    type: number
    default: '0'
  - name: buttons
    type: Map<number, boolean>
    default: new Map()
  - name: prevButtons
    type: Map<number, boolean>
    default: new Map()
  - name: wheel
    type: number
    default: '0'
  methods:
  - name: isButtonDown
    sig: '(button: number): boolean'
    hint: Check button currently pressed
  - name: isButtonPressed
    sig: '(button: number): boolean'
    hint: Check button just pressed
  - name: isButtonReleased
    sig: '(button: number): boolean'
    hint: Check button just released
  - name: getPosition
    sig: '(): {x: number, y: number}'
    hint: Return current position
  - name: getDelta
    sig: '(): {x: number, y: number}'
    hint: Return movement delta
  - name: getWheel
    sig: '(): number'
    hint: Return wheel delta
  - name: handleMouseMove
    sig: '(event: MouseEvent): void'
    hint: Process mouse move
  - name: handleMouseDown
    sig: '(event: MouseEvent): void'
    hint: Process button down
  - name: handleMouseUp
    sig: '(event: MouseEvent): void'
    hint: Process button up
  - name: handleWheel
    sig: '(event: WheelEvent): void'
    hint: Process wheel event
  - name: update
    sig: '(): void'
    hint: Save current as previous
  - name: clear
    sig: '(): void'
    hint: Reset all states
  - name: isInside
    sig: '(x: number, y: number, width: number, height: number): boolean'
    hint: Check if mouse in rect
  static:
  - name: LEFT_BUTTON
    hint: '0'
  - name: MIDDLE_BUTTON
    hint: '1'
  - name: RIGHT_BUTTON
    hint: '2'
  references:
  - thief-engine/core/engine.yaml
- name: Touch
  kind: class
  status: translated
  target_file: src/input/Touch.ts
  description: Touch input handler for mobile devices
  fields:
  - name: touches
    type: Map<number, TouchData>
    default: new Map()
  - name: prevTouches
    type: Map<number, TouchData>
    default: new Map()
  methods:
  - name: getTouch
    sig: '(id: number): TouchData | undefined'
    hint: Get touch by identifier
  - name: getAllTouches
    sig: '(): TouchData[]'
    hint: Return all active touches
  - name: getTouchCount
    sig: '(): number'
    hint: Count active touches
  - name: handleTouchStart
    sig: '(event: TouchEvent): void'
    hint: Process touch start
  - name: handleTouchMove
    sig: '(event: TouchEvent): void'
    hint: Process touch move
  - name: handleTouchEnd
    sig: '(event: TouchEvent): void'
    hint: Process touch end
  - name: handleTouchCancel
    sig: '(event: TouchEvent): void'
    hint: Process touch cancel
  - name: update
    sig: '(): void'
    hint: Save current as previous
  - name: clear
    sig: '(): void'
    hint: Reset all touches
  - name: isAnyTouch
    sig: '(): boolean'
    hint: Check if any touch active
  references:
  - thief-engine/core/engine.yaml
- name: TouchData
  kind: interface
  status: pending
  target_file: src/input/TouchData.ts
  description: Single touch point data
  fields:
  - name: id
    type: number
    default: required
  - name: x
    type: number
    default: required
  - name: y
    type: number
    default: required
  - name: startX
    type: number
    default: required
  - name: startY
    type: number
    default: required
  - name: timestamp
    type: number
    default: required
  references:
  - thief-engine/core/engine.yaml
- name: Gamepad
  kind: class
  status: translated
  target_file: src/input/Gamepad.ts
  description: Gamepad controller support
  fields:
  - name: gamepads
    type: Map<number, GamepadData>
    default: new Map()
  - name: enabled
    type: boolean
    default: 'True'
  methods:
  - name: update
    sig: '(): void'
    hint: Poll gamepad API
  - name: getGamepad
    sig: '(index: number): GamepadData | undefined'
    hint: Get gamepad by index
  - name: getAllGamepads
    sig: '(): GamepadData[]'
    hint: Return all connected
  - name: isConnected
    sig: '(index: number): boolean'
    hint: Check if connected
  - name: getButton
    sig: '(index: number, button: number): number'
    hint: Get button value 0-1
  - name: isButtonPressed
    sig: '(index: number, button: number): boolean'
    hint: Check if pressed
  - name: getAxis
    sig: '(index: number, axis: number): number'
    hint: Get axis value -1 to 1
  - name: getStick
    sig: '(index: number, stick: number): {x: number, y: number}'
    hint: Get stick position
  - name: vibrate
    sig: '(index: number, duration: number, weak: number, strong: number): void'
    hint: Trigger vibration
  - name: enable
    sig: '(): void'
    hint: Enable gamepad polling
  - name: disable
    sig: '(): void'
    hint: Disable gamepad polling
  static:
  - name: BUTTON_A
    hint: '0'
  - name: BUTTON_B
    hint: '1'
  - name: BUTTON_X
    hint: '2'
  - name: BUTTON_Y
    hint: '3'
  - name: AXIS_LEFT_X
    hint: '0'
  - name: AXIS_LEFT_Y
    hint: '1'
  references:
  - thief-engine/core/engine.yaml
- name: GamepadData
  kind: interface
  status: pending
  target_file: src/input/GamepadData.ts
  description: Gamepad state snapshot
  fields:
  - name: id
    type: string
    default: required
  - name: index
    type: number
    default: required
  - name: buttons
    type: number[]
    default: required
  - name: axes
    type: number[]
    default: required
  - name: connected
    type: boolean
    default: required
  - name: timestamp
    type: number
    default: required
  references:
  - thief-engine/core/engine.yaml
