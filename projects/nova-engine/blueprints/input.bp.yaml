## Blueprint — input
name: input
language: typescript
target_dir: src/input
description: ''
constraints:
- WebGL game engine input module
- Support keyboard, mouse, touch, gamepad
references:
- thief-engine/core/engine.yaml
types:
- name: InputManager
  kind: class
  status: translated
  target_file: src/input/InputManager.ts
  description: Central hub for all input devices
  fields:
  - name: keyboard
    type: Keyboard
    default: new Keyboard()
  - name: mouse
    type: Mouse
    default: new Mouse()
  - name: touch
    type: Touch
    default: new Touch()
  - name: gamepad
    type: Gamepad
    default: new Gamepad()
  - name: enabled
    type: boolean
    default: 'True'
  methods:
  - name: update
    sig: '(): void'
    hint: poll all devices
  - name: isAnyPressed
    sig: '(): boolean'
    hint: check all devices
  - name: resetAll
    sig: '(): void'
    hint: clear all states
  - name: disable
    sig: '(): void'
    hint: set enabled false
  - name: enable
    sig: '(): void'
    hint: set enabled true
  references:
  - thief-engine/core/engine.yaml
- name: Keyboard
  kind: class
  status: translated
  target_file: src/input/Keyboard.ts
  description: Keyboard input handler with key mapping
  fields:
  - name: keys
    type: Map<string, boolean>
    default: new Map()
  - name: prevKeys
    type: Map<string, boolean>
    default: new Map()
  methods:
  - name: isDown
    sig: '(key: string): boolean'
    hint: check current frame
  - name: isPressed
    sig: '(key: string): boolean'
    hint: down now, up before
  - name: isReleased
    sig: '(key: string): boolean'
    hint: up now, down before
  - name: update
    sig: '(): void'
    hint: save prev, poll new
  - name: reset
    sig: '(): void'
    hint: clear all keys
  - name: onKeyDown
    sig: '(e: KeyboardEvent): void'
    hint: set key true
  - name: onKeyUp
    sig: '(e: KeyboardEvent): void'
    hint: set key false
  - name: anyPressed
    sig: '(): boolean'
    hint: check all keys
  - name: combo
    sig: '(keys: string[]): boolean'
    hint: all down same time
  static:
  - name: KEY_SPACE
    hint: '" "'
  - name: KEY_ENTER
    hint: '"Enter"'
  references:
  - thief-engine/core/engine.yaml
- name: Mouse
  kind: class
  status: translated
  target_file: src/input/Mouse.ts
  description: Mouse position and button tracker
  fields:
  - name: x
    type: number
    default: '0'
  - name: y
    type: number
    default: '0'
  - name: dx
    type: number
    default: '0'
  - name: dy
    type: number
    default: '0'
  - name: buttons
    type: Map<number, boolean>
    default: new Map()
  - name: prevButtons
    type: Map<number, boolean>
    default: new Map()
  - name: locked
    type: boolean
    default: 'False'
  methods:
  - name: isDown
    sig: '(btn: number): boolean'
    hint: check current frame
  - name: isPressed
    sig: '(btn: number): boolean'
    hint: down now, up before
  - name: isReleased
    sig: '(btn: number): boolean'
    hint: up now, down before
  - name: update
    sig: '(): void'
    hint: save prev, reset delta
  - name: onMove
    sig: '(e: MouseEvent): void'
    hint: update x,y,dx,dy
  - name: onDown
    sig: '(e: MouseEvent): void'
    hint: set button true
  - name: onUp
    sig: '(e: MouseEvent): void'
    hint: set button false
  - name: lock
    sig: '(canvas: HTMLCanvasElement): void'
    hint: request pointer lock
  - name: unlock
    sig: '(): void'
    hint: exit pointer lock
  static:
  - name: LEFT
    hint: '0'
  - name: MIDDLE
    hint: '1'
  - name: RIGHT
    hint: '2'
  references:
  - thief-engine/core/engine.yaml
- name: Touch
  kind: class
  status: translated
  target_file: src/input/Touch.ts
  description: Multi-touch tracker for mobile
  fields:
  - name: touches
    type: Map<number, {x:number,y:number}>
    default: new Map()
  - name: prevTouches
    type: Map<number, {x:number,y:number}>
    default: new Map()
  methods:
  - name: count
    sig: '(): number'
    hint: active touches length
  - name: getPosition
    sig: '(id: number): {x:number,y:number}|null'
    hint: return touch coords
  - name: onStart
    sig: '(e: TouchEvent): void'
    hint: add changed touches
  - name: onMove
    sig: '(e: TouchEvent): void'
    hint: update coords
  - name: onEnd
    sig: '(e: TouchEvent): void'
    hint: remove touches
  - name: update
    sig: '(): void'
    hint: copy touches to prev
  - name: isSingleTap
    sig: '(): boolean'
    hint: one touch, short time
  - name: isPinching
    sig: '(): boolean'
    hint: two touches moving
  references:
  - thief-engine/core/engine.yaml
- name: Gamepad
  kind: class
  status: translated
  target_file: src/input/Gamepad.ts
  description: HTML5 Gamepad API wrapper
  fields:
  - name: pads
    type: Gamepad[]
    default: '[]'
  - name: prevButtons
    type: boolean[][]
    default: '[]'
  - name: deadzone
    type: number
    default: '0.15'
  methods:
  - name: update
    sig: '(): void'
    hint: poll navigator.getGamepads
  - name: getAxis
    sig: '(padIndex: number, axis: number): number'
    hint: apply deadzone
  - name: isButtonDown
    sig: '(padIndex: number, btn: number): boolean'
    hint: check current
  - name: isButtonPressed
    sig: '(padIndex: number, btn: number): boolean'
    hint: pressed this frame
  - name: rumble
    sig: '(padIndex: number, left:number, right:number, duration:number): void'
    hint: vibrationActuator
  - name: count
    sig: '(): number'
    hint: pads.length
  - name: isConnected
    sig: '(padIndex: number): boolean'
    hint: check pads array
  static:
  - name: A
    hint: '0'
  - name: B
    hint: '1'
  - name: X
    hint: '2'
  - name: Y
    hint: '3'
  references:
  - thief-engine/core/engine.yaml
