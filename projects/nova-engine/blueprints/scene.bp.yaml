  - name: range
    type: number
    default: '10'
  - name: innerCone
    type: number
    default: '30'
  - name: outerCone
    type: number
    default: '45'
  - name: castShadows
    type: boolean
    default: 'False'
  - name: shadowBias
    type: number
    default: '0.05'
  - name: shadowMap
