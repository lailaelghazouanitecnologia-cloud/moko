## Blueprint — scene
name: scene
language: typescript
target_dir: src/scene
description: ''
constraints:
- WebGL rendering pipeline
- Component-based architecture
- Hierarchical scene graph
references:
- playcanvas/scene/renderer/forward-renderer.yaml
- thief-engine/gameobject/gameobject.yaml
types:
- name: Scene
  kind: class
  status: translated
  target_file: src/scene/scene.ts
  description: Container for scene graph and rendering state
  fields:
  - name: root
    type: Node
    default: None
  - name: cameras
    type: Camera[]
    default: '[]'
  - name: lights
    type: Light[]
    default: '[]'
  - name: meshes
    type: Mesh[]
    default: '[]'
  - name: renderQueue
    type: RenderQueue
    default: None
  - name: loaded
    type: boolean
    default: 'False'
  - name: trash
    type: Node[]
    default: '[]'
  methods:
  - name: addNode
    sig: '(node: Node): void'
    hint: Add node to scene hierarchy
  - name: removeNode
    sig: '(node: Node): void'
    hint: Remove node and its children
  - name: addCamera
    sig: '(camera: Camera): void'
    hint: Register camera for rendering
  - name: removeCamera
    sig: '(camera: Camera): void'
    hint: Unregister camera
  - name: addLight
    sig: '(light: Light): void'
    hint: Register light source
  - name: removeLight
    sig: '(light: Light): void'
    hint: Unregister light
  - name: findNode
    sig: '(name: string): Node | null'
    hint: Breadth-first search by name
  - name: findNodesByTag
    sig: '(tag: string): Node[]'
    hint: Collect nodes with tag
  - name: update
    sig: '(deltaTime: number): void'
    hint: Update all nodes
  - name: render
    sig: '(renderer: ForwardRenderer): void'
    hint: Submit to renderer
  - name: flush
    sig: '(): void'
    hint: Process pending operations
  - name: cleanTrash
    sig: '(): void'
    hint: Destroy marked nodes
  - name: reset
    sig: '(): void'
    hint: Clear all content
  - name: hasNewObjects
    sig: '(): boolean'
    hint: Check for pending additions
  references:
  - thief-engine/gameobject/gameobject.yaml
- name: Node
  kind: class
  status: translated
  target_file: src/scene/node.ts
  description: Base scene graph node with transform hierarchy
  fields:
  - name: name
    type: string
  - name: parent
    type: Node
    default: None
  - name: children
    type: Node[]
    default: '[]'
  - name: transform
    type: Transform
    default: None
  - name: components
    type: Component[]
    default: '[]'
  - name: tags
    type: Set<string>
    default: new Set()
  - name: active
    type: boolean
    default: 'True'
  - name: dirty
    type: boolean
    default: 'True'
  methods:
  - name: addChild
    sig: '(child: Node): void'
    hint: Attach child node
  - name: removeChild
    sig: '(child: Node): void'
    hint: Detach child node
  - name: setParent
    sig: '(parent: Node | null): void'
    hint: Reparent node
  - name: addComponent
    sig: '<T extends Component>(type: new() => T): T'
    hint: Create and attach component
  - name: getComponent
    sig: '<T extends Component>(type: new() => T): T | null'
    hint: Find first component of type
  - name: getComponentsInChildren
    sig: '<T extends Component>(type: new() => T): T[]'
    hint: Recursive component search
  - name: addTag
    sig: '(tag: string): void'
    hint: Add tag for filtering
  - name: removeTag
    sig: '(tag: string): void'
    hint: Remove tag
  - name: hasTag
    sig: '(tag: string): boolean'
    hint: Check tag existence
  - name: update
    sig: '(deltaTime: number): void'
    hint: Update components
  - name: getWorldPosition
    sig: '(): Vec3'
    hint: Compute world space position
  - name: getWorldRotation
    sig: '(): Quat'
    hint: Compute world space rotation
  - name: lookAt
    sig: '(target: Vec3, up?: Vec3): void'
    hint: Orient towards target
  - name: translate
    sig: '(translation: Vec3, space?: Space): void'
    hint: Move by offset
  - name: rotate
    sig: '(rotation: Quat, space?: Space): void'
    hint: Rotate by quaternion
  - name: destroy
    sig: '(): void'
    hint: Mark for deletion
  references:
  - thief-engine/gameobject/gameobject.yaml
- name: Camera
  kind: class
  status: translated
  target_file: src/scene/camera.ts
  extends: Component
  description: View and projection matrix provider
  fields:
  - name: fov
    type: number
    default: '60'
  - name: aspect
    type: number
    default: '1'
  - name: near
    type: number
    default: '0.1'
  - name: far
    type: number
    default: '1000'
  - name: orthographic
    type: boolean
    default: 'False'
  - name: orthoSize
    type: number
    default: '10'
  - name: clearColor
    type: Color
    default: Color.BLACK
  - name: viewport
    type: Rect
    default: Rect.UNIT
  - name: frustum
    type: Frustum
    default: None
  methods:
  - name: getViewMatrix
    sig: '(): Mat4'
    hint: Compute view matrix
  - name: getProjectionMatrix
    sig: '(): Mat4'
    hint: Compute projection matrix
  - name: getViewProjectionMatrix
    sig: '(): Mat4'
    hint: Combined VP matrix
  - name: screenToWorld
    sig: '(screen: Vec2, depth: number): Vec3'
    hint: Convert screen to world
  - name: worldToScreen
    sig: '(world: Vec3): Vec2'
    hint: Convert world to screen
  - name: getFrustumCorners
    sig: '(): Vec3[]'
    hint: Get 8 corner points
  - name: isVisible
    sig: '(bounds: BoundingBox): boolean'
    hint: Frustum culling test
  - name: setPerspective
    sig: '(fov: number, aspect: number, near: number, far: number): void'
    hint: Configure perspective
  - name: setOrthographic
    sig: '(size: number, near: number, far: number): void'
    hint: Configure orthographic
  - name: setViewport
    sig: '(x: number, y: number, width: number, height: number): void'
    hint: Set viewport rect
  - name: getScreenRay
    sig: '(screen: Vec2): Ray'
    hint: Ray from screen point
  - name: updateFrustum
    sig: '(): void'
    hint: Update frustum planes
  references:
  - playcanvas/scene/renderer/forward-renderer.yaml
- name: Light
  kind: class
  status: translated
  target_file: src/scene/light.ts
  extends: Component
  description: Light source with shadows
  fields:
