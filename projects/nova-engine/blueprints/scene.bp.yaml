  - name: getPosition
    sig: '(): Vec3'
    hint: From world matrix
  - name: setDirection
    sig: '(dir: Vec3): void'
    hint: Set rotation to face
  - name: computeShadowMatrix
    sig: '(): Mat4'
    hint: Create light space
  - name: isDirectional
    sig: '(): boolean'
    hint: Check type
  - name: isPoint
    sig: '(): boolean'
    hint: Check type
  - name: isSpot
    sig: '(): boolean'
    hint: Check type
  - name: getAttenuation
    sig: '(distance: number): number'
    hint: Compute falloff
  - name: getShadowMap
    sig: '(): Texture'
    hint: Ensure allocated
  - name: updateShadow
    sig: '(renderer: ForwardRenderer): void'
