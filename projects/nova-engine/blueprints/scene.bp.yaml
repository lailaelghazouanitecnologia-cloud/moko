  - name: color
    type: Color
    default: Color.WHITE
  - name: intensity
    type: number
    default: '1'
  - name: range
    type: number
    default: '10'
  - name: spotAngle
    type: number
    default: '30'
  - name: castShadows
    type: boolean
    default: 'False'
  - name: shadowResolution
    type: number
    default: '1024'
  - name: shadowBias
    type: number
    default: '0.005'
  - name: shadowMap
    type: Texture
    default: None
  methods:
  - name: getDirection
    sig: '(): Vec3'
    hint: Get light direction
  - name: getAttenuation
    sig: '(distance: number): number'
    hint: Compute falloff
  - name: getSpotFactor
    sig: '(direction: Vec3): number'
    hint: Spot light falloff
  - name: setType
    sig: '(type: LightType): void'
    hint: Change light type
  - name: setColor
    sig: '(color: Color): void'
    hint: Set RGB color
  - name: setIntensity
    sig: '(intensity: number): void'
    hint: Set brightness
  - name: setRange
    sig: '(range: number): void'
    hint: Set influence radius
  - name: setSpotAngle
    sig: '(angle: number): void'
    hint: Set cone angle
  - name: enableShadows
    sig: '(enable: boolean): void'
    hint: Toggle shadow casting
  - name: updateShadowMap
    sig: '(): void'
    hint: Render shadow depth
  - name: getShadowMatrix
    sig: '(): Mat4'
    hint: Compute shadow transform
  references:
  - playcanvas/scene/renderer/forward-renderer.yaml
- name: Mesh
