## Blueprint — scene
name: scene
language: typescript
target_dir: src/scene
description: ''
constraints:
- WebGL 2.0 context required
- Component-based architecture
- Hierarchical transforms with dirty flags
- Two-root staging system for object lifecycle
references:
- playcanvas/scene/renderer/forward-renderer.yaml
- thief-engine/gameobject/gameobject.yaml
types:
- name: Scene
  kind: class
  status: translated
  target_file: src/scene/scene.ts
  description: Container for all scene objects and rendering state
  fields:
  - name: name
    type: string
    default: Scene
  - name: root
    type: Node
  - name: newsRoot
    type: Node
  - name: camera
    type: Camera
  - name: renderContext
    type: RenderContext
  - name: loaded
    type: boolean
    default: 'False'
  - name: trash
    type: Set<Node>
  methods:
  - name: addObject
    sig: '(node: Node): void'
    hint: Add to newsRoot for staging
  - name: flush
    sig: '(): void'
    hint: Merge newsRoot into root
  - name: reset
    sig: '(): void'
    hint: Clear all nodes and state
  - name: hasNewObjects
    sig: '(): boolean'
    hint: Check if newsRoot has items
  - name: deleteObject
    sig: '(node: Node): void'
    hint: Queue for destruction
  - name: cleanTrash
    sig: '(): void'
    hint: Destroy queued objects
  - name: findNodeByName
    sig: '(name: string): Node | null'
    hint: Recursive search from root
  - name: getActiveCameras
    sig: '(): Camera[]'
    hint: Find all enabled cameras
  - name: update
    sig: '(dt: number): void'
    hint: Update all components
  - name: render
    sig: '(renderer: ForwardRenderer): void'
    hint: Submit to renderer
  references:
  - thief-engine/gameobject/gameobject.yaml
- name: Node
  kind: class
  status: translated
  target_file: src/scene/node.ts
  description: Base scene object with transform and hierarchy
  fields:
  - name: name
    type: string
    default: Node
  - name: parent
    type: Node
  - name: children
    type: Node[]
    default: '[]'
  - name: transform
    type: Transform
  - name: components
    type: Component[]
    default: '[]'
  - name: scene
    type: Scene
  - name: active
    type: boolean
    default: 'True'
  methods:
  - name: addChild
    sig: '(child: Node): void'
    hint: Set parent and add to children
  - name: removeChild
    sig: '(child: Node): void'
    hint: Clear parent and remove
  - name: getChild
    sig: '(index: number): Node'
    hint: Access by index
  - name: getChildCount
    sig: '(): number'
    hint: Return children length
  - name: findChildByName
    sig: '(name: string): Node | null'
    hint: Recursive search
  - name: addComponent
    sig: '<T extends Component>(type: new() => T): T'
    hint: Create and attach
  - name: getComponent
    sig: '<T extends Component>(type: new() => T): T | null'
    hint: Find first match
  - name: getComponentsInChildren
    sig: '<T extends Component>(type: new() => T): T[]'
    hint: Recursive search
  - name: setParent
    sig: '(parent: Node | null): void'
    hint: Reparent node
  - name: getWorldPosition
    sig: '(): Vec3'
    hint: Compute from matrices
  - name: getWorldRotation
    sig: '(): Quat'
    hint: Compute from matrices
  - name: lookAt
    sig: '(target: Vec3, up?: Vec3): void'
    hint: Set rotation to face
  - name: destroy
    sig: '(): void'
    hint: Queue for deletion
  references:
  - thief-engine/gameobject/gameobject.yaml
- name: Camera
  kind: class
  status: translated
  target_file: src/scene/camera.ts
  extends: Component
  description: View and projection matrix provider
  fields:
  - name: fov
    type: number
    default: '45'
  - name: aspect
    type: number
    default: '1'
  - name: near
    type: number
    default: '0.1'
  - name: far
    type: number
    default: '1000'
  - name: orthographic
    type: boolean
    default: 'False'
  - name: orthoHeight
    type: number
    default: '10'
  - name: viewport
    type: Vec4
    default: '[0, 0, 1, 1]'
  - name: clearColor
    type: Color
    default: '[0, 0, 0, 1]'
  - name: clearDepth
    type: number
    default: '1'
  - name: priority
    type: number
    default: '0'
  methods:
  - name: getProjectionMatrix
    sig: '(): Mat4'
    hint: Compute perspective or ortho
  - name: getViewMatrix
    sig: '(): Mat4'
    hint: Inverse of world matrix
  - name: screenToWorld
    sig: '(x: number, y: number, z: number): Vec3'
    hint: Unproject with matrices
  - name: worldToScreen
    sig: '(point: Vec3): Vec3'
    hint: Project with matrices
  - name: getFrustum
    sig: '(): Frustum'
    hint: Extract from matrices
  - name: setFov
    sig: '(degrees: number): void'
    hint: Convert to radians
  - name: setAspect
    sig: '(width: number, height: number): void'
    hint: Compute ratio
  - name: setOrthographic
    sig: '(height: number): void'
    hint: Enable ortho mode
  - name: setPerspective
    sig: '(): void'
    hint: Switch from ortho
  - name: getScreenRay
    sig: '(x: number, y: number): Ray'
    hint: Create from viewport
  references:
  - playcanvas/scene/renderer/forward-renderer.yaml
