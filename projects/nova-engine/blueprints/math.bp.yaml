## Blueprint — math
name: math
language: typescript
target_dir: src/math
description: ''
constraints:
- Use Float32Array for matrix storage
- Column-major matrices for WebGL compatibility
- Immutable where possible, mutable for performance
references:
- playcanvas/core/math/vec3.yaml
- thief-engine/geom/math.yaml
types:
- name: Vec2
  kind: class
  status: translated
  target_file: src/math/vec2.ts
  description: 2D vector with x,y components
  fields:
  - name: x
    type: number
    default: '0'
  - name: y
    type: number
    default: '0'
  methods:
  - name: set
    sig: '(x: number, y: number): Vec2'
    hint: set components and return this
  - name: clone
    sig: '(): Vec2'
    hint: return new Vec2 with same values
  - name: copy
    sig: '(v: Vec2): Vec2'
    hint: copy values from another Vec2
  - name: add
    sig: '(v: Vec2): Vec2'
    hint: add another vector, return new Vec2
  - name: sub
    sig: '(v: Vec2): Vec2'
    hint: subtract another vector, return new Vec2
  - name: mul
    sig: '(v: Vec2): Vec2'
    hint: component-wise multiply, return new Vec2
  - name: mulScalar
    sig: '(s: number): Vec2'
    hint: multiply by scalar, return new Vec2
  - name: div
    sig: '(v: Vec2): Vec2'
    hint: component-wise divide, return new Vec2
  - name: dot
    sig: '(v: Vec2): number'
    hint: dot product of two vectors
  - name: length
    sig: '(): number'
    hint: magnitude of vector
  - name: lengthSq
    sig: '(): number'
    hint: squared magnitude, faster than length
  - name: normalize
    sig: '(): Vec2'
    hint: return unit vector
  - name: lerp
    sig: '(v: Vec2, t: number): Vec2'
    hint: linear interpolation between vectors
  - name: distance
    sig: '(v: Vec2): number'
    hint: distance to another vector
  - name: equals
    sig: '(v: Vec2, epsilon?: number): boolean'
    hint: check equality within epsilon
  - name: toString
    sig: '(): string'
    hint: string representation
  static:
  - name: ZERO
    hint: static Vec2(0,0)
  - name: ONE
    hint: static Vec2(1,1)
  - name: UP
    hint: static Vec2(0,1)
  - name: RIGHT
    hint: static Vec2(1,0)
  references:
  - playcanvas/core/math/vec3.yaml
