<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Nova Engine Demo</title>
  <style>canvas{display:block}</style>
</head>
<body>
<canvas id="canvas" width="640" height="480"></canvas>
<script type="module">
import { createGraphicsDevice, ForwardRenderer, Mat4, Vec3 } from './dist/index.js';

const canvas = document.getElementById('canvas');
const device = await createGraphicsDevice(canvas);

// simple shader
const vs = `#version 300 es
in vec3 position;
uniform mat4 u_viewProj;
void main(){ gl_Position = u_viewProj * vec4(position,1.0); }`;

const fs = `#version 300 es
precision mediump float;
out vec4 fragColor;
void main(){ fragColor = vec4(0.3,0.6,1.0,1.0); }`;

const prog = device.createShader(vs, fs);

// triangle mesh
const gl = device.gl;
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  0, 0.5, 0,
 -0.5,-0.5, 0,
  0.5,-0.5, 0
]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

const mesh = { vao, vertexCount: 3 };

// render loop
const renderer = new ForwardRenderer(device);
function frame() {
  device.useProgram(prog);
  const vp = new Mat4().mul(renderer.view).mul(renderer.proj);
  device.setUniform('u_viewProj', vp.data);
  renderer.render(mesh);
  requestAnimationFrame(frame);
}
renderer.setCamera(canvas.width / canvas.height);
frame();
</script>
</body>
</html>
