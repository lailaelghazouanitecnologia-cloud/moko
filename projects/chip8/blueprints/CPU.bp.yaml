## Blueprint — CPU
name: CPU
language: typescript
target_dir: src/CPU
description: ''
constraints:
- Must implement Chip-8 specification accurately
- 16-bit address space, 4KB memory
- 35 opcodes total
references:
- roska/projects/chip8/cpu.yaml
types:
- name: Cpu
  kind: class
  status: translated
  target_file: src/CPU/cpu.ts
  description: Main CPU emulator implementing Chip-8 architecture
  fields:
  - name: registers
    type: RegisterBank
    default: new RegisterBank()
  - name: stack
    type: Stack
    default: new Stack()
  - name: decoder
    type: InstructionDecoder
    default: new InstructionDecoder()
  - name: memory
    type: Uint8Array
    default: new Uint8Array(4096)
  - name: pc
    type: number
    default: '0x200'
  - name: i
    type: number
    default: '0'
  - name: delayTimer
    type: number
    default: '0'
  - name: soundTimer
    type: number
    default: '0'
  - name: halted
    type: boolean
    default: 'false'
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset all CPU state to initial values
  - name: cycle
    sig: '(): void'
    hint: Execute one instruction cycle
  - name: fetch
    sig: '(): number'
    hint: Fetch 16-bit opcode from memory at PC
  - name: execute
    sig: '(opcode: number): void'
    hint: Decode and execute instruction
  - name: updateTimers
    sig: '(): void'
    hint: Decrement delay and sound timers
  - name: loadProgram
    sig: '(data: Uint8Array, offset?: number): void'
    hint: Load program into memory
  - name: getOpcodeName
    sig: '(opcode: number): string'
    hint: Get human-readable name for opcode
  - name: handleSys
    sig: '(opcode: number): void'
    hint: Handle 0NNN system calls
  - name: handleClear
    sig: '(): void'
    hint: Clear display
  - name: handleReturn
    sig: '(): void'
    hint: Return from subroutine
  - name: handleJump
    sig: '(opcode: number): void'
    hint: Jump to address NNN
  - name: handleCall
    sig: '(opcode: number): void'
    hint: Call subroutine at NNN
  - name: handleSkipEqual
    sig: '(opcode: number): void'
    hint: Skip if VX equals NN
  - name: handleSkipNotEqual
    sig: '(opcode: number): void'
    hint: Skip if VX not equals NN
  - name: handleSkipRegEqual
    sig: '(opcode: number): void'
    hint: Skip if VX equals VY
  - name: handleLoad
    sig: '(opcode: number): void'
    hint: Load NN into VX
  - name: handleAdd
    sig: '(opcode: number): void'
    hint: Add NN to VX
  - name: handleAssign
    sig: '(opcode: number): void'
    hint: Set VX to VY
  - name: handleOr
    sig: '(opcode: number): void'
    hint: VX bitwise OR VY
  - name: handleAnd
    sig: '(opcode: number): void'
    hint: VX bitwise AND VY
  - name: handleXor
    sig: '(opcode: number): void'
    hint: VX bitwise XOR VY
  - name: handleAddReg
    sig: '(opcode: number): void'
    hint: VX += VY with carry
  - name: handleSub
    sig: '(opcode: number): void'
    hint: VX -= VY with borrow
  - name: handleShiftRight
    sig: '(opcode: number): void'
    hint: Shift VX right
  - name: handleSubReverse
    sig: '(opcode: number): void'
    hint: VY -= VX with borrow
  - name: handleShiftLeft
    sig: '(opcode: number): void'
    hint: Shift VX left
  - name: handleSkipRegNotEqual
    sig: '(opcode: number): void'
    hint: Skip if VX not equals VY
  - name: handleLoadI
    sig: '(opcode: number): void'
    hint: Set I to NNN
  - name: handleJumpOffset
    sig: '(opcode: number): void'
    hint: Jump to V0 + NNN
  - name: handleRandom
    sig: '(opcode: number): void'
    hint: VX = random AND NN
  - name: handleDraw
    sig: '(opcode: number): void'
    hint: Draw sprite at VX,VY
  - name: handleSkipKey
    sig: '(opcode: number): void'
    hint: Skip if key VX pressed
  - name: handleSkipNotKey
    sig: '(opcode: number): void'
    hint: Skip if key VX not pressed
  - name: handleLoadDelay
    sig: '(opcode: number): void'
    hint: VX = delay timer
  - name: handleWaitKey
    sig: '(opcode: number): void'
    hint: Wait for key press into VX
  - name: handleSetDelay
    sig: '(opcode: number): void'
    hint: Delay timer = VX
  - name: handleSetSound
    sig: '(opcode: number): void'
    hint: Sound timer = VX
  - name: handleAddI
    sig: '(opcode: number): void'
    hint: I += VX
  - name: handleFont
    sig: '(opcode: number): void'
    hint: I = font character VX
  - name: handleBCD
    sig: '(opcode: number): void'
    hint: Store BCD of VX at I
  - name: handleStore
    sig: '(opcode: number): void'
    hint: Store V0..VX at I
  - name: handleLoadMem
    sig: '(opcode: number): void'
    hint: Load V0..VX from I
  references:
  - chip8/specification/core.yaml
- name: RegisterBank
  kind: class
  status: pending
  target_file: src/CPU/register-bank.ts
  description: Manages 16 general purpose 8-bit registers
  fields:
  - name: v
    type: Uint8Array
    default: new Uint8Array(16)
  methods:
  - name: get
    sig: '(index: number): number'
    hint: Get register V[index]
  - name: set
    sig: '(index: number, value: number): void'
    hint: Set register V[index] with wrap
  - name: getVF
    sig: '(): number'
    hint: Get carry flag register
  - name: setVF
    sig: '(value: number): void'
    hint: Set carry flag register
  - name: clearAll
    sig: '(): void'
    hint: Zero all registers
  - name: dump
    sig: '(): number[]'
    hint: Get all register values
  - name: load
    sig: '(values: number[]): void'
    hint: Load all register values
  references:
  - chip8/specification/registers.yaml
- name: Stack
  kind: class
  status: pending
  target_file: src/CPU/stack.ts
  description: 16-level stack for subroutine calls
  fields:
  - name: stack
    type: Uint16Array
    default: new Uint16Array(16)
  - name: pointer
    type: number
    default: '-1'
  methods:
  - name: push
    sig: '(value: number): void'
    hint: Push value onto stack
  - name: pop
    sig: '(): number'
    hint: Pop value from stack
  - name: peek
    sig: '(): number'
    hint: View top value without pop
  - name: isEmpty
    sig: '(): boolean'
    hint: Check if stack empty
  - name: isFull
    sig: '(): boolean'
    hint: Check if stack full
  - name: clear
    sig: '(): void'
    hint: Reset stack pointer
  - name: size
    sig: '(): number'
    hint: Get current stack depth
  references:
  - chip8/specification/stack.yaml
- name: InstructionDecoder
  kind: class
  status: pending
  target_file: src/CPU/instruction-decoder.ts
  description: Decodes 16-bit opcodes into components
  methods:
  - name: getNibble
    sig: '(opcode: number, pos: number): number'
    hint: Extract nibble at position
  - name: getX
    sig: '(opcode: number): number'
    hint: Get register X index
  - name: getY
    sig: '(opcode: number): number'
    hint: Get register Y index
  - name: getN
    sig: '(opcode: number): number'
    hint: Get 4-bit N value
  - name: getNN
    sig: '(opcode: number): number'
    hint: Get 8-bit NN value
  - name: getNNN
    sig: '(opcode: number): number'
    hint: Get 12-bit NNN address
  - name: getType
    sig: '(opcode: number): string'
    hint: Determine instruction type
  - name: isValid
    sig: '(opcode: number): boolean'
    hint: Check if opcode valid
  - name: disassemble
    sig: '(opcode: number): string'
    hint: Convert to assembly syntax
  - name: extractPattern
    sig: '(opcode: number): string'
    hint: Get instruction pattern
  references:
  - chip8/specification/instructions.yaml
