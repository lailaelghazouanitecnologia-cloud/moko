## Blueprint — input
name: input
language: typescript
target_dir: src/input
description: ''
constraints:
- Must support 16-key hexadecimal keypad layout
- Must handle key press/release events
- Must provide state polling interface
- Must be compatible with Chip-8 specifications
references:
- chip8/src/input.yaml
types:
- name: Keypad
  kind: class
  status: pending
  target_file: src/input/keypad.ts
  description: Manages 16-key hexadecimal keypad state and input handling
  fields:
  - name: keys
    type: Map<Key, KeyState>
    default: new Map()
  - name: inputHandler
    type: InputHandler
    default: new InputHandler()
  methods:
  - name: pressKey
    sig: '(key: Key): void'
    hint: Set key state to pressed
  - name: releaseKey
    sig: '(key: Key): void'
    hint: Set key state to released
  - name: isKeyPressed
    sig: '(key: Key): boolean'
    hint: Check if specific key is pressed
  - name: getPressedKey
    sig: '(): Key | null'
    hint: Return first pressed key or null
  - name: waitForKeyPress
    sig: '(): Promise<Key>'
    hint: Async wait for next key press
  - name: reset
    sig: '(): void'
    hint: Clear all key states
  - name: getKeyState
    sig: '(key: Key): KeyState'
    hint: Get current state of key
  - name: getPressedKeys
    sig: '(): Key[]'
    hint: Return array of all pressed keys
  - name: setInputHandler
    sig: '(handler: InputHandler): void'
    hint: Replace input handler instance
  - name: handleKeyEvent
    sig: '(event: KeyboardEvent): void'
    hint: Process DOM keyboard event
  - name: mapKeyCode
    sig: '(keyCode: string): Key | null'
    hint: Convert key code to Key enum
  - name: update
    sig: '(deltaTime: number): void'
    hint: Update key states with time delta
  references:
  - src/input/keypad.roska
- name: Key
  kind: enum
  status: translated
  target_file: src/input/key.ts
  description: Enumeration of 16 hexadecimal keys in Chip-8 keypad
  methods:
  - name: fromValue
    sig: '(value: number): Key'
    hint: Convert number to Key enum
  - name: toValue
    sig: '(): number'
    hint: Get numeric value of key
  - name: toString
    sig: '(): string'
    hint: Get hex string representation
  - name: fromString
    sig: '(str: string): Key | null'
    hint: Parse string to Key enum
  - name: values
    sig: '(): Key[]'
    hint: Get all key values
  - name: isValid
    sig: '(value: number): boolean'
    hint: Check if value is valid key
  static:
  - name: ZERO
    hint: Key 0x0
  - name: ONE
    hint: Key 0x1
  - name: TWO
    hint: Key 0x2
  - name: THREE
    hint: Key 0x3
  - name: FOUR
    hint: Key 0x4
  - name: FIVE
    hint: Key 0x5
  - name: SIX
    hint: Key 0x6
  - name: SEVEN
    hint: Key 0x7
  - name: EIGHT
    hint: Key 0x8
  - name: NINE
    hint: Key 0x9
  - name: A
    hint: Key 0xA
  - name: B
    hint: Key 0xB
  - name: C
    hint: Key 0xC
  - name: D
    hint: Key 0xD
  - name: E
    hint: Key 0xE
  - name: F
    hint: Key 0xF
  references:
  - src/input/key.roska
- name: InputHandler
  kind: class
  status: pending
  target_file: src/input/input-handler.ts
  description: Handles keyboard input events and maps to Chip-8 keys
  fields:
  - name: keyMapping
    type: Map<string, Key>
    default: new Map()
  - name: enabled
    type: boolean
    default: 'true'
  methods:
  - name: registerKeyMapping
    sig: '(keyCode: string, key: Key): void'
    hint: Map keyboard code to Key
  - name: unregisterKeyMapping
    sig: '(keyCode: string): void'
    hint: Remove keyboard mapping
  - name: handleKeyDown
    sig: '(event: KeyboardEvent): void'
    hint: Process key down event
  - name: handleKeyUp
    sig: '(event: KeyboardEvent): void'
    hint: Process key up event
  - name: setEnabled
    sig: '(enabled: boolean): void'
    hint: Enable/disable input handling
  - name: isEnabled
    sig: '(): boolean'
    hint: Check if handler enabled
  - name: getKeyMapping
    sig: '(keyCode: string): Key | null'
    hint: Get mapped key for code
  - name: setupDefaultMappings
    sig: '(): void'
    hint: Configure standard key layout
  - name: clearMappings
    sig: '(): void'
    hint: Remove all key mappings
  - name: preventDefault
    sig: '(event: KeyboardEvent): void'
    hint: Prevent default browser action
  - name: attachEventListeners
    sig: '(target: EventTarget): void'
    hint: Add DOM event listeners
  - name: detachEventListeners
    sig: '(target: EventTarget): void'
    hint: Remove DOM event listeners
  references:
  - src/input/input-handler.roska
- name: KeyState
  kind: class
  status: pending
  target_file: src/input/key-state.ts
  description: Represents the current state of a key including press duration
  fields:
  - name: pressed
    type: boolean
    default: 'false'
  - name: pressTime
    type: number
    default: '0'
  - name: releaseTime
    type: number
    default: '0'
  methods:
  - name: press
    sig: '(currentTime: number): void'
    hint: Mark key as pressed
  - name: release
    sig: '(currentTime: number): void'
    hint: Mark key as released
  - name: isPressed
    sig: '(): boolean'
    hint: Check if currently pressed
  - name: getPressDuration
    sig: '(currentTime: number): number'
    hint: Get time since pressed
  - name: getReleaseDuration
    sig: '(currentTime: number): number'
    hint: Get time since released
  - name: wasPressed
    sig: '(duration: number): boolean'
    hint: Check if pressed within duration
  - name: clone
    sig: '(): KeyState'
    hint: Create copy of state
  - name: reset
    sig: '(): void'
    hint: Reset to default state
  - name: update
    sig: '(deltaTime: number): void'
    hint: Update timing info
  - name: toString
    sig: '(): string'
    hint: Get string representation
  references:
  - src/input/key-state.roska
