## Blueprint — Emulator
name: Emulator
language: typescript
target_dir: src/Emulator
description: ''
constraints:
- Must integrate with existing CPU, Display, Input, Memory, Timer
- Must provide cycle-accurate emulation
- Must support save states
- Must handle CHIP-8 quirks
references:
- roska/projects/chip8/emulator.yaml
types:
- name: Chip8Emulator
  kind: class
  status: translated
  target_file: src/Emulator/chip8-emulator.ts
  description: Main CHIP-8 emulator orchestrating all components
  fields:
  - name: cpu
    type: CPU
    default: new CPU()
  - name: memory
    type: Memory
    default: new Memory(4096)
  - name: display
    type: Display
    default: new Display(64, 32)
  - name: keypad
    type: Input
    default: new Input()
  - name: delayTimer
    type: Timer
    default: new Timer()
  - name: soundTimer
    type: Timer
    default: new Timer()
  - name: clock
    type: Clock
    default: new Clock()
  - name: isRunning
    type: boolean
    default: 'false'
  - name: cyclesPerFrame
    type: number
    default: '10'
  - name: quirks
    type: QuirkSettings
    default: new QuirkSettings()
  methods:
  - name: initialize
    sig: '(): void'
    hint: Reset all components to initial state
  - name: loadRom
    sig: '(rom: Uint8Array): void'
    hint: Load ROM into memory at 0x200
  - name: start
    sig: '(): void'
    hint: Begin emulation loop
  - name: stop
    sig: '(): void'
    hint: Pause emulation
  - name: reset
    sig: '(): void'
    hint: Reset to power-on state
  - name: step
    sig: '(): void'
    hint: Execute single cycle
  - name: stepFrame
    sig: '(): void'
    hint: Execute cycles for one frame
  - name: update
    sig: '(deltaTime: number): void'
    hint: Update timers and components
  - name: getPixel
    sig: '(x: number, y: number): boolean'
    hint: Get display pixel state
  - name: setKey
    sig: '(key: number, pressed: boolean): void'
    hint: Update keypad state
  - name: saveState
    sig: '(): EmulatorState'
    hint: Capture complete state
  - name: loadState
    sig: '(state: EmulatorState): void'
    hint: Restore complete state
  - name: getRegister
    sig: '(index: number): number'
    hint: Get V register value
  - name: setRegister
    sig: '(index: number, value: number): void'
    hint: Set V register value
  - name: getProgramCounter
    sig: '(): number'
    hint: Get current PC
  - name: getStackPointer
    sig: '(): number'
    hint: Get current SP
  - name: getDelayTimer
    sig: '(): number'
    hint: Get delay timer value
  - name: getSoundTimer
    sig: '(): number'
    hint: Get sound timer value
  - name: setQuirk
    sig: '(quirk: QuirkType, enabled: boolean): void'
    hint: Enable/disable quirk
  - name: getQuirk
    sig: '(quirk: QuirkType): boolean'
    hint: Check quirk state
  - name: setCyclesPerFrame
    sig: '(cycles: number): void'
    hint: Adjust speed
  - name: getFrameBuffer
    sig: '(): boolean[]'
    hint: Get display pixels
  - name: isWaitingForKey
    sig: '(): boolean'
    hint: Check if blocked on input
  - name: getWaitingKeyRegister
    sig: '(): number'
    hint: Get register for FX0A
  - name: dumpMemory
    sig: '(start: number, length: number): number[]'
    hint: Get memory slice
  - name: getMemorySize
    sig: '(): number'
    hint: Get total memory
  references:
  - src/CPU/cpu.yaml
  - src/Display/framebuffer.yaml
  - src/Input/keypad.yaml
  - src/Memory/ram.yaml
  - src/Timer/timer.yaml
- name: Clock
  kind: class
  status: pending
  target_file: src/Emulator/clock.ts
  description: Manages emulation timing and speed control
  fields:
  - name: frequency
    type: number
    default: '500'
  - name: lastTick
    type: number
    default: '0'
  - name: accumulatedTime
    type: number
    default: '0'
  - name: cyclesPerSecond
    type: number
    default: '500'
  methods:
  - name: setFrequency
    sig: '(hz: number): void'
    hint: Set emulation speed
  - name: getFrequency
    sig: '(): number'
    hint: Get current speed
  - name: tick
    sig: '(currentTime: number): number'
    hint: Calculate cycles to run
  - name: reset
    sig: '(): void'
    hint: Clear accumulated time
  - name: setCyclesPerSecond
    sig: '(cycles: number): void'
    hint: Adjust cycle rate
  - name: getCyclesPerSecond
    sig: '(): number'
    hint: Get cycle rate
  - name: getElapsedTime
    sig: '(): number'
    hint: Get accumulated time
  - name: shouldTick
    sig: '(currentTime: number): boolean'
    hint: Check if cycle needed
  references:
  - src/CPU/cpu.yaml
- name: QuirkSettings
  kind: class
  status: pending
  target_file: src/Emulator/quirk-settings.ts
  description: CHIP-8 compatibility quirks configuration
  fields:
  - name: shiftVxVy
    type: boolean
    default: 'false'
  - name: loadStoreIncrementI
    type: boolean
    default: 'false'
  - name: clipSprites
    type: boolean
    default: 'true'
  - name: jumpVxNNN
    type: boolean
    default: 'false'
  - name: logicSetVF
    type: boolean
    default: 'false'
  methods:
  - name: setQuirk
    sig: '(quirk: QuirkType, enabled: boolean): void'
    hint: Enable specific quirk
  - name: getQuirk
    sig: '(quirk: QuirkType): boolean'
    hint: Check quirk state
  - name: loadPreset
    sig: '(preset: QuirkPreset): void'
    hint: Apply preset config
  - name: clone
    sig: '(): QuirkSettings'
    hint: Create copy
  references:
  - src/CPU/cpu.yaml
- name: QuirkType
  kind: enum
  status: pending
  target_file: src/Emulator/quirk-type.ts
  description: Available CHIP-8 quirks
  static:
  - name: SHIFT_VX_VY
    hint: 8XY6/8XYE use VY instead of VX
  - name: LOAD_STORE_INCREMENT_I
    hint: FX55/FX65 increment I register
  - name: CLIP_SPRITES
    hint: Wrap sprites at screen edges
  - name: JUMP_VX_NNN
    hint: BNNN adds VX to address
  - name: LOGIC_SET_VF
    hint: Logical ops clear/set VF
  references:
  - src/CPU/cpu.yaml
- name: QuirkPreset
  kind: enum
  status: pending
  target_file: src/Emulator/quirk-preset.ts
  description: Pre-configured quirk combinations
  static:
  - name: CHIP8
    hint: Original CHIP-8 behavior
  - name: SCHIP
    hint: Super-CHIP compatibility
  - name: XOCHIP
    hint: XO-CHIP compatibility
  - name: MODERN
    hint: Modern interpreter behavior
  references:
  - src/CPU/cpu.yaml
- name: EmulatorState
  kind: interface
  status: pending
  target_file: src/Emulator/emulator-state.ts
  description: Complete emulator state for save/load
  fields:
  - name: cpu
    type: CpuState
  - name: memory
    type: Uint8Array
  - name: display
    type: boolean[]
  - name: keypad
    type: KeypadState
  - name: delayTimer
    type: number
  - name: soundTimer
    type: number
  - name: quirks
    type: QuirkSettings
  references:
  - src/CPU/cpu.yaml
  - src/Display/framebuffer.yaml
  - src/Input/keypad.yaml
  - src/Memory/ram.yaml
  - src/Timer/timer.yaml
