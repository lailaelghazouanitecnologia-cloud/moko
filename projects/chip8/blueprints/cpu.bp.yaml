## Blueprint — cpu
name: cpu
language: typescript
target_dir: src/cpu
description: ''
constraints:
- Emulate Chip-8 CPU behavior accurately
- Support all 35 Chip-8 instructions
- Handle 4KB memory model
- Maintain 60Hz timer frequency
references:
- chip8/src/cpu.yaml
types:
- name: Cpu
  kind: class
  status: translated
  target_file: src/cpu/cpu.ts
  description: Main CPU emulator executing Chip-8 instructions
  fields:
  - name: memory
    type: Uint8Array
    default: new Uint8Array(4096)
  - name: registers
    type: Registers
  - name: stack
    type: Stack
  - name: pc
    type: number
    default: '0x200'
  - name: i
    type: number
    default: '0'
  - name: delayTimer
    type: number
    default: '0'
  - name: soundTimer
    type: number
    default: '0'
  - name: halted
    type: boolean
    default: 'false'
  methods:
  - name: reset
    sig: '(): void'
    hint: Reset CPU to initial state
  - name: cycle
    sig: '(): void'
    hint: Execute one instruction cycle
  - name: fetch
    sig: '(): number'
    hint: Fetch 16-bit opcode from memory
  - name: decode
    sig: '(opcode: number): Opcode'
    hint: Decode raw opcode to instruction
  - name: execute
    sig: '(opcode: Opcode): void'
    hint: Execute decoded instruction
  - name: updateTimers
    sig: '(): void'
    hint: Decrement delay and sound timers
  - name: getOpcodeName
    sig: '(opcode: number): string'
    hint: Get human-readable instruction name
  - name: skipNextInstruction
    sig: '(): void'
    hint: Skip next instruction
  - name: jump
    sig: '(address: number): void'
    hint: Jump to address
  - name: call
    sig: '(address: number): void'
    hint: Call subroutine
  - name: return
    sig: '(): void'
    hint: Return from subroutine
  - name: loadRom
    sig: '(data: Uint8Array): void'
    hint: Load ROM into memory at 0x200
  - name: isHalted
    sig: '(): boolean'
    hint: Check if CPU halted
  - name: getState
    sig: '(): CpuState'
    hint: Get current CPU state snapshot
  references:
  - chip8/spec/cpu.yaml
- name: Registers
  kind: class
  status: pending
  target_file: src/cpu/registers.ts
  description: Chip-8 16 general-purpose registers V0-VF
  fields:
  - name: v
    type: Uint8Array
    default: new Uint8Array(16)
  methods:
  - name: get
    sig: '(index: number): number'
    hint: Get register value
  - name: set
    sig: '(index: number, value: number): void'
    hint: Set register with 8-bit wrap
  - name: getVf
    sig: '(): number'
    hint: Get flag register
  - name: setVf
    sig: '(value: number): void'
    hint: Set flag register
  - name: clear
    sig: '(): void'
    hint: Clear all registers
  - name: dump
    sig: '(): number[]'
    hint: Get all register values
  - name: load
    sig: '(values: number[]): void'
    hint: Load multiple registers
  references:
  - chip8/spec/registers.yaml
- name: Stack
  kind: class
  status: pending
  target_file: src/cpu/stack.ts
  description: 16-level stack for subroutine calls
  fields:
  - name: stack
    type: number[]
    default: '[]'
  - name: pointer
    type: number
    default: '-1'
  methods:
  - name: push
    sig: '(address: number): void'
    hint: Push address onto stack
  - name: pop
    sig: '(): number'
    hint: Pop address from stack
  - name: peek
    sig: '(): number'
    hint: View top without popping
  - name: isEmpty
    sig: '(): boolean'
    hint: Check if stack empty
  - name: isFull
    sig: '(): boolean'
    hint: Check if stack full
  - name: clear
    sig: '(): void'
    hint: Clear entire stack
  - name: getDepth
    sig: '(): number'
    hint: Get current stack depth
  references:
  - chip8/spec/stack.yaml
- name: Opcode
  kind: class
  status: pending
  target_file: src/cpu/opcode.ts
  description: Decoded Chip-8 instruction
  fields:
  - name: raw
    type: number
  - name: instruction
    type: string
  - name: x
    type: number
  - name: y
    type: number
  - name: n
    type: number
  - name: nn
    type: number
  - name: nnn
    type: number
  methods:
  - name: constructor
    sig: '(opcode: number)'
    hint: Decode raw opcode
  - name: toString
    sig: '(): string'
    hint: Get string representation
  - name: getType
    sig: '(): OpcodeType'
    hint: Get instruction type
  - name: matches
    sig: '(pattern: string): boolean'
    hint: Check if matches pattern
  - name: extract
    sig: '(mask: number): number'
    hint: Extract bits with mask
  references:
  - chip8/spec/instructions.yaml
