## Blueprint — interpreter
name: interpreter
language: typescript
target_dir: src/interpreter
description: ''
constraints:
- Must handle 35 Chip-8 instructions
- Cycle-accurate timing for 500Hz emulation
- Thread-safe state updates
references:
- chip8/src/interpreter.yaml
types:
- name: Interpreter
  kind: class
  status: pending
  target_file: src/interpreter/interpreter.ts
  description: Main interpreter loop managing fetch-decode-execute cycle
  fields:
  - name: memory
    type: Memory
    default: None
  - name: cpu
    type: CPU
    default: None
  - name: decoder
    type: Decoder
    default: None
  - name: executor
    type: Executor
    default: None
  - name: isRunning
    type: boolean
    default: 'False'
  - name: cycleCount
    type: number
    default: '0'
  methods:
  - name: initialize
    sig: '(memory: Memory, cpu: CPU): void'
    hint: Wire components together
  - name: start
    sig: '(): void'
    hint: Begin execution loop
  - name: stop
    sig: '(): void'
    hint: Halt execution
  - name: step
    sig: '(): void'
    hint: Execute single cycle
  - name: runFrame
    sig: '(): number'
    hint: Execute until frame complete
  - name: fetch
    sig: '(): number'
    hint: Read next 16-bit opcode
  - name: getOpcodeAt
    sig: '(address: number): number'
    hint: Read opcode from address
  - name: updateTimers
    sig: '(): void'
    hint: Decrement delay/sound
  - name: handleInterrupts
    sig: '(): void'
    hint: Check for keypad waits
  - name: getCycleCount
    sig: '(): number'
    hint: Return executed cycles
  - name: reset
    sig: '(): void'
    hint: Clear all state
  - name: setSpeed
    sig: '(hz: number): void'
    hint: Adjust emulation speed
  - name: isWaitingForInput
    sig: '(): boolean'
    hint: Check keypad wait flag
  - name: skipKeyWait
    sig: '(): void'
    hint: Cancel input wait
  - name: getState
    sig: '(): InterpreterState'
    hint: Return current state snapshot
  references:
  - src/interpreter/roska/interpreter.yaml
- name: Instruction
  kind: class
  status: pending
  target_file: src/interpreter/instruction.ts
  description: Represents decoded Chip-8 instruction with operands
  fields:
  - name: opcode
    type: number
    default: '0'
  - name: type
    type: InstructionType
    default: UNKNOWN
  - name: x
    type: number
    default: '0'
  - name: y
    type: number
    default: '0'
  - name: nnn
    type: number
    default: '0'
  - name: nn
    type: number
    default: '0'
  - name: n
    type: number
    default: '0'
  methods:
  - name: constructor
    sig: '(opcode: number)'
    hint: Parse raw opcode
  - name: toString
    sig: '(): string'
    hint: Human-readable disassembly
  - name: getMnemonic
    sig: '(): string'
    hint: Return ASM mnemonic
  - name: isJump
    sig: '(): boolean'
    hint: Check if branches
  - name: isCall
    sig: '(): boolean'
    hint: Check if subroutine
  - name: isReturn
    sig: '(): boolean'
    hint: Check if RET
  - name: isSkip
    sig: '(): boolean'
    hint: Check if skip next
  - name: isDraw
    sig: '(): boolean'
    hint: Check if DRW
  - name: isKeyOp
    sig: '(): boolean'
    hint: Check if keypad related
  - name: isSound
    sig: '(): boolean'
    hint: Check if buzzer
  - name: isLoadStore
    sig: '(): boolean'
    hint: Check if LD/ST
  - name: isArithmetic
    sig: '(): boolean'
    hint: Check if math op
  - name: isLogical
    sig: '(): boolean'
    hint: Check if bit op
  - name: affectsPC
    sig: '(): boolean'
    hint: Check if modifies PC
  - name: affectsSP
    sig: '(): boolean'
    hint: Check if stack op
  - name: getAffectedRegisters
    sig: '(): number[]'
    hint: List touched V regs
  - name: clone
    sig: '(): Instruction'
    hint: Deep copy
  static:
  - name: fromOpcode
    sig: '(opcode: number): Instruction'
    hint: Factory method
  references:
  - src/interpreter/roska/instruction.yaml
- name: Decoder
  kind: class
  status: translated
  target_file: src/interpreter/decoder.ts
  description: Decodes raw opcodes into Instruction objects
  fields:
  - name: decodeTable
    type: Map<number, InstructionType>
    default: new Map()
  methods:
  - name: decode
    sig: '(opcode: number): Instruction'
    hint: Convert opcode to instruction
  - name: decode0NNN
    sig: '(opcode: number): InstructionType'
    hint: Handle 0xxx group
  - name: decode8XY
    sig: '(opcode: number): InstructionType'
    hint: Handle 8xyx group
  - name: decodeEX
    sig: '(opcode: number): InstructionType'
    hint: Handle Exxx group
  - name: decodeFX
    sig: '(opcode: number): InstructionType'
    hint: Handle Fxxx group
  - name: buildDecodeTable
    sig: '(): void'
    hint: Initialize lookup table
  - name: getInstructionType
    sig: '(opcode: number): InstructionType'
    hint: Fast table lookup
  - name: validateOpcode
    sig: '(opcode: number): boolean'
    hint: Check if legal
  - name: disassemble
    sig: '(instruction: Instruction): string'
    hint: Create ASM string
  - name: getOperandMask
    sig: '(type: InstructionType): number'
    hint: Return bit mask
  - name: extractNibbles
    sig: '(opcode: number): number[]'
    hint: Split into 4-bit parts
  - name: extractBytes
    sig: '(opcode: number): number[]'
    hint: Split into 8-bit parts
  - name: isExtended
    sig: '(opcode: number): boolean'
    hint: Check SCHIP/CHIP-8E
  - name: getInstructionLength
    sig: '(type: InstructionType): number'
    hint: Return byte size
  - name: getInstructionCycles
    sig: '(type: InstructionType): number'
    hint: Return cycle cost
  - name: getInstructionName
    sig: '(type: InstructionType): string'
    hint: Return enum name
  references:
  - src/interpreter/roska/decoder.yaml
- name: Executor
  kind: class
  status: pending
  target_file: src/interpreter/executor.ts
  description: Executes decoded instructions against CPU state
  fields:
  - name: cpu
    type: CPU
    default: None
  - name: memory
    type: Memory
    default: None
  - name: display
    type: Display
    default: None
  - name: keypad
    type: Keypad
    default: None
  - name: random
    type: Random
    default: None
  methods:
  - name: execute
    sig: '(instruction: Instruction): void'
    hint: Dispatch to handler
  - name: executeClear
    sig: '(instruction: Instruction): void'
    hint: 00E0 clear screen
  - name: executeReturn
    sig: '(instruction: Instruction): void'
    hint: 00EE from sub
  - name: executeJump
    sig: '(instruction: Instruction): void'
    hint: 1nnn goto nnn
  - name: executeCall
    sig: '(instruction: Instruction): void'
    hint: 2nnn call nnn
  - name: executeSkipEqual
    sig: '(instruction: Instruction): void'
    hint: 3xnn skip Vx==nn
  - name: executeSkipNotEqual
    sig: '(instruction: Instruction): void'
    hint: 4xnn skip Vx!=nn
  - name: executeSkipRegEqual
    sig: '(instruction: Instruction): void'
    hint: 5xy0 skip Vx==Vy
  - name: executeLoad
    sig: '(instruction: Instruction): void'
    hint: 6xnn Vx=nn
  - name: executeAdd
    sig: '(instruction: Instruction): void'
    hint: 7xnn Vx+=nn
  - name: executeAssign
    sig: '(instruction: Instruction): void'
    hint: 8xy0 Vx=Vy
  - name: executeOr
    sig: '(instruction: Instruction): void'
    hint: 8xy1 Vx|=Vy
  - name: executeAnd
    sig: '(instruction: Instruction): void'
    hint: 8xy2 Vx&=Vy
  - name: executeXor
    sig: '(instruction: Instruction): void'
    hint: 8xy3 Vx^=Vy
  - name: executeAddReg
    sig: '(instruction: Instruction): void'
    hint: 8xy4 Vx+=Vy VF
  - name: executeSub
    sig: '(instruction: Instruction): void'
    hint: 8xy5 Vx-=Vy VF
  - name: executeShiftRight
    sig: '(instruction: Instruction): void'
    hint: 8xy6 Vx>>=1 VF
  - name: executeSubReverse
    sig: '(instruction: Instruction): void'
    hint: 8xy7 Vx=Vy-Vx VF
  - name: executeShiftLeft
    sig: '(instruction: Instruction): void'
    hint: 8xyE Vx<<=1 VF
  - name: executeSkipRegNotEqual
    sig: '(instruction: Instruction): void'
    hint: 9xy0 skip Vx!=Vy
  - name: executeLoadIndex
    sig: '(instruction: Instruction): void'
    hint: Annn I=nnn
  - name: executeJumpOffset
    sig: '(instruction: Instruction): void'
    hint: Bnnn PC=V0+nnn
  - name: executeRandom
    sig: '(instruction: Instruction): void'
    hint: Cxnn Vx=rand&nn
  - name: executeDraw
    sig: '(instruction: Instruction): void'
    hint: Dxyn draw Vy at Vx
  - name: executeSkipKey
    sig: '(instruction: Instruction): void'
    hint: Ex9E skip if key Vx
  - name: executeSkipNotKey
    sig: '(instruction: Instruction): void'
    hint: ExA1 skip if !key
  - name: executeGetDelay
    sig: '(instruction: Instruction): void'
    hint: Fx07 Vx=delay
  - name: executeWaitKey
    sig: '(instruction: Instruction): void'
    hint: Fx0A Vx=getkey
  - name: executeSetDelay
    sig: '(instruction: Instruction): void'
    hint: Fx15 delay=Vx
  - name: executeSetSound
    sig: '(instruction: Instruction): void'
    hint: Fx18 sound=Vx
  - name: executeAddIndex
    sig: '(instruction: Instruction): void'
    hint: Fx1E I+=Vx VF
  - name: executeFontChar
    sig: '(instruction: Instruction): void'
    hint: Fx29 I=sprite Vx
  - name: executeBCD
    sig: '(instruction: Instruction): void'
    hint: Fx33 BCD(Vx) to I
  - name: executeStore
    sig: '(instruction: Instruction): void'
    hint: Fx55 V0..Vx to I
  - name: executeLoadMem
    sig: '(instruction: Instruction): void'
    hint: Fx65 I to V0..Vx
  - name: checkCollision
    sig: '(x: number, y: number, height: number): boolean'
    hint: Return pixel xor
  - name: wrapCoordinate
    sig: '(coord: number, max: number): number'
    hint: Wrap screen edge
  references:
  - src/interpreter/roska/executor.yaml
