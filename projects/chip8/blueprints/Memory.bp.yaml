## Blueprint — Memory
name: Memory
language: typescript
target_dir: src/Memory
description: ''
constraints:
- Memory addresses are 12-bit (0x000-0xFFF)
- ROM is read-only after loading
- RAM provides read/write access
- MemoryMap manages address space mapping
references:
- roska/projects/chip8/memory.yaml
types:
- name: MemoryMap
  kind: class
  status: pending
  target_file: src/Memory/memory-map.ts
  description: Maps 12-bit addresses to memory regions
  fields:
  - name: ram
    type: Ram
    default: None
  - name: rom
    type: Rom
    default: None
  - name: font
    type: Uint8Array
    default: None
  methods:
  - name: read
    sig: '(address: number): number'
    hint: Route to appropriate region
  - name: write
    sig: '(address: number, value: number): void'
    hint: Route to RAM only
  - name: loadRom
    sig: '(data: Uint8Array): void'
    hint: Load program into ROM
  - name: loadFont
    sig: '(fontData: Uint8Array): void'
    hint: Load font into reserved area
  - name: isRomAddress
    sig: '(address: number): boolean'
    hint: Check if address in ROM range
  - name: isRamAddress
    sig: '(address: number): boolean'
    hint: Check if address in RAM range
  - name: isFontAddress
    sig: '(address: number): boolean'
    hint: Check if address in font range
  - name: getMemoryRegion
    sig: '(address: number): MemoryRegion'
    hint: Determine which region owns address
  - name: validateAddress
    sig: '(address: number): void'
    hint: Throw if address invalid
  - name: reset
    sig: '(): void'
    hint: Clear all memory regions
  references:
  - src/Memory/Roska.yaml
- name: Ram
  kind: class
  status: translated
  target_file: src/Memory/ram.ts
  description: Random Access Memory implementation
  fields:
  - name: data
    type: Uint8Array
    default: new Uint8Array(0x1000)
  - name: size
    type: number
    default: '4096'
  methods:
  - name: read
    sig: '(address: number): number'
    hint: Return byte at address
  - name: write
    sig: '(address: number, value: number): void'
    hint: Store byte at address
  - name: readWord
    sig: '(address: number): number'
    hint: Read 16-bit big-endian
  - name: writeWord
    sig: '(address: number, value: number): void'
    hint: Write 16-bit big-endian
  - name: clear
    sig: '(): void'
    hint: Zero all memory
  - name: copy
    sig: '(source: Uint8Array, offset: number): void'
    hint: Copy data into RAM
  - name: dump
    sig: '(start: number, length: number): Uint8Array'
    hint: Extract memory range
  - name: load
    sig: '(data: Uint8Array, offset: number): void'
    hint: Load data at offset
  - name: isValidAddress
    sig: '(address: number): boolean'
    hint: Check address range
  - name: getSize
    sig: '(): number'
    hint: Return memory size
  - name: reset
    sig: '(): void'
    hint: Clear to zeros
  references:
  - src/Memory/Roska.yaml
- name: Rom
  kind: class
  status: pending
  target_file: src/Memory/rom.ts
  description: Read-Only Memory implementation
  fields:
  - name: data
    type: Uint8Array
    default: None
  - name: size
    type: number
    default: '0'
  - name: loaded
    type: boolean
    default: 'False'
  methods:
  - name: read
    sig: '(address: number): number'
    hint: Return byte from ROM
  - name: readWord
    sig: '(address: number): number'
    hint: Read 16-bit big-endian
  - name: load
    sig: '(data: Uint8Array): void'
    hint: Load program data
  - name: isLoaded
    sig: '(): boolean'
    hint: Check if ROM loaded
  - name: getSize
    sig: '(): number'
    hint: Return ROM size
  - name: isValidAddress
    sig: '(address: number): boolean'
    hint: Check address range
  - name: getData
    sig: '(): Uint8Array'
    hint: Return ROM data
  - name: reset
    sig: '(): void'
    hint: Clear ROM data
  - name: validateRomSize
    sig: '(size: number): void'
    hint: Check size limits
  - name: getStartAddress
    sig: '(): number'
    hint: Return base address
  - name: getEndAddress
    sig: '(): number'
    hint: Return top address
  static:
  - name: MAX_SIZE
    hint: Maximum ROM size 0xE00
  - name: START_ADDRESS
    hint: ROM starts at 0x200
  references:
  - src/Memory/Roska.yaml
