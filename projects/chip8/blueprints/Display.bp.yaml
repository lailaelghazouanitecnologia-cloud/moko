## Blueprint — Display
name: Display
language: typescript
target_dir: src/Display
description: ''
constraints:
- Must support 64x32 pixel resolution
- Must implement XOR drawing for sprites
- Must detect pixel collision
references:
- roska/projects/chip8/display.yaml
types:
- name: Display
  kind: class
  status: pending
  target_file: src/Display/display.ts
  description: Manages Chip-8 screen rendering and frame updates
  fields:
  - name: width
    type: number
    default: '64'
  - name: height
    type: number
    default: '32'
  - name: frameBuffer
    type: FrameBuffer
  - name: needsRedraw
    type: boolean
    default: 'False'
  methods:
  - name: clear
    sig: '(): void'
    hint: Clear entire screen buffer
  - name: drawSprite
    sig: '(x: number, y: number, spriteData: Uint8Array): boolean'
    hint: Draw sprite at coords, return collision
  - name: getPixel
    sig: '(x: number, y: number): boolean'
    hint: Get pixel state at coordinates
  - name: setPixel
    sig: '(x: number, y: number, value: boolean): void'
    hint: Set pixel at coordinates
  - name: togglePixel
    sig: '(x: number, y: number): boolean'
    hint: Toggle pixel and return collision state
  - name: render
    sig: '(): void'
    hint: Render frame buffer to canvas
  - name: isDirty
    sig: '(): boolean'
    hint: Check if screen needs redraw
  - name: markClean
    sig: '(): void'
    hint: Mark display as up-to-date
  - name: getDimensions
    sig: '(): {width: number, height: number}'
    hint: Return screen dimensions
  - name: scrollUp
    sig: '(lines: number): void'
    hint: Scroll display up by lines
  - name: scrollDown
    sig: '(lines: number): void'
    hint: Scroll display down by lines
  - name: scrollLeft
    sig: '(cols: number): void'
    hint: Scroll display left by cols
  - name: scrollRight
    sig: '(cols: number): void'
    hint: Scroll display right by cols
  - name: saveScreenshot
    sig: '(): ImageData'
    hint: Capture current screen state
  - name: loadScreen
    sig: '(imageData: ImageData): void'
    hint: Load screen from image data
  references:
  - src/roska/display.roska
- name: FrameBuffer
  kind: class
  status: translated
  target_file: src/Display/frame-buffer.ts
  description: Manages pixel data for the display
  fields:
  - name: pixels
    type: boolean[]
  - name: width
    type: number
  - name: height
    type: number
  methods:
  - name: constructor
    sig: '(width: number, height: number)'
    hint: Create buffer with dimensions
  - name: clear
    sig: '(): void'
    hint: Clear all pixels to false
  - name: getPixel
    sig: '(x: number, y: number): boolean'
    hint: Return pixel at coordinates
  - name: setPixel
    sig: '(x: number, y: number, value: boolean): void'
    hint: Set pixel value with bounds check
  - name: togglePixel
    sig: '(x: number, y: number): boolean'
    hint: Toggle pixel and return old value
  - name: copy
    sig: '(): FrameBuffer'
    hint: Create duplicate of buffer
  - name: scrollUp
    sig: '(lines: number): void'
    hint: Scroll pixels up, clear bottom
  - name: scrollDown
    sig: '(lines: number): void'
    hint: Scroll pixels down, clear top
  - name: scrollLeft
    sig: '(cols: number): void'
    hint: Scroll pixels left, clear right
  - name: scrollRight
    sig: '(cols: number): void'
    hint: Scroll pixels right, clear left
  - name: getRow
    sig: '(y: number): boolean[]'
    hint: Return entire row of pixels
  - name: setRow
    sig: '(y: number, row: boolean[]): void'
    hint: Set entire row of pixels
  - name: getColumn
    sig: '(x: number): boolean[]'
    hint: Return entire column of pixels
  - name: setColumn
    sig: '(x: number, col: boolean[]): void'
    hint: Set entire column of pixels
  - name: isInBounds
    sig: '(x: number, y: number): boolean'
    hint: Check if coordinates valid
  - name: wrapCoordinates
    sig: '(x: number, y: number): {x: number, y: number}'
    hint: Apply Chip-8 wrapping logic
  - name: toImageData
    sig: '(): ImageData'
    hint: Convert to canvas image data
  - name: fromImageData
    sig: '(imageData: ImageData): void'
    hint: Load from canvas image data
  references:
  - src/roska/display.roska
- name: SpriteRenderer
  kind: class
  status: pending
  target_file: src/Display/sprite-renderer.ts
  description: Handles sprite drawing operations with XOR logic
  fields:
  - name: display
    type: Display
  methods:
  - name: constructor
    sig: '(display: Display)'
    hint: Create renderer with display ref
  - name: drawSprite
    sig: '(x: number, y: number, bytes: Uint8Array, height: number): boolean'
    hint: Draw sprite bytes at position
  - name: drawByte
    sig: '(x: number, y: number, byte: number): boolean'
    hint: Draw 8-pixel wide byte row
  - name: drawPixelRow
    sig: '(x: number, y: number, pixels: boolean[]): boolean'
    hint: Draw pixel array with XOR
  - name: calculateCollision
    sig: '(x: number, y: number, byte: number): boolean'
    hint: Check if XOR would clear pixel
  - name: extractBits
    sig: '(byte: number): boolean[]'
    hint: Convert byte to 8 boolean bits
  - name: wrapX
    sig: '(x: number): number'
    hint: Apply horizontal wrapping
  - name: wrapY
    sig: '(y: number): number'
    hint: Apply vertical wrapping
  - name: drawExtendedSprite
    sig: '(x: number, y: number, bytes: Uint8Array): boolean'
    hint: Draw 16x16 sprite for SCHIP
  - name: drawQuirkSprite
    sig: '(x: number, y: number, bytes: Uint8Array, height: number): boolean'
    hint: Handle sprite clipping quirks
  - name: getSpriteBounds
    sig: '(x: number, y: number, width: number, height: number): {minX: number, maxX: number, minY: number, maxY: number}'
    hint: Calculate sprite boundaries
  - name: optimizeDraw
    sig: '(x: number, y: number, bytes: Uint8Array): boolean'
    hint: Skip empty sprite rows
  - name: validateCoordinates
    sig: '(x: number, y: number): boolean'
    hint: Check if sprite visible
  references:
  - src/roska/display.roska
