target_dir: src/skill_engine
description: 'SkillRegistry — discover, load, match, and inject skills. Skills follow the official SKILL.md format: - YAML
  frontmatter with only ``name`` and ``description`` - Markdown body with instructions (loaded only after selection) Skills
  are discovered from user-configured directories and matched to tasks '
