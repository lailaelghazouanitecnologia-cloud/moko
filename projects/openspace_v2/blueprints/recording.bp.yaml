## Blueprint — recording
name: recording
language: typescript
target_dir: src/recording
description: RecordingManager ├── internal management of platform.RecordingClient ├── internal management of platform.ScreenshotClient
  ├── internal management of TrajectoryRecorder └── internal management of ActionRecorder
constraints: []
references:
- openspace/recording/action_recorder.yaml
- openspace/recording/manager.yaml
- openspace/recording/__init__.yaml
- openspace/recording/video.yaml
- openspace/recording/viewer.yaml
- openspace/recording/recorder.yaml
- openspace/recording/utils.yaml
types:
- name: ActionRecorder
  kind: class
  status: translated
  target_file: src/recording/action-recorder.ts
  description: 'Records agent actions and decision-making processes. This recorder captures the ''thinking'' layer of the
    agent: - Task planning and decomposition - Tool selection reasoning - Evaluation decisions'
  fields:
  - name: trajectory_dir
    type: unknown
    default: trajectory_dir
  - name: actions_file
    type: unknown
    default: trajectory_dir / "agent_actions.jsonl"
  methods:
  - name: constructor
    sig: (...1 params)
    hint: Agent Action Recorder Records agent decision-making processes, reasoning, and ou
  - name: record_action
    sig: '( agent_name: str, action_type: str, input_data: Optional[Dict[str, Any]] = None, reasoning: Optional[Dict[str,
      Any]] = None, output_data: Optional[Dict[str, Any]] = None, metadata: Optional[Dict[str, Any]] = None, related_tool_steps:
      Optional[list] = None, correlation_id: Optional[str] = None, ): Dict[string, Any'
    hint: 'uses: now, now, debug, _append_to_file, _infer_agent_type'
    async: true
  - name: get_step_count
    sig: '(): number'
    hint: Agent Action Recorder Records agent decision-making processes, reasoning, and ou
  references:
  - openspace/recording/action_recorder.yaml
- name: RecordingManager
  kind: class
  status: translated
  target_file: src/recording/recording-manager.ts
  fields:
  - name: enabled
    type: unknown
    default: enabled
  - name: task_id
    type: unknown
    default: task_id
  - name: log_dir
    type: unknown
    default: log_dir
  - name: backends
    type: unknown
    default: set(backends) if backends else {"mcp", "gui", "shell", "system", "web"}
  - name: enable_screenshot
    type: unknown
    default: enable_screenshot
  - name: enable_video
    type: unknown
    default: enable_video
  - name: enable_conversation_log
    type: unknown
    default: enable_conversation_log
  - name: auto_save_interval
    type: unknown
    default: auto_save_interval
  - name: server_url
    type: unknown
    default: server_url
  - name: agent_name
    type: unknown
    default: agent_name
  methods:
  - name: constructor
    sig: '( enabled: bool = True, task_id: str = "", log_dir: str = "./logs/recordings", backends: Optional[List[str]] = None,
      enable_screenshot: bool = True, enable_video: bool = False, enable_conversation_log: bool = True, auto_save_interval:
      int = 10, server_url: Optional[str] = None, agent_name: str = "GroundingAgent", )'
  - name: is_recording
    sig: '(cls): boolean'
  - name: record_retrieved_tools
    sig: '( cls, task_instruction: str, tools: List[Any], search_debug_info: Optional[Dict[str, Any]] = None, )'
    async: true
  - name: record_skill_selection
    sig: '( cls, selection_record: Dict[str, Any], )'
    async: true
  - name: record_conversation_setup
    sig: '( cls, setup_messages: List[Dict[str, Any]], tools: Optional[List] = None, max_content_length: int = 5000, agent_name:
      str = "GroundingAgent", extra: Optional[Dict[str, Any]] = None, )'
    async: true
  - name: record_iteration_context
    sig: '( cls, iteration: int, delta_messages: List[Dict[str, Any]], response_metadata: Dict[str, Any], max_content_length:
      int = 5000, agent_name: str = "GroundingAgent", extra: Optional[Dict[str, Any]] = None, )'
    async: true
  - name: record_tool_execution
    sig: '( cls, tool_name: str, backend: str, parameters: Dict[str, Any], result: Any, server_name: Optional[str] = None,
      is_success: bool = True, metadata: Optional[Dict[str, Any]] = None, )'
    async: true
  - name: start
    sig: '(task_id: Optional[str] = None)'
    async: true
  - name: save_execution_outcome
    sig: '( status: str, iterations: int, execution_time: float = 0, ): void'
    async: true
  - name: stop
    sig: ()
    async: true
  - name: register_to_llm
    sig: (llm_client)
  - name: add_metadata
    sig: '(key: str, value: Any)'
    async: true
  - name: save_plan
    sig: '(plan: Dict[str, Any], agent_name: str = "GroundingAgent")'
    async: true
  - name: log_decision
    sig: '( agent_name: str, decision: str, context: Optional[Dict[str, Any]] = None )'
    async: true
  - name: record_agent_action
    sig: '( agent_name: str, action_type: str, input_data: Optional[Dict[str, Any]] = None, reasoning: Optional[Dict[str,
      Any]] = None, output_data: Optional[Dict[str, Any]] = None, metadata: Optional[Dict[str, Any]] = None, related_tool_steps:
      Optional[list] = None, correlation_id: Optional[str] = None, ): Dict[string, Any'
    async: true
  - name: generate_summary
    sig: '(): Dict[string, Any'
    async: true
  - name: recording_status
    sig: '(): boolean'
  - name: trajectory_dir
    sig: '(): string'
  - name: recording_client
    sig: ()
  - name: screenshot_client
    sig: ()
  - name: step_count
    sig: '(): number'
  references:
  - openspace/recording/manager.yaml
- name: VideoRecorder
  kind: class
  status: translated
  target_file: src/recording/video-recorder.ts
  description: Video Recorder Communicates with local_server through platform.RecordingClient Supports local and remote recording
    (through configuration LOCAL_SERVER_URL)
  fields:
  - name: output_path
    type: unknown
    default: Path(output_path)
  - name: base_url
    type: unknown
    default: base_url
  methods:
  - name: constructor
    sig: '( output_path: str, base_url: Optional[str] = None, )'
    hint: 'uses: Path'
  - name: start
    sig: ()
    hint: 'uses: RecordingClient, info, warning, start_recording'
    async: true
  - name: stop
    sig: ()
    hint: 'uses: len, info, warning, close, end_recording'
    async: true
  references:
  - openspace/recording/video.yaml
- name: RecordingViewer
  kind: class
  status: translated
  target_file: src/recording/recording-viewer.ts
  description: 'Viewer for analyzing recording sessions. Provides convenient methods to: - Load and display recordings - Analyze
    agent behaviors - Generate reports'
  fields:
  - name: recording_dir
    type: unknown
    default: Path(recording_dir)
  - name: session
    type: unknown
    default: load_recording_session(str(self.recording_dir))
  methods:
  - name: constructor
    sig: '(recording_dir: str)'
    hint: 'uses: Path, ValueError, load_recording_session, info, exists'
  - name: show_summary
    sig: '(): string'
    hint: 'uses: join, append, get, get, sorted'
  - name: show_agent_actions
    sig: '(format_type: str = "compact", agent_name: Optional[str] = None): string'
    hint: 'uses: get, format_agent_actions, len, load_agent_actions, str'
  - name: analyze_agents
    sig: '(): string'
    hint: 'uses: join, analyze_agent_actions, append, load_agent_actions, sorted'
  - name: generate_full_report
    sig: '(output_file: Optional[str] = None): string'
    hint: 'uses: generate_summary_report, str'
  - name: export_to_json
    sig: '(output_file: str)'
    hint: 'uses: dump, info, open'
  - name: show_timeline
    sig: '(max_events: int = 50): string'
    hint: 'uses: join, get, get, append, enumerate'
  - name: show_agent_flow
    sig: '(agent_name: Optional[str] = None): string'
    hint: 'uses: join, get, get, get, get'
  references:
  - openspace/recording/viewer.yaml
- name: TrajectoryRecorder
  kind: class
  status: translated
  target_file: src/recording/trajectory-recorder.ts
  description: +1 dunder methods
  fields:
  - name: trajectory_dir
    type: unknown
    default: Path(log_dir) / folder_name
  - name: screenshots_dir
    type: unknown
    default: self.trajectory_dir / "screenshots"
  - name: task_name
    type: unknown
    default: task_name
  - name: enable_screenshot
    type: unknown
    default: enable_screenshot
  - name: enable_video
    type: unknown
    default: enable_video
  - name: server_url
    type: unknown
    default: server_url
  - name: steps
    type: unknown
    default: List[Dict]
  - name: metadata
    type: unknown
    default: "{\n            \"task_name\": task_name,\n            \"start_time\": datetime.datetime.now().strftime(\"%Y-%m-%dT%H:%M:%S\"\
      ),\n            \"enable_screenshot\": enable_screenshot,\n            \"enable_video\": enable_video,\n        }"
  methods:
  - name: constructor
    sig: '( task_name: str = "", log_dir: str = "./logs/trajectories", enable_screenshot: bool = True, enable_video: bool
      = False, server_url: Optional[str] = None, )'
  - name: record_step
    sig: '( backend: str, tool: str, command: str, result: Optional[Dict[str, Any]] = None, parameters: Optional[Dict[str,
      Any]] = None, screenshot: Optional[bytes] = None, extra: Optional[Dict[str, Any]] = None, auto_screenshot: bool = False,
      ): Dict[string, Any'
    async: true
  - name: save_init_screenshot
    sig: '(screenshot: bytes, filename: str = "init.png")'
    async: true
  - name: start_video_recording
    sig: ()
    async: true
  - name: stop_video_recording
    sig: ()
    async: true
  - name: add_metadata
    sig: '(key: str, value: Any)'
    async: true
  - name: finalize
    sig: ()
    async: true
  - name: get_trajectory_dir
    sig: '(): string'
  references:
  - openspace/recording/recorder.yaml
