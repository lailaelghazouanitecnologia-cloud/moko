## Blueprint — prompts
name: prompts
language: typescript
target_dir: src/prompts
description: Prompts for the skill engine subsystem.
constraints: []
references:
- openspace/prompts/skill_engine_prompts.yaml
- openspace/prompts/__init__.yaml
- openspace/prompts/grounding_agent_prompts.yaml
types:
- name: SkillEnginePrompts
  kind: class
  status: translated
  target_file: src/prompts/skill-engine-prompts.ts
  description: Central registry of prompts used by the skill engine.
  fields:
  - name: EVOLUTION_COMPLETE
    type: string
    default: '"<EVOLUTION_COMPLETE>"'
  - name: EVOLUTION_FAILED
    type: string
    default: '"<EVOLUTION_FAILED>"'
  methods:
  - name: evolution_fix
    sig: '( *, current_content: str, direction: str, failure_context: str, tool_issue_summary: str = "", metric_summary: str
      = "", ): string'
    hint: 'uses: format'
  - name: evolution_derived
    sig: '( *, parent_content: str, direction: str, execution_insights: str, metric_summary: str = "", ): string'
    hint: 'uses: format'
  - name: evolution_captured
    sig: '( *, direction: str, category: str, execution_highlights: str, ): string'
    hint: 'uses: format'
  - name: evolution_confirm
    sig: '( *, skill_id: str, skill_content: str, proposed_type: str, proposed_direction: str, trigger_context: str, recent_analyses:
      str, ): string'
    hint: 'uses: format'
  - name: execution_analysis
    sig: '( *, task_description: str, execution_status: str, iterations: int, tool_list: str, skill_section: str, conversation_log:
      str, traj_summary: str, selected_skill_ids_json: str, resource_info: str = "", ): string'
    hint: 'uses: format'
  references:
  - openspace/prompts/skill_engine_prompts.yaml
- name: GroundingAgentPrompts
  kind: class
  status: translated
  target_file: src/prompts/grounding-agent-prompts.ts
  fields:
  - name: TASK_COMPLETE
    type: string
    default: '"<COMPLETE>"'
  methods:
  - name: build_system_prompt
    sig: '(cls, backends: Optional[List[str]] = None): string'
  - name: iteration_summary
    sig: '( instruction: str, iteration: int, max_iterations: int ): string'
  - name: visual_analysis
    sig: '( tool_name: str, num_screenshots: int, task_description: str = "" ): string'
  - name: final_summary
    sig: '( instruction: str, iterations: int ): string'
  - name: workspace_directory
    sig: '(workspace_dir: str): string'
  - name: workspace_matching_files
    sig: '(matching_files: List[str]): string'
  - name: workspace_recent_files
    sig: '(total_files: int, recent_files: List[str]): string'
  - name: workspace_file_list
    sig: '(files: List[str]): string'
  - name: iteration_feedback
    sig: '( iteration: int, llm_summary: str, add_guidance: bool = True ): string'
  references:
  - openspace/prompts/grounding_agent_prompts.yaml
