## Blueprint — agents
name: agents
language: typescript
target_dir: src/agents
description: Module agents (1415 LOC in reference)
constraints: []
references:
- openspace/agents/base.yaml
- openspace/agents/__init__.yaml
- openspace/agents/grounding_agent.yaml
types:
- name: BaseAgent
  kind: interface
  status: translated
  target_file: src/agents/base-agent.ts
  description: +1 dunder methods
  methods:
  - name: constructor
    sig: '( name: str, backend_scope: Optional[List[str]] = None, llm_client: Optional[LLMClient] = None, grounding_client:
      Optional[GroundingClient] = None, recording_manager: Optional[RecordingManager] = None, ): void'
  - name: name
    sig: '(): string'
  - name: grounding_client
    sig: '(): GroundingClient'
  - name: backend_scope
    sig: '(): Array<string'
  - name: llm_client
    sig: '(): LLMClient'
  - name: llm_client
    sig: '(client: LLMClient): void'
  - name: recording_manager
    sig: '(): RecordingManager'
  - name: step
    sig: '(): number'
  - name: status
    sig: '(): string'
  - name: process
    sig: '(context: Dict[str, Any]): Dict[string, Any'
    async: true
  - name: construct_messages
    sig: '(context: Dict[str, Any]): Array<Dict[string, Any'
  - name: get_llm_response
    sig: '( messages: List[Dict[str, Any]], tools: Optional[List] = None, **kwargs ): Dict[string, Any'
    async: true
  - name: response_to_dict
    sig: '(response: str): Dict[string, Any'
  - name: increment_step
    sig: '(): void'
  references:
  - openspace/agents/base.yaml
- name: AgentStatus
  kind: class
  status: translated
  target_file: src/agents/agent-status.ts
  description: Constants for agent status.
  fields:
  - name: ACTIVE
    type: string
    default: '"active"'
  - name: IDLE
    type: string
    default: '"idle"'
  - name: WAITING
    type: string
    default: '"waiting"'
  references:
  - openspace/agents/base.yaml
- name: AgentRegistry
  kind: class
  status: translated
  target_file: src/agents/agent-registry.ts
  description: Registry for managing agent classes. Allows dynamic registration and retrieval of agent types.
  methods:
  - name: register
    sig: '(cls, name: str, agent_cls: Type[BaseAgent]): void'
  - name: get_cls
    sig: '(cls, name: str): Type[BaseAgent'
  - name: list_registered
    sig: '(cls): Array<string'
  - name: clear
    sig: '(cls): void'
  references:
  - openspace/agents/base.yaml
- name: GroundingAgent
  kind: class
  status: translated
  target_file: src/agents/grounding-agent.ts
  extends: BaseAgent
  methods:
  - name: constructor
    sig: '( name: str = "GroundingAgent", backend_scope: Optional[List[str]] = None, llm_client: Optional[LLMClient] = None,
      grounding_client: Optional[GroundingClient] = None, recording_manager: Optional[RecordingManager] = None, system_prompt:
      Optional[str] = None, max_iterations: int = 15, visual_analysis_timeout: float = 30.0, tool_retrieval_llm: Optional[LLMClient]
      = None, visual_analysis_model: Optional[str] = None, ): void'
  - name: set_skill_context
    sig: '( context: str, skill_ids: Optional[List[str]] = None, ): void'
  - name: clear_skill_context
    sig: '(): void'
  - name: has_skill_context
    sig: '(): boolean'
  - name: set_skill_registry
    sig: '(registry: Optional["SkillRegistry"]): void'
  - name: process
    sig: '(context: Dict[str, Any]): Dict[string, Any'
    async: true
  - name: construct_messages
    sig: '( context: Dict[str, Any] ): Array<Dict[string, Any'
  references:
  - openspace/agents/grounding_agent.yaml
